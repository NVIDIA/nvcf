# In-cluster sink address for BYOO registration:
#   http://byoo-otel-sink.byoo-sink.svc.cluster.local:4318
# Collector self-metrics:
#   http://byoo-otel-sink.byoo-sink.svc.cluster.local:8888/metrics
apiVersion: v1
kind: Service
metadata:
  name: byoo-otel-sink
  labels:
    app.kubernetes.io/name: byoo-otel-sink
spec:
  selector:
    app.kubernetes.io/name: byoo-otel-sink
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8888
      targetPort: metrics

# Reference BYOO telemetry sink. It accepts OTLP logs, metrics, and traces on
# gRPC (4317) and HTTP (4318), prints a one-line summary per batch with the
# debug exporter, and exposes the collector's own Prometheus metrics on 8888.
# The otelcol_receiver_accepted_* counters on :8888/metrics show what arrived.
# The sink does not check the bearer token BYOO sends; any token works.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
    traces:
      receivers: [otlp]
      exporters: [debug]

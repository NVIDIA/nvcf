version: 1
target: main
registries:
  public-helm:
    host: https://helm.ngc.nvidia.com
    namespace: nvidia/nvcf
    repository_alias: nvcf
  public-images:
    host: nvcr.io
    namespace: nvidia/nvcf
  public-resources:
    host: nvcr.io
    namespace: nvidia/nvcf

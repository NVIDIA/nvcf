    version: 0.17.6
    registry: public-images
  - name: nvcf-grpc-proxy
    type: image
    version: 1.33.4
    registry: public-images
  - name: nvcf-image-credential-helper
    type: image
    version: 0.11.1
    registry: public-images
  - name: nvcf-invocation-service
    type: image
    version: 0.12.1
    registry: public-images
  - name: nvcf-nats-auth-callout-service
    type: image
    version: 0.8.3
    registry: public-images
  - name: nvcf-openbao
    type: image
    version: 2.6.2-nv-1.3.4
    registry: public-images
  - name: nvcf-openbao-migrations
    type: image
    version: 0.19.5
    registry: public-images
  - name: nvcf-service-oss
    type: image
    version: 1.18.0
    registry: public-images
  - name: nvcf-ui
    type: image
    version: 1.1.2
    registry: public-images
  - name: nvcf-worker-init-oss
    type: image
    version: 1.2.1
    registry: public-images
  - name: nvcf-worker-llm-credentials-oss
    type: image
    version: 1.1.2
    registry: public-images
  - name: nvcf-worker-utils-oss
    type: image
    version: 1.2.3
    registry: public-images
  - name: nvct-service-oss
    type: image
    version: 1.66.0
    registry: public-images
  - name: reval-server
    type: image
    version: 0.20.2
    registry: public-images
  - name: stargate
    type: image
    version: 0.18.0
    registry: public-images
  - name: helm-admin-token-issuer-proxy
    type: chart
    version: 1.5.3
    registry: public-helm
    chart_format: http
  - name: helm-nvca-operator

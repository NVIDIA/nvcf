<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">NVCF LLM split-cluster invocation and worker routing</title>
  <desc id="desc">Two LLM API Gateways and two Stargate replicas run in a control cluster. Pylons in a compute cluster use one shared seed for discovery, then distinct provider-owned TCP and UDP addresses for every Stargate while preserving internal certificate identities.</desc>
  <defs>
    <style>
      :root {
        color-scheme: light dark;
        --svg-bg: #f7f9f7;
        --svg-panel: #ffffff;
        --svg-panel-muted: #eef3ef;
        --svg-border: #c8d0d6;
        --svg-text: #1f2520;
        --svg-muted: #53605a;
        --svg-line: #53605a;
        --nvidia-green: #76b900;
        --svg-blue: #1565c0;
        --svg-amber: #f9a825;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --svg-bg: #101512;
          --svg-panel: #18201b;
          --svg-panel-muted: #202a24;
          --svg-border: #50605a;
          --svg-text: #f3f7f2;
          --svg-muted: #b9c8b7;
          --svg-line: #cbd8c9;
          --nvidia-green: #8bd80f;
          --svg-blue: #6eb6ff;
          --svg-amber: #ffd166;
        }
      }

      .bg { fill: var(--svg-bg); }
      .cluster { fill: var(--svg-panel); stroke: var(--svg-border); stroke-width: 2; }
      .panel { fill: var(--svg-panel); stroke: var(--svg-border); stroke-width: 2; }
      .panel-muted { fill: var(--svg-panel-muted); stroke: var(--svg-border); stroke-width: 2; }
      .service { fill: var(--svg-panel); stroke: var(--nvidia-green); stroke-width: 3; }
      .provider { fill: var(--svg-panel-muted); stroke: var(--svg-amber); stroke-width: 2; stroke-dasharray: 8 6; }
      .identity { fill: var(--svg-panel-muted); stroke: var(--svg-blue); stroke-width: 2; }
      .title { fill: var(--svg-text); font: 700 26px Arial, sans-serif; }
      .heading { fill: var(--svg-text); font: 700 20px Arial, sans-serif; }
      .label { fill: var(--svg-text); font: 700 15px Arial, sans-serif; }
      .small { fill: var(--svg-muted); font: 13px Arial, sans-serif; }
      .tiny { fill: var(--svg-muted); font: 12px Arial, sans-serif; }
      .callout { stroke: var(--svg-panel); stroke-width: 5; paint-order: stroke; stroke-linejoin: round; }
      .callout-bg { stroke: var(--svg-bg); stroke-width: 5; paint-order: stroke; stroke-linejoin: round; }
      .line { stroke: var(--svg-line); stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .line-blue { stroke: var(--svg-blue); stroke-width: 2.4; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: var(--nvidia-green); stroke-width: 2.6; fill: none; marker-start: url(#arrow-green); marker-end: url(#arrow-green); }
      .line-amber { stroke: var(--svg-amber); stroke-width: 2.4; fill: none; marker-end: url(#arrow-amber); }
      .line-muted { stroke: var(--svg-muted); stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow-muted); }
      .arrowhead { fill: var(--svg-line); }
      .arrowhead-blue { fill: var(--svg-blue); }
      .arrowhead-green { fill: var(--nvidia-green); }
      .arrowhead-amber { fill: var(--svg-amber); }
      .arrowhead-muted { fill: var(--svg-muted); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead-blue" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead-green" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead-amber" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead-muted" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900" />
  <text class="title" x="48" y="45">LLM Split-Cluster Routing</text>
  <text class="small" x="48" y="73">Shared discovery seed, per-replica dial paths, and internal QUIC certificate identity</text>

  <rect class="cluster" x="40" y="100" width="1320" height="490" rx="12" />
  <text class="heading" x="70" y="136">Control cluster</text>

  <rect class="panel-muted" x="80" y="180" width="150" height="72" rx="8" />
  <text class="label" x="155" y="210" text-anchor="middle">Mac client</text>
  <text class="small" x="155" y="233" text-anchor="middle">llm.invocation</text>

  <rect class="service" x="285" y="165" width="190" height="102" rx="8" />
  <text class="label" x="380" y="198" text-anchor="middle">2 x LLM API</text>
  <text class="label" x="380" y="219" text-anchor="middle">Gateway</text>
  <text class="small" x="380" y="244" text-anchor="middle">OpenAI-compatible HTTP</text>

  <rect class="service" x="620" y="150" width="225" height="118" rx="8" />
  <text class="label" x="732" y="184" text-anchor="middle">Stargate 0</text>
  <text class="small" x="732" y="208" text-anchor="middle">llm-request-router-0</text>
  <text class="small" x="732" y="231" text-anchor="middle">TCP 50071 / UDP 50072</text>

  <rect class="service" x="930" y="150" width="225" height="118" rx="8" />
  <text class="label" x="1042" y="184" text-anchor="middle">Stargate 1</text>
  <text class="small" x="1042" y="208" text-anchor="middle">llm-request-router-1</text>
  <text class="small" x="1042" y="231" text-anchor="middle">TCP 50071 / UDP 50072</text>

  <rect class="panel" x="90" y="375" width="240" height="105" rx="8" />
  <text class="label" x="210" y="407" text-anchor="middle">Shared seed Service</text>
  <text class="small" x="210" y="431" text-anchor="middle">llm-request-router.nvcf</text>
  <text class="small" x="210" y="454" text-anchor="middle">WatchStargates / TCP 50071</text>

  <rect class="identity" x="375" y="345" width="275" height="165" rx="8" />
  <text class="label" x="512" y="377" text-anchor="middle">Internal identity</text>
  <text class="tiny" x="512" y="405" text-anchor="middle">llm-request-router-0.</text>
  <text class="tiny" x="512" y="422" text-anchor="middle">llm-request-router-headless.nvcf...</text>
  <text class="tiny" x="512" y="448" text-anchor="middle">llm-request-router-1.</text>
  <text class="tiny" x="512" y="465" text-anchor="middle">llm-request-router-headless.nvcf...</text>
  <text class="small" x="512" y="493" text-anchor="middle">HTTP/2 authority + QUIC SNI</text>

  <rect class="provider" x="695" y="330" width="590" height="205" rx="10" />
  <text class="label" x="990" y="362" text-anchor="middle">Provider-owned DNS + transparent L4</text>

  <rect class="panel" x="730" y="390" width="235" height="105" rx="8" />
  <text class="label" x="847" y="420" text-anchor="middle">Replica 0 dial name</text>
  <text class="tiny" x="847" y="444" text-anchor="middle">llm-request-router-0.</text>
  <text class="tiny" x="847" y="461" text-anchor="middle">router.region-a.example</text>
  <text class="small" x="847" y="484" text-anchor="middle">TCP 50071 + UDP 50072</text>

  <rect class="panel" x="1015" y="390" width="235" height="105" rx="8" />
  <text class="label" x="1132" y="420" text-anchor="middle">Replica 1 dial name</text>
  <text class="tiny" x="1132" y="444" text-anchor="middle">llm-request-router-1.</text>
  <text class="tiny" x="1132" y="461" text-anchor="middle">router.region-a.example</text>
  <text class="small" x="1132" y="484" text-anchor="middle">TCP 50071 + UDP 50072</text>

  <line class="line" x1="230" y1="216" x2="285" y2="216" />
  <path class="line-blue" d="M 475 205 L 550 205 L 550 188 L 620 188" />
  <path class="line-blue" d="M 475 228 L 535 228 L 535 115 L 1042 115 L 1042 150" />
  <path class="line-muted" d="M 330 410 C 445 310 555 285 680 268" />
  <path class="line-muted" d="M 330 445 C 530 315 785 290 990 268" />
  <line class="line-amber" x1="847" y1="390" x2="760" y2="268" />
  <line class="line-amber" x1="1132" y1="390" x2="1060" y2="268" />

  <rect class="cluster" x="40" y="625" width="1320" height="225" rx="12" />
  <text class="heading" x="70" y="663">Compute cluster</text>

  <rect class="panel-muted" x="245" y="700" width="360" height="105" rx="8" />
  <text class="label" x="425" y="734" text-anchor="middle">Function replica 0</text>
  <text class="small" x="425" y="760" text-anchor="middle">pylon + mock OpenAI server + GPU</text>
  <text class="small" x="425" y="783" text-anchor="middle">registers with both Stargates</text>

  <rect class="panel-muted" x="795" y="700" width="360" height="105" rx="8" />
  <text class="label" x="975" y="734" text-anchor="middle">Function replica 1</text>
  <text class="small" x="975" y="760" text-anchor="middle">pylon + mock OpenAI server + GPU</text>
  <text class="small" x="975" y="783" text-anchor="middle">registers with both Stargates</text>

  <path class="line-muted" d="M 380 700 C 300 620 220 570 210 480" />
  <path class="line-muted" d="M 920 700 C 700 600 430 555 255 480" />
  <text class="small callout" x="330" y="570" text-anchor="middle">1. Discover through shared seed</text>

  <path class="line-green" d="M 455 700 C 535 610 690 565 847 495" />
  <path class="line-green" d="M 500 700 C 650 615 900 565 1132 495" />
  <path class="line-green" d="M 900 700 C 860 620 845 565 847 495" />
  <path class="line-green" d="M 1010 700 C 1080 615 1125 565 1132 495" />
  <text class="small callout-bg" x="790" y="612" text-anchor="middle">2. Register over TCP, then form trusted reverse QUIC over UDP</text>

  <text class="small" x="700" y="879" text-anchor="middle">External names select the replica. Internal advertised names remain the certificate identity and are the only router SANs.</text>
</svg>

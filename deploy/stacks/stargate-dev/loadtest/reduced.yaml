version: 1
defaults:
  maxTokens: 256
  timeoutSeconds: 30
  requestSloMs: 10000
  maxWaitMs: 10000
  cooldownSeconds: 60
algorithms:
  wait-and-widen:
    routingHeader: null
  power-of-n:
    routingHeader: powerOfN
suites:
  reduced:
  - session-affinity
  - mixed-sessions
  - saturation
  session-affinity:
  - session-affinity
  mixed-sessions:
  - mixed-sessions
  capacity:
  - saturation
scenarios:
  session-affinity:
    kind: session-affinity
    sessions: 512
    turnsPerSession: 12
    repeats: 1
    rate: 24
    workers: 48
    stablePrefixBytes: 3584
    turnBytes: 512
  mixed-sessions:
    kind: mixed-sessions
    durationSeconds: 600
    repeats: 1
    hot:
      rate: 8
      workers: 128
      minPromptBytes: 2048
      maxPromptBytes: 16384
    short:
      rate: 4
      workers: 64
      promptBytesByTurn:
      - 2048
      - 4096
      - 6144
  saturation:
    kind: sweep
    rates:
    - 96
    durationSeconds: 120
    minimumWorkers: 32
    workersPerRps: 2
    promptBytes: 2048

[package]
name = "stargate-dev-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false
description = "Controlled Spark campaigns for the Stargate development deployment"

[workspace]
resolver = "3"

[dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.6.1", features = ["derive", "env"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0

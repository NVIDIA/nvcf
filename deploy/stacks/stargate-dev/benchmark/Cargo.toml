[package]
name = "stargate-dev-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false
description = "Controlled Spark campaigns for the Stargate development deployment"

[workspace]
resolver = "3"

[dependencies]
anyhow = "=1.0.103"
base64 = "=0.22.1"
clap = { version = "=4.6.1", features = ["derive", "env"] }
csv = "=1.4.0"
rustix = { version = "=1.1.5", features = ["process"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "=1.52.3", features = ["process", "signal", "time", "io-util", "macros", "rt", "net"] }
uuid = { version = "=1.22.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0

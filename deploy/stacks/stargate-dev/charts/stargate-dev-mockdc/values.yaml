clusterId: ""
modelName: ""
workerToken: ""

stargate:
  address: ""
  quicCaSecretName: ""
  quicCaSecretKey: ca.crt

images:
  mockDynamo:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  pylon:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []

# Approximate Llama 3.1 8B on one H100 near 25 concurrent requests.
# Keep output below Pylon's 237-token runaway-generation threshold.
mockDynamo:
  backend0:
    numTokens: 128
    tokenDelayMs: 5
    decodeJitterMs: 2
    ttftMs: 10
    ttftJitterMs: 20
    prefillTokensPerSecond: 7000
    maxConcurrentRequests: 25
    healthDelayMs: 0
    kvCacheCapacityTokens: 400000
  backend1:
    numTokens: 128
    tokenDelayMs: 5
    decodeJitterMs: 2
    ttftMs: 10
    ttftJitterMs: 20
    prefillTokensPerSecond: 7000
    maxConcurrentRequests: 25
    healthDelayMs: 0
    kvCacheCapacityTokens: 400000

pylon:
  doCalibration: false
  initialInputTps: ""

resources:
  mockDynamo:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  pylon:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

podAnnotations: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stargate-dev-auth.fullname" . }}
  labels:
    {{- include "stargate-dev-auth.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "stargate-dev-auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stargate-dev-auth.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "stargate-dev-auth.fullname" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: {{ include "stargate-dev-auth.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config-path=/var/run/secrets/stargate-dev-auth/config.json
            - --grpc-listen-addr=0.0.0.0:50051
            - --http-listen-addr=0.0.0.0:8080
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /var/run/secrets/stargate-dev-auth
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: {{ include "stargate-dev-auth.fullname" . }}-credentials

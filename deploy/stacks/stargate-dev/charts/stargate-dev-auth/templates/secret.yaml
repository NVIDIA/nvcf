{{- $credentials := .Values.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stargate-dev-auth.fullname" . }}-credentials
  labels:
    {{- include "stargate-dev-auth.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.json: {{ $credentials | toJson | quote }}
  service-token.json: {{ dict "nvcfApiToken" $credentials.serviceToken | toJson | quote }}

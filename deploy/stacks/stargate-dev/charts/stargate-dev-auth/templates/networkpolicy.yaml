apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stargate-dev-auth.fullname" . }}
  labels:
    {{- include "stargate-dev-auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stargate-dev-auth.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - llm-request-router
                  - llm-api-gateway
      ports:
        - port: 50051
          protocol: TCP
    - ports:
        - port: 8080
          protocol: TCP

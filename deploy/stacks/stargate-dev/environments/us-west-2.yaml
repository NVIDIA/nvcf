# Fill the regional network and TLS values, create the named kube contexts,
# then set deploymentReady to true. Credentials belong only in the protected
# file created by scripts/deploy.py init.
deploymentReady: false
namespace: stargate-dev
region: us-west-2
awsAccountIdEnv: STARGATE_DEV_AWS_ACCOUNT_ID
kubernetesVersion: "1.34"
modelName: stargate-dev-model
routingKey: stargate-dev

clusters:
  stargate:
    name: stargate-usw2
    kubeContext: stargate-usw2
    nodeInstanceType: c7i.xlarge
    nodeCount: 3
  mockdcs:
    - name: mockdc-usw2-a
      kubeContext: mockdc-usw2-a
      nodeInstanceType: t3.medium
      nodeCount: 2
      quicCaSecretName: stargate-router-ca
      # Approximate Llama 3.1 8B on one H100 near 25 concurrent requests.
      # Keep output below Pylon's 237-token runaway-generation threshold.
      mockDynamo:
        backend0:
          numTokens: 128
          tokenDelayMs: 5
          decodeJitterMs: 2
          ttftMs: 10
          ttftJitterMs: 20
          prefillTokensPerSecond: 7000
          maxConcurrentRequests: 25
          healthDelayMs: 0
          kvCacheCapacityTokens: 400000
        backend1:
          numTokens: 128
          tokenDelayMs: 5
          decodeJitterMs: 2
          ttftMs: 10
          ttftJitterMs: 20
          prefillTokensPerSecond: 7000
          maxConcurrentRequests: 25
          healthDelayMs: 0
          kvCacheCapacityTokens: 400000
    - name: mockdc-usw2-b
      kubeContext: mockdc-usw2-b
      nodeInstanceType: t3.medium
      nodeCount: 2
      quicCaSecretName: stargate-router-ca
      # Approximate Llama 3.1 8B on one H100 near 25 concurrent requests.
      # Keep output below Pylon's 237-token runaway-generation threshold.
      mockDynamo:
        backend0:
          numTokens: 128
          tokenDelayMs: 5
          decodeJitterMs: 2
          ttftMs: 10
          ttftJitterMs: 20
          prefillTokensPerSecond: 7000
          maxConcurrentRequests: 25
          healthDelayMs: 0
          kvCacheCapacityTokens: 400000
        backend1:
          numTokens: 128
          tokenDelayMs: 5
          decodeJitterMs: 2
          ttftMs: 10
          ttftJitterMs: 20
          prefillTokensPerSecond: 7000
          maxConcurrentRequests: 25
          healthDelayMs: 0
          kvCacheCapacityTokens: 400000

router:
  hostname: router.usw2.stargate-dev.example.invalid
  acmCertificateArn: arn:aws:acm:us-west-2:000000000000:certificate/00000000-0000-0000-0000-000000000000
  tlsSecretName: stargate-router-tls
  externalDnsEnabled: false
  # Add every public NAT Gateway egress IP used by the two MockDC clusters.
  loadBalancerSourceRanges:
    - 192.0.2.1/32

observability:
  namespace: stargate-dev-observability
  amp:
    workspaceId: ws-00000000-0000-0000-0000-000000000000
    writerRoleArn: arn:aws:iam::000000000000:role/stargate-dev-amp-writer
  grafana:
    readerRoleArn: arn:aws:iam::000000000000:role/stargate-dev-grafana

# Fill the regional network and TLS values, create the named kube contexts,
# then set deploymentReady to true. Credentials belong only in the protected
# file created by scripts/deploy.py init.
deploymentReady: false
namespace: stargate-dev
region: ap-northeast-1
modelName: stargate-dev-model
routingKey: stargate-dev

clusters:
  stargate:
    name: stargate-an1
    kubeContext: stargate-an1
  mockdcs:
    - name: mockdc-an1-a
      kubeContext: mockdc-an1-a
      mockDynamo:
        backend0:
          numGpuWorkers: 11
        backend1:
          numGpuWorkers: 16
    - name: mockdc-an1-b
      kubeContext: mockdc-an1-b
      mockDynamo:
        backend0:
          numGpuWorkers: 15
        backend1:
          numGpuWorkers: 20

router:
  # A non-empty object replaces the complete default routing policy.
  loadBalancerConfig: {}
  remoteWatchUrls: []
  hostname: router.apne1.stargate-dev.example.invalid
  acmCertificateArn: arn:aws:acm:ap-northeast-1:000000000000:certificate/00000000-0000-0000-0000-000000000000
  # Include NAT egress IPs of all connected MockDC and hub clusters.
  loadBalancerSourceRanges:
    - 192.0.2.1/32

observability:
  namespace: stargate-dev-observability
  amp:
    workspaceId: ws-00000000-0000-0000-0000-000000000000

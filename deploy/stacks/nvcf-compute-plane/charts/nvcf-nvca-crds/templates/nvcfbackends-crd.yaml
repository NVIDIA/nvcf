apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nvcfbackends.nvcf.nvidia.io
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: nvcf-nvca-crds
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
spec:
  group: nvcf.nvidia.io
  names:
    kind: NVCFBackend
    listKind: NVCFBackendList
    plural: nvcfbackends
    singular: nvcfbackend
  scope: Namespaced
  versions:
  - name: v1
    additionalPrinterColumns:
      - name: Age
        jsonPath: .metadata.creationTimestamp
        description: Age of this resource
        type: date
      - name: Version
        jsonPath: .status.version
        type: string
        description: Current version of the backend
      - name: Health
        jsonPath: .status.agentStatus
        description: Health status of the backend
        type: string
    schema:
      openAPIV3Schema:
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

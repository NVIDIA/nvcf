apiVersion: batch/v1
kind: Job
metadata:
  name: topology-migration
  namespace: kai-scheduler
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      labels:
        app: topology-migration
    spec:
      serviceAccountName: kai-topology-migration
      imagePullSecrets:
        - name: nvcr-pull-secret
      containers:
      - name: migration
        image: "ghcr.io/kai-scheduler/kai-scheduler/helm-hooks:v0.18.6"
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10000
        args: ["migrate-topologies"]
      restartPolicy: OnFailure

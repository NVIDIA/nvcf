apiVersion: kai.scheduler/v1
kind: SchedulingShard
metadata:
  name: default
  annotations:
    helm.sh/resource-policy: keep
spec:
  partitionLabelValue: ""
  placementStrategy:
    gpu: binpack
    cpu: binpack
  plugins:
    nodeplacement:
      arguments:
        cpu: spread
        gpu: binpack
  actions:
    consolidation:
      enabled: false
    preempt:
      enabled: false

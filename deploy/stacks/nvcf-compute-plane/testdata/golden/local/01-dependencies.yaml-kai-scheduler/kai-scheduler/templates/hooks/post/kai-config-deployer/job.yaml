apiVersion: batch/v1
kind: Job
metadata:
  name: kai-config-deployer
  namespace: kai-scheduler
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      labels:
        app: kai-config-deployer
    spec:
      serviceAccountName: kai-config-deployer
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: nvcr-pull-secret
      containers:
      - name: deployer
        image: "ghcr.io/kai-scheduler/kai-scheduler/helm-hooks:v0.18.6"
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10000
        args: ["apply-config", "--file=/manifest/kai-config.yaml"]
        volumeMounts:
        - name: manifest
          mountPath: /manifest
      volumes:
      - name: manifest
        configMap:
          name: kai-config-manifest

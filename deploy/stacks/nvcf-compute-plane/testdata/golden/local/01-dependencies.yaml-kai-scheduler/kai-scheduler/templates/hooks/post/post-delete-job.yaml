apiVersion: batch/v1
kind: Job
metadata:
  name: post-delete-cleanup
  namespace: kai-scheduler
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-delete-policy": hook-succeeded
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: post-delete-cleanup
    spec:
      serviceAccountName: post-delete-cleanup
      imagePullSecrets:
        - name: nvcr-pull-secret
      restartPolicy: Never
      containers:
        - name: deleter
          image: "ghcr.io/kai-scheduler/kai-scheduler/helm-hooks:v0.18.6"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            runAsUser: 10000
          args:
            - cleanup
            - --namespace=kai-scheduler
            - --delete-config=kai-config

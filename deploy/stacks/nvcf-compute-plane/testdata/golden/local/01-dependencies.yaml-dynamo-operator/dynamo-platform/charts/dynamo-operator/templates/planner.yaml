---
# Source: dynamo-platform/charts/dynamo-operator/templates/planner.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dynamo-operator-planner
  labels:
    helm.sh/chart: dynamo-operator-1.6.2
    app.kubernetes.io/name: dynamo-operator
    app.kubernetes.io/instance: dynamo-operator
    app.kubernetes.io/version: "1.6.2"
    app.kubernetes.io/managed-by: Helm
rules:
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeployments"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentscalingadapters/scale"]
  # Read the authoritative target to detect superseded asynchronous requests.
  verbs: ["get", "patch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamoworkermetadatas"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Read Pod lifecycle state to distinguish pending startup from drain before
# reversing a scale-up. Also used for power-annotation settlement when enabled.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]

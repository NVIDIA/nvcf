apiVersion: batch/v1
kind: Job
metadata:
  name: post-delete-cleanup
  namespace: kai-scheduler
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: post-delete-cleanup
    spec:
      serviceAccountName: post-delete-cleanup
      restartPolicy: Never
      containers:
        - name: deleter
          image: "ghcr.io/kai-scheduler/kai-scheduler/crd-upgrader:v0.14.0"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Deleting deployments..."
              kubectl -n kai-scheduler delete deployment --all --ignore-not-found=true

              echo "Deleting kai-config..."
              kubectl delete Config kai-config --ignore-not-found
              echo "Cleanup complete."

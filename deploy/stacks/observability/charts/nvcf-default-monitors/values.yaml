commonLabels:
  nvcf.nvidia.com/observability-target: "true"

dcgm:
  enabled: true
  namespace: ""
  namespaceSelector:
    any: true
  interval: 30s
  path: /metrics
  # NVCA uses this name for the injected DCGM metrics port.
  port: dcgm-metrics
  labels: {}

# These plane gates are internal inputs derived from observability.profile by
# the parent stack. They are not public user-facing switches.
controlPlane:
  enabled: false
  interval: 30s
  path: /metrics
  port: metrics
  # Default namespace the services run in (ServiceMonitor namespaceSelector).
  # Per-service `namespaces` overrides this to keep each monitor scoped tightly.
  namespaces:
    - nvcf
  services:
    - name: state-metrics
      enabled: true
      selector:
        app.kubernetes.io/instance: state-metrics
        app.kubernetes.io/name: helm-nvcf-state-metrics
    - name: grpc-proxy
      enabled: true
      selector:
        app.kubernetes.io/instance: grpc-proxy
    - name: llm-api-gateway
      enabled: true
      selector:
        app.kubernetes.io/instance: llm-api-gateway
    - name: invocation-service
      enabled: true
      selector:
        app.kubernetes.io/instance: invocation-service

computePlane:
  enabled: false

nvca:
  enabled: true
  namespaceSelector:
    matchNames:
      - nvca-system
  interval: 30s
  path: /metrics
  port: nvca
  selector:
    app.kubernetes.io/name: nvca
  labels: {}

worker:
  enabled: true
  namespaceSelector:
    matchExpressions:
      - key: nvca.nvcf.nvidia.io/workload-instance-type
        operator: Exists
  interval: 30s
  path: /metrics
  port: metrics
  selector: {}
  labels: {}

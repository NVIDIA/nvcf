apiVersion: v1
kind: Service
metadata:
  name: ess-api # hardcoded value is intentional to fit the addressing scheme
  namespace: ess
  labels:
    helm.sh/chart: helm-nvcf-ess-api-1.7.2
    app.kubernetes.io/name: helm-nvcf-ess-api
    app.kubernetes.io/instance: ess-api
    app.kubernetes.io/version: "0.4.15"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - name: app-port
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9464
      targetPort: 9464
      protocol: TCP
  selector:
    app.kubernetes.io/name: helm-nvcf-ess-api
    app.kubernetes.io/instance: ess-api

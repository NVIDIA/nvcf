apiVersion: v1
kind: ConfigMap
metadata:
  name: ess-api-vault-agent-tpl
  namespace: ess
  labels:
    helm.sh/chart: helm-nvcf-ess-api-1.7.2
    app.kubernetes.io/name: helm-nvcf-ess-api
    app.kubernetes.io/instance: ess-api
    app.kubernetes.io/version: "0.4.15"
    app.kubernetes.io/managed-by: Helm
data:
  secrets.json.tmpl: |-
    {
      "kv": {
        {{- with secret "services/ess-api/kv/data/cassandra/creds" }}
        "cassandraUsername": {{ .Data.data.username | toJSON }},
        "cassandraPassword": {{ .Data.data.password | toJSON }},
        {{- end }}
    
        {{- with secret "services/all/kv/encryption/keys/audit" }}
        "audit-hmac-keys": {{ .Data.data.keys | toJSON }},
        "audit-hmac-kid": {{ .Data.data.current_kid | toJSON }},
        {{- end }}
    
        "crypto": {
        {{- with secret "services/all/kv/encryption/keys/stored_data" }}
        {{- $keys := .Data.data.keys | base64Decode | parseJSON }}
          "masterKey": "{{ sprig_first $keys.keys | toJSON | base64Encode }}",
          "allMasterKeys": "{{ $keys.keys | toJSON | base64Encode }}"
        {{- end }}
        }
      }
    }

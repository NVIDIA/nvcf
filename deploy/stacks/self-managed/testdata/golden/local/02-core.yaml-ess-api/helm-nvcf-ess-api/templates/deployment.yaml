apiVersion: apps/v1
kind: Deployment
metadata:
  name: ess-api-deployment
  namespace: ess
  labels:
    helm.sh/chart: helm-nvcf-ess-api-1.8.2
    app.kubernetes.io/name: helm-nvcf-ess-api
    app.kubernetes.io/instance: ess-api
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/managed-by: Helm
    nvcf.nvidia.com/control-plane-owner: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-nvcf-ess-api
      app.kubernetes.io/instance: ess-api
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "ess-api"
        vault.hashicorp.com/auth-path: "auth/jwt"
        vault.hashicorp.com/agent-service-account-token-volume-name: "token"
        vault.hashicorp.com/auth-config-token-path: "/var/run/secrets/kubernetes.io/serviceaccount/token"
        vault.hashicorp.com/agent-copy-volume-mounts: helm-nvcf-ess-api
        vault.hashicorp.com/agent-run-as-same-user: "true"
        vault.hashicorp.com/agent-inject-template-file-secrets.json: "/vault/config/templates/secrets.json.tmpl" 
        vault.hashicorp.com/secret-volume-path: "/vault/secrets"
        checksum/config-env: 6da3277adcaee69e868b38e0cfbe5acd2efc9ebff23ac2588f779c30eff1b98c
      labels:
        app.kubernetes.io/name: helm-nvcf-ess-api
        app.kubernetes.io/instance: ess-api
    spec:
      serviceAccountName: ess-api
      securityContext:
        {}
      volumes:
        - name: vault-config-templates
          configMap:
            name: ess-api-vault-agent-tpl
            items:
              - key: secrets.json.tmpl
                path: secrets.json.tmpl
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: http://openbao-server.vault-system.svc.cluster.local:8200
      containers:
        - name: helm-nvcf-ess-api
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsUser: 1000
          image: "nvcr.io/nvidia/nvcf/nvcf-ess:0.5.0"
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: vault-config-templates
              mountPath: /vault/config/templates
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SPRING_PROFILES_ACTIVE
              value: "ncp-prod"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dapp.version=0.5.0 "
          
          envFrom:
            - configMapRef:
                name: ess-api-env
          
          ports:
            - name: app-port
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          resources:
            limits:
              cpu: 2
              memory: 2Gi
            requests:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            failureThreshold: 4
            httpGet:
              path: /health/readiness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 180
            httpGet:
              path: /health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

---
# Source: helm-nvcf-nats/charts/nats/templates/config-map.yaml
apiVersion: v1
data:
  nats.conf: |
    {
      "accounts": {
        "APP": {
          "jetstream": "enabled"
        },
        "AUTH": {
          "users": [
            {
              "nkey": $AUTH_CALLOUT_USER_NKEY
            }
          ]
        }
      },
      "authorization": {
        "auth_callout": {
          "account": "AUTH",
          "auth_users": [
            $AUTH_CALLOUT_USER_NKEY
          ],
          "issuer": $AUTH_CALLOUT_ACCOUNT_NKEY
        }
      },
      "cluster": {
        "name": "nats",
        "no_advertise": true,
        "port": 6222,
        "routes": [
          "nats://nats-0.nats-headless:6222",
          "nats://nats-1.nats-headless:6222",
          "nats://nats-2.nats-headless:6222"
        ]
      },
      "http_port": 8222,
      "jetstream": {
        "max_file_store": 10Gi,
        "max_memory_store": 1Gi,
        "store_dir": "/data"
      },
      "lame_duck_duration": "30s",
      "lame_duck_grace_period": "10s",
      "pid_file": "/var/run/nats/nats.pid",
      "port": 4222,
      "server_name": $SERVER_NAME,
      "server_tags": [
        "dc:ncp",
        "aws-region:ncp"
      ]
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: nats
    app.kubernetes.io/instance: nats
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nats
    app.kubernetes.io/version: 2.11.9
    helm.sh/chart: nats-1.3.15
  name: nats-config

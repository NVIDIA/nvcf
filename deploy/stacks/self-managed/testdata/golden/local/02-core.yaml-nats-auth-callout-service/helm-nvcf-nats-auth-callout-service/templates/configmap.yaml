apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-auth-callout-service-helm-nvcf-nats-auth-callout-service-config
  labels:
    helm.sh/chart: helm-nvcf-nats-auth-callout-service-1.2.0
    app.kubernetes.io/name: helm-nvcf-nats-auth-callout-service
    app.kubernetes.io/instance: nats-auth-callout-service
    app.kubernetes.io/version: "0.8.3"
    app.kubernetes.io/managed-by: Helm
    kratos_logging: 'true'
    kratos_metrics: 'true'
    nvcf.nvidia.com/control-plane-owner: default
data:
  # Configuration file that can be mounted as a volume
  config.yaml: |
    logging:
      caller: true
      development: false
      disable_timestamp: false
      fields: {}
      format: json
      level: info
      output: stdout
      sampling:
        initial: 100
        thereafter: 100
      stacktrace_level: error
    server:
      port: "8080"
    service:
      name: nvcf-nats-auth-callout-service
    tracing:
      lightstep:
        compression: gzip
        endpoint: ingest.lightstep.com:443/traces/otel/v1
        environment: development
        export_timeout_ms: 30000
        insecure: false
        max_export_batch_size: 512
        max_queue_size: 2048
        sampling_ratio: "1.0"
        schedule_delay_ms: 5000
        timeout_ms: 10000
      otel:
        compression: gzip
        endpoint: localhost:4317
        environment: development
        export_timeout_ms: 30000
        headers: {}
        http_endpoint: localhost:4318/v1/traces
        insecure: true
        max_export_batch_size: 512
        max_queue_size: 2048
        retry_delay_ms: 5000
        sampling_ratio: "1.0"
        schedule_delay_ms: 5000
        timeout_ms: 10000
      provider: otel

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-auth-callout-service-helm-nvcf-nats-auth-callout-service
  labels:
    helm.sh/chart: helm-nvcf-nats-auth-callout-service-1.2.0
    app.kubernetes.io/name: helm-nvcf-nats-auth-callout-service
    app.kubernetes.io/instance: nats-auth-callout-service
    app.kubernetes.io/version: "0.8.3"
    app.kubernetes.io/managed-by: Helm
    kratos_logging: 'true'
    kratos_metrics: 'true'
    nvcf.nvidia.com/control-plane-owner: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-nvcf-nats-auth-callout-service
      app.kubernetes.io/instance: nats-auth-callout-service
  template:
    metadata:
      annotations:
        # Force pod restart when configmap changes
        checksum/config: 735906305b326530beb0f841e2f91faacbebaaab6cfe9b4895af51276c12acac
      labels:
        helm.sh/chart: helm-nvcf-nats-auth-callout-service-1.2.0
        app.kubernetes.io/name: helm-nvcf-nats-auth-callout-service
        app.kubernetes.io/instance: nats-auth-callout-service
        app.kubernetes.io/version: "0.8.3"
        app.kubernetes.io/managed-by: Helm
        kratos_logging: 'true'
        kratos_metrics: 'true'
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      containers:
        - name: helm-nvcf-nats-auth-callout-service
          image: "nvcr.io/nvidia/nvcf/nvcf-nats-auth-callout-service:0.8.3"
          imagePullPolicy: IfNotPresent
          args:
            - "server"
            - "--config"
            - "/etc/config/config.yaml"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Service and Application Configuration
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_SERVICE_NAME
              value: "nats-auth-callout-service"
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_SERVER_PORT
              value: "8080"

            # Kubernetes Runtime Information
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # Tracing Configuration
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_TRACING_ENABLED
              value: "false"

            # Additional Environment Variables
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_SERVICE_NKEY__SEED
              valueFrom:
                secretKeyRef:
                  key: nkey_seed
                  name: nats-auth-callout-nkeys
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_SERVICE_NKEY__SIGNATURE
              valueFrom:
                secretKeyRef:
                  key: nkey_signature
                  name: nats-auth-callout-nkeys
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_SERVICE_PLUGIN__CONFIGS_NKEY_PLUGIN__TYPE
              value: nkey
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_SERVICE_PLUGIN__CONFIGS_NKEY_CONFIG_NKEY__MAPPINGS_0_NKEY
              valueFrom:
                secretKeyRef:
                  key: user.pub
                  name: nats-nkeys
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_SERVICE_PLUGIN__CONFIGS_NKEY_CONFIG_NKEY__MAPPINGS_0_ACCOUNT
              value: APP
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_SERVICE_ACCOUNT__CONFIGS_APP_ENABLED__PLUGINS_0_ID
              value: nkey

            # Metrics Configuration
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_METRICS_ENABLED
              value: "false"
            - name: NVCF_NATS_AUTH_CALLOUT_SERVICE_METRICS_PORT
              value: "9090"

          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config-volume
          configMap:
            name: nats-auth-callout-service-helm-nvcf-nats-auth-callout-service-config

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    nvcf.nvidia.com/control-plane-owner: default
  name: admin-token-issuer-proxy
  namespace: gateway
spec:
  parentRefs:
  - name: shared-gateway
    namespace: gateway
  hostnames:
  - api-keys.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/admin/keys
    backendRefs:
    - name: admin-token-issuer-proxy
      namespace: api-keys
      port: 8080

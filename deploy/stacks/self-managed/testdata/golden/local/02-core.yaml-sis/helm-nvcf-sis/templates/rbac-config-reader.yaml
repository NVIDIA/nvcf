apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spot-instance-service-remote-config-reader
  namespace: sis
  labels:
    helm.sh/chart: helm-nvcf-sis-2.0.0
    app.kubernetes.io/name: helm-nvcf-sis
    app.kubernetes.io/instance: sis
    app.kubernetes.io/version: "1.2.2"
    app.kubernetes.io/managed-by: Helm
rules:
  # list + watch only, and namespace-wide: spring-cloud-kubernetes client-config
  # fetches via listNamespacedConfigMap and filters in memory (get is never
  # called), and Kubernetes RBAC cannot scope list/watch by resourceNames.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list", "watch"]
---
# Source: helm-nvcf-sis/templates/rbac-config-reader.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spot-instance-service-remote-config-reader
  namespace: sis
  labels:
    helm.sh/chart: helm-nvcf-sis-2.0.0
    app.kubernetes.io/name: helm-nvcf-sis
    app.kubernetes.io/instance: sis
    app.kubernetes.io/version: "1.2.2"
    app.kubernetes.io/managed-by: Helm
subjects:
  # Intentionally hardcoded: matches the chart's ServiceAccount and the OpenBao
  # JWT auth role (vault.hashicorp.com/role: sis-api) that pin the literal name.
  - kind: ServiceAccount
    name: sis-api
    namespace: sis
roleRef:
  kind: Role
  name: spot-instance-service-remote-config-reader
  apiGroup: rbac.authorization.k8s.io

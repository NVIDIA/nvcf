apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sis
  labels:
    helm.sh/chart: helm-nvcf-sis-2.3.0
    app.kubernetes.io/name: helm-nvcf-sis
    app.kubernetes.io/instance: sis
    app.kubernetes.io/version: "0.7.1"
    app.kubernetes.io/managed-by: Helm
    nvcf.nvidia.com/control-plane-owner: default
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 8181
      targetPort: 8181
      protocol: TCP
      name: management-port
  selector:
    app.kubernetes.io/name: helm-nvcf-sis
    app.kubernetes.io/instance: sis

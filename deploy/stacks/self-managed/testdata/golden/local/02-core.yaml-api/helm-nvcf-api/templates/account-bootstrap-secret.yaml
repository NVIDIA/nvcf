apiVersion: v1
kind: Secret
metadata:
  name: nvcf-api-account-bootstrap-secret
  namespace: nvcf
  labels:
    helm.sh/chart: helm-nvcf-api-1.25.1
    app.kubernetes.io/name: helm-nvcf-api
    app.kubernetes.io/instance: api
    app.kubernetes.io/version: "1.16.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: account-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  NVCF_ACCOUNT_NAME: "nvcf-default"
  NVCF_ADMIN_CLIENT_ID: "ncp"
  NVCF_REGISTRY_CREDENTIALS_JSON: |
        [{"artifactTypes":["CONTAINER"],"description":"NGC Container registry","registryHostname":"nvcr.io","secret":{"name":"nvcr-containers","value":"REPLACE_WITH_BASE64_DOCKER_CREDENTIAL"},"tags":[]},{"artifactTypes":["HELM"],"description":"NGC Container registry","registryHostname":"helm.ngc.nvidia.com","secret":{"name":"nvcr-containers","value":"REPLACE_WITH_BASE64_DOCKER_CREDENTIAL"},"tags":[]},{"artifactTypes":["MODEL","RESOURCE"],"description":"NGC Model registry","registryHostname":"api.ngc.nvidia.com","secret":{"name":"ngc-model","value":"REPLACE_WITH_BASE64_DOCKER_CREDENTIAL"},"tags":[]}]
  NVCF_MAX_FUNCTIONS_ALLOWED: "10"
  NVCF_MAX_TASKS_ALLOWED: "10"
  NVCF_MAX_TELEMETRIES_ALLOWED: "10"
  NVCF_MAX_REGISTRY_CREDENTIALS_ALLOWED: "10"

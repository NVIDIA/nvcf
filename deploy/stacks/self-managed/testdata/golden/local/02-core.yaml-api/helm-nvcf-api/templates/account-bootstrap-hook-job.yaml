apiVersion: batch/v1
kind: Job
metadata:
  name: nvcf-api-account-bootstrap
  namespace: nvcf
  labels:
    helm.sh/chart: helm-nvcf-api-1.25.1
    app.kubernetes.io/name: helm-nvcf-api
    app.kubernetes.io/instance: api
    app.kubernetes.io/version: "1.16.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: account-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "2"
    # don't delete the job on success, it will be deleted by the ttl
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        helm.sh/chart: helm-nvcf-api-1.25.1
        app.kubernetes.io/name: helm-nvcf-api
        app.kubernetes.io/instance: api
        app.kubernetes.io/version: "1.16.4"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: account-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: nvcf-api-account-bootstrap
      volumes:
      - name: token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
              audience: http://openbao-server.vault-system.svc.cluster.local:8200
      - name: account-bootstrap-script
        configMap:
          name: nvcf-api-account-bootstrap-script
          defaultMode: 0755
      containers:
      - name: account-bootstrap-creator
        image: "docker.io/alpine/k8s:1.36.1"
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash"]
        args: ["/scripts/account-bootstrap.sh"]
        volumeMounts:
        - name: token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: account-bootstrap-script
          mountPath: /scripts
          readOnly: true
        envFrom:
        - secretRef:
            name: nvcf-api-account-bootstrap-secret
        env:
          - name: API_SERVICE_NAME
            value: api
          - name: API_NAMESPACE
            value: "nvcf"
          - name: API_READINESS_PERIOD_SECONDS
            value: "3"
          - name: API_READINESS_FAILURE_THRESHOLD
            value: "600"
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi

# Source: nvcf-gateway-routes/templates/tcproute-grpc-proxy.yaml
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: grpc
  namespace: gateway
  labels:
    helm.sh/chart: nvcf-gateway-routes-1.17.0
    app.kubernetes.io/name: nvcf-gateway-routes
    app.kubernetes.io/instance: ingress
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: grpc-route
  annotations:
    {}
spec:
  # Attach to the shared Gateway
  parentRefs:
    - name: grpc-gateway
      namespace: gateway
      sectionName: tcp

  # Routing rules for gRPC
  rules:
    - backendRefs:
        - name: grpc
          namespace: nvcf
          port: 10081

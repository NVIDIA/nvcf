# Source: nvcf-gateway-routes/templates/httproute-llm-api-gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-api-gateway
  namespace: gateway
  labels:
    helm.sh/chart: nvcf-gateway-routes-1.18.1
    app.kubernetes.io/name: nvcf-gateway-routes
    app.kubernetes.io/instance: ingress
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: llm-api-gateway-route
  annotations:
    {}
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: http

  hostnames:
    - "llm.localhost"

  rules:
    - timeouts:
        request: 0s
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: llm-api-gateway
          namespace: nvcf
          port: 8080

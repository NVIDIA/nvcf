# Source: nvcf-gateway-routes/templates/referencegrant-nvcf.yaml
# ReferenceGrant allows HTTPRoutes and GRPCRoutes in traefik-gateway namespace
# to reference Services in nvcf namespace (for api, invocation-service, grpc)
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-routes-to-nvcf
  namespace: nvcf  # Grant is created in the target namespace
  labels:
    helm.sh/chart: nvcf-gateway-routes-1.18.1
    app.kubernetes.io/name: nvcf-gateway-routes
    app.kubernetes.io/instance: ingress
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    nvcf.nvidia.com/control-plane-owner: default
spec:
  # Allow references FROM traefik-gateway namespace
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: gateway
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: gateway
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: gateway
  # TO Services in nvcf namespace
  to:
    - group: ""
      kind: Service

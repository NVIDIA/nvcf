# Create the RBAC/SA during pre-install to ensure it's available
# this way it can avoid using hook weights

# Give the job rbac to watch cassandra pods/statefulsets for readiness and to
# exec into the cassandra pods to run cqlsh (superuser password bootstrap and
# keyspace.cql initialization).

# The serviceaccount (and therefore its permissions) are used in both
# of the post-install jobs
---
# Source: helm-nvcf-cassandra/templates/hook-pre-01-account-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    nvcf.nvidia.com/control-plane-owner: default
  name: cassandra-initialize-cluster
  namespace: cassandra-system
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
---
# Source: helm-nvcf-cassandra/templates/hook-pre-01-account-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    nvcf.nvidia.com/control-plane-owner: default
  name: cassandra-initialize-cluster
  namespace: cassandra-system
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
rules:
  # for determining when cluster pods are in ready state
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  # job scripts can exec to cassandra pods
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
# Source: helm-nvcf-cassandra/templates/hook-pre-01-account-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    nvcf.nvidia.com/control-plane-owner: default
  name: cassandra-initialize-cluster
  namespace: cassandra-system
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
subjects:
  - kind: ServiceAccount
    namespace: cassandra-system
    name: cassandra-initialize-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cassandra-initialize-cluster

apiVersion: v1
kind: ConfigMap
metadata:
  name: ratelimiter-vault-agent-tpl
  namespace: nvcf
  labels:
    helm.sh/chart: helm-nvcf-rate-limiter-1.2.1
    app.kubernetes.io/name: nvcf-ratelimiter
    app.kubernetes.io/instance: ratelimiter
    app.kubernetes.io/version: "1.17.3"
    app.kubernetes.io/managed-by: Helm
data:
  # Vault Agent template. The injector renders this into
  # /vault/secrets/secrets.json on pod start. rate_limiter.go reads the
  # `nvcfApiToken` key as the bearer credential for calls to nvcf-api.
  secrets.json.tmpl: |
    {{- with secret "services/nvcf-api/jwt/sign/ratelimiter-api" }}
    {"nvcfApiToken": "{{ .Data.token }}"}
    {{- end }}

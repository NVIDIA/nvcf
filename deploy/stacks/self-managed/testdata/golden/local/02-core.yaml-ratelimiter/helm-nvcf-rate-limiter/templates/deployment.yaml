apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimiter
  namespace: nvcf
  labels:
    helm.sh/chart: helm-nvcf-rate-limiter-1.2.1
    app.kubernetes.io/name: nvcf-ratelimiter
    app.kubernetes.io/instance: ratelimiter
    app.kubernetes.io/version: "1.17.3"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nvcf-ratelimiter
      app.kubernetes.io/instance: ratelimiter
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "ratelimiter-api"
        vault.hashicorp.com/auth-path: "auth/jwt"
        vault.hashicorp.com/auth-config-token-path: "/var/run/secrets/openbao/token"
        vault.hashicorp.com/agent-copy-volume-mounts: "ratelimiter"
        vault.hashicorp.com/agent-inject-template-file-secrets.json: "/vault/config/templates/secrets.json.tmpl"
        vault.hashicorp.com/secret-volume-path: "/vault/secrets"
        checksum/config-env: ce682179f2df6a7f852507b7b46a8b46ee5cd777f778738733d1486fabb97358
      labels:
        app.kubernetes.io/name: nvcf-ratelimiter
        app.kubernetes.io/instance: ratelimiter
    spec:
      serviceAccountName: ratelimiter-api
      securityContext:
        {}
      volumes:
        - name: vault-config-templates
          configMap:
            name: ratelimiter-vault-agent-tpl
            items:
              - key: secrets.json.tmpl
                path: secrets.json.tmpl
        - name: openbao-token
          projected:
            sources:
            - serviceAccountToken:
                audience: http://openbao-server.vault-system.svc.cluster.local:8200
                expirationSeconds: 3600
                path: token
      containers:
        - name: ratelimiter
          securityContext:
            {}
          image: "nvcr.io/nvidia/nvcf/nvcf-ratelimiter:1.17.3"
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: vault-config-templates
              mountPath: /vault/config/templates
              readOnly: true
            - mountPath: /var/run/secrets/openbao
              name: openbao-token
              readOnly: true
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Scope Olric peer discovery to this release's pods so it never
            # merges with other Olric services sharing the namespace.
            - name: OLRIC_K8S_LABEL_SELECTOR
              value: "app.kubernetes.io/name=nvcf-ratelimiter,app.kubernetes.io/instance=ratelimiter"
            - name: OAUTH2_ISSUER
              value: "http://ratelimiter.nvcf.svc.cluster.local"
            - name: AUDIENCE
              value: "s:ratelimiter"
            - name: NVCF_API_URL
              value: "http://api.nvcf.svc.cluster.local:9090"
            - name: OAUTH2_JWKS_URL
              value: "http://openbao-server.vault-system.svc.cluster.local:8200/v1/services/ratelimiter-api/jwt/jwks"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
            - name: SECRETS_PATH
              value: "/vault/secrets/secrets.json"
          ports:
            - name: grpc
              containerPort: 7777
              protocol: TCP
            - name: metrics
              containerPort: 7776
              protocol: TCP
            - name: http-health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http-health
          readinessProbe:
            httpGet:
              path: /health
              port: http-health
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi

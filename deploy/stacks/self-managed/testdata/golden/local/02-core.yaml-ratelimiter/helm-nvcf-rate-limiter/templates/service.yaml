apiVersion: v1
kind: Service
metadata:
  name: ratelimiter
  namespace: nvcf
  labels:
    helm.sh/chart: helm-nvcf-rate-limiter-1.2.1
    app.kubernetes.io/name: nvcf-ratelimiter
    app.kubernetes.io/instance: ratelimiter
    app.kubernetes.io/version: "1.17.3"
    app.kubernetes.io/managed-by: Helm
    nvcf.nvidia.com/control-plane-owner: default
spec:
  type: ClusterIP
  ports:
    - port: 7777
      targetPort: 7777
      protocol: TCP
      name: grpc
    - port: 7776
      targetPort: 7776
      protocol: TCP
      name: metrics
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-health
  selector:
    app.kubernetes.io/name: nvcf-ratelimiter
    app.kubernetes.io/instance: ratelimiter

apiVersion: v1
kind: ConfigMap
metadata:
  name: grpc-proxy-env
  namespace: nvcf
  labels:
    helm.sh/chart: helm-nvcf-grpc-proxy-1.7.3
    app.kubernetes.io/name: helm-nvcf-grpc-proxy
    app.kubernetes.io/instance: grpc-proxy
    app.kubernetes.io/version: "1.33.4"
    app.kubernetes.io/managed-by: Helm
    nvcf.nvidia.com/control-plane-owner: default
data:
  ENABLE_HTTP1_CONNECT: "true"
  GEO_DISABLED: "true"
  JETSTREAM_PLACEMENT_TAG: "dc:ncp"
  NATS_FQDN: "nats://nats.nats-system.svc.cluster.local:4222"
  NVCF_FQDN_GRPC: "http://api.nvcf.svc.cluster.local:9090"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  RATE_LIMIT_ADDR: "http://ratelimiter.nvcf.svc.cluster.local:7777"
  RATE_LIMIT_ENABLED: "true"
  TRACING: "none"

apiVersion: v1
kind: Service
metadata:
  name: grpc
  namespace: nvcf
  labels:
    helm.sh/chart: helm-nvcf-grpc-proxy-1.7.3
    app.kubernetes.io/name: helm-nvcf-grpc-proxy
    app.kubernetes.io/instance: grpc-proxy
    app.kubernetes.io/version: "1.33.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: deployment
    nvcf.nvidia.com/control-plane-owner: default
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 10081
      targetPort: 10081
      protocol: TCP
    - name: worker-tcp
      port: 10086
      targetPort: 10086
      protocol: TCP
    - name: metrics
      port: 10083
      targetPort: 10083
      protocol: TCP
  selector:
    app.kubernetes.io/name: helm-nvcf-grpc-proxy
    app.kubernetes.io/instance: grpc-proxy
    app.kubernetes.io/component: deployment

apiVersion: v1
kind: Service
metadata:
  name: reval
  labels:
    helm.sh/chart: helm-reval-1.3.8
    app.kubernetes.io/name: helm-reval
    app.kubernetes.io/instance: reval
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: management
      protocol: TCP
      name: management
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 8081
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: helm-reval
    app.kubernetes.io/instance: reval

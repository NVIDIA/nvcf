apiVersion: apps/v1
kind: Deployment
metadata:
  name: reval
  labels:
    helm.sh/chart: helm-reval-1.3.8
    app.kubernetes.io/name: helm-reval
    app.kubernetes.io/instance: reval
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-reval
      app.kubernetes.io/instance: reval
  template:
    metadata:
      labels:
        helm.sh/chart: helm-reval-1.3.8
        app.kubernetes.io/name: helm-reval
        app.kubernetes.io/instance: reval
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      containers:
        - name: helm-reval
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          image: "nvcr.io/nvidia/nvcf/reval-server:latest"
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/config/config.yaml"
          ports:
            - name: management
              containerPort: 8082
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
          readinessProbe:
            httpGet:
              path: /healthz
              port: management
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: reval-config
              mountPath: /config/config.yaml
              subPath: config.yaml
      volumes:
        - name: reval-config
          configMap:
            name: reval-config

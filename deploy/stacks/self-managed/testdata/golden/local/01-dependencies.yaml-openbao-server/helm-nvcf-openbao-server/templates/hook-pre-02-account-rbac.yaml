# Create the RBAC/SA during pre-install to ensure it's available
# this way it can avoid using hook weights

# Give the job rbac to read,patch,create secrets in the namespace
# it will read/update the unseal key and create the root token

# The serviceaccount (and therefore its permissions) are used in both
# of the post-install jobs
---
# Source: helm-nvcf-openbao-server/templates/hook-pre-02-account-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    nvcf.nvidia.com/control-plane-owner: default
  name: openbao-server-initialize-cluster
  namespace: vault-system
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
---
# Source: helm-nvcf-openbao-server/templates/hook-pre-02-account-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    nvcf.nvidia.com/control-plane-owner: default
  name: openbao-server-initialize-cluster
  namespace: vault-system
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
rules:
  # create unseal and jwt secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "get"]
  # for determining when cluster pods are in ready state
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # job scripts can exec to bao pods
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # scripts/deploy.sh check_sidecar_version() reads the StatefulSet spec to
  # verify openbao and auto-unseal-sidecar container images match at runtime
  # (complements the template-time guard in validate-sidecar-version.yaml)
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get"]
---
# Source: helm-nvcf-openbao-server/templates/hook-pre-02-account-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    nvcf.nvidia.com/control-plane-owner: default
  name: openbao-server-initialize-cluster
  namespace: vault-system
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
subjects:
  - kind: ServiceAccount
    namespace: vault-system
    name: openbao-server-initialize-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-server-initialize-cluster
---
# Source: helm-nvcf-openbao-server/templates/hook-pre-02-account-rbac.yaml
# Allow job to access `openid/v1/jwks`
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    nvcf.nvidia.com/control-plane-owner: default
  name: openbao-server-openid-reader
  namespace: vault-system
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
subjects:
  - kind: ServiceAccount
    namespace: vault-system
    name: openbao-server-initialize-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery

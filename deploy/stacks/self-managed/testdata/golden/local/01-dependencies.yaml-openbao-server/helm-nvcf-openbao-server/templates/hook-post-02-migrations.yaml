apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-server-migrations
  namespace: vault-system
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      # this is the same service account created for hook-post-01-initcluster
      # this job can access secrets and exec to bao
      serviceAccountName: openbao-server-initialize-cluster
      containers:
        - name: bao-migrations
          image: "nvcr.io/nvidia/nvcf/nvcf-openbao-migrations:0.19.1"
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: openbao-server-root-token
              mountPath: /secrets/root_token
              readOnly: true
            - name: openbao-server-jwt
              mountPath: /secrets/jwt
              readOnly: true
          env:
            - name: OIDC_DISCOVERY_ENABLED
              value: "false"
            - name: OIDC_DISCOVERY_URL
              value: "https://kubernetes.default.svc/.well-known/openid-configuration"
            - name: OIDC_DISCOVERY_INSECURE
              value: "false"
            - name: DEFAULT_CASSANDRA_PASSWORD
              value: ch@ng3m3
            - name: NVCF_API_SIDECARS_IMAGE_PULL_SECRET
              value: REPLACE_WITH_BASE64_DOCKER_CREDENTIAL
            - name: ADMIN_CLIENT_ID
              value: ncp
            - name: ADDONS_LLM_ENABLED
              value: "false"
            - name: NVCF_SERVICE_PKI_ALLOWED_DOMAINS
              value: cluster.local
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: openbao-server-root-token
          secret:
            secretName: openbao-server-root-token
            items:
            - key: root_token
              path: root_token
        - name: openbao-server-jwt
          secret:
            secretName: cluster-jwt
            items:
              - key: pem
                path: cluster_jwt.pem

# Contains the initialization script and a job to run it as a hook

# The script runs in an image that must contain:
# - bash
# - kubectl
# - jq
# - jwker
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    nvcf.nvidia.com/control-plane-owner: default
  name: openbao-server-initialize-cluster
  namespace: vault-system
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-5"
spec:
  template:
    spec:
      containers:
        - name: bao-init
          image: "nvcr.io/nvidia/nvcf/nvcf-openbao-migrations:0.19.1"
          command: ["/bin/bash"]
          args:
            - -c
            - /scripts/deploy.sh vault-system openbao-server helm
          volumeMounts:
            - name: init-script
              readOnly: true
              mountPath: "/scripts"
            - name: utils-script
              readOnly: true
              mountPath: "/scripts/utils"
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      restartPolicy: Never
      serviceAccountName: openbao-server-initialize-cluster
      volumes:
        - name: init-script
          configMap:
            name: openbao-server-init-script

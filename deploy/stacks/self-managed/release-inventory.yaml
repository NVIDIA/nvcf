schemaVersion: 1
# Inventory states are owned by this distributable. Other stack trees publish
# their own release inventories and must not be referenced here.
states:
  - plane: control-plane
    path: deploy/stacks/self-managed/helmfile.d/01-dependencies.yaml.gotmpl
    fullOverrides:
      - addons.llm.enabled=true
      - addons.lls.enabled=true
  - plane: control-plane
    path: deploy/stacks/self-managed/helmfile.d/02-core.yaml.gotmpl
    fullOverrides:
      - addons.llm.enabled=true
      - addons.vanityGateway.enabled=true
      - addons.nvcfUi.enabled=true
      - addons.lls.enabled=true
  - plane: control-plane
    path: deploy/stacks/self-managed/helmfile.d/03-observability.yaml.gotmpl
    fullOverrides:
      - observability.profile=control
  - plane: control-plane
    path: deploy/stacks/self-managed/helmfile.d/04-upgrade-receipt.yaml.gotmpl
# These charts are released independently and might not yet be mirrored into
# the composite stack's release chart repository. Render each pinned chart from
# its immutable public GitHub release tag, then report the public self-managed
# catalog destination.
sourceCharts:
  helm-nvcf-api:
    tagPrefix: deploy/helm/cloud-functions/v
    path: deploy/helm/cloud-functions/nvcf-api
  helm-nvcf-api-keys:
    tagPrefix: deploy/helm/api-keys-colocated/v
    path: deploy/helm/api-keys-colocated/api-keys
  helm-nvcf-openbao-server:
    tagPrefix: deploy/helm/openbao/v
    path: deploy/helm/openbao/helm
  helm-nvcf-sis:
    tagPrefix: deploy/helm/icms/v
    path: deploy/helm/icms/icms-api
  helm-nvcf-llm-request-router:
    tagPrefix: deploy/helm/llm-request-router/v
    path: deploy/helm/llm-request-router/llm-request-router
  helm-nvcf-ui:
    tagPrefix: src/uis/nvcf-ui/helm/v
    path: src/uis/nvcf-ui/helm
  helm-nvcf-invocation-service:
    tagPrefix: deploy/helm/http-invocation/v
    path: deploy/helm/http-invocation/nvcf-invocation-service
  helm-nvcf-nats-auth-callout-service:
    tagPrefix: deploy/helm/nats-auth-callout/v
    path: deploy/helm/nats-auth-callout
    # Chart v1.2.0 expects this unscoped value while the tagged stack keeps the
    # intended public repository under natsAuthCalloutService.
    renderValues:
      image.repository: nvcr.io/nvidia/nvcf/nvcf-nats-auth-callout-service
  helm-nvcf-rate-limiter:
    tagPrefix: deploy/helm/ratelimiter/v
    path: deploy/helm/ratelimiter/nvcf-ratelimiter
# The release workflow authenticates before evaluating the remaining charts and
# permits states that contain only third-party or local charts.
publishedChartRepository: https://helm.ngc.nvidia.com/nvidia/nvcf

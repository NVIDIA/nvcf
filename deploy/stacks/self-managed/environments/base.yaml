global:

  # Domain for external access (used by Gateway API HTTPRoutes)
  domain: "localhost"

  # =============================================================================
  # Helm Chart Sources Configuration
  # =============================================================================
  # Option A: HTTPS Helm repository (e.g. NGC public catalog):
  #   sources:
  #     url: "https://helm.ngc.nvidia.com/nvidia/nvcf"
  #     username: "$oauthtoken"
  #     password: "YOUR_NGC_API_KEY"
  #
  # Option B: OCI registry (e.g. ECR or a private NGC org after mirroring):
  #   sources:
  #     registry: "nvcr.io"           # or <account>.dkr.ecr.<region>.amazonaws.com
  #     repository: "YOUR_ORG/YOUR_TEAM"
  # =============================================================================
  helm:
    sources:
      registry: "nvcr.io"
      repository: "YOUR_ORG/YOUR_TEAM"

  # =============================================================================
  # Container Image Registry Configuration
  # =============================================================================
  # Configure the container registry where NVCF service images are stored.
  # These images are pulled by Kubernetes when deploying the NVCF stack.
  # =============================================================================
  # =============================================================================
  # Image Pull Secrets Configuration
  # =============================================================================
  # Kubernetes imagePullSecrets applied to all NVCF workloads.
  # These must reference pre-existing Kubernetes secrets in each namespace
  # where NVCF components are deployed.
  #
  # Example: [{name: "my-registry-secret"}]
  # =============================================================================
  imagePullSecrets: []

  image:
    registry: nvcr.io
    repository: YOUR_ORG/YOUR_TEAM

  # =============================================================================
  # Worker Sidecar Registry Configuration
  # =============================================================================
  # Registry host/repository advertised to workers for the worker sidecar images
  # (NVCF_SIDECARS_* / NVCT_SIDECARS_*). Unset inherits global.image. Set these to
  # source the worker sidecars from a separate registry/org (e.g. a private NGC
  # org) while control-plane images stay on global.image. Supply the matching
  # sidecar pull credential separately.
  # =============================================================================
  # sidecars:
  #   hostname: nvcr.io
  #   repository: YOUR_ORG/YOUR_TEAM

  # Worker-facing endpoints advertised by control-plane services into launched
  # workload pods. Leave empty to use service defaults; set per environment when
  # workers run in a different cluster or DNS domain from the control plane.
  workerEndpoints:
    # NVCF function worker env: NVCF_FQDN
    nvcfServiceURL: ""
    # NVCF function worker env: NVCF_FQDN_GRPC
    nvcfGrpcServiceURL: ""
    # NVCF function worker env: NVCF_FQDN_NATS
    nvcfNatsServiceURL: ""
    # NVCF function worker env: ESS_FQDN
    essServiceURL: ""
    # NVCT task worker env: NVCT_FQDN
    nvctServiceURL: ""
    # NVCT task worker env: NVCT_FQDN_GRPC
    nvctGrpcServiceURL: ""
    # Invocation service worker stream address. Empty advertises each pod's
    # own address. Every replica advertises a set value, so invocation-service
    # stays at one replica under HA when it is set.
    invocationServiceURL: ""
    # Proxy that workers dial for invocation callbacks
    # (WORKER_STREAM_PROPERTIES__PROXY_ADDRESS). Used only when
    # workerCallbackProxy.enabled is true; empty uses the worker callback proxy
    # Service. Set it when workers reach Envoy through another address.
    invocationProxyURL: ""
    # gRPC proxy worker CONNECT endpoint advertised by the proxy. Empty
    # advertises each pod's IP. Every replica advertises a set value, so
    # grpc-proxy stays at one replica under HA when it is set, unless
    # grpcproxy.http3 is enabled, which puts each pod's IP in front of it.
    grpcProxyWorkerConnectURL: ""
    # Pylon discovery endpoint. Empty uses
    # llm-request-router-backend-router.nvcf.svc.cluster.local:50071 when backend
    # routing is enabled, otherwise llm-request-router.nvcf.svc.cluster.local:50071.
    llmRequestRouterAddress: ""

  nodeSelectors:
    enabled: false
    # Uncomment if you have a single node pool for all system workloads.
    #
    # all:
    #   key: nvcf.nvidia.com/workload
    #   value: system
    # vault: null
    # cassandra: null
    # controlplane: null
    # worker: null

    # Set these if you have dedicated node pools for each system workload type.
    vault:
      key: nvcf.nvidia.com/workload
      value: vault
    cassandra:
      key: nvcf.nvidia.com/workload
      value: cassandra
    controlplane:
      key: nvcf.nvidia.com/workload
      value: control-plane
    # Uncomment if you have a dedicated node pool for compute plane workers.
    # If unset, controlplane or all node selectors are used.
    #
    # worker:
    #   key: nvcf.nvidia.com/workload
    #   value: worker

  # Set this if you have custom node taints for system workloads.
  tolerations:
    enabled: false
    # Set these if you have taints on the node pool for all system workloads.
    # Example:
    #
    # all:
    # - effect: NoSchedule
    #   key: dedicated
    #   operator: Equal
    #   value: system-workload
    # - effect: NoExecute
    #   key: dedicated
    #   operator: Equal
    #   value: system-workload
    #
    all: []
    # Set these if you have taints on dedicated node pools for each system workload type.
    #
    # vault: []
    # cassandra: []
    # controlplane: []
    # worker: []

  storageClass: ""
  storageSize: "10Gi"

  observability:
    tracing:
      enabled: false
      collectorEndpoint: ""
      collectorPort: 4317
      collectorProtocol: http
    metrics:
      # global.observability.metrics.enabled
      enabled: false

# One profile installs and configures the shared observability stack for the
# selected planes. Self-managed control-plane installs need no other
# observability flags.
observability:
  profile: control

# Defaults consumed only for the control and all observability profiles.
functionAutoscaler:
  # Additional application settings. Environment variables use `__` between
  # nested keys, for example SCALING__LOOKBACK_SECONDS.
  env: {}
  region: local
  cassandra:
    contactPoints: cassandra.cassandra-system.svc.cluster.local
    isDevelopment: false
  nvcfApi:
    grpcAddress: http://api.nvcf.svc.cluster.local:9090
    # Self-managed auth uses the OpenBao-rendered bearer token.
    disableAuth: false
    dryRun: false
  timeseriesDb:
    # Self-hosted control-plane metrics do not require the hosted TSDB's
    # environment label.
    ignoreEnv: true

# API environment entries are merged over the stack defaults. Remote config is
# passed to the API chart and overrides its packaged application profile. When
# the LLM addon is enabled, the stack defaults the Pylon image from
# global.sidecars (or global.image) at version 0.25.0.
api:
  env: {}
  # In-cluster ESS base URL for the API's own ESS calls. Empty defaults to
  # global.workerEndpoints.essServiceURL. In split-plane deployments that value
  # is the public ESS URL for remote workers, so set this to the in-cluster
  # ess-api Service to keep control-plane ESS calls off the public edge, e.g.
  # http://ess-api.ess.svc.cluster.local:8080. The worker alias
  # (NVCF_ESS_WORKER_BASE_URL) stays on essServiceURL.
  essBaseURL: ""
  remoteConfig:
    configData: {}

# NVCT API in-cluster ESS base URL, mirroring api.essBaseURL. Empty defaults to
# global.workerEndpoints.essServiceURL; NVCT_ESS_WORKER_BASE_URL stays on it.
# Remote config is passed to the NVCT API chart and overrides its packaged
# application profile, mirroring api.remoteConfig.
nvctApi:
  essBaseURL: ""
  remoteConfig:
    configData: {}

# Image overrides for the API account-bootstrap job. alpine-k8s is not
# republished under the public nvidia/nvcf catalog. The API chart defaults to
# its upstream source, docker.io/alpine/k8s:1.37.0. Leave these unset unless
# you have mirrored the image into your own registry, in which case set
# registry and repository together:
#   accountBootstrap:
#     image:
#       registry: <your-registry>
#       repository: <your-repository>/alpine-k8s
#       tag: "1.37.0"

# The bundled upgrade receipt uses its chart's public upstream helper image.
# Global NVCF image settings do not select this third-party image. To use a
# mirror, set upgradeReceipt.image.registry and repository together. A tag
# override is optional and must be qualified for the cluster's Kubernetes version.
#   upgradeReceipt:
#     image:
#       registry: <your-registry>
#       repository: <your-repository>/alpine-k8s

accounts:
  limits:
    maxFunctions: 10
    maxTasks: 10
    maxTelemetries: 10
    maxRegistryCreds: 10

# These static global values are processed in the values template
nats:
  enabled: true
  # How workers authenticate to NATS.
  #   nkey: the NVCF API gives every worker the control plane's shared NATS
  #     NKey as NKEY_SEED. The default.
  #   token: each worker authenticates with its own worker token, into APP. The
  #     NATS auth callout passes it to the NVCF API, which returns that function
  #     version's permissions, and the API stops sending NKEY_SEED. Needs an NVCF
  #     API and worker-utils that support NVCF_NATS_ACCOUNT. Use it when workers
  #     run outside the control-plane cluster.
  # Switching an existing install: see "Worker NATS Authentication" in
  # docs/self-managed/control-plane-operations.md.
  workerAuth: nkey
  authCallout:
    workerTokenAuth:
      # token mode: the NVCF API endpoint the NATS auth callout sends worker
      # tokens to. Changing it restarts the auth callout.
      webhookUrl: http://api.nvcf.svc.cluster.local:8080/v2/nvcf/webhook/nats-auth
  # The control plane places request-queue streams by its logical NCP region.
  # Keep both tags so NATS can host shared and region-scoped streams.
  config:
    merge:
      server_tags:
        - "dc:ncp"
        - "aws-region:ncp"
      # --- Split-plane server TLS (optional; both settings default off) ---
      # Use case: when GPU workers run outside the cluster they reach NATS over
      # an L4 (TCP) passthrough load balancer, so TLS must terminate at the NATS
      # server itself -- an LB can't terminate it because the NATS client is
      # INFO-first (the server speaks first) and a terminated handshake deadlocks.
      # Set the two knobs below to serve TLS from NATS to those workers.
      #
      # Gotchas:
      #   1. allow_non_tls is mixed-mode: the server then accepts BOTH TLS and
      #      plaintext on :4222. Enable it only intentionally -- it lets in-cluster
      #      plaintext clients keep connecting while remote workers use TLS. Leave
      #      it off if every client can speak TLS.
      #   2. Changing allow_non_tls (or the tls block) requires a NATS
      #      restart/rollout to take effect.
      #   3. The cert in secretName must have a SAN covering the exact hostname the
      #      external workers connect to (the LB / public NATS hostname), and those
      #      workers must trust the issuing CA and use a TLS-capable NATS client
      #      config.
      # allow_non_tls: true
    # nats:
    #   tls:
    #     enabled: true
    #     secretName: nats-server-tls   # cert-manager-issued; SAN = external NATS hostname
  # CPU and memory for each NATS server container. The chart sets none, so the
  # servers run as BestEffort and nats-server sizes its Go runtime to every
  # core on the node. Set a CPU limit so the runtime sizes itself to it, and
  # set requests so NATS keeps its CPU share when the node is full. Size both
  # from your own load test. No memory limit is shown because the
  # request-queue streams are memory-backed and a memory limit can end the
  # server under a backlog.
  # container:
  #   merge:
  #     resources:
  #       requests:
  #         cpu: <cores>
  #         memory: <memory>
  #       limits:
  #         cpu: <cores>
  # Image overrides for the NATS config reloader. The reloader is not
  # republished under the public nvidia/nvcf catalog, so it defaults to its
  # upstream source, docker.io/natsio/nats-server-config-reloader:0.24.0.
  # Leave these unset unless you have mirrored the image into your own
  # registry, in which case set registry and repository together:
  # reloader:
  #   image:
  #     registry: <your-registry>
  #     repository: <your-repository>/nats-server-config-reloader
  #     tag: "0.24.0"
  # PDB: the upstream NATS chart enables a disruption budget by default.
  # Override here to disable it or adjust the minAvailable threshold.
  podDisruptionBudget:
    enabled: false
    merge:
      spec:
        minAvailable: 2

cassandra:
  enabled: true
  # Bitnami Cassandra resourcesPreset reference (request -> limit):
  # none: no preset resources
  # nano: 100m CPU, 128Mi memory -> 150m CPU, 192Mi memory
  # micro: 250m CPU, 256Mi memory -> 375m CPU, 384Mi memory
  # small: 500m CPU, 512Mi memory -> 750m CPU, 768Mi memory
  # medium: 500m CPU, 1024Mi memory -> 750m CPU, 1536Mi memory
  # large: 1 CPU, 2048Mi memory -> 1.5 CPU, 3072Mi memory
  # xlarge: 1 CPU, 3072Mi memory -> 3 CPU, 6144Mi memory
  # 2xlarge: 1 CPU, 3072Mi memory -> 6 CPU, 12288Mi memory
  # All presets include 50Mi ephemeral-storage request and 2Gi limit.
  # Do not use small for default cloud installs. Cassandra can OOM during
  # first boot and leave migrations in a failed or dirty state.
  resourcesPreset: "xlarge"
  migrations:
    image:
      tag: 0.17.6
  # Image overrides for the Cassandra server and dynamicSeedDiscovery containers.
  # The default image name is `cassandra` under global.image.repository.
  # Override here when pulling from a registry that uses a different path or tag.
  # image:
  #   registry: ""         # defaults to global.image.registry
  #   repository: ""       # defaults to <global.image.repository>/cassandra
  #   tag: ""              # defaults to the chart appVersion
  # dynamicSeedDiscovery:
  #   image:
  #     registry: ""
  #     repository: ""
  #     tag: ""
  # PDB: disabled by default. Recommended for production 3-node clusters.
  # Set exactly one of minAvailable or maxUnavailable.
  podDisruptionBudget:
    enabled: false
    minAvailable: 2   # keep at least 2 of 3 nodes up during any disruption

certManager:
  # cert-manager controller required to reconcile Certificate resources for
  # the self-managed PKI stack. Enabling addons.llm.pki with the managed
  # issuer, or workerCallbackProxy, provisions the OpenBao service PKI and
  # creates ClusterIssuer/nvcf-openbao-pki, which is cluster-scoped
  # and has no namespace. The nvcf-pki Helm release that creates it and the
  # cert-manager ServiceAccount it authenticates as both live in the
  # cert-manager namespace. The bundled helm-nvcf-cert-manager chart ships
  # installCRDs=true by default. Set this to false when cert-manager is
  # installed outside this stack; that external installation must still
  # provide ServiceAccount/cert-manager in the cert-manager namespace.
  enabled: true
  # The ACME solver defaults to quay.io/jetstack/cert-manager-acmesolver.
  # Set acmesolver.image.repository when the deployment uses a private mirror.
  # acmesolver:
  #   image:
  #     repository: nvcr.io/YOUR_ORG/YOUR_TEAM/cert-manager-acmesolver
  #     tag: "v1.20.2"

openbao:
  enabled: true
  migrations:
    issuerDiscovery:
      enabled: false
  injector:
    # Production default: 2 replicas with hard anti-affinity for HA.
    # Override to 1 in single-node / minimal test pools to avoid Pending pods.
    replicas: 2
    webhook:
      # Ignore admits pods when the injector webhook is unavailable.
      # Set to Fail when successful secret injection is required for admission.
      failurePolicy: Ignore
      # The selector is omitted by default, so the webhook applies to all namespaces.
      # Uncomment this block to restrict it to the selected NVCF namespaces.
      # When the addon is enabled, nvcf-ui is appended to a
      # kubernetes.io/metadata.name In expression. Other selector shapes
      # must match the nvcf-ui namespace without template mutation.
      # namespaceSelector:
      #   matchExpressions:
      #     - key: kubernetes.io/metadata.name
      #       operator: In
      #       values:
      #         - api-keys
      #         - ess
      #         - nats-system
      #         - nvcf
      #         - sis
    # PDB for the injector Deployment. minAvailable: 1 by default (always active).
    podDisruptionBudget:
      minAvailable: 1
  server:
    ha:
      # PDB for the HA Raft StatefulSet. The upstream chart enables this by
      # default with maxUnavailable derived from replica count.
      disruptionBudget:
        enabled: false
        maxUnavailable: 1

addons:
  # LLS/TURN Low-Latency Streaming addon
  # When enabled, configures OpenBao secrets for TURN service and deploys HMAC rotation CronJob
  lls:
    enabled: false

  # LLM addon: gateway + request router (stargate) for LLM function invocation
  llm:
    enabled: false
    requestRouter:
      # replicaCount defaults to the request-router chart value. Set it here
      # only when the stack needs a different topology.
      # replicaCount: 3
      # Set only for source-tree validation. Empty uses the released OCI chart.
      chartPath: ""
      # The chart owns readiness, workload, and discovery defaults. Override
      # only the fields that differ for this stack environment.
      # readiness:
      #   warmupMs: 60000
      # workload:
      #   kind: StatefulSet
      # discovery:
      #   disableDnsDiscovery: true
      #   watchHeartbeatMs: 5000
      #   remoteWatchUrls: []
      #   allowInsecureRemoteWatchHttp: false

      # Authority and SNI aware backend router. A worker holds one registration
      # stream and one reverse QUIC tunnel per router replica, and each must
      # reach the specific replica named by the gRPC authority or QUIC SNI, so
      # ordinary load balancing cannot carry this traffic. The router reads that
      # identity and forwards to the named pod.
      #
      # Follows addons.llm.enabled by default. It is deliberately not a separate
      # opt-in: keeping it on in single-cluster installs means they exercise the
      # same connection path that split-cluster and multi-region installs
      # depend on.
      #
      # Note that the router relays the reverse tunnel, and that tunnel carries
      # inference traffic, so it sits in the data path and terminates QUIC TLS.
      backendRouter:
        # enabled: defaults to addons.llm.enabled
        # replicaCount defaults to the request-router chart value.
        # replicaCount: 2
        # service:
        #   grpcPort: 50071
        # Addresses workers dial to reach the router. Both default to the
        # backend-router Service in-cluster, which is correct when workers run
        # alongside the control plane. Set both to externally reachable
        # addresses when workers run in a separate cluster or region.
        pylonGrpcDialAddress: ""
        pylonReverseTunnelDialAddress: ""

      # TLS for the worker-facing gRPC registration and Watch endpoint on
      # port 50071. This identity is consumed by the Gateway HTTPS listener;
      # it is separate from the request-router QUIC identity on port 50072.
      grpcTls:
        enabled: false
        # Required for a deliberately plaintext external development route.
        # Production and PKI-enabled split-cluster profiles enable TLS.
        allowInsecureHttp: false
        # certManager requests a certificate in the Gateway namespace.
        # existingSecret uses a pre-created Secret and renders no Certificate.
        mode: certManager
        secretName: llm-request-router-grpc-tls
        # Required only in certManager mode. With existingSecret, the operator
        # owns and verifies the certificate SANs.
        dnsNames: []
        issuerRef:
          # Defaults to the QUIC PKI issuer when omitted.
          kind: ""
          name: ""
          group: ""

    # QUIC TLS certificate for the request router (Stargate). Managed PKI is
    # active by default whenever addons.llm.enabled is true. Set enabled=false
    # only when an environment deliberately supplies another transport policy.
    #
    # mode selects who owns the server identity:
    #   certManager    - the chart requests a Certificate from the configured
    #                    issuer and mounts the resulting Secret. Managed mode
    #                    also provisions the OpenBao service-issuing hierarchy
    #                    and defaults to ClusterIssuer/nvcf-openbao-pki.
    #   existingSecret - the chart mounts a Secret you created and manages no
    #                    issuance. Requires secretName. The stable-base
    #                    dnsNames and allowedDomains defaults are tolerated
    #                    because Helmfile cannot reliably clear inherited
    #                    values to empty values;
    #                    any changed managed value is rejected. You own
    #                    issuance, renewal, rotation, and recovery, and the
    #                    stack validates neither the SANs nor the expiry.
    pki:
      enabled: true
      mode: certManager
      # Comma-separated DNS suffixes the managed OpenBao role accepts. Extend
      # this only when advertisedHostnameTemplate uses another DNS suffix.
      allowedDomains: cluster.local
      # SANs for both the stable Service and authority/SNI-selected Stargate
      # pod identities. Split/multi-cluster dial addresses select the network
      # path only: Pylon preserves the advertised per-pod hostname as gRPC
      # authority and QUIC SNI, so a load-balancer hostname or IP does not need
      # to be added here. Add SANs only when advertisedHostnameTemplate changes
      # those identities. In existingSecret mode, only these unchanged
      # stable-base defaults are tolerated; custom values are rejected.
      dnsNames:
        - llm-request-router.nvcf.svc.cluster.local
        - "*.llm-request-router-headless.nvcf.svc.cluster.local"
      # REQUIRED for mode existingSecret; the kubernetes.io/tls Secret in the
      # nvcf namespace holding the tls.crt and tls.key entries. Optional for
      # mode certManager, where it names the Secret cert-manager writes.
      # secretName: stargate-quic-tls
      # Optional overrides; defaults are usually correct.
      # issuerKind: ClusterIssuer
      # issuerName: nvcf-openbao-pki
      # Stack management defaults to true only for the default
      # ClusterIssuer/nvcf-openbao-pki configuration. Set this explicitly to
      # manage a custom ClusterIssuer. Leave it false for an external issuer.
      # clusterIssuer:
      #   enabled: true
      # mountPath: /etc/stargate/tls
      # certPath: /etc/stargate/tls/tls.crt
      # keyPath: /etc/stargate/tls/tls.key

  # Event Ledger addon: records deployment stage events from NVCA and SIS.
  # When enabled, deploys the event-ledger service backed by Cassandra.
  eventLedger:
    enabled: true

  # Vanity Gateway addon for optional vanity and OpenAI-compatible invocation routes.
  # Disabled by default; enabling this deploys the vanity-gateway service and its
  # Gateway API HTTPRoute without changing the default invocation or LLM routes.
  vanityGateway:
    enabled: false
    replicaCount: 2
    image:
      # Optional image tag override. Leave empty to use the chart appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    config:
      mappingPath: /etc/vanity-gateway/config/config.yaml
      nvcfApiEndpoint: http://invocation.nvcf.svc.cluster.local:8080
      llmGatewayEndpoint: http://llm-api-gateway.nvcf.svc.cluster.local:8080
      # Empty by default because the Vanity Gateway chart does not create Vault
      # Agent injection. Set this only when another component mounts the secrets
      # file into the pod.
      secretsPath: ""
      privateModelNameRegexPattern: ""
      awsRegion: ""
      shadowMaxConcurrent: 256
    mappingConfig:
      v2config:
        openai: {}
        vanity: {}
    serviceMonitor:
      # Disabled by default for environments without Prometheus Operator.
      enabled: false
      interval: 60s
      labels: {}
    # Runtime overrides passed through to the Vanity Gateway chart.
    service: {}
    serviceAccount: {}
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {}
    securityContext: {}
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # NVCF UI addon for optional NVCF admin-panel UI.
  # Disabled by default
  nvcfUi:
    enabled: false

stateMetrics:
  enabled: true
  # Disable ServiceMonitor for environments without Prometheus Operator
  serviceMonitor:
    enabled: false

rateLimiter:
  enabled: true
  replicaCount: 1
  # PDB: enable when replicaCount > 1.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

# Bundled in-cluster ICMS -- the sis release (spot-instance-service). Gated by a
# helmfile condition; defaults to true so existing installs are unchanged. Set to
# false to skip it when scheduling workers through an external/production ICMS.
icms:
  enabled: true

# PDB knobs for control-plane services. Disabled by default.
# Set enabled: true for any service running more than one replica.

apikeys:
  # Operator-set api-keys service env, deep-merged over the chart defaults
  # (AWS_REGION / SPRING_PROFILES_ACTIVE). Set NVCF_NCA_ID to the NCA the
  # api-keys service authorizes keys against. Leave unset to keep the chart
  # defaults only. Non-secret configuration only -- secrets belong in
  # secrets/<env>-secrets.yaml.
  # env:
  #   NVCF_NCA_ID: "nca-xxxxxxxx"
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

ess:
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

invocation:
  env:
    # Keep request subjects aligned with the API and worker consumers.
    NATS_PROPERTIES__REGION: ncp
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

adminIssuerProxy:
  # Mints admin JWTs for `nvcf-cli init` without authenticating the caller.
  # Defaults to true so existing installs are unchanged.
  #
  # false drops the release, its Gateway route, its NVCF UI health entry, and
  # the OpenBao role that lets it sign admin-scoped tokens. `nvcf-cli init` and
  # `nvcf-cli refresh` both call POST /v1/admin/keys, so both stop working
  # against this stack; obtain the admin token from your own identity provider
  # and set NVCF_TOKEN instead.
  #
  # On a stack where it is already installed this uninstalls nothing: the
  # release and the OpenBao role both already exist and stay. Until the role is
  # removed, any pod running as the admin-issuer-proxy service account in the
  # api-keys namespace can still sign those tokens. For the removal steps see
  # "Disabling Admin Issuer Proxy" in docs/self-managed/control-plane-operations.md.
  enabled: true
  # The api-keys.<domain>/v1/admin/keys route; false keeps it in-cluster only.
  # Only meaningful with enabled: true -- disabling the release removes the
  # route with it.
  gateway:
    enabled: true
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

functionautoscaler:
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

reval:
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

# LLM addon services (active only when addons.llm.enabled: true):
llmApiGateway:
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

llmRequestRouter:
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

# Ingress Gateway Configuration
ingress:
  gatewayApi:
    enabled: true
    controllerNamespace: "" # must be set by the environment
    # Optional path to a local gateway-routes chart. This lets integration
    # validation deploy route templates that have not been released yet.
    chartPath: ""
    routes:
      nvcfApi:
        routeAnnotations: {}
        grpc:
          enabled: false
          # Defaults to api-grpc.<global.domain> when enabled. Set to override.
          hostnames: []
      nvctApi:
        routeAnnotations: {}
        grpc:
          enabled: false
          # Defaults to tasks-grpc.<global.domain> when enabled. Set to override.
          hostnames: []
      # apiKeys, sis, and reval are enabled by default in the gateway-routes
      # chart, which owns that default. Leave enabled unset to keep the chart
      # default; uncomment enabled: false to drop the route -- for example, to
      # keep api-keys off the public edge in a split/multi-cluster deployment, or
      # to remove the unused sis/reval routes when they have no external consumer.
      # The stack forwards enabled only when it is set here.
      apiKeys:
        # enabled: false
        routeAnnotations: {}
      sis:
        # enabled: false
        routeAnnotations: {}
      reval:
        # enabled: false
        routeAnnotations: {}
      invocation:
        routeAnnotations: {}
      llmInvocation:
        routeAnnotations: {}
      vanityGateway:
        # Defaults to vanity.<global.domain>. Set a non-empty list to override.
        hostnames: []
        routeAnnotations: {}
      nvcfUi:
        routeAnnotations: {}
      grpc:
        routeAnnotations: {}
      grpcWorker:
        enabled: false
        # listenerName defaults to worker-tcp in the gateway-routes chart.
        # Set it only when the cluster-owned Gateway uses a different name.
        routeAnnotations: {}
      nats:
        enabled: false
        routeAnnotations: {}
      # Backend-router routes for split-cluster LLM worker registration and
      # reverse QUIC tunnels. The target router selects the named Stargate pod
      # by HTTP/2 authority and QUIC SNI.
      llmWorker:
        enabled: false
        backend:
          name: llm-request-router-backend-router
          # Required when llmWorker is enabled; normally the NVCF namespace.
          namespace: ""
          grpcPort: 50071
          quicPort: 50072
        routeAnnotations: {}
      # ESS route. NVCF worker containers fetch function secrets from ess-api.
      # In split/multi-cluster installs ess runs in the control plane, so
      # compute-plane workers reach it through this route. Opt-in per environment.
      ess:
        enabled: false
        routeAnnotations: {}
    gateways:
      shared:
        name: "" # must be set by the environment
        namespace: "" # must be set by the environment
      grpc:
        name: "" # must be set by the environment
        namespace: "" # must be set by the environment
      nats:
        name: "" # must be set by the environment when routes.nats.enabled=true
        namespace: "" # must be set by the environment when routes.nats.enabled=true
        # listenerName defaults to nats in the gateway-routes chart.
      llmGrpc:
        name: "" # required when routes.llmWorker.enabled=true
        namespace: "" # required when routes.llmWorker.enabled=true
        # listenerName defaults to llm-grpc in the gateway-routes chart.
      llmQuic:
        name: "" # required when routes.llmWorker.enabled=true
        namespace: "" # required when routes.llmWorker.enabled=true
        # listenerName defaults to llm-quic in the gateway-routes chart.

grpcproxy:
  # PDB: disabled by default. highAvailability.mode replaces it with the HA PDB
  # when it scales grpc-proxy.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  # Optional NVCF API gRPC endpoint used only by grpc-proxy.
  # Leave empty when grpc-proxy can use the same endpoint advertised to workers
  # through global.workerEndpoints.nvcfGrpcServiceURL. Set this when workers
  # need an external Gateway or load-balancer URL, but grpc-proxy should stay
  # on a control-plane-local API service address.
  nvcfGrpcServiceURL: ""
  # Optional NATS endpoint used only by grpc-proxy. It defaults to the local
  # NATS Service even when global.workerEndpoints.nvcfNatsServiceURL points at
  # an external compute-worker endpoint.
  natsServiceURL: ""
  workerConnectBaseURL: ""

# Worker callback proxy (Envoy), for workers in another cluster that cannot
# reach control-plane pod IPs. Envoy routes each callback to the grpc-proxy or
# invocation-service pod that holds the request. Single-cluster installs do
# not need it: workers call the pod directly, and highAvailability scales both
# services either way.
#
# With it enabled, grpc-proxy serves HTTP/3 callbacks and advertises
# https://<dashed-pod-ip>.<workerDomain>, and invocation-service sends worker
# streams through the proxy. The OpenBao service PKI issues the Envoy and
# grpc-proxy certificates through addons.llm.pki's issuer
# (ClusterIssuer/nvcf-openbao-pki by default), without the LLM add-on.
# Requires openbao.enabled and cert-manager. Not supported with split-plane
# worker URLs (global.workerEndpoints.invocationServiceURL,
# global.workerEndpoints.grpcProxyWorkerConnectURL, or
# grpcproxy.workerConnectBaseURL).
#
# Before enabling:
#   - Resolve *.<workerDomain> to the worker-callback-proxy Service from the
#     compute plane, for example with a wildcard DNS record or, on k3s and
#     AKS, a CoreDNS rewrite in kube-system/coredns-custom:
#       rewrite stop {
#         name regex (.+)\.<workerDomain with dots escaped>\.$ worker-callback-proxy.nvcf.svc.cluster.local.
#         answer auto
#       }
#   - Give workers the issuing CA through
#     global.nvcaOperator.agent.workerCallbackCaPem in the compute-plane stack.
# See docs/self-managed/worker-callback-proxy.md.
workerCallbackProxy:
  enabled: false
  # REQUIRED when enabled. Workers call back on <dashed-pod-ip>.<workerDomain>,
  # for example grpc-worker.example.com. The stack adds it to the OpenBao
  # signing role's allowed domains when addons.llm.pki.allowedDomains does not
  # already cover it.
  workerDomain: ""
  # Set only for source-tree validation. Empty uses the released OCI chart.
  chartPath: ""
  # replicaCount defaults to the chart value (2).
  # replicaCount: 2
  # Workers in another cluster reach Envoy through this Service, so expose it,
  # for example as a LoadBalancer, and point *.<workerDomain> and
  # global.workerEndpoints.invocationProxyURL at its address. Passed to the
  # chart as is.
  # service:
  #   type: LoadBalancer
  # The chart defaults to the upstream image, docker.io/envoyproxy/envoy.
  # Set registry and repository together to use a mirror:
  # image:
  #   registry: <your-registry>
  #   repository: <your-repository>/envoy
  #   tag: v1.40.1

# Control-plane high availability.
# global.yaml.gotmpl maps mode onto chart values (replicaCount, affinity, zone
# spread, PDB, update strategy).
#   none      keep chart/env defaults (single-node, local, CI).
#   preferred HA sizing; soft placement (schedules even if capacity is short).
#   enforced  HA sizing; hard placement (Pending rather than co-locating).
# preferred/enforced need >= 3 nodes (>= 3 zones for zone spread).
# Optional overrides: global.affinity / global.topologySpreadConstraints.
# Default preferred (real multi-node); set none for single-node / local / CI.
# JetStream stream replicas follow the NATS server count (capped at 3).
highAvailability:
  mode: preferred

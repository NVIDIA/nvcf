global:
  nodeSelectors:
    enabled: false

  storageClass: local-path
  storageSize: 2Gi

  helm:
    sources:
      registry: "nvcr.io"
      repository: "0651155215864979/ncp-dev"

  image:
    registry: nvcr.io
    repository: 0651155215864979/ncp-dev

  imagePullSecrets:
    - name: nvcr-pull-secret

  workerEndpoints:
    nvcfServiceURL: http://api.nvcf.svc.cluster.local:8080
    nvcfGrpcServiceURL: http://api.nvcf.svc.cluster.local:9090
    nvcfNatsServiceURL: nats://nats.nats-system.svc.cluster.local:4222
    essServiceURL: http://ess-api.ess.svc.cluster.local:8080
    nvctServiceURL: http://nvct-api.nvcf.svc.cluster.local:8080
    nvctGrpcServiceURL: http://nvct-api.nvcf.svc.cluster.local:9090
    invocationServiceURL: http://invocation.nvcf.svc.cluster.local:8080
    grpcProxyWorkerConnectURL: http://grpc.nvcf.svc.cluster.local:10086

  nvcaOperator:
    selfManaged:
      icmsServiceURL: http://api.sis.svc.cluster.local:8080
      revalServiceURL: http://reval.nvcf.svc.cluster.local:8080
      natsURL: nats://nats.nats-system.svc.cluster.local:4222

cassandra:
  replicaCount: 1
  # Local development uses one Cassandra replica. The large preset gives
  # Cassandra a 2048Mi memory request and 3072Mi memory limit.
  resourcesPreset: "large"
  jvm:
    # this should only be set for local development with only 1 replica is used.
    # use of this with more than 1 replica will cause node startups to unexpectedly fail.
    extraOpts: "-Dcassandra.superuser_setup_delay_ms=100 -Dcassandra.gossip_settle_min_wait_ms=1000"

openbao:
  migrations:
    issuerDiscovery:
      enabled: true
  injector:
    # Single-node local cluster: hard anti-affinity would leave the 2nd replica Pending.
    replicas: 1

# Rate Limiter — base.yaml ships the self-hosted defaults; only flip
# enabled here.
rateLimiter:
  enabled: true

# LLM gateway talks to nvcf-api over plaintext gRPC in local dev
# (api.nvcf.svc.cluster.local:9090 has no TLS).
addons:
  vanityGateway:
    enabled: true
    mappingConfig:
      v2config:
        openai:
          host: vanity.localhost
          chatCompletions: {}
        vanity: {}
  llm:
    enabled: true
    gateway:
      replicaCount: 1
      auth:
        grpcInsecure: true
      metrics:
        serviceMonitor:
          enabled: false
    requestRouter:
      replicaCount: 1
      metrics:
        serviceMonitor:
          enabled: false
      loadBalancer:
        config: |
          {
            "default": "power-of-two",
            "request_algorithms": {
              "power-of-two": "power-of-two",
              "round-robin": "round-robin",
              "random": "random",
              "groq-multiregion": "groq-multiregion"
            }
          }

agentConfig:
  mergeConfig: |
    cluster:
      validationPolicy:
        name: Unrestricted
    workload:
      stargateQUICInsecure: true

# Gateway API Ingress (POC)
# Application Developer role: Only HTTPRoutes
# Expects Cluster Operator to provision Gateway resource
ingress:
  gatewayApi:
    enabled: true
    controllerNamespace: envoy-gateway-system
    gateways:
      shared:
        name: shared-gw
        namespace: envoy-gateway-system
      grpc:
        name: grpc-gw
        namespace: envoy-gateway-system
      nats:
        name: shared-gw
        namespace: envoy-gateway-system
        listenerName: nats
    routes:
      grpcWorker:
        enabled: true
      nats:
        enabled: true

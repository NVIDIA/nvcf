# NVCA owns this catalog and installs it with the NVCA chart. It records, for
# each exact CSI provisioner, the PVC access modes qualified end to end in an
# NVCF cache workflow. Nothing else is declared: NVCA derives how caching runs
# from these modes.
#
#   ReadWriteMany              one shared claim; readers mount it read-only
#   ReadWriteOnce+ReadOnlyMany writer takes the claim; readers get ROX on it
#
# Function model caching keeps its readers in the request namespace, so either
# shape works. Helm model caching must reach other namespaces, which a
# ReadWriteMany claim does natively and the ROX shape does not, except on
# NVMesh, whose volume handles encode the namespace.
#
# An empty accessModes list means nothing is qualified yet, so both workflows
# are off for that driver. A provisioner absent from this file is unsupported.
# Enabling a backend is an edit here, backed by a qualification run.
apiVersion: storage.nvcf.nvidia.com/v1alpha1
kind: StorageCapabilityCatalog
drivers:
  nvmesh-csi.excelero.com:
    provider: nvmesh
    accessModes:
      - ReadWriteOnce
      - ReadOnlyMany
    # The reader PV is XFS on the same filesystem as the writer, so it needs
    # nouuid and norecovery or the mount fails outright.
    readerMountOptions:
      - ro
      - norecovery
      - nouuid
  csi.weka.io:
    provider: weka
    # Qualified 2026-08-31 on amahmood3-dgxc-k8s-mst-blc-01, StorageClass
    # nv-storage-file. A reader in another namespace, on a PV derived from the
    # writer volume, read the cache and was denied writes with EROFS, for both
    # ReadWriteMany and ReadOnlyMany claims. Weka volume handles carry no
    # namespace, so the writer handle is reused unchanged.
    accessModes:
      - ReadWriteMany
      - ReadOnlyMany
    # The reader claim is mounted read-only by the Pod, so NVCA sets no
    # options on the derived PV.
    readerMountOptions: []
  fss.csi.oraclecloud.com:
    provider: ociFss
    # Qualified 2026-08-31 on nvcf-dgxc-k8s-oci-jbt-ct4, StorageClass
    # fss-nvcf-test, by the same method and with the same result as Weka. FSS
    # volume handles are filesystem-ocid:mount-target-ip:export-path and carry
    # no namespace.
    #
    # Deployment note: fss.csi.oraclecloud.com declares fsGroupPolicy
    # ReadWriteOnceWithFSType, so Kubernetes does not apply fsGroup to a
    # ReadWriteMany volume. A fresh export is owned root:root, so the cache
    # writer must run as root on FSS.
    accessModes:
      - ReadWriteMany
      - ReadOnlyMany
    readerMountOptions: []
  lustre.csi.oraclecloud.com:
    provider: ociLustre
    # No PVC access mode has been qualified in an NVCF cache workflow.
    accessModes: []
    readerMountOptions: []

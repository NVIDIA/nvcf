{{- if (include "nvcaop.clusterValidatorEnabled" .) }}
{{- $cv := include "nvcaop.clusterValidatorConfig" . | fromYaml }}
{{- if eq (lower (trim (toString $cv.role))) "control-plane" }}
---
# Under the control-plane role the operator's init container runs in
# preflight mode and publishes no summary, so without this run the first
# summary waits for the CronJob's first tick, up to a full schedule interval,
# with the agent reporting NVCF-Not-Ready and last_run 0 meanwhile. It runs the
# CronJob's own spec once per install and upgrade, named for the release
# revision so each gets a fresh Job. It is not a Helm hook, but the stack
# installs with waitForJobs, so a failed Job would still fail the release: it
# runs report-only, publishing a Not-Ready verdict and completing.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-cluster-validator" (include "nvcaop.fullname" .) | trunc 52 | trimSuffix "-" }}-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvcaop.labels" . | nindent 4 }}
    app.kubernetes.io/component: validation
spec:
  ttlSecondsAfterFinished: 86400
  {{- include "nvcaop.clusterValidatorJobSpec" (dict "root" . "reportOnly" true) | nindent 2 }}
{{- end }}
{{- end }}

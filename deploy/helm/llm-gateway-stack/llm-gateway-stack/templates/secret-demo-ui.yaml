{{- if .Values.demoUiApiKey }}
# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES.
# SPDX-License-Identifier: Apache-2.0
{{- $registered := false }}
{{- range .Values.apiKeys }}
{{- if and (eq .id "demo-ui") (eq (.sha256 | lower) (sha256sum $.Values.demoUiApiKey)) }}
{{- $registered = true }}
{{- end }}
{{- end }}
{{- if not $registered }}{{ fail "demoUiApiKey requires its matching demo-ui hash in apiKeys" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: demo-ui-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway-stack.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.demoUiApiKey | b64enc | quote }}
{{- end }}

{{- $auth := index .Values "llm-request-router" "llmRequestRouter" "auth" }}
{{- $hashes := include "llm-gateway-stack.clusterCredentialHashes" . | fromJsonArray }}
{{- $credentials := dict "clusters" (dict .Values.clusterId $hashes) }}
# Router worker auth file: the SHA-256 hashes of this cluster's tokens, bound to
# its cluster id. The router re-reads the file every 30 seconds, so an upgrade
# with changed hashes rotates the credential without a restart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $auth.credentialsSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-credentials
type: Opaque
data:
  {{ $auth.credentialsSecret.key }}: {{ toYaml $credentials | b64enc }}
{{- end }}

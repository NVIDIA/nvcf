# SPDX-License-Identifier: Apache-2.0
{{- $keys := list }}
{{- range .Values.apiKeys }}
{{- $keys = append $keys (dict "id" (.id | toString) "sha256" (.sha256 | toString | lower)) }}
{{- end }}
# Gateway API key file: key ids and the SHA-256 of each key. The gateway
# re-reads it every 30 seconds.
apiVersion: v1
kind: Secret
metadata:
  name: {{ index .Values "llm-api-gateway" "llmApiGateway" "auth" "staticKeys" "existingSecret" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-keys
type: Opaque
data:
  api-keys.json: {{ toJson (dict "keys" $keys) | b64enc }}
{{- end }}

# See the License for the specific language governing permissions and
# limitations under the License.apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-request-router-stargate
  namespace: nvcf
  labels:
    helm.sh/chart: helm-nvcf-llm-request-router-0.0.0
    app.kubernetes.io/name: llm-request-router
    app.kubernetes.io/instance: llm-request-router
    app.kubernetes.io/version: "0.14.2"
    app.kubernetes.io/managed-by: Helm
data:
  stargate.toml: |
    schema_version = 1

    [stargate_identity]
    id = { env = "POD_NAME" }
    advertised_hostname_template = "{pod_name}.llm-request-router-headless.nvcf.svc.cluster.local"

    [stargate_identity.kubernetes]
    pod_name = { env = "POD_NAME" }
    namespace = { env = "POD_NAMESPACE" }

    [stargate_network]
    grpc_listen_addr = "0.0.0.0:50071"
    model_discovery_listen_addr = "0.0.0.0:50073"
    http_listen_addr = "0.0.0.0:8000"
    advertise_addr = { env = "STARGATE_ADVERTISE_ADDR" }

    [process_lifecycle]
    readiness_warmup_ms = 60000
    shutdown_drain_timeout_ms = 30000

    [stargate_discovery]
    remote_watch_urls = []
    allow_insecure_remote_watch_http = false
    watch_heartbeat_ms = 5000

    [stargate_discovery.kubernetes_pods]
    headless_service_dns_name = "llm-request-router-headless.nvcf.svc.cluster.local"
    poll_interval_ms = 1000
    resolver_ttl_ms = 1000

    [pylon_transport]
    tunnel_protocol = "raw-quic"
    quic_connect_timeout_ms = 2000
    quic_request_timeout_ms = 30000

    pylon_grpc_dial_uri = "http://llm-request-router-backend-router.nvcf.svc.cluster.local:50071"


    [pylon_transport.reverse]
    listen_addr = "0.0.0.0:50072"
    connect_timeout_ms = 10000

    pylon_dial_addr = "llm-request-router-backend-router.nvcf.svc.cluster.local:50072"




    [pylon_transport.tls]
    insecure_skip_verify = true


    [observability.metrics]
    listen_addr = "0.0.0.0:9090"
    prefix = "stargate_"



    [worker_authentication]
    endpoint = "http://api.nvcf.svc.cluster.local:9090"


    [worker_authentication.bearer_token]
    secrets_path = "/vault/secrets/secrets.json"
    json_path = ["nvcfApiToken"]

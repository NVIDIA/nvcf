# Source: helm-nvcf-llm-request-router/templates/backend-router.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-request-router-backend-router
  namespace: nvcf
  labels:
    helm.sh/chart: helm-nvcf-llm-request-router-0.0.0
    app.kubernetes.io/name: llm-request-router-backend-router
    app.kubernetes.io/instance: llm-request-router
    app.kubernetes.io/component: backend-router
    app.kubernetes.io/version: "0.14.2"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-request-router-backend-router
      app.kubernetes.io/instance: llm-request-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-request-router-backend-router
        app.kubernetes.io/instance: llm-request-router
        app.kubernetes.io/component: backend-router
    spec:
      serviceAccountName: llm-request-router-backend-router
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend-router
          image: stargate:0.14.2
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/stargate-k8s-router
          args:
            - --listen-addr=0.0.0.0:50071
            - --reverse-tunnel-listen-addr=0.0.0.0:50072
            - --health-listen-addr=0.0.0.0:8080
            - --target-namespace=nvcf
            - --target-service-name=llm-request-router-headless
            - --advertised-hostname-template={pod_name}.llm-request-router-headless.nvcf.svc.cluster.local
            - --advertised-grpc-port=50071
            - --grpc-pylon-dial-addr=http://llm-request-router-backend-router.nvcf.svc.cluster.local:50071
            - --watch-heartbeat-ms=5000
            - --grpc-port-name=grpc
            - --quic-port-name=quic
            - --tunnel-protocol=raw-quic
            - --quic-insecure
          ports:
            - name: grpc
              containerPort: 50071
              protocol: TCP
            - name: quic
              containerPort: 50072
              protocol: UDP
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: llm-request-router-backend-router
                    app.kubernetes.io/instance: llm-request-router

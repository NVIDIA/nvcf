apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-request-router
  namespace: nvcf
  labels:
    helm.sh/chart: helm-nvcf-llm-request-router-0.0.0
    app.kubernetes.io/name: llm-request-router
    app.kubernetes.io/instance: llm-request-router
    app.kubernetes.io/version: "0.14.2"
    app.kubernetes.io/managed-by: Helm
spec:
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-request-router
      app.kubernetes.io/instance: llm-request-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-request-router
        app.kubernetes.io/instance: llm-request-router
      annotations:
        checksum/stargate-config: 6f39fa75cd38ff92144f8b6ceb7d368cc67ea7cb867ddf3934b08bf25defbb3d
        vault.hashicorp.com/agent-copy-volume-mounts: helm-nvcf-llm-request-router
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-template-file-secrets.json: /vault/config/templates/secrets.json.tmpl
        vault.hashicorp.com/agent-run-as-same-user: "true"
        vault.hashicorp.com/agent-service-account-token-volume-name: vault-token
        vault.hashicorp.com/auth-path: auth/jwt
        vault.hashicorp.com/role: llm-request-router
        vault.hashicorp.com/secret-volume-path: /vault/secrets
    spec:
      serviceAccountName: llm-request-router
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: helm-nvcf-llm-request-router
          image: stargate:0.14.2
          imagePullPolicy: IfNotPresent
          args:
            - --config-file=/etc/stargate/stargate.toml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: STARGATE_ADVERTISE_ADDR
              value: "$(POD_IP):50071"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: grpc
              containerPort: 50071
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: reverse
              containerPort: 50072
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: stargate-config
              mountPath: /etc/stargate
              readOnly: true
            - name: vault-config-templates
              mountPath: /vault/config/templates
              readOnly: true
      volumes:
        - name: stargate-config
          configMap:
            name: llm-request-router-stargate
        - name: vault-token
          projected:
            sources:
            - serviceAccountToken:
                path: token
                expirationSeconds: 3600
                audience: http://openbao-server.vault-system.svc.cluster.local:8200
        - name: vault-config-templates
          configMap:
            name: llm-request-router-vault-agent-tpl
            items:
              - key: secrets.json.tmpl
                path: secrets.json.tmpl
---

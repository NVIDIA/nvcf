# Copied from src/compute-plane-services/pylon-operator/config/crd/bases/pylon.nvidia.com_inferenceendpoints.yaml
# by scripts/sync-crd.sh. Do not edit. Run make sync-crd after
# make codegen-update in the operator module.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "pylon-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.19.0
  name: inferenceendpoints.pylon.nvidia.com
spec:
  group: pylon.nvidia.com
  names:
    kind: InferenceEndpoint
    listKind: InferenceEndpointList
    plural: inferenceendpoints
    singular: inferenceendpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelName
      name: Model
      type: string
    - jsonPath: .status.gpu.product
      name: GPU
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Registered")].status
      name: Registered
      type: string
    - description: Routers with an open registration stream
      jsonPath: .status.registration.routersConnected
      name: Servers
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          InferenceEndpoint publishes a model served by a Service in this namespace
          to the LLM invocation plane.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InferenceEndpointSpec is the desired state of an InferenceEndpoint.
            properties:
              canary:
                description: Canary optionally overrides inference check timing for
                  this endpoint.
                properties:
                  intervalSeconds:
                    description: |-
                      IntervalSeconds is the period between active inference checks.
                      When omitted, Pylon uses its default interval. Checks cannot be disabled.
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                  timeoutSeconds:
                    description: |-
                      TimeoutSeconds bounds a canary request, including backend queue time.
                      When omitted, Pylon uses its default timeout.
                    format: int32
                    maximum: 300
                    minimum: 1
                    type: integer
                type: object
              gpu:
                description: GPU optionally overrides the GPU type derived from node
                  labels.
                properties:
                  product:
                    description: |-
                      Product is the GPU product name reported in status.gpu, for example
                      NVIDIA-GB10. When empty, the operator derives it from the
                      nvidia.com/gpu.product label of the nodes behind the Service.
                    type: string
                type: object
              health:
                description: Health is the backend health endpoint, served on service.port.
                properties:
                  path:
                    description: |-
                      Path is the HTTP path probed on service.port, for example
                      /v1/health/ready. Pylon and the router probe the same path.
                    pattern: ^/
                    type: string
                required:
                - path
                type: object
              inferenceAPIFormat:
                description: InferenceAPIFormat selects the inference API surface.
                properties:
                  type:
                    description: Type selects the API surface. chat is the only value
                      in v1alpha1.
                    enum:
                    - chat
                    type: string
                required:
                - type
                type: object
              maxEngineConcurrency:
                description: MaxEngineConcurrency is a concurrency hint for Pylon's
                  queue estimate.
                format: int32
                minimum: 1
                type: integer
              modelName:
                description: ModelName is the exact string clients send in the OpenAI
                  model field.
                minLength: 1
                type: string
              service:
                description: Service is the Service that fronts the backend.
                properties:
                  name:
                    description: Name of the Service in the same namespace as the
                      InferenceEndpoint.
                    minLength: 1
                    type: string
                  port:
                    description: Port is the Service port that serves the inference
                      API.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - name
                - port
                type: object
            required:
            - health
            - inferenceAPIFormat
            - modelName
            - service
            type: object
          status:
            description: InferenceEndpointStatus is the observed state of an InferenceEndpoint.
            properties:
              conditions:
                description: Conditions are Ready, TransportReady and Registered.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gpu:
                description: GPU is the effective GPU type.
                properties:
                  nodeProducts:
                    description: |-
                      NodeProducts lists the distinct nvidia.com/gpu.product label values of
                      the nodes behind the Service, sorted.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  product:
                    description: |-
                      Product is the effective GPU product. Derived values from several
                      nodes are sorted and comma-joined.
                    type: string
                  source:
                    description: Source records where Product came from.
                    enum:
                    - Spec
                    - NodeLabels
                    - Unknown
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the metadata.generation this status
                  reflects.
                format: int64
                type: integer
              registration:
                description: Registration summarises the transport's registration
                  with the router.
                properties:
                  clusterId:
                    description: ClusterID is the operator's --cluster-id.
                    type: string
                  lastRegisteredTime:
                    description: |-
                      LastRegisteredTime is when a registration stream was last observed
                      open.
                    format: date-time
                    type: string
                  routersConnected:
                    description: |-
                      RoutersConnected is the number of routers with an open registration
                      stream from at least one transport pod.
                    format: int32
                    type: integer
                type: object
              servers:
                description: Servers lists one entry per transport pod.
                items:
                  description: ServerStatus is the per-transport-pod view of one inference
                    server.
                  properties:
                    inferenceServerId:
                      description: InferenceServerID is <clusterId>.<namespace>.<name>.<replica>.
                      type: string
                    pod:
                      description: Pod is the transport pod name.
                      type: string
                    registrationStreams:
                      description: RegistrationStreams is the number of open registration
                        streams.
                      format: int32
                      type: integer
                    reverseTunnels:
                      description: ReverseTunnels is the number of connected reverse
                        tunnels.
                      format: int32
                      type: integer
                  required:
                  - inferenceServerId
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - inferenceServerId
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}

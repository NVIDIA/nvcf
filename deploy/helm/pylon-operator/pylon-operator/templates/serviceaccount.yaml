apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pylon-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pylon-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The operator calls the API server, so its token is mounted.
automountServiceAccountToken: true
{{- end }}

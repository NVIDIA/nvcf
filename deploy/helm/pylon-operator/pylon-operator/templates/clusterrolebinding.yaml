apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pylon-operator.fullname" . }}
  labels:
    {{- include "pylon-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pylon-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pylon-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "pylon-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pylon-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pylon-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP

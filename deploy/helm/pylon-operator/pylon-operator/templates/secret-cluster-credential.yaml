{{- if include "pylon-operator.generateCredential" . }}
# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0
{{- $name := include "pylon-operator.credentialSecretName" . }}
{{- $key := .Values.credential.key }}
{{- $token := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- /* Keep the installed token across upgrades; the router holds its sha256. */}}
{{- $token = index $existing.data $key }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
# T0 cluster credential. Generated on first install and kept across upgrades.
# The resource policy keeps it on uninstall too, so a reinstall under the same
# release name reuses the token the router already trusts.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pylon-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $token | quote }}
{{- end }}

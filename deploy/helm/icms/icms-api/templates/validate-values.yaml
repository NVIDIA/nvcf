{{- /*
Fail loudly if an override file still sets the pre-rename keys. sis.volumes /
sis.volumeMounts were replaced by sis.extraVolumes / sis.extraVolumeMounts when
the OpenBao token volume/mount became chart-owned. Helm silently ignores unknown
keys, so without this guard a stale override would drop its custom volumes on
upgrade with no error. hasKey catches the keys even when set to null/empty.
*/ -}}
{{- if or (hasKey .Values.sis "volumes") (hasKey .Values.sis "volumeMounts") }}
{{- fail "sis.volumes / sis.volumeMounts were renamed to sis.extraVolumes / sis.extraVolumeMounts (the OpenBao token volume + mount are now chart-owned). Move your custom entries to the extra* keys and remove the old ones." }}
{{- end }}

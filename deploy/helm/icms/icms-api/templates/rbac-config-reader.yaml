{{- if .Values.sis.remoteConfig.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sis.remoteConfigReaderName" . }}
  namespace: {{ include "sis.namespace" . }}
  labels:
    {{- include "sis.labels" . | nindent 4 }}
rules:
  # list + watch only, and namespace-wide: spring-cloud-kubernetes client-config
  # fetches via listNamespacedConfigMap and filters in memory (get is never
  # called), and Kubernetes RBAC cannot scope list/watch by resourceNames.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sis.remoteConfigReaderName" . }}
  namespace: {{ include "sis.namespace" . }}
  labels:
    {{- include "sis.labels" . | nindent 4 }}
subjects:
  # Intentionally hardcoded: matches the chart's ServiceAccount and the OpenBao
  # JWT auth role (vault.hashicorp.com/role: sis-api) that pin the literal name.
  - kind: ServiceAccount
    name: sis-api
    namespace: {{ include "sis.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "sis.remoteConfigReaderName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}

{{- if .Values.sis.lls.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: addons-lls-migrations
  namespace: {{ .Values.sis.lls.namespace }}
  labels:
    app.kubernetes.io/name: addons-lls-migrations
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "2"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    {{- with .Values.sis.lls.podAnnotations }}
    metadata:
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.sis.lls.hmacRotation.serviceAccountName }}
      {{- with (include "sis.imagePullSecrets" .) }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: addons-lls-migrations
          image: "{{ include "sis.image.full" (dict "image" .Values.sis.lls.hmacRotation.image "name" "sis.lls.hmacRotation.image") }}"
          imagePullPolicy: {{ .Values.sis.lls.hmacRotation.image.pullPolicy }}
          env:
            - name: CORE_MIGRATIONS_ENABLED
              value: "false"
            - name: ADDONS_LLS_ENABLED
              value: "true"
            - name: BAO_SERVICE
              value: {{ (.Values.sis.lls.hmacRotation.baoService | default (printf "openbao-server.%s.svc.cluster.local" .Values.sis.lls.namespace)) | quote }}
            - name: BAO_PORT
              value: {{ .Values.sis.lls.hmacRotation.baoPort | quote }}
          volumeMounts:
            - name: root-token
              mountPath: /secrets/root_token
              readOnly: true
          resources:
            {{- toYaml .Values.sis.lls.migrations.resources | nindent 12 }}
      volumes:
        - name: root-token
          secret:
            secretName: {{ .Values.sis.lls.hmacRotation.rootTokenSecretName }}
            items:
            - key: root_token
              path: root_token
{{- end }}

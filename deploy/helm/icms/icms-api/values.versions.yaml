# Internal-only Helm values override. Not OSS exported (see ../.oss-allowlist).
#
# Pins image tags that Renovate auto-bumps. The chart's main values.yaml leaves
# these tags empty so OSS consumers must supply them via their own override
# file; internal builds layer this file on top of values.yaml so the tags get
# resolved without leaking the internal registry path through OSS.
#
# Internal install: pass via an additional --values flag, for example:
#   helm install sis sis -f sis/values.yaml -f sis/values.versions.yaml ...
sis:
  lls:
    hmacRotation:
      image:
        # renovate: datasource=docker depName=nvcr.io/0651155215864979/ncp-dev/nvcf-openbao-migrations
        tag: "0.16.3"

#
# On EKS, serviceAccount.irsaRoleArn binds the IAM role with the DynamoDB
# policy of docs/iam.md in the module (IAM roles for service accounts). The
# pod identity webhook then mounts a projected web identity token and sets
# AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE, which the AWS SDK reads.
{{- if .Values.serviceAccount.create }}
{{- $annotations := deepCopy .Values.serviceAccount.annotations }}
{{- with .Values.serviceAccount.irsaRoleArn }}
{{- $_ := set $annotations "eks.amazonaws.com/role-arn" . }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "global-discovery.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "global-discovery.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server does not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}

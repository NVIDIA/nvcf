{{- include "global-discovery.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "global-discovery.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "global-discovery.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ int .Values.replicaCount }}
  {{- end }}
  # A new replica is ready before an old one drains, so a region never
  # serves with fewer replicas than it runs.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "global-discovery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "global-discovery.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "global-discovery.serviceAccountName" . }}
      # The server does not call the Kubernetes API. IRSA and EKS Pod
      # Identity mount their own projected token.
      automountServiceAccountToken: false
      # Service links would inject <SERVICE>_* variables, which for a release
      # named gds collide with the GDS_ flag fallbacks.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ int .Values.terminationGracePeriodSeconds }}
      containers:
        - name: gds-server
          image: {{ include "global-discovery.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "global-discovery.args" . | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # --region, reported by GetServerInfo.
            - name: GDS_REGION
              value: {{ .Values.region | quote }}
            # Region of the DynamoDB client.
            - name: AWS_REGION
              value: {{ .Values.region | quote }}
            {{- if .Values.otel.enabled }}
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ include "global-discovery.otelResourceAttributes" . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ int .Values.ports.grpc }}
              protocol: TCP
            - name: http
              containerPort: {{ int .Values.ports.http }}
              protocol: TCP
            - name: admin
              containerPort: {{ int .Values.ports.admin }}
              protocol: TCP
          # Ready needs a store ping, one refresh of every clusterset and a
          # fresh view; it turns false when shutdown starts.
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.tls.existingSecret }}
          volumeMounts:
            - name: tls
              mountPath: /etc/gds/tls
              readOnly: true
          {{- end }}
      {{- if .Values.tls.existingSecret }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        {{- $constraint := deepCopy . }}
        {{- if not $constraint.labelSelector }}
        {{- $_ := set $constraint "labelSelector" (dict "matchLabels" (include "global-discovery.selectorLabels" $ | fromYaml)) }}
        {{- end }}
        - {{- toYaml $constraint | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

#
# Regional internal NLB in front of the server pods. With awsNlb.enabled the
# AWS Load Balancer Controller provisions a Network Load Balancer with IP
# targets (the pod IPs, no node hop), cross-zone load balancing and an HTTP
# health check of /readyz on the admin port, so a draining or unready replica
# leaves the target group. The Route53 records of docs/networking.md in the
# module point at this load balancer.
{{- if .Values.externalService.enabled }}
{{- $nlb := .Values.externalService.awsNlb }}
{{- $annotations := dict }}
{{- if $nlb.enabled }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-type" "external" }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-nlb-target-type" "ip" }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-scheme" $nlb.scheme }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-attributes" (printf "load_balancing.cross_zone.enabled=%t" $nlb.crossZone) }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-target-group-attributes" (printf "deregistration_delay.timeout_seconds=%d" (int $nlb.deregistrationDelaySeconds)) }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol" "HTTP" }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-healthcheck-port" (toString (int .Values.ports.admin)) }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-healthcheck-path" "/readyz" }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval" (toString (int $nlb.healthCheck.intervalSeconds)) }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout" (toString (int $nlb.healthCheck.timeoutSeconds)) }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-healthcheck-healthy-threshold" (toString (int $nlb.healthCheck.healthyThreshold)) }}
{{- $_ := set $annotations "service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold" (toString (int $nlb.healthCheck.unhealthyThreshold)) }}
{{- end }}
{{- $annotations = mergeOverwrite $annotations (deepCopy .Values.externalService.annotations) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "global-discovery.externalServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "global-discovery.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.externalService.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.externalService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "global-discovery.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ int .Values.externalService.grpcPort }}
      targetPort: grpc
      protocol: TCP
    {{- if gt (int .Values.externalService.httpPort) 0 }}
    - name: http
      port: {{ int .Values.externalService.httpPort }}
      targetPort: http
      protocol: TCP
    {{- end }}
{{- end }}

{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- $operator := .Values.operator -}}
{{- $gateway := index .Values.gatewayStack "llm-api-gateway" "llmApiGateway" -}}
{{- $router := index .Values.gatewayStack "llm-request-router" "llmRequestRouter" -}}
{{- $callerName := default .Values.callerKey.secretName .Values.callerKey.existingSecret -}}
{{- $callerCreate := empty .Values.callerKey.existingSecret -}}
{{- $caller := include "llm-shared.token" (dict "root" . "name" $callerName "key" "api-key" "create" $callerCreate) -}}
{{- $callerHash := $caller | b64dec | trim | sha256sum -}}
{{- $callerKeys := list (dict "id" "stack-client" "sha256" $callerHash) -}}
{{- $ids := dict "stack-client" true -}}
{{- $hashes := dict $callerHash true -}}
{{- if not (kindIs "slice" .Values.extraCallerKeys) -}}{{ fail "shared-stack: extraCallerKeys must be a list" }}{{- end -}}
{{- range $entry := .Values.extraCallerKeys -}}
{{- if not (kindIs "map" $entry) -}}{{ fail "shared-stack: extraCallerKeys entries require id and secretName" }}{{- end -}}
{{- if or (not (kindIs "string" $entry.id)) (not (kindIs "string" $entry.secretName)) -}}{{ fail "shared-stack: extraCallerKeys entries require string id and secretName" }}{{- end -}}
{{- if or (not ($entry.id | trim)) (hasKey $ids $entry.id) -}}{{ fail "shared-stack: caller key IDs must be nonempty and unique" }}{{- end -}}
{{- if or (gt (len $entry.secretName) 253) (not (regexMatch "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$" $entry.secretName)) -}}{{ fail "shared-stack: extra caller Secret names must be nonempty DNS names" }}{{- end -}}
{{- $key := include "llm-shared.token" (dict "root" $ "name" $entry.secretName "key" "api-key" "create" false) | b64dec | trim | sha256sum -}}
{{- if hasKey $hashes $key -}}{{ fail "shared-stack: caller keys must have distinct hashes" }}{{- end -}}
{{- $_ := set $ids $entry.id true -}}
{{- $_ := set $hashes $key true -}}
{{- $callerKeys = append $callerKeys (dict "id" $entry.id "sha256" $key) -}}
{{- end -}}
{{- $tokenName := $operator.credential.existingSecret -}}
{{- $token := include "llm-shared.token" (dict "root" . "name" $tokenName "key" "cluster-token" "create" .Values.clusterCredential.create) -}}
{{- range $name := list $gateway.auth.staticKeys.existingSecret $router.auth.credentialsSecret.name -}}
{{- $secret := lookup "v1" "Secret" $.Release.Namespace $name -}}
{{- if $secret -}}
{{- include "llm-shared.owned" (dict "root" $ "resource" $secret) -}}
{{- end -}}
{{- end -}}
{{- range $entry := list (dict "name" $callerName "key" "api-key" "token" $caller "create" $callerCreate) (dict "name" $tokenName "key" "cluster-token" "token" $token "create" .Values.clusterCredential.create) -}}
{{- if $entry.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $entry.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "llm-shared.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $entry.key }}: {{ $entry.token | quote }}
{{- end -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gateway.auth.staticKeys.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-shared.labels" . | nindent 4 }}
type: Opaque
data:
  api-keys.json: {{ toJson (dict "keys" $callerKeys) | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $router.auth.credentialsSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-shared.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $router.auth.credentialsSecret.key }}: {{ toYaml (dict "clusters" (dict $operator.clusterId (list (printf "sha256:%s" ($token | b64dec | sha256sum))))) | b64enc }}

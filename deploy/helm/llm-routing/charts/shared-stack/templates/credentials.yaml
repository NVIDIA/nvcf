{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- $operator := .Values.operator -}}
{{- $gateway := index .Values.gatewayStack "llm-api-gateway" "llmApiGateway" -}}
{{- $router := index .Values.gatewayStack "llm-request-router" "llmRequestRouter" -}}
{{- $callerName := default .Values.callerKey.secretName .Values.callerKey.existingSecret -}}
{{- $callerCreate := empty .Values.callerKey.existingSecret -}}
{{- $caller := include "llm-shared.token" (dict "root" . "name" $callerName "key" "api-key" "create" $callerCreate) -}}
{{- $tokenName := $operator.credential.existingSecret -}}
{{- $token := include "llm-shared.token" (dict "root" . "name" $tokenName "key" "cluster-token" "create" .Values.clusterCredential.create) -}}
{{- range $name := list $gateway.auth.staticKeys.existingSecret $router.auth.credentialsSecret.name -}}
{{- $secret := lookup "v1" "Secret" $.Release.Namespace $name -}}
{{- if $secret -}}
{{- include "llm-shared.owned" (dict "root" $ "resource" $secret) -}}
{{- end -}}
{{- end -}}
{{- range $entry := list (dict "name" $callerName "key" "api-key" "token" $caller "create" $callerCreate) (dict "name" $tokenName "key" "cluster-token" "token" $token "create" .Values.clusterCredential.create) -}}
{{- if $entry.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $entry.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "llm-shared.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $entry.key }}: {{ $entry.token | quote }}
{{- end -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gateway.auth.staticKeys.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-shared.labels" . | nindent 4 }}
type: Opaque
data:
  api-keys.json: {{ toJson (dict "keys" (list (dict "id" "stack-client" "sha256" ($caller | b64dec | trim | sha256sum)))) | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $router.auth.credentialsSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-shared.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $router.auth.credentialsSecret.key }}: {{ toYaml (dict "clusters" (dict $operator.clusterId (list (printf "sha256:%s" ($token | b64dec | sha256sum))))) | b64enc }}

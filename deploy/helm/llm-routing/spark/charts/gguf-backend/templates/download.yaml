{{- if eq .Values.phase "download" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-download
data:
  download.py: |
{{ .Files.Get "files/download.py" | indent 4 }}
  model-lock.json: |
{{ required "model.lock is required" .Values.model.lock | toPrettyJson | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-download
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: download}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ (index .Values.targets 0).node | quote }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: download
          image: {{ .Values.image | quote }}
          command: [python3, -u, /checks/download.py]
          env: [{name: NVIDIA_VISIBLE_DEVICES, value: void}, {name: PYTHONDONTWRITEBYTECODE, value: '1'}]
          resources:
            requests: {cpu: '1', memory: 512Mi}
            limits: {cpu: '3', memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: artifacts, mountPath: /artifacts}
            - {name: checks, mountPath: /checks, readOnly: true}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-artifacts}
        - name: checks
          configMap: {name: {{ .Release.Name }}-download}
{{- end }}

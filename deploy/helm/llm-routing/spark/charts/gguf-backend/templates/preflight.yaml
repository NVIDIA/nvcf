{{- if eq .Values.phase "preflight" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-preflight
data:
  preflight.py: |
{{ .Files.Get "files/preflight.py" | indent 4 }}
{{- range $target := required "targets are required" .Values.targets }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-preflight-{{ $target.id }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: preflight
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      runtimeClassName: {{ $.Values.runtimeClassName }}
      nodeSelector:
        kubernetes.io/hostname: {{ required "target.node is required" $target.node | quote }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: preflight
          image: {{ required "image is required" $.Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python3, -u, /checks/preflight.py]
          env:
            - {name: HOME, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
          resources:
            requests: {cpu: '1', memory: 2Gi, nvidia.com/gpu: 1}
            limits: {cpu: '4', memory: 4Gi, nvidia.com/gpu: 1}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: checks, mountPath: /checks, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: checks
          configMap: {name: {{ $.Release.Name }}-preflight}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
{{- end }}
{{- end }}

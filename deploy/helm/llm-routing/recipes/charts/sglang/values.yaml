# Automatic mode uses the bundled pinned recipe and explicit node placement.
# Supplying phase retains the advanced qualify/download/serve workflow.
mode: automatic
recipe: qwen3.8-27b
profileName: ""
nodes: []
# Site-verified facts keyed by selected node. Runtime checks the device/link again.
nodeCapabilities: {}
sharedCAConfigMap: llm-gateway-stack-ca
cache:
  existingClaim: ""
  # Optional per-rank retained PVCs for TP2. Empty entries create new claims.
  existingClaims: []
phase: deploy
suspended: false
# Automatic startup always checks existing files first. True requires a complete offline cache.
reuseCaches: false
model: {}
image: ""
imagePullPolicy: IfNotPresent
runtimeClassName: nvidia
storageClassName: local-path
profile: {}
gpu: {product: ""}
targets: []
contextLength: 8192
concurrency: 1
register: true
ports: {http: 30000, rendezvous: 34000, bootstrap: 38000}
hfTokenSecret: ""

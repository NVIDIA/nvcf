{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- $v := include "sglang.settings" . | fromJson -}}
{{- if $v.automatic }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-check
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sglang.nodeRole" . }}
rules:
  - apiGroups: ['']
    resources: [nodes]
    resourceNames: [{{ index $v.nodes 0 | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sglang.nodeRole" . }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "sglang.nodeRole" . }}}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-check, namespace: {{ .Release.Namespace | quote }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-check
rules:
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    resourceNames: [{{ default (printf "%s-cache-0" .Release.Name) $v.cache.existingClaim | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-check
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-check}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-check, namespace: {{ .Release.Namespace | quote }}}
{{- end }}

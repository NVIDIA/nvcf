{{- if eq .Values.phase "chain" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  chain-check.py: |
{{ .Files.Get "files/chain-check.py" | indent 4 }}
  rpc-chain-check.cpp: |
{{ .Files.Get "files/rpc-chain-check.cpp" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-{{ .Values.chain.attempt }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ required "chain.runtimeRelease is required" .Values.chain.runtimeRelease }}
        app.kubernetes.io/component: chain-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      runtimeClassName: {{ .Values.runtimeClassName }}
      nodeSelector:
        kubernetes.io/hostname: {{ (index .Values.targets 0).node | quote }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: check
          image: {{ .Values.image | quote }}
          command: [python3, -u, /checks/chain-check.py]
          env:
            - {name: HOME, value: /tmp}
            - {name: NVIDIA_VISIBLE_DEVICES, value: none}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: 'compute,utility'}
            - {name: GGML_RPC_NO_RDMA, value: '1'}
            - {name: GGML_SCHED_DEBUG, value: '1'}
            - {name: LLAMA_REVISION, value: {{ .Values.build.revision | quote }}}
            - {name: RPC_ENDPOINTS, value: "{{ range $i, $target := .Values.targets }}{{ if $i }},{{ end }}{{ $.Values.chain.runtimeRelease }}-rpc-{{ $target.id }}:50052{{ end }}"}
          resources:
            requests: {cpu: '1', memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: artifacts, mountPath: /artifacts}
            - {name: checks, mountPath: /checks, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: {{ required "chain.artifactClaim is required" .Values.chain.artifactClaim }}}
        - name: checks
          configMap: {name: {{ .Release.Name }}}
        - name: tmp
          emptyDir: {sizeLimit: 2Gi}
{{- end }}

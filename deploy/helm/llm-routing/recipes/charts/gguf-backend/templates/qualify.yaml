{{- if eq .Values.phase "qualify" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-qualify
data:
  qualify.py: |
{{ .Files.Get "files/qualify.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-qualify-{{ .Values.qualification.attempt }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: qualification}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      runtimeClassName: {{ .Values.runtimeClassName }}
      nodeSelector:
        kubernetes.io/hostname: {{ (index .Values.targets 0).node | quote }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: qualify
          image: {{ .Values.image | quote }}
          command: [python3, -u, /checks/qualify.py]
          env:
            - {name: HOME, value: /tmp}
            - {name: NVIDIA_VISIBLE_DEVICES, value: none}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: 'compute,utility'}
            - {name: GGML_RPC_NO_RDMA, value: '1'}
            - {name: RPC_ENDPOINTS, value: "{{ range $i, $target := .Values.targets }}{{ if $i }},{{ end }}{{ $.Release.Name }}-rpc-{{ $target.id }}:50052{{ end }}"}
          resources:
            requests: {cpu: '1', memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: artifacts, mountPath: /artifacts, readOnly: true}
            - {name: checks, mountPath: /checks, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-artifacts}
        - name: checks
          configMap: {name: {{ .Release.Name }}-qualify}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
{{- end }}

{{- if .Values.enabled }}
{{- $dashboard := .Files.Get "files/dashboard.json" | fromJson }}
{{- $llamaCpp := false }}
{{- range .Values.targets }}
{{- if eq (default "" .runtime) "llama.cpp" }}
{{- $llamaCpp = true }}
{{- end }}
{{- end }}
{{- if $llamaCpp }}
{{- $panels := $dashboard.panels }}
{{- range (.Files.Get "files/dashboard-llamacpp.json" | fromJsonArray) }}
{{- $panels = append $panels . }}
{{- end }}
{{- $_ := set $dashboard "panels" $panels }}
{{- end }}
{{- if or (not .Values.grafana.adminSecret) .Values.grafana.adminPassword }}
{{- $name := default (printf "%s-grafana-admin" .Release.Name) .Values.grafana.adminSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.grafana.adminPassword }}
{{- if $existing }}
{{- $owner := $existing.metadata.annotations | default dict }}
{{- if or (ne (index $owner "meta.helm.sh/release-name") .Release.Name) (ne (index $owner "meta.helm.sh/release-namespace") .Release.Namespace) }}
{{- fail "Grafana credential Secret belongs to another Helm release; reference it with grafana.adminSecret and leave adminPassword empty" }}
{{- end }}
{{- $password = required "Grafana credential Secret is incomplete; restore admin-password" (index ($existing.data | default dict) "admin-password") | b64dec }}
{{- else if and .Release.IsUpgrade (not $password) }}
{{- fail "Grafana credential Secret is missing; restore it before upgrading" }}
{{- else if not $password }}
{{- $password = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-user: admin
  admin-password: {{ $password | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Demo metrics
        uid: demo-metrics
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-victoria-metrics:8428
        isDefault: true
        editable: false
        jsonData:
          timeInterval: {{ .Values.scrapeInterval | quote }}
  dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: demo
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
  dashboard.json: |
{{ $dashboard | toPrettyJson | indent 4 }}
  dashboard-collector.json: |
{{ .Files.Get "files/dashboard-collector.json" | indent 4 }}
{{- end }}

{{- $ingress := .Values.grafana.ingress }}
{{- if and .Values.enabled $ingress.enabled }}
{{- if not (regexMatch "^(/[A-Za-z0-9._~-]+)+$" $ingress.path) }}{{ fail "grafana.ingress.path must be a path such as /grafana, without a trailing /" }}{{ end }}
# Grafana serves its pages under the path itself (GF_SERVER_SERVE_FROM_SUB_PATH),
# so any ingress controller can route the prefix without rewriting it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-grafana
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with $ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ $ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-grafana
                port: {name: http}
{{- end }}

{
  "enabled": true,
  "nodeSelector": {},
  "imagePullPolicy": "IfNotPresent",
  "imagePullSecrets": [],
  "scrapeInterval": "15s",
  "scrapeTimeout": "10s",
  "namespaces": [
    "llm-stack"
  ],
  "targets": [
    {
      "name": "gateway",
      "selector": "app.kubernetes.io/name=llm-api-gateway,app.kubernetes.io/instance=llm-stack",
      "portName": "http",
      "port": 9464
    },
    {
      "name": "router",
      "selector": "app.kubernetes.io/name=llm-request-router,app.kubernetes.io/instance=llm-stack",
      "portName": "metrics"
    },
    {
      "name": "operator",
      "selector": "app.kubernetes.io/name=operator,app.kubernetes.io/instance=llm-stack",
      "portName": "metrics"
    },
    {
      "name": "pylon",
      "selector": "app.kubernetes.io/name=pylon,app.kubernetes.io/managed-by=pylon-operator",
      "portName": "metrics"
    }
  ],
  "networkPolicy": {
    "enabled": false,
    "apiServerCIDRs": []
  },
  "collector": {
    "image": "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.160.0",
    "resources": {
      "requests": {
        "cpu": "100m",
        "memory": "128Mi"
      },
      "limits": {
        "memory": "512Mi"
      }
    }
  },
  "victoriaMetrics": {
    "image": "victoriametrics/victoria-metrics:v1.153.0",
    "retentionPeriod": "3d",
    "resources": {
      "requests": {
        "cpu": "100m",
        "memory": "256Mi"
      },
      "limits": {
        "memory": "768Mi"
      }
    },
    "storage": {
      "enabled": true,
      "storageClass": "",
      "size": "5Gi"
    }
  },
  "grafana": {
    "image": "grafana/grafana:13.2.3",
    "adminSecret": "",
    "resources": {
      "requests": {
        "cpu": "100m",
        "memory": "512Mi"
      },
      "limits": {
        "memory": "1Gi"
      }
    },
    "adminPassword": "",
    "rootURL": "http://demo.example.com/grafana/",
    "ingress": {
      "enabled": true,
      "className": "traefik",
      "host": "",
      "path": "/grafana"
    }
  }
}

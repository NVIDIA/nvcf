llmApiGateway:
  replicaCount: 3

  podDisruptionBudget:
    enabled: false
    # minAvailable and maxUnavailable are mutually exclusive; set exactly one.
    # Accepts an integer or a percentage string (e.g. 1 or "50%").
    minAvailable: ""
    maxUnavailable: ""

  image:
    registry: ""
    repository: ""
    tag: "0.14.2"
    pullPolicy: IfNotPresent

  imagePullSecrets: []
  # Namespace to deploy namespaced resources. Defaults to the release namespace.
  namespace: ""
  nameOverride: llm-api-gateway
  fullnameOverride: llm-api-gateway

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  service:
    type: ClusterIP
    port: 8080

  config:
    region: global
    requestRouterUrl: "http://llm-request-router.nvcf.svc.cluster.local:8000"
    requestRouterConnectTimeout: 2s
    requestRouterRequestTimeout: 0s
    # Longest a single response write may stall on a client that stopped
    # reading. Applies only while a write is in progress, so it does not cap
    # total response time or upstream pauses. 0s disables the bound.
    inferenceWriteTimeout: 60s
    nvcfGrpcAddr: "api.nvcf.svc.cluster.local:9090"
    nvcfGrpcInsecure: false
    nvcfGrpcTimeout: 2s
    rateLimitEnabled: true
    rateLimitFailOpen: true
    localFunctionId: ""
    defaultModel: ""
    defaultRpm: 120
    defaultTpm: 240000

  # Caller authentication. mode selects exactly one of:
  #   nvcf        Authenticate each request through the NVCF LLM gRPC auth
  #               service at config.nvcfGrpcAddr, with the service token the
  #               Vault Agent writes to /vault/secrets/secrets.json. The model
  #               carries a routing-key prefix. This is the default.
  #   staticKeys  Verify the caller's bearer key against the SHA-256 digests in
  #               the Secret staticKeys.existingSecret. Needs no NVCF API and no
  #               Vault; set vault.enabled=false when no Vault is available.
  #   anonymous   Accept every request without credentials. Development only.
  auth:
    mode: nvcf
    staticKeys:
      # Existing Secret with key api-keys.json, mounted read-only at
      # /etc/llm-api-gateway/auth and passed as API_KEYS_PATH. Required in
      # staticKeys mode. The gateway re-reads the file at most every 60
      # seconds, so key changes need no restart. Format:
      #   {"keys": [{"id": "team-a", "sha256": "<lowercase hex SHA-256 of the key>"}]}
      existingSecret: ""
      # Request paths served in staticKeys mode, passed comma-joined as
      # STATIC_ALLOWED_PATHS. Other paths return 403 after authentication.
      allowedPaths:
        - /v1/chat/completions
    # Optional bearer the gateway sends to the request router in every mode.
    # Read from the given key of the existing Secret existingSecret and passed
    # as STARGATE_SERVICE_TOKEN. The caller's Authorization header is never
    # forwarded.
    serviceToken:
      existingSecret: ""
      key: token

  # TLS on the gateway listener. When enabled, the kubernetes.io/tls Secret
  # existingSecret is mounted read-only at /etc/llm-api-gateway/tls, its tls.crt
  # and tls.key are passed as TLS_CERT_FILE and TLS_KEY_FILE, and the probes use
  # HTTPS. The gateway reads the files at startup, so a renewed certificate
  # takes effect on the next pod restart.
  tls:
    enabled: false
    existingSecret: ""

  # Rate-limit state is kept in an embedded Olric cluster colocated with the
  # gateway pods (no separate Redis deployment). The gateway's server.go picks
  # ratelimit.AllowAll when RATE_LIMIT_ENABLED=true AND OLRIC_ENABLED=false, so
  # enabling rate limiting without Olric silently turns into a no-op.
  olric:
    enabled: true
    # "local" | "lan" | "wan" - memberlist tuning. Use "local" for single-pod k3d
    # or tight-timing dev setups; "lan" for normal multi-pod production.
    env: lan
    # Bind ports exposed on the pod. 3320 = Olric data, 3322 = memberlist.
    bindPort: 3320
    memberlistPort: 3322
    # K8s label selector the Olric k8s-discovery plugin uses to find peers. Left
    # empty here so it's computed from the chart's selectorLabels in the
    # ConfigMap template; override to pin a different selector.
    k8sLabelSelector: ""
    replicaCount: 1
    partitionCount: 271
    dmapName: rate-limit
    startupTimeout: 15s
    logLevel: WARN
    # Grants the gateway's ServiceAccount get/list on pods in its own namespace
    # for memberlist peer discovery. Turn this off only if you're wiring up
    # OLRIC_PEERS statically or discovery via another mechanism.
    rbac:
      create: true

  vault:
    # Inject the Vault Agent sidecar and mount its token and template volumes.
    # nvcf mode reads its NVCF service token from the Vault Agent. staticKeys
    # and anonymous modes need no Vault; set false when none is available.
    enabled: true
    audience: ""

  metrics:
    enabled: false
    port: 9464
    serviceMonitor:
      enabled: false
      interval: "30s"
      path: "/metrics"
      port: "metrics"

  observability:
    tracing:
      enabled: false
      endpoint: ""
      protocol: grpc

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Zone spread; set by the HA value layer, empty by default.
  topologySpreadConstraints: []

  # Rollout strategy; set by the HA value layer, empty by default.
  strategy: {}

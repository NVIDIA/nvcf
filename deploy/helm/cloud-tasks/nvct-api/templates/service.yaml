apiVersion: v1
kind: Service
metadata:
  name: nvct-api
  namespace: {{ include "nvct-api.namespace" . }}
  labels:
    {{- include "nvct-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nvctApi.service.type }}
  ports:
    {{- range .Values.nvctApi.service.ports }}
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol }}
      name: {{ .name }}
    {{- end }}
  selector:
    {{- include "nvct-api.selectorLabels" . | nindent 4 }}

{{- $serverFullname := include "nvcf-openbao.serverFullname" . }}
{{- if ne (include "nvcf-openbao.jwtLifecycleMode" .) "bridge" }}
{{- $versioned := eq (include "nvcf-openbao.jwtLifecycleMode" .) "versioned" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $serverFullname }}-migrations
  namespace: {{ include "nvcf-openbao.namespace" . }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
spec:
  template:
    {{- with .Values.openbao.hooks.migrations.podAnnotations }}
    metadata:
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
      {{- with .Values.openbao.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.openbao.hooks.migrations.schedulingGates }}
      schedulingGates:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      # this is the same service account created for hook-post-01-initcluster
      # this job can access secrets and exec to bao
      serviceAccountName: {{ $serverFullname }}-initialize-cluster
      {{- if $versioned }}
      initContainers:
        - name: jwt-plugin-version
          image: "{{ include "openbao.image" (dict "image" .Values.openbao.server.image "name" "openbao.server.image") }}"
          imagePullPolicy: {{ .Values.openbao.server.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- include "nvcf-openbao.adminEnvironment" . | nindent 14 }}
              jwt-plugin-lifecycle wait-ready
              {{- include "nvcf-openbao.copyJWTManifest" . | nindent 14 }}
          volumeMounts:
            - name: jwt-plugin-version
              mountPath: /versions
            - name: {{ $serverFullname }}-root-token
              mountPath: /secrets/root_token
              readOnly: true
          resources:
            {{- toYaml .Values.openbao.hooks.migrations.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: bao-migrations
          image: "{{ include "openbao.image" (dict "image" .Values.openbao.migrations.image "name" "openbao.migrations.image") }}"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          imagePullPolicy: {{ .Values.openbao.migrations.image.pullPolicy }}
          volumeMounts:
            {{- if $versioned }}
            - name: jwt-plugin-version
              mountPath: /versions
              readOnly: true
            {{- end }}
            - name: {{ $serverFullname }}-root-token
              mountPath: /secrets/root_token
              readOnly: true
            - name: {{ $serverFullname }}-jwt
              mountPath: /secrets/jwt
              readOnly: true
            {{- if .Values.openbao.migrations.issuerDiscovery.caBundleSecretName }}
            - name: oidc-ca-bundle
              mountPath: /etc/ssl/certs/oidc
              readOnly: true
            {{- end }}
          env:
            - name: JWT_PLUGIN_LIFECYCLE_MODE
              value: {{ include "nvcf-openbao.jwtLifecycleMode" . | quote }}
            {{- if $versioned }}
            - name: BAO_JWT_PLUGIN_VERSIONS_FILE
              value: /versions/manifest.env
            {{- end }}
            - name: OIDC_DISCOVERY_ENABLED
              value: "{{ .Values.openbao.migrations.issuerDiscovery.enabled }}"
            - name: OIDC_DISCOVERY_URL
              value: "{{- .Values.openbao.migrations.issuerDiscovery.urlOverride | default "https://kubernetes.default.svc/.well-known/openid-configuration" -}}"
            - name: OIDC_DISCOVERY_INSECURE
              value: "{{ .Values.openbao.migrations.issuerDiscovery.insecure }}"
            {{- if .Values.openbao.migrations.issuerDiscovery.caBundleSecretName }}
            - name: OIDC_CA_BUNDLE
              value: "/etc/ssl/certs/oidc/ca.crt"
            {{- end }}
            {{- with .Values.openbao.migrations.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.openbao.hooks.migrations.resources | nindent 12 }}
      volumes:
        {{- if $versioned }}
        - name: jwt-plugin-version
          emptyDir: {}
        {{- end }}
        - name: {{ $serverFullname }}-root-token
          secret:
            secretName: {{ $serverFullname }}-root-token
            items:
            - key: root_token
              path: root_token
        - name: {{ $serverFullname }}-jwt
          secret:
            secretName: cluster-jwt
            items:
              - key: pem
                path: cluster_jwt.pem
      {{- if .Values.openbao.migrations.issuerDiscovery.caBundleSecretName }}
        - name: oidc-ca-bundle
          secret:
            secretName: "{{ .Values.openbao.migrations.issuerDiscovery.caBundleSecretName }}"
            items:
            - key: ca.crt
              path: ca.crt
      {{- end }}
{{- end }}

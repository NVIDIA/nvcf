# Contains the initialization script and a job to run it as a hook

# The script runs in an image that must contain:
# - bash
# - cqlsh
{{- if .Values.cassandra.hooks.initializeCluster.enabled }}
{{- $fullname := include "cassandra.fullname" . }}
{{- $namespace := include "cassandra.namespace" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-initialize-cluster
  namespace: {{ $namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    {{- with .Values.cassandra.hooks.initializeCluster.podAnnotations }}
    metadata:
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
      {{- include "cassandra.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.cassandra.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cassandra.hooks.initializeCluster.schedulingGates }}
      schedulingGates:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cassandra-init
          image: "{{ .Values.cassandra.migrations.image.registry }}/{{ .Values.cassandra.migrations.image.repository }}:{{ .Values.cassandra.migrations.image.tag }}"
          {{- if .Values.cassandra.migrations.image.pullPolicy }}
          imagePullPolicy: {{ .Values.cassandra.migrations.image.pullPolicy | title }}
          {{- end }}
          {{- with .Values.cassandra.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/bash"]
          args:
            - -c
            - /scripts/initdb.sh
          env:
            - name: CASSANDRA_HOSTS
              value: "{{ $fullname }}-0.{{ $fullname }}-headless.{{ $namespace }}.svc.cluster.local"
            - name: CASSANDRA_READY_HOSTS
              value: {{ include "cassandra.replicaHosts" . | quote }}
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_USER
              value: {{ .Values.cassandra.dbUser.user | quote }}
            - name: CASSANDRA_PASSWORD
              value: {{ .Values.cassandra.dbUser.password | quote }}
            - name: REPLICA_COUNT
              value: {{ .Values.cassandra.replicaCount | quote }}
          volumeMounts:
            - name: init-script
              readOnly: true
              mountPath: "/scripts"
            - name: cassandra-init-cql
              readOnly: true
              mountPath: /opt/nvcf/cassandra/cql
          resources:
            {{- toYaml .Values.cassandra.hooks.initializeCluster.resources | nindent 12 }}
      restartPolicy: Never
      volumes:
        - name: init-script
          configMap:
            name: cassandra-init-script # static name is intentional
            defaultMode: 0555
        - name: cassandra-init-cql
          configMap:
            name: cassandra-init-cql # static name is intentional
            defaultMode: 0444
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-init-script
  namespace: {{ include "cassandra.namespace" . }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-failed,hook-succeeded
data:
  initdb.sh: |-
    {{- .Files.Get "scripts/initdb.sh" | nindent 4 }}
---
{{- end }}

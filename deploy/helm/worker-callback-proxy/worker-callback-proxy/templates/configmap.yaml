{{- $c := .Values.workerCallbackProxy }}
{{- include "workerCallbackProxy.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workerCallbackProxy.fullname" . }}-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "workerCallbackProxy.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    {{- include "workerCallbackProxy.envoyConfig" . | nindent 4 }}
  {{- if include "workerCallbackProxy.frontendTls" . }}
  sds_frontend.yaml: |
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: frontend_tls
        tls_certificate:
          certificate_chain: { filename: /etc/envoy/tls/frontend/tls.crt }
          private_key: { filename: /etc/envoy/tls/frontend/tls.key }
          watched_directory: { path: /etc/envoy/tls/frontend }
  {{- end }}
  {{- if $c.grpcProxy.enabled }}
  sds_grpc_proxy_ca.yaml: |
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: grpc_proxy_ca
        validation_context:
          trusted_ca: { filename: /etc/envoy/tls/grpc-proxy-ca/ca.crt }
          watched_directory: { path: /etc/envoy/tls/grpc-proxy-ca }
  {{- end }}

{{- $c := .Values.workerCallbackProxy }}
{{- $cert := $c.tls.frontend.certificate }}
{{- if and (include "workerCallbackProxy.frontendTls" .) $cert.create (not $c.tls.frontend.existingSecret) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "workerCallbackProxy.fullname" . }}-frontend
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "workerCallbackProxy.labels" . | nindent 4 }}
spec:
  secretName: {{ include "workerCallbackProxy.frontendSecretName" . | quote }}
  dnsNames:
    - {{ printf "*.%s" (include "workerCallbackProxy.workerDomain" .) | quote }}
  duration: {{ $cert.duration | quote }}
  renewBefore: {{ $cert.renewBefore | quote }}
  privateKey:
    {{- toYaml $cert.privateKey | nindent 4 }}
  issuerRef:
    {{- toYaml $cert.issuerRef | nindent 4 }}
{{- end }}

{{- $c := .Values.workerCallbackProxy }}
{{- if $c.service.create }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workerCallbackProxy.serviceName" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "workerCallbackProxy.labels" . | nindent 4 }}
    {{- with $c.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type | quote }}
  {{- with $c.service.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  {{- with $c.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "workerCallbackProxy.selectorLabels" . | nindent 4 }}
  ports:
    {{- if $c.grpcProxy.enabled }}
    - name: grpc-quic
      port: {{ $c.service.ports.grpcQuic }}
      targetPort: grpc-quic
      protocol: UDP
    {{- end }}
    {{- if $c.invocation.enabled }}
    - name: invocation-tcp
      port: {{ $c.service.ports.invocationTcp }}
      targetPort: invocation-tcp
      protocol: TCP
    {{- end }}
{{- end }}

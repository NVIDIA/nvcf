{{- $c := .Values.workerCallbackProxy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wcp.labels" . | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      {{- include "wcp.selectorLabels" . | nindent 6 }}
  {{- with $c.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "wcp.envoyConfig" . | sha256sum }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "wcp.selectorLabels" . | nindent 8 }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $c.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- with $c.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: envoy
          image: {{ include "wcp.image" . | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          args:
            - -c
            - /etc/envoy/config/envoy.yaml
            - --drain-time-s
            - {{ $c.drainTimeSeconds | quote }}
            - --drain-strategy
            - gradual
            - --disable-hot-restart
            - -l
            - {{ $c.logLevel | quote }}
          ports:
            {{- if $c.grpcProxy.enabled }}
            - name: grpc-quic
              containerPort: {{ $c.ports.grpcQuic }}
              protocol: UDP
            {{- end }}
            {{- if $c.invocation.enabled }}
            - name: invocation-tcp
              containerPort: {{ $c.ports.invocationTcp }}
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: {{ $c.ports.health }}
              protocol: TCP
          {{- with $c.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                # Start a graceful listener drain through the admin API, then
                # wait so endpoints drop this pod before SIGTERM.
                command:
                  - /bin/bash
                  - -c
                  - >-
                    exec 3<>/dev/tcp/127.0.0.1/{{ $c.ports.admin }} &&
                    printf 'POST /drain_listeners?graceful HTTP/1.1\r\nHost: localhost\r\nContent-Length: 0\r\nConnection: close\r\n\r\n' >&3;
                    sleep {{ $c.preStopSleepSeconds }}
          {{- with $c.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/envoy/config
              readOnly: true
            {{- if $c.grpcProxy.enabled }}
            - name: frontend-tls
              mountPath: /etc/envoy/tls/frontend
              readOnly: true
            - name: grpc-proxy-ca
              mountPath: /etc/envoy/tls/grpc-proxy-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "wcp.fullname" . }}-config
        {{- if $c.grpcProxy.enabled }}
        - name: frontend-tls
          secret:
            secretName: {{ include "wcp.frontendSecretName" . }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: grpc-proxy-ca
          secret:
            secretName: {{ $c.grpcProxy.caSecret.name }}
            items:
              - key: {{ $c.grpcProxy.caSecret.key }}
                path: ca.crt
        {{- end }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if $c.affinity }}
        {{- toYaml $c.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "wcp.selectorLabels" . | nindent 20 }}
        {{- end }}
      topologySpreadConstraints:
        {{- if $c.topologySpreadConstraints }}
        {{- toYaml $c.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "wcp.selectorLabels" . | nindent 14 }}
        {{- end }}

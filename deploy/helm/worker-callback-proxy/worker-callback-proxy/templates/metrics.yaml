{{- $c := .Values.workerCallbackProxy }}
{{- if $c.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workerCallbackProxy.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workerCallbackProxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "workerCallbackProxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ $c.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
{{- if $c.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "workerCallbackProxy.fullname" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workerCallbackProxy.labels" . | nindent 4 }}
    {{- with $c.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "workerCallbackProxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /stats/prometheus
      interval: {{ $c.metrics.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ $c.metrics.serviceMonitor.scrapeTimeout | quote }}
{{- end }}

workerCallbackProxy:
  nameOverride: ""
  fullnameOverride: ""

  replicaCount: 2

  image:
    registry: ""
    repository: envoyproxy/envoy
    # Defaults to v<appVersion>.
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  # Worker callback hostnames are <dashed-pod-ip>.<workerDomain>, for example
  # 10-42-0-5.grpc-worker.example.com. Required.
  workerDomain: ""
  clusterDomain: cluster.local

  # grpc-proxy worker tunnels: HTTP/3 from the worker, TLS terminated here and
  # re-encrypted to the grpc-proxy pod whose IP is in the hostname.
  grpcProxy:
    enabled: true
    # grpc-proxy HTTP/3 port on the pod.
    port: 10084
    # SNI sent to grpc-proxy and the only SAN accepted from it. Defaults to
    # *.grpc-headless.<release namespace>.svc.<clusterDomain>.
    tlsServerName: ""
    # Certificate grpc-proxy serves HTTP/3 with, for tlsServerName. Issued from
    # tls.frontend.certificate.issuerRef; grpc-proxy mounts the Secret.
    podCertificate:
      create: true
      secretName: grpc-proxy-pod-tls
    # CA bundle that signed the grpc-proxy pod certificate.
    caSecret:
      name: grpc-proxy-pod-tls
      key: ca.crt

  # invocation-service worker tunnels: HTTP/1 CONNECT and forward-proxy
  # requests, allowed only to <dashed-pod-ip>.<serviceName>.<namespace>.svc.
  invocation:
    enabled: true
    serviceName: invocation
    # Defaults to the release namespace.
    namespace: ""
    port: 8080

  tls:
    frontend:
      # Use a pre-created kubernetes.io/tls Secret for *.<workerDomain>, for
      # example a publicly trusted certificate. Takes precedence over
      # certificate.create.
      existingSecret: ""
      certificate:
        # Issue *.<workerDomain> with cert-manager.
        create: true
        issuerRef:
          kind: ClusterIssuer
          name: nvcf-openbao-pki
          group: cert-manager.io
        duration: 2160h
        renewBefore: 720h
        privateKey:
          algorithm: RSA
          size: 2048

  ports:
    grpcQuic: 10443
    invocationTcp: 10084
    # Serves only /ready, for the kubelet probes. Not exposed by the Service.
    health: 8081
    admin: 9901

  service:
    create: true
    # Workers reach Envoy through this Service. Keep the name stable: DNS rules
    # and PROXY_ADDRESS point at it.
    name: ""
    type: ClusterIP
    annotations: {}
    labels: {}
    loadBalancerClass: ""
    externalTrafficPolicy: ""
    ports:
      grpcQuic: 443
      invocationTcp: 10084

  admin:
    # The admin API can drain or stop Envoy and dump its config, so it listens
    # only inside the pod. Probes use ports.health instead.
    address: 127.0.0.1

  logLevel: info

  # Seconds Envoy spends draining listeners. The preStop hook starts the drain
  # and then waits preStopSleepSeconds before Kubernetes sends SIGTERM, which
  # ends Envoy at once, so keep the sleep at least drainTimeSeconds.
  drainTimeSeconds: 30
  preStopSleepSeconds: 30
  terminationGracePeriodSeconds: 60

  timeouts:
    connect: 2s
    quicIdle: 60s
    grpcIdle: 1800s
    grpcMaxConnectionDuration: 1700s
    invocationIdle: 3605s
    invocationMaxConnectionDuration: 3400s

  connectionLimits:
    maxActiveDownstreamConnections: 20000
    maxUpstreamConnections: 20000
    maxPendingRequests: 1000000
    maxRequests: 1000000
    perConnectionBufferLimitBytes: 4194304

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  readinessProbe:
    httpGet:
      path: /ready
      port: health
    periodSeconds: 5
  livenessProbe:
    httpGet:
      path: /ready
      port: health
    initialDelaySeconds: 10
    periodSeconds: 10

  nodeSelector: {}
  tolerations: []
  # Defaults to soft hostname anti-affinity when empty.
  affinity: {}
  # Defaults to a soft zone spread when empty.
  topologySpreadConstraints: []

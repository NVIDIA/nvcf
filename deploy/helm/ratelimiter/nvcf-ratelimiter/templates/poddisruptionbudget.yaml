{{- if .Values.rateLimiter.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nvcf-ratelimiter.fullname" . }}
  namespace: {{ include "nvcf-ratelimiter.namespace" . }}
  labels: {{- include "nvcf-ratelimiter.labels" . | nindent 4 }}
spec:
  {{- if .Values.rateLimiter.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.rateLimiter.podDisruptionBudget.minAvailable }}
  {{- else if .Values.rateLimiter.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.rateLimiter.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels: {{- include "nvcf-ratelimiter.selectorLabels" . | nindent 6 }}
{{- end }}

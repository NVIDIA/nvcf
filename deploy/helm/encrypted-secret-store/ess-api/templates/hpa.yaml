{{- if .Values.ess.autoscaling.enabled }}
{{- if and (not .Values.ess.autoscaling.targetCPUUtilizationPercentage) (not .Values.ess.autoscaling.targetMemoryUtilizationPercentage) }}
{{- fail "ess.autoscaling.enabled=true but no scaling metric is configured. Set at least one of ess.autoscaling.targetCPUUtilizationPercentage or ess.autoscaling.targetMemoryUtilizationPercentage, or set ess.autoscaling.enabled=false." }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ess-api.fullname" . }}
  namespace: {{ include "ess-api.namespace" . }}
  labels:
    {{- include "ess-api.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ess-api.fullname" . }}-deployment
  minReplicas: {{ .Values.ess.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.ess.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.ess.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ess.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.ess.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.ess.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}

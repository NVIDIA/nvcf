ess:
  replicaCount: 1

  podDisruptionBudget:
    enabled: false
    # minAvailable and maxUnavailable are mutually exclusive; set exactly one.
    # Accepts an integer or a percentage string (e.g. 1 or "50%").
    minAvailable: ""
    maxUnavailable: ""

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    registry: "" # must be supplied in additional values
    repository: "" # must be supplied in additional values
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "0.4.15"

  namespace: ""

  # This is to override the chart name.
  nameOverride: ""
  fullnameOverride: ""

  configuration:
    springProfile: ncp-prod
    additionalJavaOpts: ""

  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}
  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext:
    capabilities:
      drop:
      - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    runAsUser: 1000

  # Optional nodeSelector to constrain Pods to specific nodes. Example:
  # nodeSelector:
  #   nvc.nvidia.com/workload: "control-plane"
  nodeSelector: {}

  # This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    port: 8080
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    ports:
      - name: app-port
        port: 8080
        targetPort: 8080
        protocol: TCP
      - name: metrics
        port: 9464
        targetPort: 9464
        protocol: TCP

  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 8080
    initialDelaySeconds: 0
    timeoutSeconds: 5
    periodSeconds: 15
    successThreshold: 1
    failureThreshold: 4
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 8080
    initialDelaySeconds: 0
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6

  startupProbe:
    httpGet:
      path: /health/readiness
      port: 8080
    failureThreshold: 180
    periodSeconds: 5
    initialDelaySeconds: 10

  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    #targetMemoryUtilizationPercentage: 80

  ports:
    - name: app-port
      containerPort: 8080
      protocol: TCP
    - name: metrics
      containerPort: 9464
      protocol: TCP

{{ if .Values.stateMetrics.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nvcf-state-metrics.fullname" . }}-env
  namespace: {{ include "nvcf-state-metrics.namespace" . }}
  labels:
    {{- include "nvcf-state-metrics.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.stateMetrics.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{ end }}

    # The caching layer
    server {
        set $docker_proxy_request_type "nvcf-proxy-cache";
        include  /etc/nginx/conf.d/sites/proxy-common.conf;
        access_log /dev/stdout main buffer=256k flush=10s;

        # Listen on 14128, for all hostnames.
        listen 14128 ssl;
        # override specific configurations from proxy-common.conf
        http2 {{ $.Values.cache.http2 | default "off" }};
        server_name ~^x?l?files\.(stg\.)?ngc\.nvidia\.com$;
        # Cache-lock timeouts inherited from proxy-common.conf (aligned fleet-wide).
        proxy_cache proxy_ngc;
        
        # Buffer profile inherited from proxy-common.conf (aligned fleet-wide).
        
        # Reliability for NGC downloads  
        # NGC model blobs are content-addressed and immutable; validity is
        # driven by cache.valid so expiry does not force refetching.
        proxy_cache_valid 200 206 {{ $.Values.cache.valid | default "7d" }};
        proxy_cache_valid 429 0;
        proxy_cache_use_stale http_429 error timeout updating;
        proxy_cache_background_update on;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        
        # NGC CDN connection optimizations
        proxy_connect_timeout 10s;      # Allow time for CDN connection setup
        proxy_set_header Connection "";  # Enable keep-alive to upstream

        set_by_lua_block $ssl_server_name {
          local headers = ngx.req.get_headers()
          return headers["Host"]
        }

        location  / {
          # Neutralise a malformed "bytes=" Range before anything reads
          # $http_range. nginx would answer 416; the origin ignores it and
          # serves 200. See lua/safe-range.lua. Must stay ahead of every
          # directive below that consumes the range, because nginx caches
          # $http_range once evaluated.
          set_by_lua_file $safe_range /etc/nginx/conf.d/lua/safe-range.lua;

          # Initialize upstream_last_modified to prevent warnings
          set $upstream_last_modified "";

          # Overrides the 15s common default for the NGC CDN origin hop. This is
          # an inactivity-between-reads timeout, so it bounds a CDN stall, not
          # the total transfer.
          #
          # The previous comment here said "16MB chunks from NGC CDN can spike".
          # That is no longer the request profile: NGC CLI 4.20.1 issues 512MiB
          # Range requests (measured on oci-lhr-ct2, dominant span 536870912
          # bytes). Left at 30s because reads flow continuously once a transfer
          # starts, so this only trips on a genuine origin stall -- but it is now
          # configurable so it can be raised without a chart release if the CDN's
          # first-byte latency for large ranges turns out to need it.
          proxy_read_timeout {{ ($.Values.cache).originReadTimeout | default "30s" }};

{{- if ($.Values.consistentHashRouting).enabled }}
          # Consistent-hash routing to the owner pod (see lua/cc-route.lua).
          # Route on the same key nginx caches on so each byte-range chunk maps
          # to its own owner and a large blob spreads across the tier.
          set $cc_hash_key "$request_method|$uri|$arg_versionId|$safe_range";
          set $cc_replicas {{ int $.Values.replicaCount }};
          rewrite_by_lua_file /etc/nginx/conf.d/lua/cc-route.lua;
{{- end }}

          proxy_pass_request_headers on;
          proxy_set_header Range $safe_range;
          proxy_cache_key $request_method|$uri|$arg_versionId|$safe_range;
          access_by_lua_file /etc/nginx/conf.d/lua/lua-access.lua;
          proxy_set_header Host $host;
          proxy_pass $scheme://$host;
        }
    }

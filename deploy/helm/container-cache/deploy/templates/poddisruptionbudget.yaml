{{- if .Values.podDisruptionBudget.enabled }}
{{- $pdbMinAvailable := .Values.podDisruptionBudget.minAvailable }}
{{- $pdbMaxUnavailable := .Values.podDisruptionBudget.maxUnavailable }}
{{- $hasPdbMinAvailable := and (ne $pdbMinAvailable nil) (ne ($pdbMinAvailable | toString) "") }}
{{- $hasPdbMaxUnavailable := and (ne $pdbMaxUnavailable nil) (ne ($pdbMaxUnavailable | toString) "") }}
{{- if and $hasPdbMinAvailable $hasPdbMaxUnavailable }}
{{- fail "podDisruptionBudget: set only one of minAvailable or maxUnavailable" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app: {{ $.Release.Name }}
    {{- include "nvcf-container-cache.labels" . | nindent 4 }}
spec:
  {{- if $hasPdbMinAvailable }}
  minAvailable: {{ $pdbMinAvailable }}
  {{- else if $hasPdbMaxUnavailable }}
  maxUnavailable: {{ $pdbMaxUnavailable }}
  {{- else }}
  minAvailable: 50%
  {{- end }}
  selector:
    matchLabels:
      app: nvcf-proxy-cache
{{- end }}

{{- $certificate := dig "http3" "tls" "certificate" dict .Values.grpcproxy }}
{{- if and (dig "http3" "enabled" false .Values.grpcproxy) (dig "enabled" false $certificate) }}
{{- $issuerRef := dig "issuerRef" dict $certificate }}
{{- $dnsNames := dig "dnsNames" list $certificate }}
{{- if not $dnsNames }}
{{- $dnsNames = include "grpc-proxy.http3DefaultDnsNames" . | fromJsonArray }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "grpc-proxy.http3SecretName" . | quote }}
  namespace: {{ include "grpc-proxy.namespace" . }}
  labels:
    {{- include "grpc-proxy.labels" . | nindent 4 }}
spec:
  secretName: {{ include "grpc-proxy.http3SecretName" . | quote }}
  {{- with dig "duration" "" $certificate }}
  duration: {{ . | quote }}
  {{- end }}
  {{- with dig "renewBefore" "" $certificate }}
  renewBefore: {{ . | quote }}
  {{- end }}
  dnsNames:
    {{- toYaml $dnsNames | nindent 4 }}
  usages:
    - server auth
  issuerRef:
    kind: {{ dig "kind" "ClusterIssuer" $issuerRef | quote }}
    name: {{ required "grpcproxy.http3.tls.certificate.issuerRef.name is required when grpcproxy.http3.tls.certificate.enabled is true" (dig "name" "" $issuerRef) | quote }}
    {{- with dig "group" "" $issuerRef }}
    group: {{ . | quote }}
    {{- end }}
{{- end }}

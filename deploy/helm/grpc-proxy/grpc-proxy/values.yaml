grpcproxy:

  namespace: ""

  # This is to override the chart name.
  nameOverride: ""
  fullnameOverride: ""

  replicaCount: 1

  podDisruptionBudget:
    enabled: false
    # minAvailable and maxUnavailable are mutually exclusive; set exactly one.
    # Accepts an integer or a percentage string (e.g. 1 or "50%").
    minAvailable: ""
    maxUnavailable: ""

  image:
    registry: ""
    repository: ""

    pullPolicy: IfNotPresent

    tag: "1.34.2"

  # Image pull secrets for private registries
  imagePullSecrets: []

  # Deployment type: "deployment" or "daemonset" (mutually exclusive)
  deploymentType: "deployment"

  # Deployment-specific configuration (only used when deploymentType: "deployment")
  deployment:
    # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80
    # Node selector for the Deployment pods
    nodeSelector: {}
    # Tolerations for the Deployment pods
    tolerations: []
    # Affinity rules for the Deployment pods
    affinity: {}
    # Zone spread; set by the HA value layer, empty by default.
    topologySpreadConstraints: []

  # DaemonSet-specific configuration (only used when deploymentType: "daemonset")
  daemonset:
    # Node selector for the DaemonSet pods
    nodeSelector: {}
    # Tolerations for the DaemonSet pods
    tolerations: []
    # Update strategy for the DaemonSet
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
    # DaemonSet metadata annotations
    annotations: {}
      # Add any DaemonSet-specific annotations here


  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}

  securityContext:
    capabilities:
      drop:
      - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    runAsUser: 1000

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  livenessProbe:
    httpGet:
      path: /health
      port: client
  readinessProbe:
    httpGet:
      path: /health
      port: client

  ports:
    - name: client
      containerPort: 10081
      protocol: TCP
    - name: worker-tcp
      containerPort: 10086
      protocol: TCP
    - name: metrics
      containerPort: 10083
      protocol: TCP

  # Optional routable grpc-proxy callback endpoint for workers that cannot
  # reach the grpc-proxy pod IP directly, such as split control-plane /
  # compute-plane deployments. The chart maps this value to the
  # SELF_WORKER_FQDN environment variable used by the grpc-proxy binary.
  # Leave empty to preserve the pod-IP fallback.
  workerConnectBaseURL: ""

  # HTTP/3 worker callbacks over TLS on UDP 10084. When enabled, the chart
  # opens the port, mounts the TLS Secret, sets ENABLE_HTTP3_CONNECT=true and
  # ENABLE_HTTP1_CONNECT=false, and each pod advertises
  # https://<dashed-pod-ip>.<base host>. The base is workerConnectBaseURL when
  # set, otherwise https://grpc-headless.<namespace>.svc.cluster.local:10084,
  # which in-cluster workers resolve straight to the pod. That relies on the
  # cluster DNS default of naming headless Service endpoints by dashed pod IP;
  # CoreDNS endpoint_pod_names breaks it, so set workerConnectBaseURL to a
  # domain that resolves those names instead. A custom base host needs DNS
  # for every <dashed-pod-ip>.<base host> name, for example a wildcard
  # record, not only the base host. Workers must trust the certificate's CA,
  # for example through NVCF_PROXY_CA_PEM.
  http3:
    enabled: false
    tls:
      # kubernetes.io/tls Secret holding tls.crt and tls.key. Required unless
      # certificate.enabled; with it, names the issued Secret
      # (default <fullname>-worker-tls).
      secretName: ""
      # Issue the Secret with cert-manager. grpc-proxy reloads the files when
      # cert-manager renews them, without a restart.
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          # Required when certificate.enabled.
          name: ""
          group: cert-manager.io
        # Must cover the advertised hostnames. Defaults to *.<base host>, for
        # example *.grpc-headless.<namespace>.svc.cluster.local.
        dnsNames: []
        duration: 2160h
        renewBefore: 720h

  # Additional volumes on the output Deployment definition.
  volumes: []

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []

  env:
    ENABLE_HTTP1_CONNECT: "true"
    GEO_DISABLED: "true"
    JETSTREAM_PLACEMENT_TAG: "dc:ncp"
    NVCF_FQDN_GRPC: "http://api.nvcf.svc.cluster.local:9090"
    NATS_FQDN: "nats://nats.nats-system.svc.cluster.local:4222" # TODO no tls
    # Tracing is opt-in. The proxy treats any non-empty value here as
    # "tracing enabled" and will attempt to export spans to this
    # endpoint on every request that carries a traceparent header. If
    # the endpoint is unreachable the proxy panics on the first traced
    # request, so leave this empty unless an OTLP collector is
    # actually deployed and reachable from the proxy.
    # Example: "http://otel.tracing-system.svc.cluster.local:8282"
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    # Event ledger base URL. Events are not published when empty.
    # EVENT_LEDGER_ADDR: "http://event-ledger.nvcf.svc.cluster.local:8080"

  # Service configuration
  service:
    type: ClusterIP  # Options: ClusterIP, NodePort, LoadBalancer, ExternalName
    annotations: {}
      # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      # service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

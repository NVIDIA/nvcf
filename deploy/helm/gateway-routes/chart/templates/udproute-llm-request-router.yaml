{{- if and .Values.nvcfGatewayRoutes.enabled .Values.nvcfGatewayRoutes.routes.llmRequestRouter.enabled }}
---
# QUIC reverse tunnel from pylon back into the LLM request router. The router
# issues the tunnel target after gRPC registration, so this path must reach the
# router pod named by the advertised hostname.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: {{ .Values.nvcfGatewayRoutes.routes.llmRequestRouter.quic.name }}
  namespace: {{ .Values.nvcfGatewayRoutes.gateways.llmRequestRouterQuic.namespace }}
  labels:
    {{- include "nvcf-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-request-router-quic-route
  annotations:
    {{- toYaml .Values.nvcfGatewayRoutes.routes.llmRequestRouter.routeAnnotations | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.nvcfGatewayRoutes.gateways.llmRequestRouterQuic.name }}
      namespace: {{ .Values.nvcfGatewayRoutes.gateways.llmRequestRouterQuic.namespace }}
      sectionName: {{ .Values.nvcfGatewayRoutes.gateways.llmRequestRouterQuic.listenerName }}

  rules:
    - backendRefs:
        - name: {{ .Values.nvcfGatewayRoutes.routes.llmRequestRouter.quic.backend.name }}
          namespace: {{ .Values.nvcfGatewayRoutes.routes.llmRequestRouter.quic.backend.namespace }}
          port: {{ .Values.nvcfGatewayRoutes.routes.llmRequestRouter.quic.backend.port }}
{{- end }}

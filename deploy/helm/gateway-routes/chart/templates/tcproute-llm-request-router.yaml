{{- if and .Values.nvcfGatewayRoutes.enabled .Values.nvcfGatewayRoutes.routes.llmRequestRouter.enabled }}
---
# Pylon gRPC control channel into the LLM request router. Workers resolve this
# address from nvcf.llm-request-router.worker-address handed down by nvcf-api.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ .Values.nvcfGatewayRoutes.routes.llmRequestRouter.grpcName }}
  namespace: {{ .Values.nvcfGatewayRoutes.gateways.llmRequestRouter.namespace }}
  labels:
    {{- include "nvcf-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-request-router-grpc-route
  annotations:
    {{- toYaml .Values.nvcfGatewayRoutes.routes.llmRequestRouter.routeAnnotations | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.nvcfGatewayRoutes.gateways.llmRequestRouter.name }}
      namespace: {{ .Values.nvcfGatewayRoutes.gateways.llmRequestRouter.namespace }}
      sectionName: {{ .Values.nvcfGatewayRoutes.gateways.llmRequestRouter.grpcListenerName }}

  rules:
    - backendRefs:
        - name: {{ .Values.nvcfGatewayRoutes.routes.llmRequestRouter.backend.name }}
          namespace: {{ .Values.nvcfGatewayRoutes.routes.llmRequestRouter.backend.namespace }}
          port: {{ .Values.nvcfGatewayRoutes.routes.llmRequestRouter.backend.grpcPort }}
{{- end }}

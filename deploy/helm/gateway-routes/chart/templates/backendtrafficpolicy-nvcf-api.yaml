{{- $route := .Values.nvcfGatewayRoutes.routes.nvcfApi }}
{{- if and .Values.nvcfGatewayRoutes.enabled $route.enabled $route.envoyBackendTrafficPolicy.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $route.name }}-connection-idle
  namespace: {{ .Values.nvcfGatewayRoutes.gateways.shared.namespace }}
  labels:
    {{- include "nvcf-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: nvcf-api-route
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $route.name }}
  timeout:
    http:
      connectionIdleTimeout: {{ required "nvcfApi.envoyBackendTrafficPolicy.connectionIdleTimeout is required" $route.envoyBackendTrafficPolicy.connectionIdleTimeout | quote }}
{{- end }}

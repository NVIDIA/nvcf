{{- if .Values.nvcfGatewayRoutes.enabled }}
---
# ReferenceGrant allows HTTPRoutes and GRPCRoutes in the shared Gateway
# namespaces to reference Services in the configured NVCF backend namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-routes-to-nvcf
  namespace: {{ .Values.nvcfGatewayRoutes.routes.nvcfApi.backend.namespace }}
  labels:
    {{- include "nvcf-gateway.labels" . | nindent 4 }}
spec:
  # Allow references FROM traefik-gateway namespace
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ include "nvcf-gateway.routeNamespace" . }}
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: {{ include "nvcf-gateway.routeNamespace" . }}
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: {{ include "nvcf-gateway.routeNamespace" . }}
  # TO Services in the configured NVCF backend namespace
  to:
    - group: ""
      kind: Service
{{- end }}

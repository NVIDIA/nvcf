{{- include "gds-mcs-controller.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gds-mcs-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gds-mcs-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.replicaCount }}
  {{- if .Values.leaderElection.enabled }}
  # One replica at a time; a stopping leader releases its Lease, so another
  # replica takes over at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- else }}
  # Without leader election two controllers must never run at once.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "gds-mcs-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gds-mcs-controller.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "gds-mcs-controller.serviceAccountName" . }}
      # The controller watches and writes Kubernetes objects.
      automountServiceAccountToken: true
      # The controller takes its configuration from flags; Service links would
      # only add <SERVICE>_* variables to its environment.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ int .Values.terminationGracePeriodSeconds }}
      containers:
        - name: gds-mcs-controller
          image: {{ include "gds-mcs-controller.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "gds-mcs-controller.args" . | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Defaults --operator-namespace, the namespace of the leader
            # election Lease.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.otel.enabled }}
            {{- with .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ include "gds-mcs-controller.otelResourceAttributes" . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ int .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ int .Values.healthProbe.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.gds.tlsCaConfigMap }}
          volumeMounts:
            - name: gds-ca
              mountPath: {{ include "gds-mcs-controller.gdsCaDir" . }}
              readOnly: true
          {{- end }}
      {{- if .Values.gds.tlsCaConfigMap }}
      volumes:
        - name: gds-ca
          configMap:
            name: {{ .Values.gds.tlsCaConfigMap }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "gds-mcs-controller.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

#
# Leader election: the Lease gds-mcs-controller.gds.nvidia.com and its Events
# in the release namespace. config/rbac/role.yaml covers only the
# reconcilers.
{{- if .Values.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gds-mcs-controller.suffixed" (list . "leader-election") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gds-mcs-controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gds-mcs-controller.suffixed" (list . "leader-election") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gds-mcs-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gds-mcs-controller.suffixed" (list . "leader-election") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gds-mcs-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

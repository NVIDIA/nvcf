{{- $env := .Values.invocation.env | default dict }}
{{- $workerTls := .Values.invocation.workerTls }}
{{- $workerTlsEnv := include "nvcf-invocation-service.workerTlsEnv" . | fromYaml }}
{{- if include "nvcf-invocation-service.hasEnvConfig" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nvcf-invocation-service.fullname" . }}-env
  namespace: {{ include "nvcf-invocation-service.namespace" . }}
  labels:
    {{- include "nvcf-invocation-service.labels" . | nindent 4 }}
data:
  {{- range $key, $value := $env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if not (hasKey $env "ENFORCE_POLLING_OWNER") }}
  ENFORCE_POLLING_OWNER: {{ .Values.invocation.polling.enforceOwnership | quote }}
  {{- end }}
  {{- if not (hasKey $env "CORS_ALLOWED_ORIGINS") }}
  {{- with .Values.invocation.cors.allowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ join "," . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.invocation.metrics.enabled }}
  APP_CONFIG: "/etc/nvcf-invocation/settings.yaml"
  APP_CONFIG_YAML: |
    server:
      metrics:
        exporters:
          - exporter: prometheus
            endpoint: http://{{ .Values.invocation.metrics.bindAddress }}:{{ .Values.invocation.metrics.port }}
  {{- end }}
  {{- with .Values.invocation.tracing.baggageAttributeAllowlist }}
  SERVER__TRACING__BAGGAGE_ATTRIBUTE_ALLOWLIST: {{ join "," . | quote }}
  {{- end }}
  {{- range $key, $value := $workerTlsEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if not (hasKey $env "WORKER_STREAM_PROPERTIES__SERVICE_ADDRESS") }}
  {{- if and $workerTls.enabled $workerTls.advertise }}
  WORKER_STREAM_PROPERTIES__SERVICE_ADDRESS: "https://{{ include "nvcf-invocation-service.serviceHost" . }}:{{ $workerTls.port }}"
  {{- else }}
  WORKER_STREAM_PROPERTIES__SERVICE_ADDRESS: "http://{{ include "nvcf-invocation-service.serviceHost" . }}:{{ (index .Values.invocation.service.ports 0).port }}"
  {{- end }}
  {{- end }}
{{- end }}

{{- if not (kindIs "bool" .Values.invocation.polling.enforceOwnership) }}
{{- fail "invocation.polling.enforceOwnership must be a boolean" }}
{{- end }}
{{- if not (kindIs "slice" .Values.invocation.cors.allowedOrigins) }}
{{- fail "invocation.cors.allowedOrigins must be a list" }}
{{- end }}
{{- range .Values.invocation.cors.allowedOrigins }}
{{- if not (kindIs "string" .) }}
{{- fail "invocation.cors.allowedOrigins entries must be strings" }}
{{- end }}
{{- if or (empty .) (contains "," .) }}
{{- fail "invocation.cors.allowedOrigins entries must be nonempty origins without commas" }}
{{- end }}
{{- end }}

{{- if and .Values.invocation.metrics.serviceMonitor.enabled (not .Values.invocation.metrics.enabled) }}
{{- fail "invocation.metrics.enabled must be true when invocation.metrics.serviceMonitor.enabled is true" }}
{{- end }}
{{- if .Values.invocation.metrics.enabled }}
{{- if not .Values.invocation.metrics.bindAddress }}
{{- fail "invocation.metrics.bindAddress is required when invocation.metrics.enabled is true" }}
{{- end }}
{{- $metricsPortText := toString .Values.invocation.metrics.port }}
{{- if or (not (regexMatch `^[0-9]+$` $metricsPortText)) (lt (int $metricsPortText) 1) (gt (int $metricsPortText) 65535) }}
{{- fail "invocation.metrics.port must be an integer between 1 and 65535 when invocation.metrics.enabled is true" }}
{{- end }}
{{- if hasKey .Values.invocation.env "APP_CONFIG" }}
{{- fail "invocation.env.APP_CONFIG is reserved when invocation.metrics.enabled is true" }}
{{- end }}
{{- if hasKey .Values.invocation.env "APP_CONFIG_YAML" }}
{{- fail "invocation.env.APP_CONFIG_YAML is reserved when invocation.metrics.enabled is true" }}
{{- end }}
{{- end }}
{{- $workerTls := .Values.invocation.workerTls }}
{{- if not (kindIs "bool" $workerTls.enabled) }}
{{- fail "invocation.workerTls.enabled must be a boolean" }}
{{- end }}
{{- if not (kindIs "bool" $workerTls.advertise) }}
{{- fail "invocation.workerTls.advertise must be a boolean" }}
{{- end }}
{{- if $workerTls.enabled }}
{{- $workerTlsPortText := toString $workerTls.port }}
{{- if or (not (regexMatch `^[0-9]+$` $workerTlsPortText)) (lt (int $workerTlsPortText) 1) (gt (int $workerTlsPortText) 65535) }}
{{- fail "invocation.workerTls.port must be an integer between 1 and 65535" }}
{{- end }}
{{- range .Values.invocation.ports }}
{{- if eq (int .containerPort) (int $workerTlsPortText) }}
{{- fail (printf "invocation.workerTls.port %s is already used by container port %s" $workerTlsPortText .name) }}
{{- end }}
{{- end }}
{{- if and .Values.invocation.metrics.enabled (eq (int .Values.invocation.metrics.port) (int $workerTlsPortText)) }}
{{- fail (printf "invocation.workerTls.port %s is already used by invocation.metrics.port" $workerTlsPortText) }}
{{- end }}
{{- range $key, $_ := .Values.invocation.env }}
{{- if hasPrefix "WORKER_TLS__" $key }}
{{- fail (printf "invocation.env.%s is set by invocation.workerTls; remove it from invocation.env" $key) }}
{{- end }}
{{- end }}
{{- $_ := include "nvcf-invocation-service.workerTlsSecretName" . }}
{{- end }}

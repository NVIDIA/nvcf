apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vanity-gateway.fullname" . }}
  labels:
    {{- include "vanity-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.vanityGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "vanity-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vanity-gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.vanityGateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.vanityGateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vanity-gateway.serviceAccountName" . }}
      {{- with .Values.vanityGateway.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vanityGateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vanityGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vanityGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vanityGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.vanityGateway.shutdown.terminationGracePeriodSeconds }}
      containers:
        - name: vanity-gateway
          image: {{ include "vanity-gateway.image" . }}
          imagePullPolicy: {{ .Values.vanityGateway.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "vanity-gateway.fullname" . }}-env
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 10081
              protocol: TCP
            - name: admin
              containerPort: 10083
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/bin/sleep
                  - {{ .Values.vanityGateway.shutdown.preStopSleepSeconds | quote }}
          resources:
            {{- toYaml .Values.vanityGateway.resources | nindent 12 }}
          {{- with .Values.vanityGateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: mapping-config
              mountPath: /etc/vanity-gateway/config
              readOnly: true
      volumes:
        - name: mapping-config
          configMap:
            name: {{ include "vanity-gateway.fullname" . }}-config

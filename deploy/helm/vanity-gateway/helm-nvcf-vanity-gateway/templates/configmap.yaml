apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vanity-gateway.fullname" . }}-env
  labels:
    {{- include "vanity-gateway.labels" . | nindent 4 }}
data:
  MAPPING_PATH: {{ .Values.vanityGateway.config.mappingPath | quote }}
  NVCF_API_ENDPOINT: {{ .Values.vanityGateway.config.nvcfApiEndpoint | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.vanityGateway.config.otelExporterOtlpEndpoint | quote }}
  SECRETS_PATH: {{ .Values.vanityGateway.config.secretsPath | quote }}
  PRIVATE_MODEL_NAME_REGEX_PATTERN: {{ .Values.vanityGateway.config.privateModelNameRegexPattern | quote }}
  AWS_REGION: {{ .Values.vanityGateway.config.awsRegion | quote }}
  SHADOW_MAX_CONCURRENT: {{ .Values.vanityGateway.config.shadowMaxConcurrent | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vanity-gateway.fullname" . }}-config
  labels:
    {{- include "vanity-gateway.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.vanityGateway.mappingConfig | nindent 4 }}

vanityGateway:
  replicaCount: 2

  image:
    registry: ""
    repository: nvcf-ai-api-gateway-service
    tag: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: vanity-gateway

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}

  shutdown:
    terminationGracePeriodSeconds: 330
    preStopSleepSeconds: 70

  service:
    type: ClusterIP
    httpPort: 8080
    adminPort: 10083

  config:
    mappingPath: /etc/vanity-gateway/config/config.yaml
    nvcfApiEndpoint: http://invocation.nvcf.svc.cluster.local:8080
    # Used only by hosts declared under mappingConfig.v2config.llmGateway.
    llmGatewayEndpoint: http://llm-api-gateway.nvcf.svc.cluster.local:8080
    otelExporterOtlpEndpoint: ""
    secretsPath: ""
    privateModelNameRegexPattern: ""
    awsRegion: ""
    shadowMaxConcurrent: 256

  mappingConfig:
    v2config:
      openai: {}
      vanity: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  serviceMonitor:
    enabled: false
    interval: 60s
    labels: {}

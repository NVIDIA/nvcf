vanityGateway:
  replicaCount: 1

  # values.schema.json requires a non-empty image.repository, so it cannot be
  # blanked out here. Set the registry to wherever the image is available.
  image:
    registry: ""
    repository: nvcf-ai-api-gateway-service

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # Local clusters do not usually run the Prometheus Operator CRDs.
  serviceMonitor:
    enabled: false

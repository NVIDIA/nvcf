{{/*
Generates the shared-worker (USER) NKey secret consumed by natsBox and as
the `shared_worker_nkey_pub` field copied into auth-callout's KV path. The
NKey encoding helpers live in `_helpers.tpl` and are also used by
nats-auth-callout-nkeys-secret.yaml. Idempotent via `lookup` to avoid
rotating on `helm upgrade`.

PrefixByteUser = 20 << 3 = 160. See nkeys/strkey.go.
*/}}

{{- $secretName := .Values.nats.natsBox.contexts.default.nkey.secretName -}}
{{- $namespace := include "nvcf-nats.namespace" . -}}
{{- $existing := (lookup "v1" "Secret" $namespace $secretName) -}}

{{- $nkeySeed := "" -}}
{{- $pubNkey := "" -}}

{{- if $existing -}}
  {{- $existingNkeySeed := index $existing.data "user.key" -}}
  {{- if $existingNkeySeed -}}{{- $nkeySeed = $existingNkeySeed | b64dec -}}{{- end -}}
  {{- $existingPubKey := index $existing.data "user.pub" -}}
  {{- if $existingPubKey -}}{{- $pubNkey = $existingPubKey | b64dec -}}{{- end -}}
{{- end -}}

{{- if or (not $nkeySeed) (not $pubNkey) -}}
  {{- $pair := include "nvcf-nats.genNkeyPair" (dict "publicPrefixByte" 160) -}}
  {{- $parts := splitList ";" $pair -}}
  {{- $nkeySeed = trimPrefix "seed=" (index $parts 0) -}}
  {{- $pubNkey = trimPrefix "pub=" (index $parts 1) -}}
{{- end -}}

{{- $pluginConfigs := dict "nkey" (dict "plugin_type" "nkey" "config" (dict "nkey_mappings" (list (dict "nkey" $pubNkey "account" "APP")))) -}}
{{- $_ := set $pluginConfigs "sis" (dict "plugin_type" "webhook" "config" (dict "url" "http://api.sis.svc.cluster.local:8080/v1/nvca/nats-authorize")) -}}
{{- $appPlugins := list (dict "id" "sis" "alias" "oidc") (dict "id" "nkey") -}}
{{- $authCallout := default dict (get (default dict (get .Values "nats")) "authCallout") -}}
{{- $workerTokenAuth := default dict (get $authCallout "workerTokenAuth") -}}
{{- if $workerTokenAuth.enabled -}}
  {{- $webhookUrl := required "nats.authCallout.workerTokenAuth.webhookUrl is required when workerTokenAuth is enabled" $workerTokenAuth.webhookUrl -}}
  {{- $_ := set $pluginConfigs "nvcf-api" (dict "plugin_type" "webhook" "config" (dict "url" $webhookUrl)) -}}
  {{- /* Workers ask for APP with plugin "webhook"; the API checks the worker token and answers APP. */ -}}
  {{- $appPlugins = append $appPlugins (dict "id" "nvcf-api" "alias" "webhook") -}}
{{- end -}}
{{- $accountConfigs := dict "APP" (dict "enabled_plugins" $appPlugins) -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  user.key: {{ $nkeySeed | b64enc | quote }}
  user.pub: {{ $pubNkey | b64enc | quote }}
  auth-callout-plugin.yaml: {{ dict "service" (dict "plugin_configs" $pluginConfigs "account_configs" $accountConfigs) | toYaml | b64enc | quote }}

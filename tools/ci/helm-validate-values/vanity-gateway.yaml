# CI-only values for helm lint/template validation.
vanityGateway:
  image:
    registry: example.com
    repository: foo/bar/baz
  serviceMonitor:
    enabled: true
  # An LLM-routed model, so schema regressions surface on every lint.
  mappingConfig:
    v2config:
      openai:
        host: api.example.com
        chatCompletions:
          meta_llama-3_3-70b:
            modelName: meta/llama-3.3-70b
            functionID: 00000000-0000-0000-0000-000000000001
            functionType: LLM
            customHeaders:
              X-Provider-Feature: enabled
      vanity: {}

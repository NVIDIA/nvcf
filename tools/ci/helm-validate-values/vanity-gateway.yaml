# CI-only values for helm lint/template validation.
vanityGateway:
  image:
    registry: example.com
    repository: foo/bar/baz
  serviceMonitor:
    enabled: true
  # Exercise an LLM-routed model so schema regressions surface in CI. Setting
  # functionType also triggers the conditional requirement on
  # config.llmGatewayEndpoint, which the chart default satisfies.
  mappingConfig:
    v2config:
      openai:
        host: api.example.com
        chatCompletions:
          meta_llama-3_3-70b:
            modelName: meta/llama-3.3-70b
            functionID: 00000000-0000-0000-0000-000000000001
            functionType: LLM
            customHeaders:
              X-Provider-Feature: enabled
      vanity: {}

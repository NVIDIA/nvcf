version: 1
default_tags:
  - eks
  - nvcf-cds
  - prod
go_work:
  go: "1.26"
  use:
    - tools/byoo
    - tools/collect-dependencies
    - tools/docs-version-sync
    - tools/generate-subproject-ci
    - tools/sync-synthetic-imports
shared_change_paths:
  # Files here trigger every subproject's full validation lane
  # regardless of which subtree changed. Keep tight. Generated
  # release-jobs YAML under `tools/ci/` is intentionally NOT here:
  # chart MRs regenerate it but don't change Go sources, and the
  # parent pipeline's check-release-pipeline-generated already
  # catches generator drift. Edits to this config file itself stay
  # covered through the explicit `subproject-validations.yaml` entry.
  - .gitlab-ci.yml
  - tools/ci/subproject-validations.yaml
  - tools/generate-subproject-ci/**/*
  - tools/scripts/boilerplate.go.txt
  - tools/scripts/update-go-deepcopy
  - tools/scripts/update-go-work
bazel_shared_change_paths:
  - .bazelrc
  - .bazelversion
  - MODULE.bazel
  - MODULE.bazel.lock
  - rules/**/*
  - platforms/**/*
  - ci/Dockerfile.bazel
# Generated/mechanical files (basenames). The semantic-release
# release-worthiness guard skips a service's version bump when the only
# in-scope changes since its last tag are these files -- a cross-cutting
# commit (a Bazel repin, an .oss-allowlist flip) that incidentally touches
# a service subtree should not release it.
#
# This list is the complete, authoritative set: setting the key REPLACES
# the built-in default (YAML lists are not merged). The key is
# pre-populated with the default below, so to add an exclusion (e.g.
# Cargo.lock, a generated *.pb.go basename) edit this list directly, and
# keep the existing entries unless you intend to drop them. If the key is
# omitted entirely, the generator falls back to MODULE.bazel.lock +
# .oss-allowlist.
release_generated_paths:
  - MODULE.bazel.lock
  - .oss-allowlist
profiles:
  go-library:
    stage: validate
    image: golang:1.26-bookworm
    variables:
      GOTOOLCHAIN: local
      GOWORK: $CI_PROJECT_DIR/go.work
    checks:
      - id: vendor
        type: go-vendor
      - id: codegen
        type: go-codegen
        install:
          - k8s.io/code-generator/cmd/deepcopy-gen@v0.34.2
        command: make codegen-update
      # Lint is intentionally omitted here because go-lib's Bazel lane owns
      # //src/libraries/go/lib:golangci_lint.
  go-tool:
    stage: validate
    image: golang:1.26-bookworm
    variables:
      GOTOOLCHAIN: local
      GOWORK: "off"
    checks:
      - id: unit-tests
        type: shell
        command: go test ./...
      - id: build
        type: shell
        command: go build ./...
  docs:
    stage: validate
    image: dockerhub.nvidia.com/node:24-alpine
    variables:
      FERN_NO_VERSION_REDIRECTION: "true"
    checks:
      - id: lint
        type: shell
        command: apk add --no-cache go && ./tools/ci/check-docs
  nvcf-cli:
    image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
    extends: .bazel-check
    variables:
      INSTALL_GO: "1"
    checks:
      - id: check-agent-skill-generated
        type: shell
        command: ./tools/ci/check-agent-skill-generated
      - id: verify-agent-skill-manifest
        type: shell
        command: bazel test ${BAZEL_REMOTE_FLAGS} --invocation_id=$BAZEL_INVOCATION_ID --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE --test_output=errors //src/clis/nvcf-cli/internal/agentskill:agentskill_test
      - id: test
        type: shell
        command: bazel test ${BAZEL_REMOTE_FLAGS} --invocation_id=$BAZEL_INVOCATION_ID --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE --build_tests_only --@rules_go//go/config:race --@rules_go//go/config:pure=false --test_output=errors //src/clis/nvcf-cli/...
  nvca-toolbox:
    stage: validate
    image: gitlab-master.nvidia.com:5005/egx/tools/toolbox:15
    checks:
      - id: dotenv-format
        type: shell
        skip_workspace_setup: true
        command: $CI_PROJECT_DIR/tools/ci/run-nvca-check dotenv-format
      - id: generated-files
        type: go-codegen
        command: >-
          make codegen-update &&
          make openapigen-update &&
          make testdata-update &&
          nv_components gen-gitlab-ci >./pipelines/components.yml &&
          make docs-update &&
          make dotenv-dependencies-update
      - id: service-oauth-defaults
        type: shell
        skip_workspace_setup: true
        command: $CI_PROJECT_DIR/tools/ci/run-nvca-check service-oauth-defaults
      - id: mirror-helm-chart
        type: shell
        skip_workspace_setup: true
        command: $CI_PROJECT_DIR/tools/ci/run-nvca-check mirror-helm-chart
      - id: bazel-image-push-targets
        type: shell
        skip_workspace_setup: true
        command: $CI_PROJECT_DIR/tools/ci/run-nvca-check bazel-image-push-targets
      - id: lint
        type: shell
        skip_workspace_setup: true
        command: $CI_PROJECT_DIR/tools/ci/run-nvca-check lint
subprojects:
  - id: go-lib
    path: src/libraries/go/lib
    profile: go-library
    go_work: true
    bazel:
      extra_test_targets:
        - //src/libraries/go/lib:golangci_lint
    needs_host_go: true
    change_paths:
      - src/libraries/go/lib/BUILD.bazel
      - src/libraries/go/lib/cmd/**/*
      - src/libraries/go/lib/go.mod
      - src/libraries/go/lib/go.sum
      - src/libraries/go/lib/Makefile
      - src/libraries/go/lib/.goheader.tmpl
      - src/libraries/go/lib/.golangci.yml
      - src/libraries/go/lib/BUILD.bazel
      - src/libraries/go/lib/pkg/**/*
      - src/libraries/go/lib/testdata/**/*
      - src/libraries/go/lib/validator/**/*
      - src/libraries/go/lib/vendor/**/*
  - id: go-worker
    path: src/libraries/go/worker
    go_work: true
    bazel:
      targets:
        - //src/libraries/go/worker/...
    change_paths:
      - src/libraries/go/worker/go.mod
      - src/libraries/go/worker/go.sum
      - src/libraries/go/worker/**/*
  # The worker services are GitHub-first OSS-mirrored image releases.
  # Tag pipelines build the multi-arch image index, push to a staging
  # registry, emit release-manifest.json, and trigger the private
  # release repo which copies the staging digest by reference to its
  # NVCR destinations (ncp-dev + nvcf-staging + nvcf-production). NVCR
  # destinations and NGC auth are owned by that private repo, never by
  # this OSS tree. Image names carry the hyphenated `-oss` suffix (nvcf-worker-<svc>-oss)
  - id: worker-init
    path: src/compute-plane-services/worker-init
    change_paths:
      - src/compute-plane-services/worker-init/go.mod
      - src/compute-plane-services/worker-init/go.sum
      - src/compute-plane-services/worker-init/**/*
    bazel: {}
    release:
      service_name: nvcf-worker-init
      legacy_tag_prefix: nvcf-worker-init-v
      staging:
        images:
          - name: nvcf-worker-init-oss
            bazel_image_target: //cmd:image_index
      slack_channel: C08S6KLCEJH
  - id: worker-utils
    path: src/compute-plane-services/worker-utils
    change_paths:
      - src/compute-plane-services/worker-utils/go.mod
      - src/compute-plane-services/worker-utils/go.sum
      - src/compute-plane-services/worker-utils/**/*
    bazel: {}
    release:
      service_name: nvcf-worker-utils
      legacy_tag_prefix: nvcf-worker-utils-v
      staging:
        images:
          - name: nvcf-worker-utils-oss
            bazel_image_target: //cmd:image_index
      slack_channel: C08S6KLCEJH
  - id: worker-llm-credentials
    path: src/compute-plane-services/worker-llm-credentials
    change_paths:
      - src/compute-plane-services/worker-llm-credentials/go.mod
      - src/compute-plane-services/worker-llm-credentials/go.sum
      - src/compute-plane-services/worker-llm-credentials/**/*
    bazel: {}
    release:
      service_name: nvcf-worker-llm-credentials
      legacy_tag_prefix: nvcf-worker-llm-credentials-v
      staging:
        images:
          - name: nvcf-worker-llm-credentials-oss
            bazel_image_target: //cmd:image_index
      slack_channel: C08S6KLCEJH
  - id: ncp-local-credential-provider
    path: tools/ncp-local-cluster/credential-provider-go
    profile: go-tool
    go_work: false
    change_paths:
      - tools/ncp-local-cluster/credential-provider-go/go.mod
      - tools/ncp-local-cluster/credential-provider-go/go.sum
      - tools/ncp-local-cluster/credential-provider-go/cmd/**/*
      - tools/ncp-local-cluster/credential-provider-go/internal/**/*
      - tools/ncp-local-cluster/credential-provider-go/hack/**/*
  - id: docs
    path: .
    profile: docs
    skip_shared_change_paths: true
    skip_global_triggers: true
    change_paths:
      - docs/**/*
      - docs/version-catalog/**/*
      - fern/**/*
      - tools/docs-version-sync/**/*
      - .rumdl.toml
  - id: nvcf-cli
    path: .
    profile: nvcf-cli
    # archive_release opts the CLI into auto-versioned semantic-release
    # without an image-push job: the cut path-scoped CLI tag triggers
    # the CLI's own child pipeline (tools/ci/nvcf-cli.yml), which builds the
    # multi-platform binaries, uploads archives to the GitLab generic
    # package registry, and pushes the bundle to NGC resource registry
    # (ncp-dev / staging / test-sandbox). subtree overrides the umbrella-
    # root path: above so semantic-release-monorepo scopes commits to
    # the CLI subtree (path: . is needed by the nvcf-cli profile because
    # ./tools/ci/check-agent-skill-generated resolves from umbrella root).
    release:
      service_name: nvcf-cli
      legacy_tag_prefix: nvcf-cli-v
      archive_release:
        subtree: src/clis/nvcf-cli
      slack_channel: C08S6KLCEJH
    change_paths:
      - src/clis/nvcf-cli/**/*
      - ai-tooling/user/skills/nvcf-self-managed-cli/**/*
      - ai-tooling/user/skills/nvcf-self-managed-installation/**/*
      - tools/ci/nvcf-cli.yml
      - tools/ci/check-agent-skill-generated
  # nvcf-compute-plane-stack is the helmfile stack distributed to
  # operators for GPU cluster onboarding. archive_release opts it into
  # VERSION-file-backed release tagging without an image-push job: the cut
  # deploy/stacks/nvcf-compute-plane/v<X> tag triggers the stack's own child
  # pipeline (tools/ci/nvcf-compute-plane.yml), which runs `make dist`,
  # tarballs the output, uploads the archive to the GitLab generic
  # package registry, and pushes the bundle to NGC resource registry
  # (nvcf-ncp-staging / test-sandbox / ncp-dev). The nvcf-cli resolves
  # the stack via oci://nvcr.io/.../nvcf-compute-plane-stack:<version>.
  - id: nvcf-compute-plane-stack
    path: deploy/stacks/nvcf-compute-plane
    release:
      service_name: nvcf-compute-plane-stack
      legacy_tag_prefix: nvcf-compute-plane-stack-v
      version_file: VERSION
      dev_prerelease: true
      archive_release:
        subtree: deploy/stacks/nvcf-compute-plane
      slack_channel: C08S6KLCEJH
    checks:
      - id: yamllint
        type: shell
        image: dockerhub.nvidia.com/pipelinecomponents/yamllint:0.35.9
        skip_workspace_setup: true
        command: >-
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}, empty-lines: disable}}" environments/*.yaml
      - id: template
        type: shell
        image: ghcr.io/helmfile/helmfile:v1.1.0
        skip_workspace_setup: true
        command: >-
          apk add --no-cache make bash &&
          mkdir -p registration &&
          cp testdata/registration/ncp-local-register-values.yaml registration/ &&
          cp testdata/environments/local.yaml environments/ &&
          sed -i 's|chart: nvcf/helm-nvca-operator|chart: /builds/nvcf/nvcf/deploy/helm/nvca-operator/nvca-operator|g' helmfile.d/02-nvca.yaml.gotmpl &&
          DEV_MODE=1 make template HELMFILE_ENV=local CLUSTER_NAME=ncp-local
      - id: dist
        type: shell
        image: dockerhub.nvidia.com/alpine:3.20
        skip_workspace_setup: true
        command: apk add --no-cache make bash && make dist
    change_paths:
      - deploy/stacks/nvcf-compute-plane/**/*
      - tools/ci/nvcf-compute-plane.yml
  # nvcf-observability-stack has a working install-mode path (self-managed-cp
  # overlay) but publishes no release artifact until the consuming stack lands.
  # Validates its local charts and both Helmfile envs.
  - id: nvcf-observability-stack
    path: deploy/stacks/observability
    checks:
      - id: helm-lint
        type: shell
        image: ghcr.io/helmfile/helmfile:v1.1.0
        skip_workspace_setup: true
        command: >-
          helm lint charts/nvcf-otel-collector &&
          helm lint charts/nvcf-default-monitors
      - id: helm-template
        type: shell
        image: ghcr.io/helmfile/helmfile:v1.1.0
        skip_workspace_setup: true
        command: >-
          helm template control-plane-collector charts/nvcf-otel-collector
          --namespace monitoring
          --set 'imagePullSecrets[0].name=nvcf-registry' &&
          helm template default-monitors charts/nvcf-default-monitors
          --namespace monitoring
          --set dcgm.enabled=true
      - id: helmfile-template-local
        type: shell
        image: ghcr.io/helmfile/helmfile:v1.1.0
        skip_workspace_setup: true
        command: >-
          HELMFILE_ENV=local helmfile --environment default
          --allow-no-matching-release template
      - id: helmfile-template-install
        type: shell
        image: ghcr.io/helmfile/helmfile:v1.1.0
        skip_workspace_setup: true
        # Renders the install-mode overlay, scoped to the local collector chart
        # (CI can't pull the remote OCI charts -- no nvcr creds). Still exercises
        # the full gotmpl: mode gating and the VM endpoint guard run at parse time.
        command: >-
          HELMFILE_ENV=self-managed-cp helmfile --environment default
          --allow-no-matching-release --selector name=control-plane-collector
          template
  # grpc-proxy is a native Bazel-built subtree. Its `bazel:` block
  # emits grpc-proxy-bazel-build-test into the generated subproject-validations
  # child pipeline. It also opts into the umbrella's auto-versioned
  # release pipeline. The
  # `release:` block declares the service name, the per-registry image
  # push targets, and the auth source for each. The generator emits
  # `compute-next-release-version-grpc-proxy`,
  # `semantic-release-grpc-proxy`, and `grpc-proxy-image-push` jobs
  # into `tools/ci/generated-release-jobs.yml`, which the umbrella
  # `.gitlab-ci.yml` includes.
  #
  # Adding a new opt-in native service is a YAML entry here. Add
  # `bazel: {}` for build/test validation, add `release:` when the
  # service also publishes artifacts, then regenerate
  # tools/ci/generated-release-jobs.yml if release changed:
  # `go run -C tools/generate-subproject-ci . --config ../ci/subproject-validations.yaml --release-output ../ci/generated-release-jobs.yml`.
  # The validation child pipeline is generated at CI runtime and is
  # not committed. The check-release-pipeline-generated CI job verifies
  # the committed release output stays in sync.
  - id: grpc-proxy
    path: src/invocation-plane-services/grpc-proxy
    # grpc-proxy releases before the monorepo cutover were tagged v* in the
    # upstream repo, so those tags and their history are not reachable from
    # nvcf/nvcf (upstream v1.28.6 and earlier; the umbrella continues the
    # line as nvcf-grpc-proxy-v1.28.7+). Point the changelog browser at the
    # upstream so older versions render inline. Consumed only by
    # tools/changelog-site; the CI generator ignores this key.
    changelog:
      upstream_repo: https://gitlab-master.nvidia.com/nvcf/nvcf-grpc-proxy.git
      tag_prefix: v
      umbrella_tag_prefix: nvcf-grpc-proxy-v
    change_paths:
      - src/invocation-plane-services/grpc-proxy/**/*
    bazel:
      dind: true
    release:
      service_name: nvcf-grpc-proxy
      legacy_tag_prefix: nvcf-grpc-proxy-v
      # Tag pipelines build the multi-arch image index, push to a
      # staging registry, emit release-manifest.json, and trigger the
      # private release repo which copies the staging digest by
      # reference to nvcf-staging + nvcf-production (both via
      # NGC_NVCF_COMPONENTS_KEY) and ncp-dev (NGC_DEVOPS_API_KEY).
      # NVCR destinations and NGC auth are owned by the private repo,
      # not here. Drops the legacy nvcr.io/nvidian/kaze destination;
      # nvcf-staging + nvcf-production cover the same audience under
      # the unified components key.
      staging:
        images:
          - name: nvcf-grpc-proxy
            bazel_image_target: //:image_index
      slack_channel: C08S6KLCEJH
  # grpc-proxy Helm chart subtree. Imported from
  # ncp/nvcf/application-services/grpc-proxy-colocated-deploy in !440.
  # Chart proper is at deploy/helm/grpc-proxy/grpc-proxy.
  # The chart releases independently of the grpc-proxy binary above:
  # commits touching only helm/ bump this chart entry, commits touching
  # the Rust code bump the binary entry, commits touching both bump
  # both. service_name matches the chart's Chart.yaml `name:`
  # field (helm-nvcf-grpc-proxy) so the pushed OCI artifact path stays
  # aligned with the packaged chart.
  - id: grpc-proxy-helm
    path: deploy/helm/grpc-proxy
    # Pre-cutover releases are tagged in the upstream repo and are not
    # reachable from nvcf/nvcf; merge them into the changelog page
    # (dual-source, same pattern as nvca). Consumed only by
    # tools/changelog-site; the CI generator ignores this key.
    changelog:
      upstream_repo: https://gitlab-master.nvidia.com/ncp/nvcf/application-services/grpc-proxy-colocated-deploy.git
      tag_prefix: ""
      umbrella_tag_prefix: helm-nvcf-grpc-proxy-v
    change_paths:
      - deploy/helm/grpc-proxy/**/*
      - tools/ci/helm-validate-values/grpc-proxy.yaml
    helm_validate:
      values_file: tools/ci/helm-validate-values/grpc-proxy.yaml
    release:
      service_name: helm-nvcf-grpc-proxy
      legacy_tag_prefix: helm-nvcf-grpc-proxy-v
      helm:
        # Relative to subtree root (`path:`). The generator joins
        # `${path}/${chart_path}` -> deploy/helm/grpc-proxy/grpc-proxy.
        chart_path: grpc-proxy
        lint: true
        push_targets:
          - name: ncp-dev
            ngc_path: 0651155215864979/ncp-dev
            auth:
              type: vault_ncp_dev
      slack_channel: C08S6KLCEJH
  # ratelimiter is a native Bazel-built subtree. Single image-push to
  # nvcr.io/nvidian/kaze/nvcf-ratelimiter via the legacy vault key
  # `nvcf-rate-limiter` (note: with hyphen, matches $CI_PROJECT_TITLE
  # on the upstream — not $CI_PROJECT_NAME). Anchor tag in the umbrella
  # is `nvcf-ratelimiter-v1.12.3` (last pre-cutover upstream release).
  - id: ratelimiter
    path: src/invocation-plane-services/ratelimiter
    # Pre-cutover releases are tagged in the upstream repo and are not
    # reachable from nvcf/nvcf; merge them into the changelog page
    # (dual-source, same pattern as nvca). Consumed only by
    # tools/changelog-site; the CI generator ignores this key.
    changelog:
      upstream_repo: https://gitlab-master.nvidia.com/nvcf/nvcf-ratelimiter.git
      tag_prefix: v
      umbrella_tag_prefix: nvcf-ratelimiter-v
    change_paths:
      - src/invocation-plane-services/ratelimiter/**/*
    bazel: {}
    release:
      service_name: nvcf-ratelimiter
      legacy_tag_prefix: nvcf-ratelimiter-v
      # Tag pipelines build the multi-arch image index, push to a
      # staging registry, emit release-manifest.json, and trigger the
      # private release repo which copies the staging digest by
      # reference to nvcf-staging + nvcf-production (both via
      # NGC_NVCF_COMPONENTS_KEY) and ncp-dev (NGC_DEVOPS_API_KEY).
      # NVCR destinations and NGC auth are owned by that private repo,
      # not here.
      staging:
        images:
          - name: nvcf-ratelimiter
            bazel_image_target: //cmd:image_index
      slack_channel: C08S6KLCEJH
  # ratelimiter Helm chart subtree. Pre-cutover the upstream
  # nvcf-ratelimiter-colocated-deploy repo used the
  # ncp-service-helm-release@1.7.0 cds-component to package + publish
  # to nvcr.io/0651155215864979/ncp-dev via the shared NCP SERVICE_KEY.
  # Anchor tag helm-nvcf-rate-limiter-v1.0.3 matches the upstream's
  # last released tag.
  - id: ratelimiter-helm
    path: deploy/helm/ratelimiter
    # Pre-cutover releases are tagged in the upstream repo and are not
    # reachable from nvcf/nvcf; merge them into the changelog page
    # (dual-source, same pattern as nvca). Consumed only by
    # tools/changelog-site; the CI generator ignores this key.
    changelog:
      upstream_repo: https://gitlab-master.nvidia.com/ncp/nvcf/application-services/nvcf-ratelimiter-colocated-deploy.git
      tag_prefix: ""
      umbrella_tag_prefix: helm-nvcf-rate-limiter-v
    change_paths:
      - deploy/helm/ratelimiter/**/*
      - tools/ci/helm-validate-values/ratelimiter.yaml
    helm_validate:
      values_file: tools/ci/helm-validate-values/ratelimiter.yaml
    release:
      service_name: helm-nvcf-rate-limiter
      legacy_tag_prefix: helm-nvcf-rate-limiter-v
      helm:
        chart_path: nvcf-ratelimiter
        lint: true
        push_targets:
          - name: ncp-dev
            ngc_path: 0651155215864979/ncp-dev
            auth:
              type: vault_ncp_dev
      slack_channel: C08S6KLCEJH
  # http-invocation is a native Bazel-built subtree. Publishes to
  # nvcr.io/0544956542906249/nvcf-dev/nvcf-invocation-service (legacy
  # vault key `nvcf-invocation-service`) plus a new ncp-dev tenant
  # push under nvcr.io/0651155215864979/ncp-dev/nvcf-invocation-service
  # (NGC_DEVOPS_API_KEY CI variable). Anchor tag in the umbrella is
  # `nvcf-invocation-service-v0.5.8` (matches upstream's last
  # pre-cutover release).
  - id: http-invocation
    path: src/invocation-plane-services/http-invocation
    # Pre-cutover releases are tagged in the upstream repo and are not
    # reachable from nvcf/nvcf; merge them into the changelog page
    # (dual-source, same pattern as nvca). Consumed only by
    # tools/changelog-site; the CI generator ignores this key.
    changelog:
      upstream_repo: https://gitlab-master.nvidia.com/nvcf/nvcf-invocation-service.git
      tag_prefix: ""
      umbrella_tag_prefix: nvcf-invocation-service-v
    change_paths:
      - src/invocation-plane-services/http-invocation/**/*
    bazel: {}
    release:
      service_name: nvcf-invocation-service
      legacy_tag_prefix: nvcf-invocation-service-v
      # Tag pipelines build the multi-arch image index, push to a
      # staging registry, emit release-manifest.json, and trigger the
      # private release repo which copies the staging digest by
      # reference to nvcr.io/0544956542906249/nvcf-dev/nvcf-invocation-service
      # (legacy nvcf-dev tenant) and ncp-dev. NVCR destinations and
      # NGC auth are owned by the private repo, not here.
      staging:
        images:
          - name: nvcf-invocation-service
            bazel_image_target: //crates/server:image_index
      slack_channel: C08S6KLCEJH
  # HTTP invocation Helm chart subtree. The chart was moved out of the
  # Rust image-source subtree so chart-only edits validate independently.
  - id: http-invocation-helm
    path: deploy/helm/http-invocation
    change_paths:
      - deploy/helm/http-invocation/**/*
    helm_validate:
      chart_path: "."
  # stargate is intentionally NOT wired for umbrella Bazel build here.
  # stargate is upstream-authoritative. Its image build + push lives in
  # the private release repo (nvcf-internal build_stargate_images.sh), which
  # builds the three runtime images from the Dockerfile and pushes them to

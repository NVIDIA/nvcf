  # nvcf-image-credential-helper is a native Bazel-built subtree
  # (imports.yaml authoritative_source: native). Image-only release.
  # Publishes the Go binary OCI image to three nvcr.io destinations:
  #
  #   1. nvcr.io/0544956542906249/nvcf-staging/nvcf-image-credential-helper
  #      (vault key nvcf-components -- the NGC self-managed org)
  #   2. nvcr.io/0544956542906249/nvcf-production/nvcf-image-credential-helper
  #      (same vault key; production scope under same org)
  #   3. nvcr.io/0651155215864979/ncp-dev/nvcf-image-credential-helper
  #      (universal ncp-dev target, NGC_DEVOPS_API_KEY)
  #
  # Release tags use the GitHub First repo-relative format:
  # src/compute-plane-services/image-credential-helper/vX.Y.Z
  - id: image-credential-helper
    path: src/compute-plane-services/image-credential-helper
    # Pre-cutover releases are tagged in the upstream repo and are not
    # reachable from nvcf/nvcf; merge them into the changelog page
    # (dual-source, same pattern as nvca). Consumed only by
    # tools/changelog-site; the CI generator ignores this key.
    changelog:
      upstream_repo: https://gitlab-master.nvidia.com/egx/intelligent-infra/nvcf-image-credential-helper.git
      tag_prefix: ""
      umbrella_tag_prefix: nvcf-image-credential-helper-v
    change_paths:
      - src/compute-plane-services/image-credential-helper/**/*
    bazel: {}
    release:
      service_name: nvcf-image-credential-helper
      legacy_tag_prefix: nvcf-image-credential-helper-v
      # Tag pipelines build the multi-arch image index, push to a
      # staging registry, emit release-manifest.json, and trigger the
      # private release repo which copies the staging digest by
      # reference to nvcf-staging + nvcf-production (both via
      # NGC_NVCF_COMPONENTS_KEY) and ncp-dev (NGC_DEVOPS_API_KEY).
      # NVCR destinations and NGC auth are owned by that private repo,
      # never by this OSS tree.
      staging:
        images:
          - name: nvcf-image-credential-helper
            bazel_image_target: //cmd/image-credential-helper:image_index
      slack_channel: C08S6KLCEJH
  # See the worker-init/utils/llm-credentials block above: GitHub-first
  # staging release, promoted to NVCR by the private release repo.
  - id: worker-task
    path: src/compute-plane-services/worker-task
    change_paths:
      - src/compute-plane-services/worker-task/go.mod
      - src/compute-plane-services/worker-task/go.sum
      - src/compute-plane-services/worker-task/**/*
    bazel: {}
    release:
      service_name: nvcf-worker-task
      legacy_tag_prefix: nvcf-worker-task-v
      staging:
        images:
          - name: nvcf-worker-task-oss
            bazel_image_target: //cmd:image_index
      slack_channel: C08S6KLCEJH
  # nvcf-ui is a native Bazel-built subtree (imports.yaml authoritative_source: native).
  # Ships a Go BFF + control-plane binary plus a React/Vite SPA in a single distroless
  # OCI image via the go_web_oci_image macro. The Helm chart lives in deploy/helm/nvcf-ui.
  # Not ready for OSS mirroring; no .oss-allowlist added.
  - id: nvcf-ui
    path: src/control-plane-services/nvcf-ui
    change_paths:
      - src/control-plane-services/nvcf-ui/**/*
      - deploy/helm/nvcf-ui/**/*
    checks:
      - id: lint
        type: shell
        image: dockerhub.nvidia.com/node:24-alpine
        skip_workspace_setup: true
        command: >-
          corepack enable &&
          cd ui &&
          pnpm install --frozen-lockfile &&
          pnpm check
      - id: typecheck
        type: shell
        image: dockerhub.nvidia.com/node:24-alpine
        skip_workspace_setup: true
        command: >-
          corepack enable &&
          cd ui &&
          pnpm install --frozen-lockfile &&
          pnpm tsc --noEmit
    bazel:
      dind: true
    release:
      service_name: nvcf-ui
      tag_prefix: v
      staging:
        images:
          - name: nvcf-ui
            bazel_image_target: //:image_index
      helm:
        chart_path: ../../../deploy/helm/nvcf-ui
        push_targets:
          - name: nvcf-internal
            ngc_path: "0544956542906249"
            ngc_key_var: NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL
      slack_channel: C08S6KLCEJH
  # nvcf-ui Helm chart subtree. Chart-only edits validate independently.
  - id: nvcf-ui-helm
    path: deploy/helm/nvcf-ui
    change_paths:
      - deploy/helm/nvcf-ui/**/*
      - tools/ci/helm-validate-values/nvcf-ui.yaml
    helm_validate:
      chart_path: "."
      values_file: tools/ci/helm-validate-values/nvcf-ui.yaml

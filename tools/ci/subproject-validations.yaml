  # manifest push (template added to the generator alongside this
  # entry). Tags use each migration subtree path so versions don't
  # collide with other services.
  - id: cassandra-migrations
    path: migrations/cassandra
    # Pre-cutover releases are tagged in the upstream repo and are not
    # reachable from nvcf/nvcf; merge them into the changelog page
    # (dual-source, same pattern as nvca). Consumed only by
    # tools/changelog-site; the CI generator ignores this key.
    changelog:
      upstream_repo: https://gitlab-master.nvidia.com/ncp/nvcf/infrastructure-services/cassandra/nvcf-cassandra-migrations.git
      tag_prefix: ""
      umbrella_tag_prefix: nvcf-cassandra-migrations-v
    change_paths:
      - migrations/cassandra/**/*
    release:
      service_name: nvcf-cassandra-migrations
      legacy_tag_prefix: nvcf-cassandra-migrations-v
      dockerfile:
        # Internal Dockerfile variant; the public OSS mirror gets a
        # sanitized copy via nvossctl, but builds happen from the
        # internal one which adds the proprietary `migrate` binary.
        dockerfile: Dockerfile.internal
        image_name: nvcf-cassandra-migrations
      slack_channel: C08S6KLCEJH
  - id: openbao-migrations
    path: migrations/openbao
    # Pre-cutover releases are tagged in the upstream repo and are not

.compute-next-release-version-service:
  stage: init
  image: ${CDS_TOOLS_IMAGE}
  tags: [eks, nvcf-cds, prod]
  # Safe to interrupt: this is a read-only dry-run. Every default-branch
  # pipeline now sweeps all release services and lets compute-next decide
  # whether a service has unreleased in-scope commits. If a path-gated
  # release pipeline is canceled or hits semantic-release's stale HEAD guard,
  # the next main pipeline recomputes the pending service instead of relying
  # on that next commit to touch the same subtree.
  interruptible: true
  # No vault block: compute-next is a dry-run that derives NEXT_VERSION
  # from local git history (commit-analyzer + release-notes-generator).
  # The legacy @semantic-release/gitlab plugin made dry-run authenticate
  # against the protected default branch via verifyAuth git-push, which
  # never works with CI_JOB_TOKEN and required the long-lived
  # kv/gitlab/semantic-release/gl-token PAT. We dropped that plugin in
  # the pivot to @semantic-release/exec + release-cli; dry-run no longer
  # touches the remote.
  before_script:
    - cd "$SUBTREE"
    - |
      RELEASE_TAG_PREFIX="${RELEASE_TAG_PREFIX:-${SERVICE_NAME}-v}"
      RELEASE_TAG_FORMAT="${RELEASE_TAG_PREFIX}\${version}"
      RELEASE_TAG_GLOB="${RELEASE_TAG_PREFIX}*"
      RELEASE_BRANCH_PREFIX="${RELEASE_BRANCH_PREFIX:-release-${RELEASE_TAG_PREFIX}}"
      RELEASE_LEGACY_TAG_PREFIX="${RELEASE_LEGACY_TAG_PREFIX:-}"
      export RELEASE_TAG_FORMAT RELEASE_TAG_PREFIX RELEASE_TAG_GLOB RELEASE_BRANCH_PREFIX RELEASE_LEGACY_TAG_PREFIX
      echo "[release-tags] format=${RELEASE_TAG_FORMAT} prefix=${RELEASE_TAG_PREFIX}"
      if [ -n "${RELEASE_LEGACY_TAG_PREFIX}" ]; then
        echo "[release-tags] legacy-prefix=${RELEASE_LEGACY_TAG_PREFIX}"
      fi
      echo "[release-branches] prefix=${RELEASE_BRANCH_PREFIX}"
    - |
      cat > "${CI_PROJECT_DIR}/release-tag-compat.sh" <<'SCRIPT_EOF'
      release_configure_tag_prefixes() {
        release_tag_prefixes=("${RELEASE_TAG_PREFIX}")
        if [ -n "${RELEASE_LEGACY_TAG_PREFIX:-}" ] && [ "${RELEASE_LEGACY_TAG_PREFIX}" != "${RELEASE_TAG_PREFIX}" ]; then
          release_tag_prefixes+=("${RELEASE_LEGACY_TAG_PREFIX}")
        fi
      }

      release_version_from_tag() {
        local tag="$1" prefix
        for prefix in "${release_tag_prefixes[@]}"; do
          if [[ "${tag}" == "${prefix}"* ]]; then
            printf '%s\n' "${tag#"$prefix"}"
            return 0
          fi
        done
        return 1
      }

      release_tags_matching_suffix() {
        local suffix="${1:-*}" prefix
        for prefix in "${release_tag_prefixes[@]}"; do
          git -C "${CI_PROJECT_DIR}" tag -l "${prefix}${suffix}"
        done | sort -u
      }

      release_latest_tag_for_prefix() {
        local prefix="$1" tag version
        while IFS= read -r tag; do
          [ -n "${tag}" ] || continue
          version="${tag#"$prefix"}"
          printf '%s %s\n' "${version}" "${tag}"
        done < <(git -C "${CI_PROJECT_DIR}" tag -l "${prefix}*") | sort -k1,1V | tail -1 | cut -d' ' -f2-
      }

      release_latest_tag() {
        local tag version
        while IFS= read -r tag; do
          [ -n "${tag}" ] || continue
          version="$(release_version_from_tag "${tag}" || true)"
          [ -n "${version}" ] || continue
          printf '%s %s\n' "${version}" "${tag}"
        done < <(release_tags_matching_suffix '*') | sort -k1,1V | tail -1 | cut -d' ' -f2-
      }

      release_tag_for_version() {
        local version="$1" prefix tag
        for prefix in "${release_tag_prefixes[@]}"; do
          tag="${prefix}${version}"
          if git -C "${CI_PROJECT_DIR}" rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf '%s\n' "${tag}"
            return 0
          fi
        done
        return 1
      }

      release_synthesize_current_prefix_anchor() {
        if [ -z "${RELEASE_LEGACY_TAG_PREFIX:-}" ] || [ "${RELEASE_LEGACY_TAG_PREFIX}" = "${RELEASE_TAG_PREFIX}" ]; then
          return 0
        fi
        if [ -n "$(release_latest_tag_for_prefix "${RELEASE_TAG_PREFIX}" || true)" ]; then
          return 0
        fi
        local legacy_tag version anchor sha
        legacy_tag="$(release_latest_tag_for_prefix "${RELEASE_LEGACY_TAG_PREFIX}" || true)"
        [ -n "${legacy_tag}" ] || return 0
        version="${legacy_tag#"$RELEASE_LEGACY_TAG_PREFIX"}"
        anchor="${RELEASE_TAG_PREFIX}${version}"
        if git -C "${CI_PROJECT_DIR}" rev-parse -q --verify "refs/tags/${anchor}" >/dev/null; then
          return 0
        fi
        sha="$(git -C "${CI_PROJECT_DIR}" rev-list -n 1 "${legacy_tag}")"
        git -C "${CI_PROJECT_DIR}" tag "${anchor}" "${sha}"
        echo "[release-tags] synthesized local compatibility anchor ${anchor} -> ${legacy_tag} (${sha})"
      }
      SCRIPT_EOF
      . "${CI_PROJECT_DIR}/release-tag-compat.sh"
      release_configure_tag_prefixes
      release_synthesize_current_prefix_anchor
    - |
      # Default-branch release jobs are scheduled for every service so a
      # later unrelated main pipeline can recover a release that a stale
      # path-gated pipeline skipped. Keep that sweep cheap: if there are no
      # real files under this subtree since the service's last tag, write the
      # dotenv now and exit before npm install / semantic-release setup. This
      # guard also applies to VERSION-file dev prerelease services so unrelated
      # main commits do not mint the next dev tag.
      if [ -z "${CI_COMMIT_TAG:-}" ] && \
         [ -z "${CI_MERGE_REQUEST_IID:-}" ] && \
         [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-}" ]; then
        GUARD_LAST_TAG=$(release_latest_tag || true)
        GUARD_RANGE="HEAD"
        [ -n "${GUARD_LAST_TAG}" ] && GUARD_RANGE="${GUARD_LAST_TAG}..HEAD"

        set +e
        GUARD_RAW=$(git -C "${CI_PROJECT_DIR}" log "${GUARD_RANGE}" --name-only --pretty=format: -- "${SUBTREE}" 2>/dev/null)
        GUARD_STATUS=$?
        set -e

        if [ "${GUARD_STATUS}" -eq 0 ]; then
          GUARD_ALL=$(printf '%s\n' "${GUARD_RAW}" | grep -v '^$' | sort -u || true)
          GUARD_REAL=$(printf '%s\n' "${GUARD_ALL}" | grep -vE '(^|/)(MODULE\.bazel\.lock|\.oss-allowlist)$' | grep -v '^$' || true)
          if [ -z "${GUARD_ALL}" ] || [ -z "${GUARD_REAL}" ]; then
            NEXT_VERSION="$(release_version_from_tag "${GUARD_LAST_TAG}" || true)"
            [ -n "${NEXT_VERSION}" ] || NEXT_VERSION="0.0.0"
            SKIP_SEMANTIC_RELEASE=true
            if [ -z "${GUARD_ALL}" ]; then
              echo "[compute-next] no commits under ${SUBTREE} since ${GUARD_LAST_TAG:-<root>}; downstream publishes will skip"
            else
              echo "[compute-next] only generated/mechanical files under ${SUBTREE} changed since ${GUARD_LAST_TAG:-<root>}; downstream publishes will skip"
            fi
            {
              echo "NEXT_VERSION=${NEXT_VERSION}"
              echo "SKIP_SEMANTIC_RELEASE=${SKIP_SEMANTIC_RELEASE}"
            } > "${CI_PROJECT_DIR}/release.env"
            exit 0
          fi
        else
          echo "[compute-next] could not precheck ${SUBTREE} changes for ${GUARD_RANGE}; falling through to semantic-release"
        fi
      fi
    - |
      if [ -n "${RELEASE_VERSION_FILE:-}" ] || [ "${RELEASE_DEV_PRERELEASE:-}" = "true" ]; then
        echo "[compute-next] version-file release path; skipping semantic-release package setup"
      else
        cat > package.json <<EOF
      {
        "name": "${SERVICE_NAME}",
        "version": "1.0.0",
        "private": true,
        "devDependencies": {
          "semantic-release": "17.4.4",
          "semantic-release-monorepo": "^7.0.0"
        }
      }
      EOF
        cat package.json
      fi
    - |
      if [ -n "${RELEASE_VERSION_FILE:-}" ] || [ "${RELEASE_DEV_PRERELEASE:-}" = "true" ]; then
        echo "[compute-next] version-file release path; skipping semantic-release config setup"
      else
        # semantic-release-monorepo (v7.x) is a SHAREABLE CONFIG, not a
        # CLI. It exposes no bin entry; using it via the extends field
        # is the only supported pattern. semantic-release reads extends
        # and merges the shareable config (which adds path-scoped
        # commit filtering based on package.json directory).
        cat > .releaserc.json <<EOF
      {
        "extends": "semantic-release-monorepo",
        "tagFormat": "${RELEASE_TAG_FORMAT}",
        "branches": ["main"],
        "plugins": [
          ["@semantic-release/commit-analyzer", {
            "releaseRules": [
              {"type": "feat", "release": "minor"},
              {"type": "fix", "release": "patch"},
              {"type": "perf", "release": "patch"},
              {"type": "chore", "release": false},
              {"type": "ci", "release": false},
              {"type": "docs", "release": false},
              {"type": "style", "release": false},
              {"type": "refactor", "release": false},
              {"type": "test", "release": false},
              {"type": "build", "release": false}
            ]
          }],
          "@semantic-release/release-notes-generator"
        ]
      }
      EOF
        cat .releaserc.json
      fi
    - |
      if [ -n "${RELEASE_VERSION_FILE:-}" ] || [ "${RELEASE_DEV_PRERELEASE:-}" = "true" ]; then
        echo "[compute-next] version-file release path; skipping npm install"
      else
        npm install
      fi
  script:
    - |
      set -o pipefail
      SEMREL_EXIT=0
      # Release-worthiness guard. A cross-cutting commit (e.g. a Bazel
      # repin refreshing MODULE.bazel.lock, or an .oss-allowlist flip) can
      # incidentally touch this service's subtree without changing the
      # service. semantic-release-monorepo scopes commits by directory and
      # would still bump the version, so detect the case where the only
      # in-scope changes since this service's last tag are generated /
      # mechanical files and treat it as "no relevant changes" -- the
      # existing default-branch skip path then sets SKIP_SEMANTIC_RELEASE=
      # true and downstream publishes no-op. Tag and MR pipelines are left
      # untouched.
      RELEASE_GENERATED_ONLY=false
      if [ -z "${CI_COMMIT_TAG:-}" ] && [ -z "${CI_MERGE_REQUEST_IID:-}" ] && [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-}" ]; then
        GUARD_LAST_TAG=$(release_latest_tag || true)
        GUARD_RANGE="HEAD"
        [ -n "${GUARD_LAST_TAG}" ] && GUARD_RANGE="${GUARD_LAST_TAG}..HEAD"
        GUARD_ALL=$(git -C "${CI_PROJECT_DIR}" log "${GUARD_RANGE}" --name-only --pretty=format: -- "${SUBTREE}" 2>/dev/null | grep -v '^$' | sort -u || true)
        GUARD_REAL=$(printf '%s\n' "${GUARD_ALL}" | grep -vE '(^|/)(MODULE\.bazel\.lock|\.oss-allowlist)$' | grep -v '^$' || true)
        if [ -n "${GUARD_ALL}" ] && [ -z "${GUARD_REAL}" ]; then
          RELEASE_GENERATED_ONLY=true
        fi
      fi
      if [ "${RELEASE_GENERATED_ONLY}" = "true" ]; then
        echo "[compute-next] only generated/mechanical files (MODULE.bazel.lock, .oss-allowlist) changed under ${SUBTREE} since ${GUARD_LAST_TAG:-<root>}; treating as no relevant changes"
        echo "no relevant changes (generated files only)" > semantic-release-output.log
      elif [ "${RELEASE_DEV_PRERELEASE:-}" = "true" ]; then
        echo "[compute-next] release.dev_prerelease=true; deriving dev prerelease tag from ${RELEASE_VERSION_FILE}"
        : > semantic-release-output.log
      elif [ -n "${RELEASE_VERSION_FILE:-}" ]; then
        echo "[compute-next] release.version_file=${RELEASE_VERSION_FILE}; skipping semantic-release dry-run because the version file is authoritative"
        : > semantic-release-output.log
      else
        echo -e "\e[0Ksection_start:`date +%s`:semantic_release[collapsed=true]\r\e[0KSemantic-release debug output..."
        npx semantic-release --dry-run --no-ci --debug 2>&1 | tee semantic-release-output.log || SEMREL_EXIT=$?
        echo -e "\e[0Ksection_end:`date +%s`:semantic_release\r\e[0K"
        echo "[compute-next] semantic-release dry-run exit=${SEMREL_EXIT}"
      fi
    - |
      # Pre-Bazel MR-preview images consumed the mr.<iid>-<sha> tag
      # shape from cds/cicd-pipelines set_image_tag; default-branch
      # publishes normally use the bare semver from semantic-release.
      # Services that declare release.version_file opt out of
      # semantic-release version calculation: their source-controlled
      # version file is the release source of truth.
      if [ "${RELEASE_DEV_PRERELEASE:-}" = "true" ]; then
        if [ -z "${RELEASE_VERSION_FILE:-}" ]; then
          echo "[compute-next] ERROR: release.dev_prerelease requires release.version_file" >&2
          exit 1
        fi
        if [ ! -f "${RELEASE_VERSION_FILE}" ]; then
          echo "[compute-next] ERROR: release.version_file=${RELEASE_VERSION_FILE} does not exist under ${SUBTREE}" >&2
          exit 1
        fi
        RELEASE_DEV_PRERELEASE_BASE_VERSION="$(tr -d '[:space:]' < "${RELEASE_VERSION_FILE}")"
        RELEASE_DEV_PRERELEASE_BASE_VERSION="${RELEASE_DEV_PRERELEASE_BASE_VERSION#v}"
        if [ -z "${RELEASE_DEV_PRERELEASE_BASE_VERSION}" ]; then
          echo "[compute-next] ERROR: release.version_file=${RELEASE_VERSION_FILE} is empty" >&2
          exit 1
        fi
        if ! printf '%s\n' "${RELEASE_DEV_PRERELEASE_BASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "[compute-next] ERROR: release.version_file=${RELEASE_VERSION_FILE} must contain X.Y.Z, got ${RELEASE_DEV_PRERELEASE_BASE_VERSION}" >&2
          exit 1
        fi
        if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
          NEXT_VERSION="mr.${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
          SKIP_SEMANTIC_RELEASE=true
        elif [ -n "${CI_COMMIT_TAG:-}" ]; then
          NEXT_VERSION="$(release_version_from_tag "${CI_COMMIT_TAG}" || true)"
          if [ -z "${NEXT_VERSION}" ]; then
            echo "[compute-next] ERROR: ${CI_COMMIT_TAG} does not match configured release tag prefixes" >&2
            exit 1
          fi
          SKIP_SEMANTIC_RELEASE=false
        elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          git fetch --tags --quiet origin
          LAST_DEV=-1
          for tag in $(release_tags_matching_suffix "${RELEASE_DEV_PRERELEASE_BASE_VERSION}-dev.*"); do
            suffix="$(release_version_from_tag "${tag}")"
            suffix="${suffix#${RELEASE_DEV_PRERELEASE_BASE_VERSION}-dev.}"
            case "$suffix" in
              ''|*[!0-9]*) continue ;;
            esac
            value=$((10#$suffix))
            if [ "$value" -gt "$LAST_DEV" ]; then
              LAST_DEV="$value"
            fi
          done
          NEXT_DEV=$((LAST_DEV + 1))
          NEXT_VERSION="${RELEASE_DEV_PRERELEASE_BASE_VERSION}-dev.${NEXT_DEV}"
          SKIP_SEMANTIC_RELEASE=false
          echo "[compute-next] next dev prerelease is ${RELEASE_TAG_PREFIX}${NEXT_VERSION}"
        elif [ -n "${CI_COMMIT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH#"$RELEASE_BRANCH_PREFIX"}" != "${CI_COMMIT_BRANCH}" ]; then
          RELEASE_TRAIN="${CI_COMMIT_BRANCH#"$RELEASE_BRANCH_PREFIX"}"
          if ! printf '%s\n' "${RELEASE_TRAIN}" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "[compute-next] ERROR: release branch ${CI_COMMIT_BRANCH} must end with X.Y" >&2
            exit 1
          fi
          RELEASE_FILE_TRAIN="${RELEASE_DEV_PRERELEASE_BASE_VERSION%.*}"
          if [ "${RELEASE_TRAIN}" != "${RELEASE_FILE_TRAIN}" ]; then
            echo "[compute-next] ERROR: ${SUBTREE}/${RELEASE_VERSION_FILE} is ${RELEASE_DEV_PRERELEASE_BASE_VERSION}, but branch ${CI_COMMIT_BRANCH} is train ${RELEASE_TRAIN}" >&2
            exit 1
          fi
          git fetch --tags --quiet origin
          if [ "${RELEASE_RC_PRERELEASE:-}" = "true" ] && ! git -C "${CI_PROJECT_DIR}" rev-parse -q --verify "refs/tags/${RELEASE_TAG_PREFIX}${RELEASE_DEV_PRERELEASE_BASE_VERSION}" >/dev/null 2>&1; then
            LAST_RC=0
            for tag in $(release_tags_matching_suffix "${RELEASE_DEV_PRERELEASE_BASE_VERSION}-rc.*"); do
              version="$(release_version_from_tag "${tag}")"
              suffix="${version#${RELEASE_DEV_PRERELEASE_BASE_VERSION}-rc.}"
              case "${suffix}" in
                ''|*[!0-9]*) continue ;;
              esac
              value=$((10#$suffix))
              if [ "$value" -gt "$LAST_RC" ]; then
                LAST_RC="$value"
              fi
            done
            NEXT_RC=$((LAST_RC + 1))
            NEXT_VERSION="${RELEASE_DEV_PRERELEASE_BASE_VERSION}-rc.${NEXT_RC}"
            echo "[compute-next] next RC prerelease is ${RELEASE_TAG_PREFIX}${NEXT_VERSION}"
          else
            [ "${RELEASE_RC_PRERELEASE:-}" = "true" ] && echo "[compute-next] stable ${RELEASE_TAG_PREFIX}${RELEASE_DEV_PRERELEASE_BASE_VERSION} exists; switching to patch mode"
            LAST_PATCH=-1
            for tag in $(release_tags_matching_suffix "${RELEASE_TRAIN}.*"); do
              version="$(release_version_from_tag "${tag}")"
              case "${version}" in
                *-*) continue ;;
              esac
              patch="${version#${RELEASE_TRAIN}.}"
              case "${patch}" in
                ''|*[!0-9]*) continue ;;
              esac
              value=$((10#$patch))
              if [ "$value" -gt "$LAST_PATCH" ]; then
                LAST_PATCH="$value"
              fi
            done
            if [ "$LAST_PATCH" -lt 0 ]; then
              NEXT_VERSION="${RELEASE_DEV_PRERELEASE_BASE_VERSION}"
            else
              NEXT_PATCH=$((LAST_PATCH + 1))
              NEXT_VERSION="${RELEASE_TRAIN}.${NEXT_PATCH}"
            fi
          fi
          GIT_TAG="${RELEASE_TAG_PREFIX}${NEXT_VERSION}"
          EXISTING_TAG="$(release_tag_for_version "${NEXT_VERSION}" || true)"
          if [ -n "${EXISTING_TAG}" ]; then
            TAG_SHA="$(git rev-list -n 1 "${EXISTING_TAG}")"
            if [ "${EXISTING_TAG}" = "${GIT_TAG}" ] && [ "${TAG_SHA}" = "${CI_COMMIT_SHA}" ]; then
              SKIP_SEMANTIC_RELEASE=true
              echo "[compute-next] ${GIT_TAG} already points at ${CI_COMMIT_SHA}; downstream publishes will skip"
            else
              echo "[compute-next] ERROR: release version ${NEXT_VERSION} already exists as ${EXISTING_TAG} at ${TAG_SHA}, not ${CI_COMMIT_SHA}" >&2
              exit 1
            fi
          else
            SKIP_SEMANTIC_RELEASE=false
            echo "[compute-next] next release-branch version is ${GIT_TAG}"
          fi
        else
          NEXT_VERSION="${CI_COMMIT_SHORT_SHA}"
          SKIP_SEMANTIC_RELEASE=true
        fi
      elif [ -n "${RELEASE_VERSION_FILE:-}" ]; then
        if [ ! -f "${RELEASE_VERSION_FILE}" ]; then
          echo "[compute-next] ERROR: release.version_file=${RELEASE_VERSION_FILE} does not exist under ${SUBTREE}" >&2
          exit 1
        fi
        RELEASE_FILE_VERSION="$(tr -d '[:space:]' < "${RELEASE_VERSION_FILE}")"
        RELEASE_FILE_VERSION="${RELEASE_FILE_VERSION#v}"
        if [ -z "${RELEASE_FILE_VERSION}" ]; then
          echo "[compute-next] ERROR: release.version_file=${RELEASE_VERSION_FILE} is empty" >&2
          exit 1
        fi

        if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
          NEXT_VERSION="mr.${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
          SKIP_SEMANTIC_RELEASE=true
        elif [ -n "${CI_COMMIT_TAG:-}" ]; then
          NEXT_VERSION="$(release_version_from_tag "${CI_COMMIT_TAG}" || true)"
          if [ -z "${NEXT_VERSION}" ]; then
            echo "[compute-next] ERROR: ${CI_COMMIT_TAG} does not match configured release tag prefixes" >&2
            exit 1
          fi
          SKIP_SEMANTIC_RELEASE=false
        elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          git fetch --tags --quiet origin
          NEXT_VERSION="${RELEASE_FILE_VERSION}"
          EXISTING_TAG="$(release_tag_for_version "${NEXT_VERSION}" || true)"
          if [ -n "${EXISTING_TAG}" ]; then
            SKIP_SEMANTIC_RELEASE=true
            echo "[compute-next] ${EXISTING_TAG} already exists; downstream publishes will skip"
          else
            SKIP_SEMANTIC_RELEASE=false
            echo "[compute-next] using ${RELEASE_VERSION_FILE} as NEXT_VERSION=${NEXT_VERSION}"
          fi
        else
          NEXT_VERSION="${CI_COMMIT_SHORT_SHA}"
          SKIP_SEMANTIC_RELEASE=true
        fi

        NEXT_VERSION_PLAIN="${NEXT_VERSION#v}"
        if [ -z "${CI_MERGE_REQUEST_IID:-}" ] && [ "${NEXT_VERSION_PLAIN}" != "${RELEASE_FILE_VERSION}" ]; then
          echo "##############################################################"
          echo "[compute-next] ERROR: release version mismatch"
          echo "  NEXT_VERSION=${NEXT_VERSION}, but ${SUBTREE}/${RELEASE_VERSION_FILE}"
          echo "  contains ${RELEASE_FILE_VERSION}."
          echo ""
          echo "  The release tag and published image version must come from"
          echo "  ${RELEASE_VERSION_FILE}. Failing here prevents release tags"
          echo "  and image versions from drifting away from source metadata."
          echo "##############################################################"
          exit 1
        fi
        if [ -n "${RELEASE_VERSION_MAJOR_MINOR_SOURCE_FILE:-}" ]; then
          if [ ! -f "${RELEASE_VERSION_MAJOR_MINOR_SOURCE_FILE}" ]; then
            echo "[compute-next] ERROR: release.version_major_minor_source_file=${RELEASE_VERSION_MAJOR_MINOR_SOURCE_FILE} does not exist under ${SUBTREE}" >&2
            exit 1
          fi
          SOURCE_VERSION="$(grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' "${RELEASE_VERSION_MAJOR_MINOR_SOURCE_FILE}" | head -1 | sed 's/^v//')"
          if [ -z "${SOURCE_VERSION}" ]; then
            echo "[compute-next] ERROR: could not detect a semantic version in ${SUBTREE}/${RELEASE_VERSION_MAJOR_MINOR_SOURCE_FILE}" >&2
            exit 1
          fi
          SOURCE_MAJOR_MINOR="${SOURCE_VERSION%.*}"
          RELEASE_MAJOR_MINOR="${RELEASE_FILE_VERSION%.*}"
          if [ "${SOURCE_MAJOR_MINOR}" != "${RELEASE_MAJOR_MINOR}" ]; then
            echo "##############################################################"
            echo "[compute-next] ERROR: ${SUBTREE}/${RELEASE_VERSION_FILE}"
            echo "  contains ${RELEASE_FILE_VERSION}, but"
            echo "  ${SUBTREE}/${RELEASE_VERSION_MAJOR_MINOR_SOURCE_FILE}"
            echo "  first declares version ${SOURCE_VERSION}."
            echo ""
            echo "  The release major/minor must match the source major/minor."
            echo "  Failing before publishing ${RELEASE_TAG_PREFIX}${NEXT_VERSION}."
            echo "##############################################################"
            exit 1
          fi
          echo "[compute-next] ${RELEASE_VERSION_MAJOR_MINOR_SOURCE_FILE} major/minor matches ${RELEASE_VERSION_FILE}"
        fi
        if [ -z "${CI_MERGE_REQUEST_IID:-}" ]; then
          echo "[compute-next] ${RELEASE_VERSION_FILE} is authoritative for NEXT_VERSION=${NEXT_VERSION}"
        fi
      else
        # Priority for semantic-release services:
        # 1) semantic-release-emitted NEXT_VERSION on the default branch,
        # 2) tag pipeline derives from $CI_COMMIT_TAG,
        # 3) MR / non-default branch falls back to the legacy
        #    mr.<iid>-<sha> / sha shape and marks SKIP_SEMANTIC_RELEASE=true.
        #
        # Loud-failure rule (default branch only): if NEXT_VERSION is
        # empty AND the semantic-release output does NOT explicitly say
        # "There are no relevant changes", fail this job.
        NEXT_VERSION=$(awk '/next release version is/ {print $NF; exit}' semantic-release-output.log)
        if [ -n "$NEXT_VERSION" ]; then
          SKIP_SEMANTIC_RELEASE=false
        elif [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
          NEXT_VERSION="mr.${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
          SKIP_SEMANTIC_RELEASE=true
        elif [ -n "${CI_COMMIT_TAG:-}" ]; then
          NEXT_VERSION="$(release_version_from_tag "${CI_COMMIT_TAG}" || true)"
          if [ -z "${NEXT_VERSION}" ]; then
            echo "[compute-next] ERROR: ${CI_COMMIT_TAG} does not match configured release tag prefixes" >&2
            exit 1
          fi
          SKIP_SEMANTIC_RELEASE=false
        elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          if [ "${SEMREL_EXIT}" -eq 0 ] && \
             grep -qE "no relevant changes|There are no commits|is behind the remote" semantic-release-output.log; then
            LAST_RELEASE_TAG=$(release_latest_tag || true)
            NEXT_VERSION="$(release_version_from_tag "${LAST_RELEASE_TAG}" || true)"
            [ -n "${NEXT_VERSION}" ] || NEXT_VERSION="0.0.0"
            SKIP_SEMANTIC_RELEASE=true
            # Three legitimate skip reasons on the default branch:
            #   1. "no relevant changes" - no feat/fix/perf since last tag
            #   2. "There are no commits" - empty range
            #   3. "is behind the remote" - benign race: a newer commit
            #      landed on main between pipeline scheduling and this
            #      job running. semantic-release correctly refuses to
            #      tag from a stale HEAD; a fresh pipeline for the new
            #      tip will publish.
            echo "[compute-next] no release-worthy commits / stale HEAD since ${LAST_RELEASE_TAG:-<root>}; downstream publishes will skip"
          else
            echo "##############################################################"
            echo "[compute-next] ERROR: semantic-release dry-run produced no"
            echo "  NEXT_VERSION and did not log the legitimate 'no relevant"
            echo "  changes' message on the default branch. exit=${SEMREL_EXIT}"
            echo ""
            echo "  No GitLab auth is involved in this job (we use"
            echo "  release-cli with CI_JOB_TOKEN in the publish-step"
            echo "  semantic-release-${SERVICE_NAME} job for tag creation;"
            echo "  this dry-run has no remote dependencies). Likely"
            echo "  causes: commit-analyzer plugin crash, malformed"
            echo "  commit message in the scanned range, missing or"
            echo "  unparseable package.json, or semantic-release-monorepo"
            echo "  failing to resolve the package directory. Full"
            echo "  semantic-release log is in the collapsed"
            echo "  'Semantic-release debug output' section above."
            echo ""
            echo "  Failing loud rather than silently skipping the release."
            echo "##############################################################"
            exit 1
          fi
        else
          NEXT_VERSION="${CI_COMMIT_SHORT_SHA}"
          SKIP_SEMANTIC_RELEASE=true
        fi
      fi
      echo "NEXT_VERSION=${NEXT_VERSION}  SKIP_SEMANTIC_RELEASE=${SKIP_SEMANTIC_RELEASE}"
    - |
      touch release.env
      echo "NEXT_VERSION=${NEXT_VERSION}" > release.env
      echo "SKIP_SEMANTIC_RELEASE=${SKIP_SEMANTIC_RELEASE}" >> release.env
      mv release.env "${CI_PROJECT_DIR}/release.env"
  artifacts:
    reports:
      dotenv: release.env

.semantic-release-service:
  stage: publish
  image: ${CDS_TOOLS_IMAGE}
  tags: [eks, nvcf-cds, prod]
  # Pivoted off @semantic-release/gitlab to @semantic-release/exec +
  # GitLab release-cli (James McNamee's helm-oci-release pattern). The
  # tag is created via the Releases API (POST /projects/:id/releases)
  # which is callable with the ephemeral CI_JOB_TOKEN. No long-lived
  # PAT, no kv/gitlab/semantic-release/gl-token, no protected-branch
  # git push. Releases API tag-creation fires a Tag pipeline normally,
  # so existing image-push rules (if: $CI_COMMIT_TAG) keep working.
  #
  # resource_group serializes every semantic-release-<svc> job across
  # this project. semantic-release core (not just the dropped gitlab
  # plugin) hardcodes a "git push refs/notes/semantic-release" in
  # lib/git.js at success time. When multiple semantic-release jobs
  # run in parallel -- e.g. on a web-source manual pipeline where
  # changes: matches every service, or on a default-branch push that
  # touches multiple subtrees -- they race that ref and all but one
  # get rejected non-fast-forward. The lock the legacy generator had
  # was dropped on the (wrong) assumption that exec doesn't push notes.
  # Restore it so the publish completes regardless of how many
  # services are in flight; the slowdown on real multi-service tag
  # pipelines is a few seconds of serialization.
  resource_group: semantic-release-notes
  before_script:
    - |
      if [ "${SKIP_SEMANTIC_RELEASE:-}" = "true" ]; then
        echo "compute-next-release-version-${SERVICE_NAME} reported no publishable release; skipping tag creation."
        exit 0
      fi
    - cd "$SUBTREE"
    - |
      RELEASE_TAG_PREFIX="${RELEASE_TAG_PREFIX:-${SERVICE_NAME}-v}"
      RELEASE_TAG_FORMAT="${RELEASE_TAG_PREFIX}\${version}"
      RELEASE_TAG_GLOB="${RELEASE_TAG_PREFIX}*"
      RELEASE_BRANCH_PREFIX="${RELEASE_BRANCH_PREFIX:-release-${RELEASE_TAG_PREFIX}}"
      RELEASE_LEGACY_TAG_PREFIX="${RELEASE_LEGACY_TAG_PREFIX:-}"
      export RELEASE_TAG_FORMAT RELEASE_TAG_PREFIX RELEASE_TAG_GLOB RELEASE_BRANCH_PREFIX RELEASE_LEGACY_TAG_PREFIX
      echo "[release-tags] format=${RELEASE_TAG_FORMAT} prefix=${RELEASE_TAG_PREFIX}"
      if [ -n "${RELEASE_LEGACY_TAG_PREFIX}" ]; then
        echo "[release-tags] legacy-prefix=${RELEASE_LEGACY_TAG_PREFIX}"
      fi
      echo "[release-branches] prefix=${RELEASE_BRANCH_PREFIX}"
    - |
      if [ ! -f "${CI_PROJECT_DIR}/release-tag-compat.sh" ]; then
        cat > "${CI_PROJECT_DIR}/release-tag-compat.sh" <<'SCRIPT_EOF'
        release_configure_tag_prefixes() {
          release_tag_prefixes=("${RELEASE_TAG_PREFIX}")
          if [ -n "${RELEASE_LEGACY_TAG_PREFIX:-}" ] && [ "${RELEASE_LEGACY_TAG_PREFIX}" != "${RELEASE_TAG_PREFIX}" ]; then
            release_tag_prefixes+=("${RELEASE_LEGACY_TAG_PREFIX}")
          fi
        }

        release_version_from_tag() {
          local tag="$1" prefix
          for prefix in "${release_tag_prefixes[@]}"; do
            if [[ "${tag}" == "${prefix}"* ]]; then
              printf '%s\n' "${tag#"$prefix"}"
              return 0
            fi
          done
          return 1
        }

        release_tags_matching_suffix() {
          local suffix="${1:-*}" prefix
          for prefix in "${release_tag_prefixes[@]}"; do
            git -C "${CI_PROJECT_DIR}" tag -l "${prefix}${suffix}"
          done | sort -u
        }

        release_latest_tag_for_prefix() {
          local prefix="$1" tag version
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            version="${tag#"$prefix"}"
            printf '%s %s\n' "${version}" "${tag}"
          done < <(git -C "${CI_PROJECT_DIR}" tag -l "${prefix}*") | sort -k1,1V | tail -1 | cut -d' ' -f2-
        }

        release_latest_tag() {
          local tag version
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            version="$(release_version_from_tag "${tag}" || true)"
            [ -n "${version}" ] || continue
            printf '%s %s\n' "${version}" "${tag}"
          done < <(release_tags_matching_suffix '*') | sort -k1,1V | tail -1 | cut -d' ' -f2-
        }

        release_tag_for_version() {
          local version="$1" prefix tag
          for prefix in "${release_tag_prefixes[@]}"; do
            tag="${prefix}${version}"
            if git -C "${CI_PROJECT_DIR}" rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              printf '%s\n' "${tag}"
              return 0
            fi
          done
          return 1
        }

        release_synthesize_current_prefix_anchor() {
          if [ -z "${RELEASE_LEGACY_TAG_PREFIX:-}" ] || [ "${RELEASE_LEGACY_TAG_PREFIX}" = "${RELEASE_TAG_PREFIX}" ]; then
            return 0
          fi
          if [ -n "$(release_latest_tag_for_prefix "${RELEASE_TAG_PREFIX}" || true)" ]; then
            return 0
          fi
          local legacy_tag version anchor sha
          legacy_tag="$(release_latest_tag_for_prefix "${RELEASE_LEGACY_TAG_PREFIX}" || true)"
          [ -n "${legacy_tag}" ] || return 0
          version="${legacy_tag#"$RELEASE_LEGACY_TAG_PREFIX"}"
          anchor="${RELEASE_TAG_PREFIX}${version}"
          if git -C "${CI_PROJECT_DIR}" rev-parse -q --verify "refs/tags/${anchor}" >/dev/null; then
            return 0
          fi
          sha="$(git -C "${CI_PROJECT_DIR}" rev-list -n 1 "${legacy_tag}")"
          git -C "${CI_PROJECT_DIR}" tag "${anchor}" "${sha}"
          echo "[release-tags] synthesized local compatibility anchor ${anchor} -> ${legacy_tag} (${sha})"
        }
      SCRIPT_EOF
      fi
      . "${CI_PROJECT_DIR}/release-tag-compat.sh"
      release_configure_tag_prefixes
      release_synthesize_current_prefix_anchor
    - |
      if [ -n "${RELEASE_VERSION_FILE:-}" ] || [ "${RELEASE_DEV_PRERELEASE:-}" = "true" ]; then
        echo "[semantic-release] version-file release path; skipping semantic-release package setup"
      else
        cat > package.json <<EOF
      {
        "name": "${SERVICE_NAME}",
        "version": "1.0.0",
        "private": true,
        "devDependencies": {
          "semantic-release": "17.4.4",
          "@semantic-release/exec": "5.0.0",
          "semantic-release-monorepo": "^7.0.0"
        }
      }
      EOF
      fi
    - |
      if [ -n "${RELEASE_VERSION_FILE:-}" ] || [ "${RELEASE_DEV_PRERELEASE:-}" = "true" ]; then
        echo "[semantic-release] version-file release path; skipping semantic-release config setup"
      else
        cat > .releaserc.json <<EOF
      {
        "extends": "semantic-release-monorepo",
        "tagFormat": "${RELEASE_TAG_FORMAT}",
        "branches": ["main"],
        "plugins": [
          ["@semantic-release/commit-analyzer", {
            "releaseRules": [
              {"type": "feat", "release": "minor"},
              {"type": "fix", "release": "patch"},
              {"type": "perf", "release": "patch"},
              {"type": "chore", "release": false},
              {"type": "ci", "release": false},
              {"type": "docs", "release": false},
              {"type": "style", "release": false},
              {"type": "refactor", "release": false},
              {"type": "test", "release": false},
              {"type": "build", "release": false}
            ]
          }],
          "@semantic-release/release-notes-generator",
          ["@semantic-release/exec", {
            "verifyConditionsCmd": "${CI_PROJECT_DIR}/.gitlab/scripts/release-verify.sh",
            "prepareCmd": "${CI_PROJECT_DIR}/.gitlab/scripts/release-prepare.sh \${nextRelease.version} \${nextRelease.gitTag} \${Buffer.from(nextRelease.notes || '').toString('base64')}",
            "publishCmd": "${CI_PROJECT_DIR}/.gitlab/scripts/release-publish.sh \${nextRelease.gitTag}",
            "failCmd": "${CI_PROJECT_DIR}/.gitlab/scripts/release-fail.sh \${nextRelease.version}"
          }]
        ]
      }
      EOF
        cat .releaserc.json
      fi
    - |
      if [ -n "${RELEASE_VERSION_FILE:-}" ] || [ "${RELEASE_DEV_PRERELEASE:-}" = "true" ]; then
        echo "[semantic-release] version-file release path; skipping npm install"
      else
        npm install
      fi
    - |
      # release-cli is GitLab's official binary for the Releases API.
      # It speaks CI_JOB_TOKEN out of the box. Pinned to 0.18.0 because
      # the /latest/ segment in GitLab's generic packages URL is a
      # literal package-version label, not a moving alias — bumping is
      # an explicit edit here, never an implicit drift between jobs.
      # Currently downloaded per job; baking it into the CDS_TOOLS_IMAGE
      # (or our bazel-ci image) is a clean follow-up.
      curl -fsSL -o /usr/local/bin/release-cli \
        "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/v0.18.0/release-cli-linux-amd64"
      chmod +x /usr/local/bin/release-cli
      release-cli -v
    - mkdir -p "${CI_PROJECT_DIR}/.gitlab/scripts"
    - |
      cat > "${CI_PROJECT_DIR}/.gitlab/scripts/release-verify.sh" <<'SCRIPT_EOF'
      #!/bin/bash
      set -e
      # @semantic-release/exec verifyConditions hook. Asserts the
      # ephemeral token + identifiers we depend on are present. Does
      # NOT push anything (the legacy @semantic-release/gitlab plugin
      # did, which is what this whole pivot replaced).
      : "${CI_JOB_TOKEN:?CI_JOB_TOKEN is not set}"
      : "${CI_PROJECT_ID:?CI_PROJECT_ID is not set}"
      : "${CI_COMMIT_SHA:?CI_COMMIT_SHA is not set}"
      : "${SERVICE_NAME:?SERVICE_NAME is not set}"
      command -v release-cli >/dev/null || { echo "release-cli not on PATH"; exit 1; }
      echo "[release-verify] preconditions ok for ${SERVICE_NAME}"
      SCRIPT_EOF
    - |
      cat > "${CI_PROJECT_DIR}/.gitlab/scripts/release-prepare.sh" <<'SCRIPT_EOF'
      #!/bin/bash
      set -e
      VERSION=$1
      GIT_TAG=$2
      NOTES_B64=${3:-}
      : "${VERSION:?prepare: version arg missing}"
      : "${GIT_TAG:?prepare: gitTag arg missing}"
      # Notes arrive as base64 so commit-message apostrophes, backticks,
      # and dollar signs cannot escape into the shell command line.
      # See @semantic-release/exec prepareCmd: it Lodash-evaluates
      # Buffer.from(nextRelease.notes || '').toString('base64') and
      # substitutes the result here. Empty notes -> NOTES_B64="".
      if [ -n "${NOTES_B64}" ]; then
        NOTES=$(printf %s "${NOTES_B64}" | base64 -d)
      else
        NOTES=""
      fi
      # release-cli create-from-file consumes this YAML. tag-name is the
      # hyphenated form (release-cli convention; matches helm-oci-release).
      cat > "${CI_PROJECT_DIR}/release-data.yml" <<RELEASE_EOF
      name: "${GIT_TAG}"
      tag-name: "${GIT_TAG}"
      ref: "${CI_COMMIT_SHA}"
      description: |
      $(printf '%s\n' "${NOTES}" | awk '{ print "  " $0 }')
      RELEASE_EOF
      echo "[release-prepare] wrote release-data.yml for ${GIT_TAG} -> ${CI_COMMIT_SHA}"
      cat "${CI_PROJECT_DIR}/release-data.yml"
      SCRIPT_EOF
    - |
      cat > "${CI_PROJECT_DIR}/.gitlab/scripts/release-publish.sh" <<'SCRIPT_EOF'
      #!/bin/bash
      set -e
      GIT_TAG=$1
      : "${GIT_TAG:?publish: gitTag arg missing}"
      if [ ! -f "${CI_PROJECT_DIR}/release-data.yml" ]; then
        echo "[release-publish] release-data.yml not found"
        exit 1
      fi
      # POST /projects/:id/releases using $CI_JOB_TOKEN. If GIT_TAG does
      # not yet exist, the API creates it at the supplied ref; the tag
      # creation fires a Tag pipeline with $CI_COMMIT_TAG set, which is
      # what our downstream image-push jobs key off.
      release-cli create-from-file --file "${CI_PROJECT_DIR}/release-data.yml"
      echo "[release-publish] created GitLab Release for ${GIT_TAG}"
      SCRIPT_EOF
    - |
      cat > "${CI_PROJECT_DIR}/.gitlab/scripts/release-fail.sh" <<'SCRIPT_EOF'
      #!/bin/bash
      VERSION=$1
      echo "[release-fail] release failed for version ${VERSION}; cleaning up release-data.yml"
      rm -f "${CI_PROJECT_DIR}/release-data.yml"
      SCRIPT_EOF
    - find "${CI_PROJECT_DIR}/.gitlab/scripts" -name '*.sh' -exec chmod +x {} \;
  script:
    - |
      if [ "${SKIP_SEMANTIC_RELEASE}" = "true" ]; then
        echo "compute-next-release-version-${SERVICE_NAME} reported no publishable release; skipping tag creation."
        exit 0
      fi
    - |
      if [ "${RELEASE_DEV_PRERELEASE:-}" = "true" ]; then
        if [ -z "${RELEASE_VERSION_FILE:-}" ]; then
          echo "[dev-prerelease] ERROR: release.dev_prerelease requires release.version_file" >&2
          exit 1
        fi
        if [ ! -f "${RELEASE_VERSION_FILE}" ]; then
          echo "[dev-prerelease] ERROR: ${SUBTREE}/${RELEASE_VERSION_FILE} not found" >&2
          exit 1
        fi
        RELEASE_DEV_PRERELEASE_BASE_VERSION="$(tr -d '[:space:]' < "${RELEASE_VERSION_FILE}")"
        RELEASE_DEV_PRERELEASE_BASE_VERSION="${RELEASE_DEV_PRERELEASE_BASE_VERSION#v}"
        if [ -z "${RELEASE_DEV_PRERELEASE_BASE_VERSION}" ]; then
          echo "[dev-prerelease] ERROR: release.version_file=${RELEASE_VERSION_FILE} is empty" >&2
          exit 1
        fi
        if ! printf '%s\n' "${RELEASE_DEV_PRERELEASE_BASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "[dev-prerelease] ERROR: release.version_file=${RELEASE_VERSION_FILE} must contain X.Y.Z, got ${RELEASE_DEV_PRERELEASE_BASE_VERSION}" >&2
          exit 1
        fi
        git fetch --tags --quiet origin
        if [ -n "${CI_COMMIT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH#"$RELEASE_BRANCH_PREFIX"}" != "${CI_COMMIT_BRANCH}" ]; then
          RELEASE_TRAIN="${CI_COMMIT_BRANCH#"$RELEASE_BRANCH_PREFIX"}"
          if ! printf '%s\n' "${RELEASE_TRAIN}" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "[release-branch] ERROR: release branch ${CI_COMMIT_BRANCH} must end with X.Y" >&2
            exit 1
          fi
          RELEASE_FILE_TRAIN="${RELEASE_DEV_PRERELEASE_BASE_VERSION%.*}"
          if [ "${RELEASE_TRAIN}" != "${RELEASE_FILE_TRAIN}" ]; then
            echo "[release-branch] ERROR: ${SUBTREE}/${RELEASE_VERSION_FILE} is ${RELEASE_DEV_PRERELEASE_BASE_VERSION}, but branch ${CI_COMMIT_BRANCH} is train ${RELEASE_TRAIN}" >&2
            exit 1
          fi
          if [ "${RELEASE_RC_PRERELEASE:-}" = "true" ] && ! git -C "${CI_PROJECT_DIR}" rev-parse -q --verify "refs/tags/${RELEASE_TAG_PREFIX}${RELEASE_DEV_PRERELEASE_BASE_VERSION}" >/dev/null 2>&1; then
            LAST_RC=0
            for tag in $(release_tags_matching_suffix "${RELEASE_DEV_PRERELEASE_BASE_VERSION}-rc.*"); do
              version="$(release_version_from_tag "${tag}")"
              suffix="${version#${RELEASE_DEV_PRERELEASE_BASE_VERSION}-rc.}"
              case "${suffix}" in
                ''|*[!0-9]*) continue ;;
              esac
              value=$((10#$suffix))
              if [ "$value" -gt "$LAST_RC" ]; then
                LAST_RC="$value"
              fi
            done
            NEXT_RC=$((LAST_RC + 1))
            VERSION="${RELEASE_DEV_PRERELEASE_BASE_VERSION}-rc.${NEXT_RC}"
          else
            [ "${RELEASE_RC_PRERELEASE:-}" = "true" ] && echo "[release-branch] stable ${RELEASE_TAG_PREFIX}${RELEASE_DEV_PRERELEASE_BASE_VERSION} exists; switching to patch mode"
            LAST_PATCH=-1
            for tag in $(release_tags_matching_suffix "${RELEASE_TRAIN}.*"); do
              version="$(release_version_from_tag "${tag}")"
              case "${version}" in
                *-*) continue ;;
              esac
              patch="${version#${RELEASE_TRAIN}.}"
              case "${patch}" in
                ''|*[!0-9]*) continue ;;
              esac
              value=$((10#$patch))
              if [ "$value" -gt "$LAST_PATCH" ]; then
                LAST_PATCH="$value"
              fi
            done
            if [ "$LAST_PATCH" -lt 0 ]; then
              VERSION="${RELEASE_DEV_PRERELEASE_BASE_VERSION}"
            else
              NEXT_PATCH=$((LAST_PATCH + 1))
              VERSION="${RELEASE_TRAIN}.${NEXT_PATCH}"
            fi
          fi
          if [ -n "${NEXT_VERSION:-}" ] && [ "${NEXT_VERSION}" != "${VERSION}" ]; then
            echo "[release-branch] recomputed NEXT_VERSION under release lock: ${NEXT_VERSION} -> ${VERSION}"
          fi
          GIT_TAG="${RELEASE_TAG_PREFIX}${VERSION}"
          EXISTING_TAG="$(release_tag_for_version "${VERSION}" || true)"
          if [ -n "${EXISTING_TAG}" ]; then
            TAG_SHA="$(git rev-list -n 1 "${EXISTING_TAG}")"
            if [ "${EXISTING_TAG}" = "${GIT_TAG}" ] && [ "${TAG_SHA}" = "${CI_COMMIT_SHA}" ]; then
              echo "[release-branch] ${GIT_TAG} already points at ${CI_COMMIT_SHA}; skipping tag creation"
              exit 0
            fi
            echo "[release-branch] ERROR: release version ${VERSION} already exists as ${EXISTING_TAG} at ${TAG_SHA}, not ${CI_COMMIT_SHA}" >&2
            exit 1
          fi
          cat > "${CI_PROJECT_DIR}/release-data.yml" <<RELEASE_EOF
      name: "${GIT_TAG}"
      tag-name: "${GIT_TAG}"
      ref: "${CI_COMMIT_SHA}"
      description: |
        Release ${GIT_TAG}
      RELEASE_EOF
          cat "${CI_PROJECT_DIR}/release-data.yml"
          release-cli create-from-file --file "${CI_PROJECT_DIR}/release-data.yml"
          echo "[release-branch] created GitLab Release for ${GIT_TAG}"
          exit 0
        else
          LAST_DEV=-1
          for tag in $(release_tags_matching_suffix "${RELEASE_DEV_PRERELEASE_BASE_VERSION}-dev.*"); do
            suffix="$(release_version_from_tag "${tag}")"
            suffix="${suffix#${RELEASE_DEV_PRERELEASE_BASE_VERSION}-dev.}"
            case "$suffix" in
              ''|*[!0-9]*) continue ;;
            esac
            value=$((10#$suffix))
            if [ "$value" -gt "$LAST_DEV" ]; then
              LAST_DEV="$value"
            fi
          done
          NEXT_DEV=$((LAST_DEV + 1))
          VERSION="${RELEASE_DEV_PRERELEASE_BASE_VERSION}-dev.${NEXT_DEV}"
          if [ -n "${NEXT_VERSION:-}" ] && [ "${NEXT_VERSION}" != "${VERSION}" ]; then
            echo "[dev-prerelease] recomputed NEXT_VERSION under release lock: ${NEXT_VERSION} -> ${VERSION}"
          fi
          GIT_TAG="${RELEASE_TAG_PREFIX}${VERSION}"
          EXISTING_TAG="$(release_tag_for_version "${VERSION}" || true)"
          if [ -n "${EXISTING_TAG}" ]; then
            echo "[dev-prerelease] ERROR: release version ${VERSION} already exists as ${EXISTING_TAG} after recomputing dev prerelease version" >&2
            exit 1
          fi
          cat > "${CI_PROJECT_DIR}/release-data.yml" <<RELEASE_EOF
      name: "${GIT_TAG}"
      tag-name: "${GIT_TAG}"
      ref: "${CI_COMMIT_SHA}"
      description: |
        Release ${GIT_TAG}
      RELEASE_EOF
          cat "${CI_PROJECT_DIR}/release-data.yml"
          release-cli create-from-file --file "${CI_PROJECT_DIR}/release-data.yml"
          echo "[dev-prerelease] created GitLab Release for ${GIT_TAG}"
          exit 0
        fi
      fi
    - |
      if [ -n "${RELEASE_VERSION_FILE:-}" ]; then
        if [ ! -f "${RELEASE_VERSION_FILE}" ]; then
          echo "[release-version-file] ERROR: ${SUBTREE}/${RELEASE_VERSION_FILE} not found" >&2
          exit 1
        fi
        RELEASE_FILE_VERSION="$(tr -d '[:space:]' < "${RELEASE_VERSION_FILE}")"
        RELEASE_FILE_VERSION="${RELEASE_FILE_VERSION#v}"
        VERSION="${NEXT_VERSION:-${RELEASE_FILE_VERSION}}"
        VERSION="${VERSION#v}"
        if [ -z "${VERSION}" ] || [ "${VERSION}" != "${RELEASE_FILE_VERSION}" ]; then
          echo "[release-version-file] ERROR: NEXT_VERSION=${NEXT_VERSION:-<empty>} does not match ${SUBTREE}/${RELEASE_VERSION_FILE}=${RELEASE_FILE_VERSION}" >&2
          exit 1
        fi
        GIT_TAG="${RELEASE_TAG_PREFIX}${VERSION}"
        cat > "${CI_PROJECT_DIR}/release-data.yml" <<RELEASE_EOF
      name: "${GIT_TAG}"
      tag-name: "${GIT_TAG}"
      ref: "${CI_COMMIT_SHA}"
      description: |
        Release ${GIT_TAG}
      RELEASE_EOF
        cat "${CI_PROJECT_DIR}/release-data.yml"
        release-cli create-from-file --file "${CI_PROJECT_DIR}/release-data.yml"
        echo "[release-version-file] created GitLab Release for ${GIT_TAG}"
        exit 0
      fi
    - |
      # Stale-main-race handling. semantic-release core aborts with exit 0
      # (a SILENT no-op) and logs "The local branch <b> is behind the remote
      # one" when a newer commit lands on the branch between this pipeline's
      # checkout and the publish step. That silently skips an already-computed
      # release. Re-sync to the remote tip and retry (B); if still behind after
      # ATTEMPTS, exit non-zero (A) so the skip is visible instead of green.
      # The release tag ref is pinned to CI_COMMIT_SHA in release-prepare.sh,
      # so re-syncing the working tree does not move where the tag is created.
      SEMREL_LOG="$(mktemp)"
      ATTEMPTS=3
      n=1
      while :; do
        # Capture semantic-release's real exit code without depending on
        # the invoking shell having set -o pipefail. A cmd-piped-to-tee pipeline
        # reports tee's status (~always 0), so a genuine publish failure could
        # be masked as success -- worse than the bare command. Redirect to the
        # log, capture rc directly, then echo the log for job-output visibility.
        rc=0
        npx semantic-release --no-ci > "${SEMREL_LOG}" 2>&1 || rc=$?
        cat "${SEMREL_LOG}"
        if ! grep -q "is behind the remote" "${SEMREL_LOG}"; then
          exit ${rc}
        fi
        if [ "${n}" -ge "${ATTEMPTS}" ]; then
          echo "[semantic-release] ERROR: local branch still behind origin/${CI_COMMIT_REF_NAME} after ${ATTEMPTS} attempts; an already-computed release for ${SERVICE_NAME} was NOT published. Failing loud so this is not a silent skip -- re-run this job once ${CI_COMMIT_REF_NAME} is quiescent." >&2
          exit 1
        fi
        echo "[semantic-release] branch behind remote (attempt ${n}/${ATTEMPTS}); fetching + re-syncing to origin/${CI_COMMIT_REF_NAME} and retrying"
        git fetch --quiet origin "${CI_COMMIT_REF_NAME}"
        git reset --hard "origin/${CI_COMMIT_REF_NAME}"
        n=$((n + 1))
      done


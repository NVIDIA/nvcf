        echo "[helm-push-nats-ncp-dev] ERROR: nvcr.io rejected the NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW credential (login unauthorized)." >&2
        echo "[helm-push-nats-ncp-dev]   This key is sourced from vault kv/app/ncp/ngc-key. A login failure almost always means the stored key expired or was rotated on the NGC side without vault being updated -- rotate the key at that vault path. This is not a code/CI defect." >&2

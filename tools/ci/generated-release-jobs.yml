      # run on native arm64 runners, so pre-seed an arch-native binary and
      # let the template reuse it.
      case "$(uname -m)" in
        x86_64) vault_arch=amd64 ;;
        aarch64|arm64) vault_arch=arm64 ;;
        *) echo "[cassandra-migrations-buildah] unsupported vault architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      mkdir -p vault/bin
      vault_zip="nvault_agent_v${NV_VAULT_VERSION}_linux_${vault_arch}.zip"
      vault_url="https://urm.nvidia.com/artifactory/sw-kaizen-data-generic/com/nvidia/vault/vault-agent/${NV_VAULT_VERSION}/${vault_zip}"

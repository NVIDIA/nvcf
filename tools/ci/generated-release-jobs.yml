  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot
  # Reuse the repo-local bazel-ci image (ci/Dockerfile.bazel ships
  # both curl and jq already; both warmed on CI runners from earlier
  # pipeline stages). curlimages/curl runs as a non-root security
  # user, so an apk install step fails there with "Unable to lock
  # database: Permission denied"; bazel-ci sidesteps that and
  # avoids a per-job install altogether.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: semantic-release-openbao-migrations
      artifacts: false
      optional: true
    - job: openbao-migrations-image-push
      artifacts: false
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    SLACK_CHANNEL_ID: C08S6KLCEJH
  script:
    - |
      # bazel-ci ships curl + jq pre-installed; no apk step needed.
      # jq handles JSON encoding of the multi-line Slack message
      # below (backslashes / quotes / newlines in commit titles and
      # author names land safely).
      # Prefer CI_COMMIT_TAG on tag pipelines so the message carries the
      # real semver (the legacy bug printed "tag: unknown" because git
      # describe runs against a shallow CI clone where the tag is not
      # reachable). Strip the current or legacy release tag prefix so the
      # message shows just the version (e.g. "1.13.0" not
      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          migrations/openbao/v*) TAG_DISPLAY="${CI_COMMIT_TAG#migrations/openbao/v}" ;;
          nvcf-openbao-migrations-v*) TAG_DISPLAY="${CI_COMMIT_TAG#nvcf-openbao-migrations-v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='migrations/openbao/v*' --match='nvcf-openbao-migrations-v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            migrations/openbao/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#migrations/openbao/v}" ;;
            nvcf-openbao-migrations-v*) TAG_DISPLAY="${LAST_RELEASE_TAG#nvcf-openbao-migrations-v}" ;;
          esac
        else
          TAG_DISPLAY=unknown
        fi
      fi
      # Multi-line Slack message matching the cloud-tasks convention.
      # Embedded newlines via $'\n' (ANSI-C quoting); jq --arg
      # JSON-encodes them as \n in the wire payload.
      # BT is a literal backtick (printf octal 140); Slack renders
      # backtick-wrapped values as inline code, which is the closest
      # Slack supports to highlighting the value after each label
      # (Slack has no inline text color). A literal backtick cannot
      # appear in this Go raw-string template, hence printf.
      BT=$(printf '\140')
      # By: the tagged commit's author (the merged change), not the tag
      # creator -- the release automation cuts every tag under one token.
      SLACK_MESSAGE=":rocket: ${SERVICE_NAME:-nvcf-openbao-migrations} release pipeline complete!"$'\n'
      SLACK_MESSAGE+="Project: ${BT}${CI_PROJECT_PATH}${BT} | Tag: ${BT}${TAG_DISPLAY}${BT} | Branch: ${BT}${CI_COMMIT_REF_NAME}${BT}"$'\n'
      SLACK_MESSAGE+="Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: ${BT}${CI_COMMIT_AUTHOR}${BT}"$'\n'
      SLACK_MESSAGE+="Commit Message: ${BT}${CI_COMMIT_TITLE}${BT}"
      jq -n --arg ch "${SLACK_CHANNEL_ID}" --arg msg "${SLACK_MESSAGE}" \
        '{channel_id: $ch, message: $msg}' > /tmp/slack.json
      curl -sSf -X POST 'https://backstage-helper.service.odp.nvidia.com/notify_channel?dry_run=false' \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d @/tmp/slack.json
  rules:
    # Fire only on tag pipelines. The default-branch pipeline that
    # triggered semantic-release will create the tag, which spawns a
    # second (tag-ref) pipeline; this job runs there. Firing on both
    # would post duplicate Slack messages (observed on
    # nvcf-ratelimiter-v1.13.0 release).
    - if: $CI_COMMIT_TAG =~ /^(migrations\/openbao\/v|nvcf-openbao-migrations-v)/

compute-next-release-version-image-credential-helper:
  extends: .compute-next-release-version-service
  variables:
    SUBTREE: src/compute-plane-services/image-credential-helper
    SERVICE_NAME: nvcf-image-credential-helper
    RELEASE_TAG_PREFIX: src/compute-plane-services/image-credential-helper/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-image-credential-helper-v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_MERGE_REQUEST_IID
      changes: &image_credential_helper_release_paths
        - src/compute-plane-services/image-credential-helper/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Tag pipelines need NEXT_VERSION too: the helm-package job's
    # chart-version input reads ${NEXT_VERSION}, and the image-push
    # job's NVCF_VERSION shell fallback consumes it when set. The
    # compute job's own script falls back to stripping the matching
    # configured release prefix on tag pipelines so downstream jobs
    # stamp artifacts with the tag semver.
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/image-credential-helper\/v|nvcf-image-credential-helper-v)/

semantic-release-image-credential-helper:
  extends: .semantic-release-service
  variables:
    SUBTREE: src/compute-plane-services/image-credential-helper
    SERVICE_NAME: nvcf-image-credential-helper
    RELEASE_TAG_PREFIX: src/compute-plane-services/image-credential-helper/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-image-credential-helper-v
  needs:
    - job: compute-next-release-version-image-credential-helper
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

image-credential-helper-stage-nvcf-image-credential-helper:
  extends:
    - .bazel-remote-probe
  stage: Prerequisites
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
  needs:
    - job: bazel-ci-image
      optional: true
      artifacts: false
    - job: subproject-validations
      optional: true
      artifacts: false
    - job: compute-next-release-version-image-credential-helper
      artifacts: true
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    BAZEL_DISK_CACHE: $CI_PROJECT_DIR/.bazel-cache/disk
    BAZEL_REPO_CACHE: $CI_PROJECT_DIR/.bazel-cache/repo
  cache:
    - key:
        files:
          - src/compute-plane-services/image-credential-helper/MODULE.bazel.lock
          - src/compute-plane-services/image-credential-helper/.bazelversion
        prefix: image-credential-helper-bazel-repo
      paths:
        - .bazel-cache/repo/
      policy: pull
    - key:
        files:
          - src/compute-plane-services/image-credential-helper/.bazelversion
          - src/compute-plane-services/image-credential-helper/.bazelrc
        prefix: image-credential-helper-bazel-disk
      paths:
        - .bazel-cache/disk/
      policy: pull
  before_script:
    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[image-credential-helper-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[image-credential-helper-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/compute-plane-services/image-credential-helper
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/image-credential-helper/v}"
      else
        echo "[image-credential-helper-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[image-credential-helper-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[image-credential-helper-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-image-credential-helper}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvcf_image_credential_helper",
          image = "//cmd/image-credential-helper:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvcf-image-credential-helper",
      )
      EOF
      echo "[image-credential-helper-stage-image] generated staging push package:"
      sed 's/^/[image-credential-helper-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvcf-image-credential-helper
      BAZEL_IMAGE_TARGET=//cmd/image-credential-helper:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvcf-image-credential-helper"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvcf_image_credential_helper
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvcf_image_credential_helper.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
  artifacts:
    paths:
      - release-images/push_nvcf_image_credential_helper.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/image-credential-helper\/v|nvcf-image-credential-helper-v)/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging
# registry). Named <image>-image-push-mr-manual so the UI button clearly
# reads as an image push (image names are unique, so this stays distinct
# even for multi-image services).
#
# It extends the tag-time image-credential-helper-stage-nvcf-image-credential-helper job for the build/push script
# (which branches to ncp-dev when PUSH_MR_IMAGE_TO_REGISTRY=true) plus the
# vault templates so it can fetch the ncp-dev RW key. before_script runs the
# vault setup first, then the stage job's bazel/go/crane setup. image is
# pinned to bazel-ci so the vault templates do not override it. allow_failure
# so a push failure (auth, registry quota) does not block the MR.
nvcf-image-credential-helper-image-push-mr-manual:
  extends:
    - image-credential-helper-stage-nvcf-image-credential-helper
    - .nv-vault
    - .vault-reader-settings
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  variables:
    PUSH_MR_IMAGE_TO_REGISTRY: "true"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
    - !reference [image-credential-helper-stage-nvcf-image-credential-helper, before_script]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *image_credential_helper_release_paths
      when: manual
      allow_failure: true

image-credential-helper-release-manifest:
  stage: publish
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: compute-next-release-version-image-credential-helper
      artifacts: true
      optional: true
    - job: image-credential-helper-stage-nvcf-image-credential-helper
      artifacts: true
  tags: [eks, nvcf-cds, prod]
  script:
    - |
      if [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/image-credential-helper/v}"
      else
        echo "[image-credential-helper-release-manifest] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[image-credential-helper-release-manifest] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      python3 - <<'PY'
      import datetime
      import json
      import os
      from pathlib import Path

      images = [
          json.loads(Path("release-images/push_nvcf_image_credential_helper.json").read_text(encoding="utf-8")),
      ]
      manifest = {
          "schema_version": 1,
          "service_id": "image-credential-helper",
          "service_name": "nvcf-image-credential-helper",
          "source_repo_url": os.environ.get("CI_PROJECT_URL", ""),
          "source_project_id": os.environ.get("CI_PROJECT_ID", ""),
          "source_pipeline_id": os.environ.get("CI_PIPELINE_ID", ""),
          "git_sha": os.environ["CI_COMMIT_SHA"],
          "git_tag": os.environ.get("CI_COMMIT_TAG", ""),
          "version": os.environ["NVCF_VERSION"],
          "artifact_mode": "promote",
          "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "images": images,
      }
      Path(os.environ["CI_PROJECT_DIR"], "release-manifest.json").write_text(
          json.dumps(manifest, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY
      echo "[image-credential-helper-release-manifest] wrote ${CI_PROJECT_DIR}/release-manifest.json"
    - |
      # Emit the manifest as a base64 string in the job's dotenv
      # artifact. The trigger-internal-release job below forwards it
      # to the downstream nvcf-internal pipeline as a single trigger
      # variable. Downstream validate decodes the var and writes the
      # manifest to disk -- no cross-project HTTP, no JOB-TOKEN
      # allowlist dependency, no list-pipeline-jobs endpoint quirk.
      # The legacy plumbing (NVCF_SOURCE_* variables + API fetch) is
      # also emitted as a fallback so any in-flight trigger from a
      # prior nvcf-internal main can still resolve. Slated for
      # removal once both sides have fully cut over.
      printf 'NVCF_SOURCE_MANIFEST_JOB_ID=%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/release-manifest.env"
      printf 'NVCF_RELEASE_MANIFEST_B64=%s\n' "$(base64 -w 0 release-manifest.json)" >> "${CI_PROJECT_DIR}/release-manifest.env"
      echo "[image-credential-helper-release-manifest] dotenv keys:"
      cut -d= -f1 "${CI_PROJECT_DIR}/release-manifest.env"
  artifacts:
    paths:
      - release-manifest.json
    reports:
      dotenv: release-manifest.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/image-credential-helper\/v|nvcf-image-credential-helper-v)/

image-credential-helper-trigger-internal-release:
  # Live in publish (not Snapshot) so that slack-notify (Snapshot) can
  # take a real needs-dependency on us. With strategy: depend this job
  # blocks until the downstream pipeline finishes, so the publish stage
  # finishes only after the digest has actually been promoted to NVCR.
  # slack-notify then announces a release that has really shipped rather
  # than racing the downstream pipeline.
  stage: publish
  needs:
    # artifacts: true picks up release-manifest.env from the
    # release-manifest job (contains NVCF_RELEASE_MANIFEST_B64 for the
    # primary path + NVCF_SOURCE_MANIFEST_JOB_ID for legacy fallback).
    - job: image-credential-helper-release-manifest
      artifacts: true
  trigger:
    project: nvcf/nvcf-internal
    branch: main
    strategy: depend
  variables:
    NVCF_SERVICE_ID: image-credential-helper
    # Primary path: the downstream validate decodes this and writes
    # release-manifest.json. No HTTP, no JOB-TOKEN allowlist.
    NVCF_RELEASE_MANIFEST_B64: "$NVCF_RELEASE_MANIFEST_B64"
    NVCF_SOURCE_REPO_URL: "$CI_PROJECT_URL"
    NVCF_SOURCE_REPO_REF: "$CI_COMMIT_TAG"
    # Legacy fallback. Drop once nvcf-internal's runFetch HTTP branch
    # is removed and no in-flight tag pipelines reference it.
    NVCF_SOURCE_PROJECT_ID: "$CI_PROJECT_ID"
    NVCF_SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    NVCF_SOURCE_MANIFEST_JOB: "image-credential-helper-release-manifest"
    NVCF_SOURCE_MANIFEST_JOB_ID: "$NVCF_SOURCE_MANIFEST_JOB_ID"
    NVCF_SOURCE_MANIFEST_PATH: "release-manifest.json"
    NVCF_SOURCE_API_URL: "$CI_API_V4_URL"
    NVCF_SOURCE_JOB_TOKEN: "$CI_JOB_TOKEN"
    NVCF_RELEASE_BACKEND: "$NVCF_RELEASE_BACKEND"
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/image-credential-helper\/v|nvcf-image-credential-helper-v)/

# Slack release notification. Mirrors the legacy upstream's
# slack-notification job from cds/nvcf-cicd-pipeline. Posts to the
# backstage-helper notify_channel endpoint, which is the
# NVIDIA-internal indirection that handles Slack auth -- no token
# required in CI. Fires only on default-branch publishes after the
# real release tag is created.
image-credential-helper-slack-notify:
  # Snapshot is the only umbrella stage after publish, where
  # semantic-release-<svc> lives. GitLab needs requires the
  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot
  # Reuse the repo-local bazel-ci image (ci/Dockerfile.bazel ships
  # both curl and jq already; both warmed on CI runners from earlier
  # pipeline stages). curlimages/curl runs as a non-root security
  # user, so an apk install step fails there with "Unable to lock
  # database: Permission denied"; bazel-ci sidesteps that and
  # avoids a per-job install altogether.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: semantic-release-image-credential-helper
      artifacts: false
      optional: true
    # Services that release through nvcf-internal replace the legacy
    # <id>-image-push with the downstream-blocking trigger-internal-release
    # job. Real dep, not optional: if promotion/build fails or the downstream
    # pipeline is skipped, slack-notify never fires.
    - job: image-credential-helper-trigger-internal-release
      artifacts: false
  tags: [eks, nvcf-cds, prod]
  variables:
    SLACK_CHANNEL_ID: C08S6KLCEJH
  script:
    - |
      # bazel-ci ships curl + jq pre-installed; no apk step needed.
      # jq handles JSON encoding of the multi-line Slack message
      # below (backslashes / quotes / newlines in commit titles and
      # author names land safely).
      # Prefer CI_COMMIT_TAG on tag pipelines so the message carries the
      # real semver (the legacy bug printed "tag: unknown" because git
      # describe runs against a shallow CI clone where the tag is not
      # reachable). Strip the current or legacy release tag prefix so the
      # message shows just the version (e.g. "1.13.0" not
      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          src/compute-plane-services/image-credential-helper/v*) TAG_DISPLAY="${CI_COMMIT_TAG#src/compute-plane-services/image-credential-helper/v}" ;;
          nvcf-image-credential-helper-v*) TAG_DISPLAY="${CI_COMMIT_TAG#nvcf-image-credential-helper-v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='src/compute-plane-services/image-credential-helper/v*' --match='nvcf-image-credential-helper-v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            src/compute-plane-services/image-credential-helper/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#src/compute-plane-services/image-credential-helper/v}" ;;
            nvcf-image-credential-helper-v*) TAG_DISPLAY="${LAST_RELEASE_TAG#nvcf-image-credential-helper-v}" ;;
          esac
        else
          TAG_DISPLAY=unknown
        fi
      fi
      # Multi-line Slack message matching the cloud-tasks convention.
      # Embedded newlines via $'\n' (ANSI-C quoting); jq --arg
      # JSON-encodes them as \n in the wire payload.
      # BT is a literal backtick (printf octal 140); Slack renders
      # backtick-wrapped values as inline code, which is the closest
      # Slack supports to highlighting the value after each label
      # (Slack has no inline text color). A literal backtick cannot
      # appear in this Go raw-string template, hence printf.
      BT=$(printf '\140')
      # By: the tagged commit's author (the merged change), not the tag
      # creator -- the release automation cuts every tag under one token.
      SLACK_MESSAGE=":rocket: ${SERVICE_NAME:-nvcf-image-credential-helper} release pipeline complete!"$'\n'
      SLACK_MESSAGE+="Project: ${BT}${CI_PROJECT_PATH}${BT} | Tag: ${BT}${TAG_DISPLAY}${BT} | Branch: ${BT}${CI_COMMIT_REF_NAME}${BT}"$'\n'
      SLACK_MESSAGE+="Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: ${BT}${CI_COMMIT_AUTHOR}${BT}"$'\n'
      SLACK_MESSAGE+="Commit Message: ${BT}${CI_COMMIT_TITLE}${BT}"
      jq -n --arg ch "${SLACK_CHANNEL_ID}" --arg msg "${SLACK_MESSAGE}" \
        '{channel_id: $ch, message: $msg}' > /tmp/slack.json
      curl -sSf -X POST 'https://backstage-helper.service.odp.nvidia.com/notify_channel?dry_run=false' \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d @/tmp/slack.json
  rules:
    # Fire only on tag pipelines. The default-branch pipeline that
    # triggered semantic-release will create the tag, which spawns a
    # second (tag-ref) pipeline; this job runs there. Firing on both
    # would post duplicate Slack messages (observed on
    # nvcf-ratelimiter-v1.13.0 release).
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/image-credential-helper\/v|nvcf-image-credential-helper-v)/

compute-next-release-version-worker-task:
  extends: .compute-next-release-version-service
  variables:
    SUBTREE: src/compute-plane-services/worker-task
    SERVICE_NAME: nvcf-worker-task
    RELEASE_TAG_PREFIX: src/compute-plane-services/worker-task/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-worker-task-v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_MERGE_REQUEST_IID
      changes: &worker_task_release_paths
        - src/compute-plane-services/worker-task/go.mod
        - src/compute-plane-services/worker-task/go.sum
        - src/compute-plane-services/worker-task/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Tag pipelines need NEXT_VERSION too: the helm-package job's
    # chart-version input reads ${NEXT_VERSION}, and the image-push
    # job's NVCF_VERSION shell fallback consumes it when set. The
    # compute job's own script falls back to stripping the matching
    # configured release prefix on tag pipelines so downstream jobs
    # stamp artifacts with the tag semver.
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-task\/v|nvcf-worker-task-v)/

semantic-release-worker-task:
  extends: .semantic-release-service
  variables:
    SUBTREE: src/compute-plane-services/worker-task
    SERVICE_NAME: nvcf-worker-task
    RELEASE_TAG_PREFIX: src/compute-plane-services/worker-task/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-worker-task-v
  needs:
    - job: compute-next-release-version-worker-task
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

worker-task-stage-nvcf-worker-task-oss:
  extends:
    - .bazel-remote-probe
  stage: Prerequisites
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
  needs:
    - job: bazel-ci-image
      optional: true
      artifacts: false
    - job: subproject-validations
      optional: true
      artifacts: false
    - job: compute-next-release-version-worker-task
      artifacts: true
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    BAZEL_DISK_CACHE: $CI_PROJECT_DIR/.bazel-cache/disk
    BAZEL_REPO_CACHE: $CI_PROJECT_DIR/.bazel-cache/repo
  cache:
    - key:
        files:
          - src/compute-plane-services/worker-task/MODULE.bazel.lock
          - src/compute-plane-services/worker-task/.bazelversion
        prefix: worker-task-bazel-repo
      paths:
        - .bazel-cache/repo/
      policy: pull
    - key:
        files:
          - src/compute-plane-services/worker-task/.bazelversion
          - src/compute-plane-services/worker-task/.bazelrc
        prefix: worker-task-bazel-disk
      paths:
        - .bazel-cache/disk/
      policy: pull
  before_script:
    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[worker-task-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[worker-task-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/compute-plane-services/worker-task
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/worker-task/v}"
      else
        echo "[worker-task-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[worker-task-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[worker-task-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-worker-task}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvcf_worker_task_oss",
          image = "//cmd:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvcf-worker-task-oss",
      )
      EOF
      echo "[worker-task-stage-image] generated staging push package:"
      sed 's/^/[worker-task-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvcf-worker-task-oss
      BAZEL_IMAGE_TARGET=//cmd:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvcf-worker-task-oss"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvcf_worker_task_oss
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvcf_worker_task_oss.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
  artifacts:
    paths:
      - release-images/push_nvcf_worker_task_oss.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-task\/v|nvcf-worker-task-v)/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging
# registry). Named <image>-image-push-mr-manual so the UI button clearly
# reads as an image push (image names are unique, so this stays distinct
# even for multi-image services).
#
# It extends the tag-time worker-task-stage-nvcf-worker-task-oss job for the build/push script
# (which branches to ncp-dev when PUSH_MR_IMAGE_TO_REGISTRY=true) plus the
# vault templates so it can fetch the ncp-dev RW key. before_script runs the
# vault setup first, then the stage job's bazel/go/crane setup. image is
# pinned to bazel-ci so the vault templates do not override it. allow_failure
# so a push failure (auth, registry quota) does not block the MR.
nvcf-worker-task-oss-image-push-mr-manual:
  extends:
    - worker-task-stage-nvcf-worker-task-oss
    - .nv-vault
    - .vault-reader-settings
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  variables:
    PUSH_MR_IMAGE_TO_REGISTRY: "true"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
    - !reference [worker-task-stage-nvcf-worker-task-oss, before_script]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *worker_task_release_paths
      when: manual
      allow_failure: true

worker-task-release-manifest:
  stage: publish
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: compute-next-release-version-worker-task
      artifacts: true
      optional: true
    - job: worker-task-stage-nvcf-worker-task-oss
      artifacts: true
  tags: [eks, nvcf-cds, prod]
  script:
    - |
      if [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/worker-task/v}"
      else
        echo "[worker-task-release-manifest] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[worker-task-release-manifest] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      python3 - <<'PY'
      import datetime
      import json
      import os
      from pathlib import Path

      images = [
          json.loads(Path("release-images/push_nvcf_worker_task_oss.json").read_text(encoding="utf-8")),
      ]
      manifest = {
          "schema_version": 1,
          "service_id": "worker-task",
          "service_name": "nvcf-worker-task",
          "source_repo_url": os.environ.get("CI_PROJECT_URL", ""),
          "source_project_id": os.environ.get("CI_PROJECT_ID", ""),
          "source_pipeline_id": os.environ.get("CI_PIPELINE_ID", ""),
          "git_sha": os.environ["CI_COMMIT_SHA"],
          "git_tag": os.environ.get("CI_COMMIT_TAG", ""),
          "version": os.environ["NVCF_VERSION"],
          "artifact_mode": "promote",
          "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "images": images,
      }
      Path(os.environ["CI_PROJECT_DIR"], "release-manifest.json").write_text(
          json.dumps(manifest, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY
      echo "[worker-task-release-manifest] wrote ${CI_PROJECT_DIR}/release-manifest.json"
    - |
      # Emit the manifest as a base64 string in the job's dotenv
      # artifact. The trigger-internal-release job below forwards it
      # to the downstream nvcf-internal pipeline as a single trigger
      # variable. Downstream validate decodes the var and writes the
      # manifest to disk -- no cross-project HTTP, no JOB-TOKEN
      # allowlist dependency, no list-pipeline-jobs endpoint quirk.
      # The legacy plumbing (NVCF_SOURCE_* variables + API fetch) is
      # also emitted as a fallback so any in-flight trigger from a
      # prior nvcf-internal main can still resolve. Slated for
      # removal once both sides have fully cut over.
      printf 'NVCF_SOURCE_MANIFEST_JOB_ID=%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/release-manifest.env"
      printf 'NVCF_RELEASE_MANIFEST_B64=%s\n' "$(base64 -w 0 release-manifest.json)" >> "${CI_PROJECT_DIR}/release-manifest.env"
      echo "[worker-task-release-manifest] dotenv keys:"
      cut -d= -f1 "${CI_PROJECT_DIR}/release-manifest.env"
  artifacts:
    paths:
      - release-manifest.json
    reports:
      dotenv: release-manifest.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-task\/v|nvcf-worker-task-v)/

worker-task-trigger-internal-release:
  # Live in publish (not Snapshot) so that slack-notify (Snapshot) can
  # take a real needs-dependency on us. With strategy: depend this job
  # blocks until the downstream pipeline finishes, so the publish stage
  # finishes only after the digest has actually been promoted to NVCR.
  # slack-notify then announces a release that has really shipped rather
  # than racing the downstream pipeline.
  stage: publish
  needs:
    # artifacts: true picks up release-manifest.env from the
    # release-manifest job (contains NVCF_RELEASE_MANIFEST_B64 for the
    # primary path + NVCF_SOURCE_MANIFEST_JOB_ID for legacy fallback).
    - job: worker-task-release-manifest
      artifacts: true
  trigger:
    project: nvcf/nvcf-internal
    branch: main
    strategy: depend
  variables:
    NVCF_SERVICE_ID: worker-task
    # Primary path: the downstream validate decodes this and writes
    # release-manifest.json. No HTTP, no JOB-TOKEN allowlist.
    NVCF_RELEASE_MANIFEST_B64: "$NVCF_RELEASE_MANIFEST_B64"
    NVCF_SOURCE_REPO_URL: "$CI_PROJECT_URL"
    NVCF_SOURCE_REPO_REF: "$CI_COMMIT_TAG"
    # Legacy fallback. Drop once nvcf-internal's runFetch HTTP branch
    # is removed and no in-flight tag pipelines reference it.
    NVCF_SOURCE_PROJECT_ID: "$CI_PROJECT_ID"
    NVCF_SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    NVCF_SOURCE_MANIFEST_JOB: "worker-task-release-manifest"
    NVCF_SOURCE_MANIFEST_JOB_ID: "$NVCF_SOURCE_MANIFEST_JOB_ID"
    NVCF_SOURCE_MANIFEST_PATH: "release-manifest.json"
    NVCF_SOURCE_API_URL: "$CI_API_V4_URL"
    NVCF_SOURCE_JOB_TOKEN: "$CI_JOB_TOKEN"
    NVCF_RELEASE_BACKEND: "$NVCF_RELEASE_BACKEND"
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-task\/v|nvcf-worker-task-v)/

# Slack release notification. Mirrors the legacy upstream's
# slack-notification job from cds/nvcf-cicd-pipeline. Posts to the
# backstage-helper notify_channel endpoint, which is the
# NVIDIA-internal indirection that handles Slack auth -- no token
# required in CI. Fires only on default-branch publishes after the
# real release tag is created.
worker-task-slack-notify:
  # Snapshot is the only umbrella stage after publish, where
  # semantic-release-<svc> lives. GitLab needs requires the
  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot
  # Reuse the repo-local bazel-ci image (ci/Dockerfile.bazel ships
  # both curl and jq already; both warmed on CI runners from earlier
  # pipeline stages). curlimages/curl runs as a non-root security
  # user, so an apk install step fails there with "Unable to lock
  # database: Permission denied"; bazel-ci sidesteps that and
  # avoids a per-job install altogether.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: semantic-release-worker-task
      artifacts: false
      optional: true
    # Services that release through nvcf-internal replace the legacy
    # <id>-image-push with the downstream-blocking trigger-internal-release
    # job. Real dep, not optional: if promotion/build fails or the downstream
    # pipeline is skipped, slack-notify never fires.
    - job: worker-task-trigger-internal-release
      artifacts: false
  tags: [eks, nvcf-cds, prod]
  variables:
    SLACK_CHANNEL_ID: C08S6KLCEJH
  script:
    - |
      # bazel-ci ships curl + jq pre-installed; no apk step needed.
      # jq handles JSON encoding of the multi-line Slack message
      # below (backslashes / quotes / newlines in commit titles and
      # author names land safely).
      # Prefer CI_COMMIT_TAG on tag pipelines so the message carries the
      # real semver (the legacy bug printed "tag: unknown" because git
      # describe runs against a shallow CI clone where the tag is not
      # reachable). Strip the current or legacy release tag prefix so the
      # message shows just the version (e.g. "1.13.0" not
      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          src/compute-plane-services/worker-task/v*) TAG_DISPLAY="${CI_COMMIT_TAG#src/compute-plane-services/worker-task/v}" ;;
          nvcf-worker-task-v*) TAG_DISPLAY="${CI_COMMIT_TAG#nvcf-worker-task-v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='src/compute-plane-services/worker-task/v*' --match='nvcf-worker-task-v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            src/compute-plane-services/worker-task/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#src/compute-plane-services/worker-task/v}" ;;
            nvcf-worker-task-v*) TAG_DISPLAY="${LAST_RELEASE_TAG#nvcf-worker-task-v}" ;;
          esac
        else
          TAG_DISPLAY=unknown
        fi
      fi
      # Multi-line Slack message matching the cloud-tasks convention.
      # Embedded newlines via $'\n' (ANSI-C quoting); jq --arg
      # JSON-encodes them as \n in the wire payload.
      # BT is a literal backtick (printf octal 140); Slack renders
      # backtick-wrapped values as inline code, which is the closest
      # Slack supports to highlighting the value after each label
      # (Slack has no inline text color). A literal backtick cannot
      # appear in this Go raw-string template, hence printf.
      BT=$(printf '\140')
      # By: the tagged commit's author (the merged change), not the tag
      # creator -- the release automation cuts every tag under one token.
      SLACK_MESSAGE=":rocket: ${SERVICE_NAME:-nvcf-worker-task} release pipeline complete!"$'\n'
      SLACK_MESSAGE+="Project: ${BT}${CI_PROJECT_PATH}${BT} | Tag: ${BT}${TAG_DISPLAY}${BT} | Branch: ${BT}${CI_COMMIT_REF_NAME}${BT}"$'\n'
      SLACK_MESSAGE+="Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: ${BT}${CI_COMMIT_AUTHOR}${BT}"$'\n'
      SLACK_MESSAGE+="Commit Message: ${BT}${CI_COMMIT_TITLE}${BT}"
      jq -n --arg ch "${SLACK_CHANNEL_ID}" --arg msg "${SLACK_MESSAGE}" \
        '{channel_id: $ch, message: $msg}' > /tmp/slack.json
      curl -sSf -X POST 'https://backstage-helper.service.odp.nvidia.com/notify_channel?dry_run=false' \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d @/tmp/slack.json
  rules:
    # Fire only on tag pipelines. The default-branch pipeline that
    # triggered semantic-release will create the tag, which spawns a
    # second (tag-ref) pipeline; this job runs there. Firing on both
    # would post duplicate Slack messages (observed on
    # nvcf-ratelimiter-v1.13.0 release).
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-task\/v|nvcf-worker-task-v)/

compute-next-release-version-nvcf-ui:
  extends: .compute-next-release-version-service
  variables:
    SUBTREE: src/control-plane-services/nvcf-ui
    SERVICE_NAME: nvcf-ui
    RELEASE_TAG_PREFIX: src/control-plane-services/nvcf-ui/v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_MERGE_REQUEST_IID
      changes: &nvcf_ui_release_paths
        - src/control-plane-services/nvcf-ui/**/*
        - deploy/helm/nvcf-ui/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Tag pipelines need NEXT_VERSION too: the helm-package job's
    # chart-version input reads ${NEXT_VERSION}, and the image-push
    # job's NVCF_VERSION shell fallback consumes it when set. The
    # compute job's own script falls back to stripping the matching
    # configured release prefix on tag pipelines so downstream jobs
    # stamp artifacts with the tag semver.
    - if: $CI_COMMIT_TAG =~ /^src\/control-plane-services\/nvcf-ui\/v/

semantic-release-nvcf-ui:
  extends: .semantic-release-service
  variables:
    SUBTREE: src/control-plane-services/nvcf-ui
    SERVICE_NAME: nvcf-ui
    RELEASE_TAG_PREFIX: src/control-plane-services/nvcf-ui/v
  needs:
    - job: compute-next-release-version-nvcf-ui
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

nvcf-ui-stage-nvcf-ui:
  extends:
    - .bazel-remote-probe
  stage: Prerequisites
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
  needs:
    - job: bazel-ci-image
      optional: true
      artifacts: false
    - job: subproject-validations
      optional: true
      artifacts: false
    - job: compute-next-release-version-nvcf-ui
      artifacts: true
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    BAZEL_DISK_CACHE: $CI_PROJECT_DIR/.bazel-cache/disk
    BAZEL_REPO_CACHE: $CI_PROJECT_DIR/.bazel-cache/repo
  cache:
    - key:
        files:
          - src/control-plane-services/nvcf-ui/MODULE.bazel.lock
          - src/control-plane-services/nvcf-ui/.bazelversion
        prefix: nvcf-ui-bazel-repo
      paths:
        - .bazel-cache/repo/
      policy: pull
    - key:
        files:
          - src/control-plane-services/nvcf-ui/.bazelversion
          - src/control-plane-services/nvcf-ui/.bazelrc
        prefix: nvcf-ui-bazel-disk
      paths:
        - .bazel-cache/disk/
      policy: pull
  before_script:
    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[nvcf-ui-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[nvcf-ui-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/control-plane-services/nvcf-ui
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/control-plane-services/nvcf-ui/v}"
      else
        echo "[nvcf-ui-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[nvcf-ui-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[nvcf-ui-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-nvcf-ui}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvcf_ui",
          image = "//:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvcf-ui",
      )
      EOF
      echo "[nvcf-ui-stage-image] generated staging push package:"
      sed 's/^/[nvcf-ui-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvcf-ui
      BAZEL_IMAGE_TARGET=//:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvcf-ui"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvcf_ui
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvcf_ui.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
  artifacts:
    paths:
      - release-images/push_nvcf_ui.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^src\/control-plane-services\/nvcf-ui\/v/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging
# registry). Named <image>-image-push-mr-manual so the UI button clearly
# reads as an image push (image names are unique, so this stays distinct
# even for multi-image services).
#
# It extends the tag-time nvcf-ui-stage-nvcf-ui job for the build/push script
# (which branches to ncp-dev when PUSH_MR_IMAGE_TO_REGISTRY=true) plus the
# vault templates so it can fetch the ncp-dev RW key. before_script runs the
# vault setup first, then the stage job's bazel/go/crane setup. image is
# pinned to bazel-ci so the vault templates do not override it. allow_failure
# so a push failure (auth, registry quota) does not block the MR.
nvcf-ui-image-push-mr-manual:
  extends:
    - nvcf-ui-stage-nvcf-ui
    - .nv-vault
    - .vault-reader-settings
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  variables:
    PUSH_MR_IMAGE_TO_REGISTRY: "true"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
    - !reference [nvcf-ui-stage-nvcf-ui, before_script]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *nvcf_ui_release_paths
      when: manual
      allow_failure: true

nvcf-ui-release-manifest:
  stage: publish
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: compute-next-release-version-nvcf-ui
      artifacts: true
      optional: true
    - job: nvcf-ui-stage-nvcf-ui
      artifacts: true
  tags: [eks, nvcf-cds, prod]
  script:
    - |
      if [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/control-plane-services/nvcf-ui/v}"
      else
        echo "[nvcf-ui-release-manifest] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[nvcf-ui-release-manifest] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      python3 - <<'PY'
      import datetime
      import json
      import os
      from pathlib import Path

      images = [
          json.loads(Path("release-images/push_nvcf_ui.json").read_text(encoding="utf-8")),
      ]
      manifest = {
          "schema_version": 1,
          "service_id": "nvcf-ui",
          "service_name": "nvcf-ui",
          "source_repo_url": os.environ.get("CI_PROJECT_URL", ""),
          "source_project_id": os.environ.get("CI_PROJECT_ID", ""),
          "source_pipeline_id": os.environ.get("CI_PIPELINE_ID", ""),
          "git_sha": os.environ["CI_COMMIT_SHA"],
          "git_tag": os.environ.get("CI_COMMIT_TAG", ""),
          "version": os.environ["NVCF_VERSION"],
          "artifact_mode": "promote",
          "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "images": images,
      }
      Path(os.environ["CI_PROJECT_DIR"], "release-manifest.json").write_text(
          json.dumps(manifest, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY
      echo "[nvcf-ui-release-manifest] wrote ${CI_PROJECT_DIR}/release-manifest.json"
    - |
      # Emit the manifest as a base64 string in the job's dotenv
      # artifact. The trigger-internal-release job below forwards it
      # to the downstream nvcf-internal pipeline as a single trigger
      # variable. Downstream validate decodes the var and writes the
      # manifest to disk -- no cross-project HTTP, no JOB-TOKEN
      # allowlist dependency, no list-pipeline-jobs endpoint quirk.
      # The legacy plumbing (NVCF_SOURCE_* variables + API fetch) is
      # also emitted as a fallback so any in-flight trigger from a
      # prior nvcf-internal main can still resolve. Slated for
      # removal once both sides have fully cut over.
      printf 'NVCF_SOURCE_MANIFEST_JOB_ID=%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/release-manifest.env"
      printf 'NVCF_RELEASE_MANIFEST_B64=%s\n' "$(base64 -w 0 release-manifest.json)" >> "${CI_PROJECT_DIR}/release-manifest.env"
      echo "[nvcf-ui-release-manifest] dotenv keys:"
      cut -d= -f1 "${CI_PROJECT_DIR}/release-manifest.env"
  artifacts:
    paths:
      - release-manifest.json
    reports:
      dotenv: release-manifest.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^src\/control-plane-services\/nvcf-ui\/v/

nvcf-ui-trigger-internal-release:
  # Live in publish (not Snapshot) so that slack-notify (Snapshot) can
  # take a real needs-dependency on us. With strategy: depend this job
  # blocks until the downstream pipeline finishes, so the publish stage
  # finishes only after the digest has actually been promoted to NVCR.
  # slack-notify then announces a release that has really shipped rather
  # than racing the downstream pipeline.
  stage: publish
  needs:
    # artifacts: true picks up release-manifest.env from the
    # release-manifest job (contains NVCF_RELEASE_MANIFEST_B64 for the
    # primary path + NVCF_SOURCE_MANIFEST_JOB_ID for legacy fallback).
    - job: nvcf-ui-release-manifest
      artifacts: true
  trigger:
    project: nvcf/nvcf-internal
    branch: main
    strategy: depend
  variables:
    NVCF_SERVICE_ID: nvcf-ui
    # Primary path: the downstream validate decodes this and writes
    # release-manifest.json. No HTTP, no JOB-TOKEN allowlist.
    NVCF_RELEASE_MANIFEST_B64: "$NVCF_RELEASE_MANIFEST_B64"
    NVCF_SOURCE_REPO_URL: "$CI_PROJECT_URL"
    NVCF_SOURCE_REPO_REF: "$CI_COMMIT_TAG"
    # Legacy fallback. Drop once nvcf-internal's runFetch HTTP branch
    # is removed and no in-flight tag pipelines reference it.
    NVCF_SOURCE_PROJECT_ID: "$CI_PROJECT_ID"
    NVCF_SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    NVCF_SOURCE_MANIFEST_JOB: "nvcf-ui-release-manifest"
    NVCF_SOURCE_MANIFEST_JOB_ID: "$NVCF_SOURCE_MANIFEST_JOB_ID"
    NVCF_SOURCE_MANIFEST_PATH: "release-manifest.json"
    NVCF_SOURCE_API_URL: "$CI_API_V4_URL"
    NVCF_SOURCE_JOB_TOKEN: "$CI_JOB_TOKEN"
    NVCF_RELEASE_BACKEND: "$NVCF_RELEASE_BACKEND"
  rules:
    - if: $CI_COMMIT_TAG =~ /^src\/control-plane-services\/nvcf-ui\/v/

# Slack release notification. Mirrors the legacy upstream's
# slack-notification job from cds/nvcf-cicd-pipeline. Posts to the
# backstage-helper notify_channel endpoint, which is the
# NVIDIA-internal indirection that handles Slack auth -- no token
# required in CI. Fires only on default-branch publishes after the
# real release tag is created.
nvcf-ui-slack-notify:
  # Snapshot is the only umbrella stage after publish, where
  # semantic-release-<svc> lives. GitLab needs requires the
  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot
  # Reuse the repo-local bazel-ci image (ci/Dockerfile.bazel ships
  # both curl and jq already; both warmed on CI runners from earlier
  # pipeline stages). curlimages/curl runs as a non-root security
  # user, so an apk install step fails there with "Unable to lock
  # database: Permission denied"; bazel-ci sidesteps that and
  # avoids a per-job install altogether.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: semantic-release-nvcf-ui
      artifacts: false
      optional: true
    # Services that release through nvcf-internal replace the legacy
    # <id>-image-push with the downstream-blocking trigger-internal-release
    # job. Real dep, not optional: if promotion/build fails or the downstream
    # pipeline is skipped, slack-notify never fires.
    - job: nvcf-ui-trigger-internal-release
      artifacts: false
  tags: [eks, nvcf-cds, prod]
  variables:
    SLACK_CHANNEL_ID: C08S6KLCEJH
  script:
    - |
      # bazel-ci ships curl + jq pre-installed; no apk step needed.
      # jq handles JSON encoding of the multi-line Slack message
      # below (backslashes / quotes / newlines in commit titles and
      # author names land safely).
      # Prefer CI_COMMIT_TAG on tag pipelines so the message carries the
      # real semver (the legacy bug printed "tag: unknown" because git
      # describe runs against a shallow CI clone where the tag is not
      # reachable). Strip the current or legacy release tag prefix so the
      # message shows just the version (e.g. "1.13.0" not
      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          src/control-plane-services/nvcf-ui/v*) TAG_DISPLAY="${CI_COMMIT_TAG#src/control-plane-services/nvcf-ui/v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='src/control-plane-services/nvcf-ui/v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            src/control-plane-services/nvcf-ui/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#src/control-plane-services/nvcf-ui/v}" ;;
          esac
        else
          TAG_DISPLAY=unknown
        fi
      fi
      # Multi-line Slack message matching the cloud-tasks convention.
      # Embedded newlines via $'\n' (ANSI-C quoting); jq --arg
      # JSON-encodes them as \n in the wire payload.
      # BT is a literal backtick (printf octal 140); Slack renders
      # backtick-wrapped values as inline code, which is the closest
      # Slack supports to highlighting the value after each label
      # (Slack has no inline text color). A literal backtick cannot
      # appear in this Go raw-string template, hence printf.
      BT=$(printf '\140')
      # By: the tagged commit's author (the merged change), not the tag
      # creator -- the release automation cuts every tag under one token.
      SLACK_MESSAGE=":rocket: ${SERVICE_NAME:-nvcf-ui} release pipeline complete!"$'\n'
      SLACK_MESSAGE+="Project: ${BT}${CI_PROJECT_PATH}${BT} | Tag: ${BT}${TAG_DISPLAY}${BT} | Branch: ${BT}${CI_COMMIT_REF_NAME}${BT}"$'\n'
      SLACK_MESSAGE+="Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: ${BT}${CI_COMMIT_AUTHOR}${BT}"$'\n'
      SLACK_MESSAGE+="Commit Message: ${BT}${CI_COMMIT_TITLE}${BT}"
      jq -n --arg ch "${SLACK_CHANNEL_ID}" --arg msg "${SLACK_MESSAGE}" \
        '{channel_id: $ch, message: $msg}' > /tmp/slack.json
      curl -sSf -X POST 'https://backstage-helper.service.odp.nvidia.com/notify_channel?dry_run=false' \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d @/tmp/slack.json
  rules:
    # Fire only on tag pipelines. The default-branch pipeline that
    # triggered semantic-release will create the tag, which spawns a
    # second (tag-ref) pipeline; this job runs there. Firing on both
    # would post duplicate Slack messages (observed on
    # nvcf-ratelimiter-v1.13.0 release).
    - if: $CI_COMMIT_TAG =~ /^src\/control-plane-services\/nvcf-ui\/v/

# Per-service extends consumed by the helm-package-nvcf-ui and
# helm-push-nvcf-ui-* jobs (instantiated from the cds-components
# include: block at the top of this file). The cds-component owns the
# concrete script (helm package + helm push to NGC); the extends below
# only add stage placement, needs, and the path-gated rules so the
# jobs run on the right pipeline kinds and pick up NEXT_VERSION from
# compute-next-release-version-nvcf-ui's dotenv.

.nvcf-ui-helm-package-extend:
  stage: publish
  needs:
    - job: compute-next-release-version-nvcf-ui
      artifacts: true
      # 'optional: true' so the YAML validator does not reject the
      # pipeline on tag refs where the depended job might not be
      # scheduled (matches the image-push pattern). On tag pipelines
      # compute-next-release-version-nvcf-ui fires (its rules
      # include the configured release tag prefix) and supplies
      # the NEXT_VERSION dotenv that chart-version reads.
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^src\/control-plane-services\/nvcf-ui\/v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *nvcf_ui_release_paths

# Helm chart push to the OCI/image-registry surface (helm push
# oci://nvcr.io/...). Replaces the legacy cds-components/helm-push-
# ngc@0.16.6, which wrote only to NGC's chart-registry API and left
# the OCI manifest absent. Self-managed-stack Helmfile pulls via
# helm pull oci://, so the OCI write is the one that matters; this
# job's helm show chart readback at the end is a mandatory
# regression guard to prevent the same drift from re-emerging silently.
helm-push-nvcf-ui-nvcf-internal:
  stage: publish
  # bazel-ci ships helm + jq + curl + unzip; alpine/helm:3.16.4 shipped
  # helm without jq, which made .vault-reader-before-script's secret
  # loop iterate 0 times and leave NGC_KEY unset (set -u then tripped
  # on the resulting unbound variable, original symptom in job
  # 336565515 on helm-admin-token-issuer-proxy-v1.4.2). Consolidating
  # on bazel-ci keeps every vault-using job on one image and reuses
  # the warmed cache from earlier pipeline stages.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: helm-package-nvcf-ui
      artifacts: true
  variables:
    NGC_PATH: "0544956542906249"
  script:
    - |
      set -euo pipefail
      NGC_KEY="${NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL}"
      if [ -z "${NGC_KEY:-}" ]; then
        echo "[helm-push-nvcf-ui-nvcf-internal] ERROR: NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL is unset; cannot login" >&2
        exit 1
      fi
      # The trailing "|| true" is load-bearing: under set -euo
      # pipefail, when ls finds no .tgz it exits non-zero, pipefail
      # surfaces that through the pipe into the command-substitution
      # exit, and set -e then kills the script before the explicit
      # empty-check below can print a useful diagnostic. Suppress the
      # pipeline exit so the guard can fire.
      chart_tgz=$(ls package/*.tgz 2>/dev/null | head -1 || true)
      if [ -z "${chart_tgz:-}" ]; then
        echo "[helm-push-nvcf-ui-nvcf-internal] ERROR: no chart .tgz under package/ (helm-package-nvcf-ui artifact missing?)" >&2
        ls -la package/ 2>&1 || true
        exit 1
      fi
      name=$(helm show chart "$chart_tgz" | awk -F': ' '/^name:/  {print $2; exit}')
      version=$(helm show chart "$chart_tgz" | awk -F': ' '/^version:/ {print $2; exit}')
      echo "[helm-push-nvcf-ui-nvcf-internal] $name:$version -> oci://nvcr.io/${NGC_PATH}"
      if ! echo "$NGC_KEY" | helm registry login nvcr.io -u '$oauthtoken' --password-stdin; then
        echo "[helm-push-nvcf-ui-nvcf-internal] ERROR: nvcr.io rejected the NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL credential (login unauthorized)." >&2
        echo "[helm-push-nvcf-ui-nvcf-internal]   Verify or rotate the NGC key behind NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL. This is not a code/CI defect." >&2
        exit 1
      fi
      helm push "$chart_tgz" "oci://nvcr.io/${NGC_PATH}"
      # Mandatory readback from the OCI surface. Without this, a regression
      # like issue #9 (chart-registry write succeeds, OCI surface 404s)
      # would slip through silently. Fails loud if the OCI manifest is
      # missing.
      helm show chart "oci://nvcr.io/${NGC_PATH}/$name" --version "$version"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^src\/control-plane-services\/nvcf-ui\/v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *nvcf_ui_release_paths

      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

worker-init-stage-nvcf-worker-init-oss:
  extends:
    - .bazel-remote-probe
  stage: Prerequisites
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
  needs:
    - job: bazel-ci-image
      optional: true
      artifacts: false
    - job: subproject-validations
      optional: true
      artifacts: false
    - job: compute-next-release-version-worker-init
      artifacts: true
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    BAZEL_DISK_CACHE: $CI_PROJECT_DIR/.bazel-cache/disk
    BAZEL_REPO_CACHE: $CI_PROJECT_DIR/.bazel-cache/repo
  cache:
    - key:
        files:
          - src/compute-plane-services/worker-init/MODULE.bazel.lock
          - src/compute-plane-services/worker-init/.bazelversion
        prefix: worker-init-bazel-repo
      paths:
        - .bazel-cache/repo/
      policy: pull
    - key:
        files:
          - src/compute-plane-services/worker-init/.bazelversion
          - src/compute-plane-services/worker-init/.bazelrc
        prefix: worker-init-bazel-disk
      paths:
        - .bazel-cache/disk/
      policy: pull
  before_script:
    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[worker-init-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[worker-init-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/compute-plane-services/worker-init
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/worker-init/v}"
      else
        echo "[worker-init-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[worker-init-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[worker-init-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-worker-init}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvcf_worker_init_oss",
          image = "//cmd:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvcf-worker-init-oss",
      )
      EOF
      echo "[worker-init-stage-image] generated staging push package:"
      sed 's/^/[worker-init-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvcf-worker-init-oss
      BAZEL_IMAGE_TARGET=//cmd:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvcf-worker-init-oss"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvcf_worker_init_oss
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvcf_worker_init_oss.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
  artifacts:
    paths:
      - release-images/push_nvcf_worker_init_oss.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-init\/v|nvcf-worker-init-v)/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging
# registry). Named <image>-image-push-mr-manual so the UI button clearly
# reads as an image push (image names are unique, so this stays distinct
# even for multi-image services).
#
# It extends the tag-time worker-init-stage-nvcf-worker-init-oss job for the build/push script
# (which branches to ncp-dev when PUSH_MR_IMAGE_TO_REGISTRY=true) plus the
# vault templates so it can fetch the ncp-dev RW key. before_script runs the
# vault setup first, then the stage job's bazel/go/crane setup. image is
# pinned to bazel-ci so the vault templates do not override it. allow_failure
# so a push failure (auth, registry quota) does not block the MR.
nvcf-worker-init-oss-image-push-mr-manual:
  extends:
    - worker-init-stage-nvcf-worker-init-oss
    - .nv-vault
    - .vault-reader-settings
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  variables:
    PUSH_MR_IMAGE_TO_REGISTRY: "true"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
    - !reference [worker-init-stage-nvcf-worker-init-oss, before_script]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *worker_init_release_paths
      when: manual
      allow_failure: true

worker-init-release-manifest:
  stage: publish
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: compute-next-release-version-worker-init
      artifacts: true
      optional: true
    - job: worker-init-stage-nvcf-worker-init-oss
      artifacts: true
  tags: [eks, nvcf-cds, prod]
  script:
    - |
      if [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/worker-init/v}"
      else
        echo "[worker-init-release-manifest] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[worker-init-release-manifest] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      python3 - <<'PY'
      import datetime
      import json
      import os
      from pathlib import Path

      images = [
          json.loads(Path("release-images/push_nvcf_worker_init_oss.json").read_text(encoding="utf-8")),
      ]
      manifest = {
          "schema_version": 1,
          "service_id": "worker-init",
          "service_name": "nvcf-worker-init",
          "source_repo_url": os.environ.get("CI_PROJECT_URL", ""),
          "source_project_id": os.environ.get("CI_PROJECT_ID", ""),
          "source_pipeline_id": os.environ.get("CI_PIPELINE_ID", ""),
          "git_sha": os.environ["CI_COMMIT_SHA"],
          "git_tag": os.environ.get("CI_COMMIT_TAG", ""),
          "version": os.environ["NVCF_VERSION"],
          "artifact_mode": "promote",
          "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "images": images,
      }
      Path(os.environ["CI_PROJECT_DIR"], "release-manifest.json").write_text(
          json.dumps(manifest, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY
      echo "[worker-init-release-manifest] wrote ${CI_PROJECT_DIR}/release-manifest.json"
    - |
      # Emit the manifest as a base64 string in the job's dotenv
      # artifact. The trigger-internal-release job below forwards it
      # to the downstream nvcf-internal pipeline as a single trigger
      # variable. Downstream validate decodes the var and writes the
      # manifest to disk -- no cross-project HTTP, no JOB-TOKEN
      # allowlist dependency, no list-pipeline-jobs endpoint quirk.
      # The legacy plumbing (NVCF_SOURCE_* variables + API fetch) is
      # also emitted as a fallback so any in-flight trigger from a
      # prior nvcf-internal main can still resolve. Slated for
      # removal once both sides have fully cut over.
      printf 'NVCF_SOURCE_MANIFEST_JOB_ID=%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/release-manifest.env"
      printf 'NVCF_RELEASE_MANIFEST_B64=%s\n' "$(base64 -w 0 release-manifest.json)" >> "${CI_PROJECT_DIR}/release-manifest.env"
      echo "[worker-init-release-manifest] dotenv keys:"
      cut -d= -f1 "${CI_PROJECT_DIR}/release-manifest.env"
  artifacts:
    paths:
      - release-manifest.json
    reports:
      dotenv: release-manifest.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-init\/v|nvcf-worker-init-v)/

worker-init-trigger-internal-release:
  # Live in publish (not Snapshot) so that slack-notify (Snapshot) can
  # take a real needs-dependency on us. With strategy: depend this job
  # blocks until the downstream pipeline finishes, so the publish stage
  # finishes only after the digest has actually been promoted to NVCR.
  # slack-notify then announces a release that has really shipped rather
  # than racing the downstream pipeline.
  stage: publish
  needs:
    # artifacts: true picks up release-manifest.env from the
    # release-manifest job (contains NVCF_RELEASE_MANIFEST_B64 for the
    # primary path + NVCF_SOURCE_MANIFEST_JOB_ID for legacy fallback).
    - job: worker-init-release-manifest
      artifacts: true
  trigger:
    project: nvcf/nvcf-internal
    branch: main
    strategy: depend
  variables:
    NVCF_SERVICE_ID: worker-init
    # Primary path: the downstream validate decodes this and writes
    # release-manifest.json. No HTTP, no JOB-TOKEN allowlist.
    NVCF_RELEASE_MANIFEST_B64: "$NVCF_RELEASE_MANIFEST_B64"
    NVCF_SOURCE_REPO_URL: "$CI_PROJECT_URL"
    NVCF_SOURCE_REPO_REF: "$CI_COMMIT_TAG"
    # Legacy fallback. Drop once nvcf-internal's runFetch HTTP branch
    # is removed and no in-flight tag pipelines reference it.
    NVCF_SOURCE_PROJECT_ID: "$CI_PROJECT_ID"
    NVCF_SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    NVCF_SOURCE_MANIFEST_JOB: "worker-init-release-manifest"
    NVCF_SOURCE_MANIFEST_JOB_ID: "$NVCF_SOURCE_MANIFEST_JOB_ID"
    NVCF_SOURCE_MANIFEST_PATH: "release-manifest.json"
    NVCF_SOURCE_API_URL: "$CI_API_V4_URL"
    NVCF_SOURCE_JOB_TOKEN: "$CI_JOB_TOKEN"
    NVCF_RELEASE_BACKEND: "$NVCF_RELEASE_BACKEND"
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-init\/v|nvcf-worker-init-v)/

# Slack release notification. Mirrors the legacy upstream's
# slack-notification job from cds/nvcf-cicd-pipeline. Posts to the
# backstage-helper notify_channel endpoint, which is the
# NVIDIA-internal indirection that handles Slack auth -- no token
# required in CI. Fires only on default-branch publishes after the
# real release tag is created.
worker-init-slack-notify:
  # Snapshot is the only umbrella stage after publish, where
  # semantic-release-<svc> lives. GitLab needs requires the
  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot
  # Reuse the repo-local bazel-ci image (ci/Dockerfile.bazel ships
  # both curl and jq already; both warmed on CI runners from earlier
  # pipeline stages). curlimages/curl runs as a non-root security
  # user, so an apk install step fails there with "Unable to lock
  # database: Permission denied"; bazel-ci sidesteps that and
  # avoids a per-job install altogether.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: semantic-release-worker-init
      artifacts: false
      optional: true
    # Services that release through nvcf-internal replace the legacy
    # <id>-image-push with the downstream-blocking trigger-internal-release
    # job. Real dep, not optional: if promotion/build fails or the downstream
    # pipeline is skipped, slack-notify never fires.
    - job: worker-init-trigger-internal-release
      artifacts: false
  tags: [eks, nvcf-cds, prod]
  variables:
    SLACK_CHANNEL_ID: C08S6KLCEJH
  script:
    - |
      # bazel-ci ships curl + jq pre-installed; no apk step needed.
      # jq handles JSON encoding of the multi-line Slack message
      # below (backslashes / quotes / newlines in commit titles and
      # author names land safely).
      # Prefer CI_COMMIT_TAG on tag pipelines so the message carries the
      # real semver (the legacy bug printed "tag: unknown" because git
      # describe runs against a shallow CI clone where the tag is not
      # reachable). Strip the current or legacy release tag prefix so the
      # message shows just the version (e.g. "1.13.0" not
      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          src/compute-plane-services/worker-init/v*) TAG_DISPLAY="${CI_COMMIT_TAG#src/compute-plane-services/worker-init/v}" ;;
          nvcf-worker-init-v*) TAG_DISPLAY="${CI_COMMIT_TAG#nvcf-worker-init-v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='src/compute-plane-services/worker-init/v*' --match='nvcf-worker-init-v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            src/compute-plane-services/worker-init/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#src/compute-plane-services/worker-init/v}" ;;
            nvcf-worker-init-v*) TAG_DISPLAY="${LAST_RELEASE_TAG#nvcf-worker-init-v}" ;;
          esac
        else
          TAG_DISPLAY=unknown
        fi
      fi
      # Multi-line Slack message matching the cloud-tasks convention.
      # Embedded newlines via $'\n' (ANSI-C quoting); jq --arg
      # JSON-encodes them as \n in the wire payload.
      # BT is a literal backtick (printf octal 140); Slack renders
      # backtick-wrapped values as inline code, which is the closest
      # Slack supports to highlighting the value after each label
      # (Slack has no inline text color). A literal backtick cannot
      # appear in this Go raw-string template, hence printf.
      BT=$(printf '\140')
      # By: the tagged commit's author (the merged change), not the tag
      # creator -- the release automation cuts every tag under one token.
      SLACK_MESSAGE=":rocket: ${SERVICE_NAME:-nvcf-worker-init} release pipeline complete!"$'\n'
      SLACK_MESSAGE+="Project: ${BT}${CI_PROJECT_PATH}${BT} | Tag: ${BT}${TAG_DISPLAY}${BT} | Branch: ${BT}${CI_COMMIT_REF_NAME}${BT}"$'\n'
      SLACK_MESSAGE+="Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: ${BT}${CI_COMMIT_AUTHOR}${BT}"$'\n'
      SLACK_MESSAGE+="Commit Message: ${BT}${CI_COMMIT_TITLE}${BT}"
      jq -n --arg ch "${SLACK_CHANNEL_ID}" --arg msg "${SLACK_MESSAGE}" \
        '{channel_id: $ch, message: $msg}' > /tmp/slack.json
      curl -sSf -X POST 'https://backstage-helper.service.odp.nvidia.com/notify_channel?dry_run=false' \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d @/tmp/slack.json
  rules:
    # Fire only on tag pipelines. The default-branch pipeline that
    # triggered semantic-release will create the tag, which spawns a
    # second (tag-ref) pipeline; this job runs there. Firing on both
    # would post duplicate Slack messages (observed on
    # nvcf-ratelimiter-v1.13.0 release).
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-init\/v|nvcf-worker-init-v)/

compute-next-release-version-worker-utils:
  extends: .compute-next-release-version-service
  variables:
    SUBTREE: src/compute-plane-services/worker-utils
    SERVICE_NAME: nvcf-worker-utils
    RELEASE_TAG_PREFIX: src/compute-plane-services/worker-utils/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-worker-utils-v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_MERGE_REQUEST_IID
      changes: &worker_utils_release_paths
        - src/compute-plane-services/worker-utils/go.mod
        - src/compute-plane-services/worker-utils/go.sum
        - src/compute-plane-services/worker-utils/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Tag pipelines need NEXT_VERSION too: the helm-package job's
    # chart-version input reads ${NEXT_VERSION}, and the image-push
    # job's NVCF_VERSION shell fallback consumes it when set. The
    # compute job's own script falls back to stripping the matching
    # configured release prefix on tag pipelines so downstream jobs
    # stamp artifacts with the tag semver.
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-utils\/v|nvcf-worker-utils-v)/

semantic-release-worker-utils:
  extends: .semantic-release-service
  variables:
    SUBTREE: src/compute-plane-services/worker-utils
    SERVICE_NAME: nvcf-worker-utils
    RELEASE_TAG_PREFIX: src/compute-plane-services/worker-utils/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-worker-utils-v
  needs:
    - job: compute-next-release-version-worker-utils
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

worker-utils-stage-nvcf-worker-utils-oss:
  extends:
    - .bazel-remote-probe
  stage: Prerequisites
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
  needs:
    - job: bazel-ci-image
      optional: true
      artifacts: false
    - job: subproject-validations
      optional: true
      artifacts: false
    - job: compute-next-release-version-worker-utils
      artifacts: true
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    BAZEL_DISK_CACHE: $CI_PROJECT_DIR/.bazel-cache/disk
    BAZEL_REPO_CACHE: $CI_PROJECT_DIR/.bazel-cache/repo
  cache:
    - key:
        files:
          - src/compute-plane-services/worker-utils/MODULE.bazel.lock
          - src/compute-plane-services/worker-utils/.bazelversion
        prefix: worker-utils-bazel-repo
      paths:
        - .bazel-cache/repo/
      policy: pull
    - key:
        files:
          - src/compute-plane-services/worker-utils/.bazelversion
          - src/compute-plane-services/worker-utils/.bazelrc
        prefix: worker-utils-bazel-disk
      paths:
        - .bazel-cache/disk/
      policy: pull
  before_script:
    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[worker-utils-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[worker-utils-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/compute-plane-services/worker-utils
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/worker-utils/v}"
      else
        echo "[worker-utils-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[worker-utils-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[worker-utils-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-worker-utils}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvcf_worker_utils_oss",
          image = "//cmd:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvcf-worker-utils-oss",
      )
      EOF
      echo "[worker-utils-stage-image] generated staging push package:"
      sed 's/^/[worker-utils-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvcf-worker-utils-oss
      BAZEL_IMAGE_TARGET=//cmd:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvcf-worker-utils-oss"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvcf_worker_utils_oss
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvcf_worker_utils_oss.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
  artifacts:
    paths:
      - release-images/push_nvcf_worker_utils_oss.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-utils\/v|nvcf-worker-utils-v)/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging
# registry). Named <image>-image-push-mr-manual so the UI button clearly
# reads as an image push (image names are unique, so this stays distinct
# even for multi-image services).
#
# It extends the tag-time worker-utils-stage-nvcf-worker-utils-oss job for the build/push script
# (which branches to ncp-dev when PUSH_MR_IMAGE_TO_REGISTRY=true) plus the
# vault templates so it can fetch the ncp-dev RW key. before_script runs the
# vault setup first, then the stage job's bazel/go/crane setup. image is
# pinned to bazel-ci so the vault templates do not override it. allow_failure
# so a push failure (auth, registry quota) does not block the MR.
nvcf-worker-utils-oss-image-push-mr-manual:
  extends:
    - worker-utils-stage-nvcf-worker-utils-oss
    - .nv-vault
    - .vault-reader-settings
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  variables:
    PUSH_MR_IMAGE_TO_REGISTRY: "true"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
    - !reference [worker-utils-stage-nvcf-worker-utils-oss, before_script]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *worker_utils_release_paths
      when: manual
      allow_failure: true

worker-utils-release-manifest:
  stage: publish
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: compute-next-release-version-worker-utils
      artifacts: true
      optional: true
    - job: worker-utils-stage-nvcf-worker-utils-oss
      artifacts: true
  tags: [eks, nvcf-cds, prod]
  script:
    - |
      if [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/worker-utils/v}"
      else
        echo "[worker-utils-release-manifest] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[worker-utils-release-manifest] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      python3 - <<'PY'
      import datetime
      import json
      import os
      from pathlib import Path

      images = [
          json.loads(Path("release-images/push_nvcf_worker_utils_oss.json").read_text(encoding="utf-8")),
      ]
      manifest = {
          "schema_version": 1,
          "service_id": "worker-utils",
          "service_name": "nvcf-worker-utils",
          "source_repo_url": os.environ.get("CI_PROJECT_URL", ""),
          "source_project_id": os.environ.get("CI_PROJECT_ID", ""),
          "source_pipeline_id": os.environ.get("CI_PIPELINE_ID", ""),
          "git_sha": os.environ["CI_COMMIT_SHA"],
          "git_tag": os.environ.get("CI_COMMIT_TAG", ""),
          "version": os.environ["NVCF_VERSION"],
          "artifact_mode": "promote",
          "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "images": images,
      }
      Path(os.environ["CI_PROJECT_DIR"], "release-manifest.json").write_text(
          json.dumps(manifest, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY
      echo "[worker-utils-release-manifest] wrote ${CI_PROJECT_DIR}/release-manifest.json"
    - |
      # Emit the manifest as a base64 string in the job's dotenv
      # artifact. The trigger-internal-release job below forwards it
      # to the downstream nvcf-internal pipeline as a single trigger
      # variable. Downstream validate decodes the var and writes the
      # manifest to disk -- no cross-project HTTP, no JOB-TOKEN
      # allowlist dependency, no list-pipeline-jobs endpoint quirk.
      # The legacy plumbing (NVCF_SOURCE_* variables + API fetch) is
      # also emitted as a fallback so any in-flight trigger from a
      # prior nvcf-internal main can still resolve. Slated for
      # removal once both sides have fully cut over.
      printf 'NVCF_SOURCE_MANIFEST_JOB_ID=%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/release-manifest.env"
      printf 'NVCF_RELEASE_MANIFEST_B64=%s\n' "$(base64 -w 0 release-manifest.json)" >> "${CI_PROJECT_DIR}/release-manifest.env"
      echo "[worker-utils-release-manifest] dotenv keys:"
      cut -d= -f1 "${CI_PROJECT_DIR}/release-manifest.env"
  artifacts:
    paths:
      - release-manifest.json
    reports:
      dotenv: release-manifest.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-utils\/v|nvcf-worker-utils-v)/

worker-utils-trigger-internal-release:
  # Live in publish (not Snapshot) so that slack-notify (Snapshot) can
  # take a real needs-dependency on us. With strategy: depend this job
  # blocks until the downstream pipeline finishes, so the publish stage
  # finishes only after the digest has actually been promoted to NVCR.
  # slack-notify then announces a release that has really shipped rather
  # than racing the downstream pipeline.
  stage: publish
  needs:
    # artifacts: true picks up release-manifest.env from the
    # release-manifest job (contains NVCF_RELEASE_MANIFEST_B64 for the
    # primary path + NVCF_SOURCE_MANIFEST_JOB_ID for legacy fallback).
    - job: worker-utils-release-manifest
      artifacts: true
  trigger:
    project: nvcf/nvcf-internal
    branch: main
    strategy: depend
  variables:
    NVCF_SERVICE_ID: worker-utils
    # Primary path: the downstream validate decodes this and writes
    # release-manifest.json. No HTTP, no JOB-TOKEN allowlist.
    NVCF_RELEASE_MANIFEST_B64: "$NVCF_RELEASE_MANIFEST_B64"
    NVCF_SOURCE_REPO_URL: "$CI_PROJECT_URL"
    NVCF_SOURCE_REPO_REF: "$CI_COMMIT_TAG"
    # Legacy fallback. Drop once nvcf-internal's runFetch HTTP branch
    # is removed and no in-flight tag pipelines reference it.
    NVCF_SOURCE_PROJECT_ID: "$CI_PROJECT_ID"
    NVCF_SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    NVCF_SOURCE_MANIFEST_JOB: "worker-utils-release-manifest"
    NVCF_SOURCE_MANIFEST_JOB_ID: "$NVCF_SOURCE_MANIFEST_JOB_ID"
    NVCF_SOURCE_MANIFEST_PATH: "release-manifest.json"
    NVCF_SOURCE_API_URL: "$CI_API_V4_URL"
    NVCF_SOURCE_JOB_TOKEN: "$CI_JOB_TOKEN"
    NVCF_RELEASE_BACKEND: "$NVCF_RELEASE_BACKEND"
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-utils\/v|nvcf-worker-utils-v)/

# Slack release notification. Mirrors the legacy upstream's
# slack-notification job from cds/nvcf-cicd-pipeline. Posts to the
# backstage-helper notify_channel endpoint, which is the
# NVIDIA-internal indirection that handles Slack auth -- no token
# required in CI. Fires only on default-branch publishes after the
# real release tag is created.
worker-utils-slack-notify:
  # Snapshot is the only umbrella stage after publish, where
  # semantic-release-<svc> lives. GitLab needs requires the
  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot
  # Reuse the repo-local bazel-ci image (ci/Dockerfile.bazel ships
  # both curl and jq already; both warmed on CI runners from earlier
  # pipeline stages). curlimages/curl runs as a non-root security
  # user, so an apk install step fails there with "Unable to lock
  # database: Permission denied"; bazel-ci sidesteps that and
  # avoids a per-job install altogether.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: semantic-release-worker-utils
      artifacts: false
      optional: true
    # Services that release through nvcf-internal replace the legacy
    # <id>-image-push with the downstream-blocking trigger-internal-release
    # job. Real dep, not optional: if promotion/build fails or the downstream
    # pipeline is skipped, slack-notify never fires.
    - job: worker-utils-trigger-internal-release
      artifacts: false
  tags: [eks, nvcf-cds, prod]
  variables:
    SLACK_CHANNEL_ID: C08S6KLCEJH
  script:
    - |
      # bazel-ci ships curl + jq pre-installed; no apk step needed.
      # jq handles JSON encoding of the multi-line Slack message
      # below (backslashes / quotes / newlines in commit titles and
      # author names land safely).
      # Prefer CI_COMMIT_TAG on tag pipelines so the message carries the
      # real semver (the legacy bug printed "tag: unknown" because git
      # describe runs against a shallow CI clone where the tag is not
      # reachable). Strip the current or legacy release tag prefix so the
      # message shows just the version (e.g. "1.13.0" not
      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          src/compute-plane-services/worker-utils/v*) TAG_DISPLAY="${CI_COMMIT_TAG#src/compute-plane-services/worker-utils/v}" ;;
          nvcf-worker-utils-v*) TAG_DISPLAY="${CI_COMMIT_TAG#nvcf-worker-utils-v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='src/compute-plane-services/worker-utils/v*' --match='nvcf-worker-utils-v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            src/compute-plane-services/worker-utils/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#src/compute-plane-services/worker-utils/v}" ;;
            nvcf-worker-utils-v*) TAG_DISPLAY="${LAST_RELEASE_TAG#nvcf-worker-utils-v}" ;;
          esac
        else
          TAG_DISPLAY=unknown
        fi
      fi
      # Multi-line Slack message matching the cloud-tasks convention.
      # Embedded newlines via $'\n' (ANSI-C quoting); jq --arg
      # JSON-encodes them as \n in the wire payload.
      # BT is a literal backtick (printf octal 140); Slack renders
      # backtick-wrapped values as inline code, which is the closest
      # Slack supports to highlighting the value after each label
      # (Slack has no inline text color). A literal backtick cannot
      # appear in this Go raw-string template, hence printf.
      BT=$(printf '\140')
      # By: the tagged commit's author (the merged change), not the tag
      # creator -- the release automation cuts every tag under one token.
      SLACK_MESSAGE=":rocket: ${SERVICE_NAME:-nvcf-worker-utils} release pipeline complete!"$'\n'
      SLACK_MESSAGE+="Project: ${BT}${CI_PROJECT_PATH}${BT} | Tag: ${BT}${TAG_DISPLAY}${BT} | Branch: ${BT}${CI_COMMIT_REF_NAME}${BT}"$'\n'
      SLACK_MESSAGE+="Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: ${BT}${CI_COMMIT_AUTHOR}${BT}"$'\n'
      SLACK_MESSAGE+="Commit Message: ${BT}${CI_COMMIT_TITLE}${BT}"
      jq -n --arg ch "${SLACK_CHANNEL_ID}" --arg msg "${SLACK_MESSAGE}" \
        '{channel_id: $ch, message: $msg}' > /tmp/slack.json
      curl -sSf -X POST 'https://backstage-helper.service.odp.nvidia.com/notify_channel?dry_run=false' \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d @/tmp/slack.json
  rules:
    # Fire only on tag pipelines. The default-branch pipeline that
    # triggered semantic-release will create the tag, which spawns a
    # second (tag-ref) pipeline; this job runs there. Firing on both
    # would post duplicate Slack messages (observed on
    # nvcf-ratelimiter-v1.13.0 release).
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-utils\/v|nvcf-worker-utils-v)/

compute-next-release-version-worker-llm-credentials:
  extends: .compute-next-release-version-service
  variables:
    SUBTREE: src/compute-plane-services/worker-llm-credentials
    SERVICE_NAME: nvcf-worker-llm-credentials
    RELEASE_TAG_PREFIX: src/compute-plane-services/worker-llm-credentials/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-worker-llm-credentials-v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_MERGE_REQUEST_IID
      changes: &worker_llm_credentials_release_paths
        - src/compute-plane-services/worker-llm-credentials/go.mod
        - src/compute-plane-services/worker-llm-credentials/go.sum
        - src/compute-plane-services/worker-llm-credentials/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Tag pipelines need NEXT_VERSION too: the helm-package job's
    # chart-version input reads ${NEXT_VERSION}, and the image-push
    # job's NVCF_VERSION shell fallback consumes it when set. The
    # compute job's own script falls back to stripping the matching
    # configured release prefix on tag pipelines so downstream jobs
    # stamp artifacts with the tag semver.
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-llm-credentials\/v|nvcf-worker-llm-credentials-v)/

semantic-release-worker-llm-credentials:
  extends: .semantic-release-service
  variables:
    SUBTREE: src/compute-plane-services/worker-llm-credentials
    SERVICE_NAME: nvcf-worker-llm-credentials
    RELEASE_TAG_PREFIX: src/compute-plane-services/worker-llm-credentials/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-worker-llm-credentials-v
  needs:
    - job: compute-next-release-version-worker-llm-credentials
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

worker-llm-credentials-stage-nvcf-worker-llm-credentials-oss:
  extends:
    - .bazel-remote-probe
  stage: Prerequisites
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
  needs:
    - job: bazel-ci-image
      optional: true
      artifacts: false
    - job: subproject-validations
      optional: true
      artifacts: false
    - job: compute-next-release-version-worker-llm-credentials
      artifacts: true
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    BAZEL_DISK_CACHE: $CI_PROJECT_DIR/.bazel-cache/disk
    BAZEL_REPO_CACHE: $CI_PROJECT_DIR/.bazel-cache/repo
  cache:
    - key:
        files:
          - src/compute-plane-services/worker-llm-credentials/MODULE.bazel.lock
          - src/compute-plane-services/worker-llm-credentials/.bazelversion
        prefix: worker-llm-credentials-bazel-repo
      paths:
        - .bazel-cache/repo/
      policy: pull
    - key:
        files:
          - src/compute-plane-services/worker-llm-credentials/.bazelversion
          - src/compute-plane-services/worker-llm-credentials/.bazelrc
        prefix: worker-llm-credentials-bazel-disk
      paths:
        - .bazel-cache/disk/
      policy: pull
  before_script:
    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[worker-llm-credentials-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[worker-llm-credentials-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/compute-plane-services/worker-llm-credentials
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/worker-llm-credentials/v}"
      else
        echo "[worker-llm-credentials-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[worker-llm-credentials-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[worker-llm-credentials-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-worker-llm-credentials}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvcf_worker_llm_credentials_oss",
          image = "//cmd:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvcf-worker-llm-credentials-oss",
      )
      EOF
      echo "[worker-llm-credentials-stage-image] generated staging push package:"
      sed 's/^/[worker-llm-credentials-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvcf-worker-llm-credentials-oss
      BAZEL_IMAGE_TARGET=//cmd:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvcf-worker-llm-credentials-oss"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvcf_worker_llm_credentials_oss
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvcf_worker_llm_credentials_oss.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
  artifacts:
    paths:
      - release-images/push_nvcf_worker_llm_credentials_oss.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-llm-credentials\/v|nvcf-worker-llm-credentials-v)/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging
# registry). Named <image>-image-push-mr-manual so the UI button clearly
# reads as an image push (image names are unique, so this stays distinct
# even for multi-image services).
#
# It extends the tag-time worker-llm-credentials-stage-nvcf-worker-llm-credentials-oss job for the build/push script
# (which branches to ncp-dev when PUSH_MR_IMAGE_TO_REGISTRY=true) plus the
# vault templates so it can fetch the ncp-dev RW key. before_script runs the
# vault setup first, then the stage job's bazel/go/crane setup. image is
# pinned to bazel-ci so the vault templates do not override it. allow_failure
# so a push failure (auth, registry quota) does not block the MR.
nvcf-worker-llm-credentials-oss-image-push-mr-manual:
  extends:
    - worker-llm-credentials-stage-nvcf-worker-llm-credentials-oss
    - .nv-vault
    - .vault-reader-settings
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  variables:
    PUSH_MR_IMAGE_TO_REGISTRY: "true"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
    - !reference [worker-llm-credentials-stage-nvcf-worker-llm-credentials-oss, before_script]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *worker_llm_credentials_release_paths
      when: manual
      allow_failure: true

worker-llm-credentials-release-manifest:
  stage: publish
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: compute-next-release-version-worker-llm-credentials
      artifacts: true
      optional: true
    - job: worker-llm-credentials-stage-nvcf-worker-llm-credentials-oss
      artifacts: true
  tags: [eks, nvcf-cds, prod]
  script:
    - |
      if [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/worker-llm-credentials/v}"
      else
        echo "[worker-llm-credentials-release-manifest] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[worker-llm-credentials-release-manifest] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      python3 - <<'PY'
      import datetime
      import json
      import os
      from pathlib import Path

      images = [
          json.loads(Path("release-images/push_nvcf_worker_llm_credentials_oss.json").read_text(encoding="utf-8")),
      ]
      manifest = {
          "schema_version": 1,
          "service_id": "worker-llm-credentials",
          "service_name": "nvcf-worker-llm-credentials",
          "source_repo_url": os.environ.get("CI_PROJECT_URL", ""),
          "source_project_id": os.environ.get("CI_PROJECT_ID", ""),
          "source_pipeline_id": os.environ.get("CI_PIPELINE_ID", ""),
          "git_sha": os.environ["CI_COMMIT_SHA"],
          "git_tag": os.environ.get("CI_COMMIT_TAG", ""),
          "version": os.environ["NVCF_VERSION"],
          "artifact_mode": "promote",
          "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "images": images,
      }
      Path(os.environ["CI_PROJECT_DIR"], "release-manifest.json").write_text(
          json.dumps(manifest, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY
      echo "[worker-llm-credentials-release-manifest] wrote ${CI_PROJECT_DIR}/release-manifest.json"
    - |
      # Emit the manifest as a base64 string in the job's dotenv
      # artifact. The trigger-internal-release job below forwards it
      # to the downstream nvcf-internal pipeline as a single trigger
      # variable. Downstream validate decodes the var and writes the
      # manifest to disk -- no cross-project HTTP, no JOB-TOKEN
      # allowlist dependency, no list-pipeline-jobs endpoint quirk.
      # The legacy plumbing (NVCF_SOURCE_* variables + API fetch) is
      # also emitted as a fallback so any in-flight trigger from a
      # prior nvcf-internal main can still resolve. Slated for
      # removal once both sides have fully cut over.
      printf 'NVCF_SOURCE_MANIFEST_JOB_ID=%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/release-manifest.env"
      printf 'NVCF_RELEASE_MANIFEST_B64=%s\n' "$(base64 -w 0 release-manifest.json)" >> "${CI_PROJECT_DIR}/release-manifest.env"
      echo "[worker-llm-credentials-release-manifest] dotenv keys:"
      cut -d= -f1 "${CI_PROJECT_DIR}/release-manifest.env"
  artifacts:
    paths:
      - release-manifest.json
    reports:
      dotenv: release-manifest.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-llm-credentials\/v|nvcf-worker-llm-credentials-v)/

worker-llm-credentials-trigger-internal-release:
  # Live in publish (not Snapshot) so that slack-notify (Snapshot) can
  # take a real needs-dependency on us. With strategy: depend this job
  # blocks until the downstream pipeline finishes, so the publish stage
  # finishes only after the digest has actually been promoted to NVCR.
  # slack-notify then announces a release that has really shipped rather
  # than racing the downstream pipeline.
  stage: publish
  needs:
    # artifacts: true picks up release-manifest.env from the
    # release-manifest job (contains NVCF_RELEASE_MANIFEST_B64 for the
    # primary path + NVCF_SOURCE_MANIFEST_JOB_ID for legacy fallback).
    - job: worker-llm-credentials-release-manifest
      artifacts: true
  trigger:
    project: nvcf/nvcf-internal
    branch: main
    strategy: depend
  variables:
    NVCF_SERVICE_ID: worker-llm-credentials
    # Primary path: the downstream validate decodes this and writes
    # release-manifest.json. No HTTP, no JOB-TOKEN allowlist.
    NVCF_RELEASE_MANIFEST_B64: "$NVCF_RELEASE_MANIFEST_B64"
    NVCF_SOURCE_REPO_URL: "$CI_PROJECT_URL"
    NVCF_SOURCE_REPO_REF: "$CI_COMMIT_TAG"
    # Legacy fallback. Drop once nvcf-internal's runFetch HTTP branch
    # is removed and no in-flight tag pipelines reference it.
    NVCF_SOURCE_PROJECT_ID: "$CI_PROJECT_ID"
    NVCF_SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    NVCF_SOURCE_MANIFEST_JOB: "worker-llm-credentials-release-manifest"
    NVCF_SOURCE_MANIFEST_JOB_ID: "$NVCF_SOURCE_MANIFEST_JOB_ID"
    NVCF_SOURCE_MANIFEST_PATH: "release-manifest.json"
    NVCF_SOURCE_API_URL: "$CI_API_V4_URL"
    NVCF_SOURCE_JOB_TOKEN: "$CI_JOB_TOKEN"
    NVCF_RELEASE_BACKEND: "$NVCF_RELEASE_BACKEND"
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/worker-llm-credentials\/v|nvcf-worker-llm-credentials-v)/

# Slack release notification. Mirrors the legacy upstream's
# slack-notification job from cds/nvcf-cicd-pipeline. Posts to the
# backstage-helper notify_channel endpoint, which is the
# NVIDIA-internal indirection that handles Slack auth -- no token
# required in CI. Fires only on default-branch publishes after the
# real release tag is created.
worker-llm-credentials-slack-notify:
  # Snapshot is the only umbrella stage after publish, where
  # semantic-release-<svc> lives. GitLab needs requires the
  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot

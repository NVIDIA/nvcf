    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(deploy\/helm\/api-keys-colocated\/v|helm-nvcf-api-keys-v)/

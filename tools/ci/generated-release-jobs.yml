    - if: $CI_COMMIT_BRANCH =~ /^release-src\/compute-plane-services\/nvca\/v[0-9]+\.[0-9]+$/

nvca-stage-nvca:
  extends:
    - .bazel-remote-probe
  stage: Prerequisites
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
  needs:
    - job: bazel-ci-image
      optional: true
      artifacts: false
    - job: subproject-validations
      optional: true
      artifacts: false
    - job: compute-next-release-version-nvca
      artifacts: true
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    BAZEL_DISK_CACHE: $CI_PROJECT_DIR/.bazel-cache/disk
    BAZEL_REPO_CACHE: $CI_PROJECT_DIR/.bazel-cache/repo
  cache:
    - key:
        files:
          - src/compute-plane-services/nvca/MODULE.bazel.lock
          - src/compute-plane-services/nvca/.bazelversion
        prefix: nvca-bazel-repo
      paths:
        - .bazel-cache/repo/
      policy: pull
    - key:
        files:
          - src/compute-plane-services/nvca/.bazelversion
          - src/compute-plane-services/nvca/.bazelrc
        prefix: nvca-bazel-disk
      paths:
        - .bazel-cache/disk/
      policy: pull
  before_script:
    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[nvca-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[nvca-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/compute-plane-services/nvca
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/nvca/v}"
      else
        echo "[nvca-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[nvca-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[nvca-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-nvca}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvca",
          image = "//cmd/nvca:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvca",
      )
      EOF
      echo "[nvca-stage-image] generated staging push package:"
      sed 's/^/[nvca-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvca
      BAZEL_IMAGE_TARGET=//cmd/nvca:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvca"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvca
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvca.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
  artifacts:
    paths:
      - release-images/push_nvca.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/nvca\/v|nvca-v)/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging

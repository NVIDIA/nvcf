    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[vanity-gateway-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[vanity-gateway-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/invocation-plane-services/vanity-gateway
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/invocation-plane-services/vanity-gateway/v}"
      else
        echo "[vanity-gateway-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[vanity-gateway-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[vanity-gateway-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-vanity-gateway}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvcf_ai_api_gateway_service",
          image = "//:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvcf-ai-api-gateway-service",
      )
      EOF
      echo "[vanity-gateway-stage-image] generated staging push package:"
      sed 's/^/[vanity-gateway-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvcf-ai-api-gateway-service
      BAZEL_IMAGE_TARGET=//:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvcf-ai-api-gateway-service"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvcf_ai_api_gateway_service
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvcf_ai_api_gateway_service.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
  artifacts:
    paths:
      - release-images/push_nvcf_ai_api_gateway_service.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/invocation-plane-services\/vanity-gateway\/v|nvcf-ai-api-gateway-service-v)/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging
# registry). Named <image>-image-push-mr-manual so the UI button clearly
# reads as an image push (image names are unique, so this stays distinct
# even for multi-image services).
#
# It extends the tag-time vanity-gateway-stage-nvcf-ai-api-gateway-service job for the build/push script
# (which branches to ncp-dev when PUSH_MR_IMAGE_TO_REGISTRY=true) plus the
# vault templates so it can fetch the ncp-dev RW key. before_script runs the
# vault setup first, then the stage job's bazel/go/crane setup. image is
# pinned to bazel-ci so the vault templates do not override it. allow_failure
# so a push failure (auth, registry quota) does not block the MR.
nvcf-ai-api-gateway-service-image-push-mr-manual:
  extends:
    - vanity-gateway-stage-nvcf-ai-api-gateway-service
    - .nv-vault
    - .vault-reader-settings
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  variables:
    PUSH_MR_IMAGE_TO_REGISTRY: "true"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
    - !reference [vanity-gateway-stage-nvcf-ai-api-gateway-service, before_script]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *vanity_gateway_release_paths
      when: manual
      allow_failure: true

vanity-gateway-release-manifest:
  stage: publish
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: compute-next-release-version-vanity-gateway
      artifacts: true
      optional: true
    - job: vanity-gateway-stage-nvcf-ai-api-gateway-service
      artifacts: true
  tags: [eks, nvcf-cds, prod]
  script:
    - |
      if [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/invocation-plane-services/vanity-gateway/v}"
      else
        echo "[vanity-gateway-release-manifest] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[vanity-gateway-release-manifest] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      python3 - <<'PY'
      import datetime
      import json
      import os
      from pathlib import Path

      images = [
          json.loads(Path("release-images/push_nvcf_ai_api_gateway_service.json").read_text(encoding="utf-8")),
      ]
      manifest = {
          "schema_version": 1,
          "service_id": "vanity-gateway",
          "service_name": "nvcf-ai-api-gateway-service",
          "source_repo_url": os.environ.get("CI_PROJECT_URL", ""),
          "source_project_id": os.environ.get("CI_PROJECT_ID", ""),
          "source_pipeline_id": os.environ.get("CI_PIPELINE_ID", ""),
          "git_sha": os.environ["CI_COMMIT_SHA"],
          "git_tag": os.environ.get("CI_COMMIT_TAG", ""),
          "version": os.environ["NVCF_VERSION"],
          "artifact_mode": "promote",
          "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "images": images,
      }
      Path(os.environ["CI_PROJECT_DIR"], "release-manifest.json").write_text(
          json.dumps(manifest, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY
      echo "[vanity-gateway-release-manifest] wrote ${CI_PROJECT_DIR}/release-manifest.json"
    - |
      # Emit the manifest as a base64 string in the job's dotenv
      # artifact. The trigger-internal-release job below forwards it
      # to the downstream nvcf-internal pipeline as a single trigger
      # variable. Downstream validate decodes the var and writes the
      # manifest to disk -- no cross-project HTTP, no JOB-TOKEN
      # allowlist dependency, no list-pipeline-jobs endpoint quirk.
      # The legacy plumbing (NVCF_SOURCE_* variables + API fetch) is
      # also emitted as a fallback so any in-flight trigger from a
      # prior nvcf-internal main can still resolve. Slated for
      # removal once both sides have fully cut over.
      printf 'NVCF_SOURCE_MANIFEST_JOB_ID=%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/release-manifest.env"
      printf 'NVCF_RELEASE_MANIFEST_B64=%s\n' "$(base64 -w 0 release-manifest.json)" >> "${CI_PROJECT_DIR}/release-manifest.env"
      echo "[vanity-gateway-release-manifest] dotenv keys:"
      cut -d= -f1 "${CI_PROJECT_DIR}/release-manifest.env"
  artifacts:
    paths:
      - release-manifest.json
    reports:
      dotenv: release-manifest.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/invocation-plane-services\/vanity-gateway\/v|nvcf-ai-api-gateway-service-v)/

vanity-gateway-trigger-internal-release:
  # Live in publish (not Snapshot) so that slack-notify (Snapshot) can
  # take a real needs-dependency on us. With strategy: depend this job
  # blocks until the downstream pipeline finishes, so the publish stage
  # finishes only after the digest has actually been promoted to NVCR.
  # slack-notify then announces a release that has really shipped rather
  # than racing the downstream pipeline.
  stage: publish
  needs:
    # artifacts: true picks up release-manifest.env from the
    # release-manifest job (contains NVCF_RELEASE_MANIFEST_B64 for the
    # primary path + NVCF_SOURCE_MANIFEST_JOB_ID for legacy fallback).
    - job: vanity-gateway-release-manifest
      artifacts: true
  trigger:
    project: nvcf/nvcf-internal
    branch: main
    strategy: depend
  variables:
    NVCF_SERVICE_ID: vanity-gateway
    # Primary path: the downstream validate decodes this and writes
    # release-manifest.json. No HTTP, no JOB-TOKEN allowlist.
    NVCF_RELEASE_MANIFEST_B64: "$NVCF_RELEASE_MANIFEST_B64"
    NVCF_SOURCE_REPO_URL: "$CI_PROJECT_URL"
    NVCF_SOURCE_REPO_REF: "$CI_COMMIT_TAG"
    # Legacy fallback. Drop once nvcf-internal's runFetch HTTP branch
    # is removed and no in-flight tag pipelines reference it.
    NVCF_SOURCE_PROJECT_ID: "$CI_PROJECT_ID"
    NVCF_SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    NVCF_SOURCE_MANIFEST_JOB: "vanity-gateway-release-manifest"
    NVCF_SOURCE_MANIFEST_JOB_ID: "$NVCF_SOURCE_MANIFEST_JOB_ID"
    NVCF_SOURCE_MANIFEST_PATH: "release-manifest.json"
    NVCF_SOURCE_API_URL: "$CI_API_V4_URL"
    NVCF_SOURCE_JOB_TOKEN: "$CI_JOB_TOKEN"
    NVCF_RELEASE_BACKEND: "$NVCF_RELEASE_BACKEND"
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/invocation-plane-services\/vanity-gateway\/v|nvcf-ai-api-gateway-service-v)/

# Slack release notification. Mirrors the legacy upstream's
# slack-notification job from cds/nvcf-cicd-pipeline. Posts to the
# backstage-helper notify_channel endpoint, which is the
# NVIDIA-internal indirection that handles Slack auth -- no token
# required in CI. Fires only on default-branch publishes after the
# real release tag is created.
vanity-gateway-slack-notify:
  # Snapshot is the only umbrella stage after publish, where
  # semantic-release-<svc> lives. GitLab needs requires the
  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot
  # Reuse the repo-local bazel-ci image (ci/Dockerfile.bazel ships
  # both curl and jq already; both warmed on CI runners from earlier
  # pipeline stages). curlimages/curl runs as a non-root security
  # user, so an apk install step fails there with "Unable to lock
  # database: Permission denied"; bazel-ci sidesteps that and
  # avoids a per-job install altogether.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: semantic-release-vanity-gateway
      artifacts: false
      optional: true
    # Services that release through nvcf-internal replace the legacy
    # <id>-image-push with the downstream-blocking trigger-internal-release
    # job. Real dep, not optional: if promotion/build fails or the downstream
    # pipeline is skipped, slack-notify never fires.
    - job: vanity-gateway-trigger-internal-release
      artifacts: false
  tags: [eks, nvcf-cds, prod]
  variables:
    SLACK_CHANNEL_ID: C08S6KLCEJH
  script:
    - |
      # bazel-ci ships curl + jq pre-installed; no apk step needed.
      # jq handles JSON encoding of the multi-line Slack message
      # below (backslashes / quotes / newlines in commit titles and
      # author names land safely).
      # Prefer CI_COMMIT_TAG on tag pipelines so the message carries the
      # real semver (the legacy bug printed "tag: unknown" because git
      # describe runs against a shallow CI clone where the tag is not
      # reachable). Strip the current or legacy release tag prefix so the
      # message shows just the version (e.g. "1.13.0" not
      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          src/invocation-plane-services/vanity-gateway/v*) TAG_DISPLAY="${CI_COMMIT_TAG#src/invocation-plane-services/vanity-gateway/v}" ;;
          nvcf-ai-api-gateway-service-v*) TAG_DISPLAY="${CI_COMMIT_TAG#nvcf-ai-api-gateway-service-v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='src/invocation-plane-services/vanity-gateway/v*' --match='nvcf-ai-api-gateway-service-v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            src/invocation-plane-services/vanity-gateway/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#src/invocation-plane-services/vanity-gateway/v}" ;;
            nvcf-ai-api-gateway-service-v*) TAG_DISPLAY="${LAST_RELEASE_TAG#nvcf-ai-api-gateway-service-v}" ;;
          esac
        else
          TAG_DISPLAY=unknown
        fi
      fi
      # Multi-line Slack message matching the cloud-tasks convention.
      # Embedded newlines via $'\n' (ANSI-C quoting); jq --arg
      # JSON-encodes them as \n in the wire payload.
      # BT is a literal backtick (printf octal 140); Slack renders
      # backtick-wrapped values as inline code, which is the closest
      # Slack supports to highlighting the value after each label
      # (Slack has no inline text color). A literal backtick cannot
      # appear in this Go raw-string template, hence printf.
      BT=$(printf '\140')
      # By: the tagged commit's author (the merged change), not the tag
      # creator -- the release automation cuts every tag under one token.
      SLACK_MESSAGE=":rocket: ${SERVICE_NAME:-nvcf-ai-api-gateway-service} release pipeline complete!"$'\n'
      SLACK_MESSAGE+="Project: ${BT}${CI_PROJECT_PATH}${BT} | Tag: ${BT}${TAG_DISPLAY}${BT} | Branch: ${BT}${CI_COMMIT_REF_NAME}${BT}"$'\n'
      SLACK_MESSAGE+="Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: ${BT}${CI_COMMIT_AUTHOR}${BT}"$'\n'
      SLACK_MESSAGE+="Commit Message: ${BT}${CI_COMMIT_TITLE}${BT}"
      jq -n --arg ch "${SLACK_CHANNEL_ID}" --arg msg "${SLACK_MESSAGE}" \
        '{channel_id: $ch, message: $msg}' > /tmp/slack.json
      curl -sSf -X POST 'https://backstage-helper.service.odp.nvidia.com/notify_channel?dry_run=false' \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d @/tmp/slack.json
  rules:
    # Fire only on tag pipelines. The default-branch pipeline that
    # triggered semantic-release will create the tag, which spawns a
    # second (tag-ref) pipeline; this job runs there. Firing on both
    # would post duplicate Slack messages (observed on
    # nvcf-ratelimiter-v1.13.0 release).
    - if: $CI_COMMIT_TAG =~ /^(src\/invocation-plane-services\/vanity-gateway\/v|nvcf-ai-api-gateway-service-v)/

compute-next-release-version-function-autoscaler:
  extends: .compute-next-release-version-service
  variables:
    SUBTREE: src/control-plane-services/function-autoscaler
    SERVICE_NAME: nvcf-function-autoscaler
    RELEASE_TAG_PREFIX: src/control-plane-services/function-autoscaler/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-function-autoscaler-v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_MERGE_REQUEST_IID
      changes: &function_autoscaler_release_paths
        - src/control-plane-services/function-autoscaler/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Tag pipelines need NEXT_VERSION too: the helm-package job's
    # chart-version input reads ${NEXT_VERSION}, and the image-push
    # job's NVCF_VERSION shell fallback consumes it when set. The
    # compute job's own script falls back to stripping the matching
    # configured release prefix on tag pipelines so downstream jobs
    # stamp artifacts with the tag semver.
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/function-autoscaler\/v|nvcf-function-autoscaler-v)/

semantic-release-function-autoscaler:
  extends: .semantic-release-service
  variables:
    SUBTREE: src/control-plane-services/function-autoscaler
    SERVICE_NAME: nvcf-function-autoscaler
    RELEASE_TAG_PREFIX: src/control-plane-services/function-autoscaler/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-function-autoscaler-v
  needs:
    - job: compute-next-release-version-function-autoscaler
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

function-autoscaler-stage-nvcf-function-autoscaler:
  extends:
    - .bazel-remote-probe
  stage: Prerequisites
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
  needs:
    - job: bazel-ci-image
      optional: true
      artifacts: false
    - job: subproject-validations
      optional: true
      artifacts: false
    - job: compute-next-release-version-function-autoscaler
      artifacts: true
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    BAZEL_DISK_CACHE: $CI_PROJECT_DIR/.bazel-cache/disk
    BAZEL_REPO_CACHE: $CI_PROJECT_DIR/.bazel-cache/repo
  cache:
    - key:
        files:
          - src/control-plane-services/function-autoscaler/MODULE.bazel.lock
          - src/control-plane-services/function-autoscaler/.bazelversion
        prefix: function-autoscaler-bazel-repo
      paths:
        - .bazel-cache/repo/
      policy: pull
    - key:
        files:
          - src/control-plane-services/function-autoscaler/.bazelversion
          - src/control-plane-services/function-autoscaler/.bazelrc
        prefix: function-autoscaler-bazel-disk
      paths:
        - .bazel-cache/disk/
      policy: pull
  before_script:
    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[function-autoscaler-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[function-autoscaler-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/control-plane-services/function-autoscaler
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/control-plane-services/function-autoscaler/v}"
      else
        echo "[function-autoscaler-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[function-autoscaler-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[function-autoscaler-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-function-autoscaler}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvcf_function_autoscaler",
          image = "//crates/server:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvcf-function-autoscaler",
      )
      EOF
      echo "[function-autoscaler-stage-image] generated staging push package:"
      sed 's/^/[function-autoscaler-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvcf-function-autoscaler
      BAZEL_IMAGE_TARGET=//crates/server:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvcf-function-autoscaler"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvcf_function_autoscaler
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvcf_function_autoscaler.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        MR_PUSH_AUTH=$(printf '$oauthtoken:%s' "${RS_AUTOSCALER_TOKEN}" | base64 -w0)
        # Merge a PATH-SCOPED auth entry for this push repo into the docker
        # config. Never a bare-host login: a host-wide nvcr.io key would be
        # longest-prefix matched onto the anonymous distroless base pull and
        # 403 it on a cache miss (NVCF-10337), and a plain overwrite would
        # clobber the scoped ncp-dev entry the primary MR push relies on.
        [ -f ~/.docker/config.json ] || { mkdir -p ~/.docker; echo '{}' > ~/.docker/config.json; }
        tmp=$(mktemp)
        jq --arg r "nvcr.io/ema5hzr4ziav/nvcf_autoscaling" --arg a "${MR_PUSH_AUTH}" '.auths[$r] = {auth: $a}' ~/.docker/config.json > "$tmp"
        mv "$tmp" ~/.docker/config.json
        chmod 600 ~/.docker/config.json
        # printf (not an indented heredoc): BUILD.bazel content must start at
        # column 0 or Starlark rejects the file with an indentation error.
        printf '\noci_push(\n    name = "%s",\n    image = "%s",\n    remote_tags = ":image_tags.txt",\n    repository = "%s",\n)\n' \
          "push_mr_ema5hzr4ziav_nvcf_autoscaling" "//crates/server:image_index" "nvcr.io/ema5hzr4ziav/nvcf_autoscaling" >> ci-release/BUILD.bazel
        bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_mr_ema5hzr4ziav_nvcf_autoscaling
      fi
  artifacts:
    paths:
      - release-images/push_nvcf_function_autoscaler.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/function-autoscaler\/v|nvcf-function-autoscaler-v)/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging
# registry). Named <image>-image-push-mr-manual so the UI button clearly
# reads as an image push (image names are unique, so this stays distinct
# even for multi-image services).
#
# It extends the tag-time function-autoscaler-stage-nvcf-function-autoscaler job for the build/push script
# (which branches to ncp-dev when PUSH_MR_IMAGE_TO_REGISTRY=true) plus the
# vault templates so it can fetch the ncp-dev RW key. before_script runs the
# vault setup first, then the stage job's bazel/go/crane setup. image is
# pinned to bazel-ci so the vault templates do not override it. allow_failure
# so a push failure (auth, registry quota) does not block the MR.
nvcf-function-autoscaler-image-push-mr-manual:
  extends:
    - function-autoscaler-stage-nvcf-function-autoscaler
    - .nv-vault
    - .vault-reader-settings
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  variables:
    PUSH_MR_IMAGE_TO_REGISTRY: "true"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        },
        {
          "path": "kv/gitlab/ngc-registry-auth/rs-autoscaler",
          "key": "NGC_REGISTRY_TOKEN",
          "env_var": "RS_AUTOSCALER_TOKEN"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
    - !reference [function-autoscaler-stage-nvcf-function-autoscaler, before_script]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *function_autoscaler_release_paths
      when: manual
      allow_failure: true

function-autoscaler-release-manifest:
  stage: publish
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: compute-next-release-version-function-autoscaler
      artifacts: true
      optional: true
    - job: function-autoscaler-stage-nvcf-function-autoscaler
      artifacts: true
  tags: [eks, nvcf-cds, prod]
  script:
    - |
      if [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/control-plane-services/function-autoscaler/v}"
      else
        echo "[function-autoscaler-release-manifest] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[function-autoscaler-release-manifest] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      python3 - <<'PY'
      import datetime
      import json
      import os
      from pathlib import Path

      images = [
          json.loads(Path("release-images/push_nvcf_function_autoscaler.json").read_text(encoding="utf-8")),
      ]
      manifest = {
          "schema_version": 1,
          "service_id": "function-autoscaler",
          "service_name": "nvcf-function-autoscaler",
          "source_repo_url": os.environ.get("CI_PROJECT_URL", ""),
          "source_project_id": os.environ.get("CI_PROJECT_ID", ""),
          "source_pipeline_id": os.environ.get("CI_PIPELINE_ID", ""),
          "git_sha": os.environ["CI_COMMIT_SHA"],
          "git_tag": os.environ.get("CI_COMMIT_TAG", ""),
          "version": os.environ["NVCF_VERSION"],
          "artifact_mode": "promote",
          "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "images": images,
      }
      Path(os.environ["CI_PROJECT_DIR"], "release-manifest.json").write_text(
          json.dumps(manifest, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY
      echo "[function-autoscaler-release-manifest] wrote ${CI_PROJECT_DIR}/release-manifest.json"
    - |
      # Emit the manifest as a base64 string in the job's dotenv
      # artifact. The trigger-internal-release job below forwards it
      # to the downstream nvcf-internal pipeline as a single trigger
      # variable. Downstream validate decodes the var and writes the
      # manifest to disk -- no cross-project HTTP, no JOB-TOKEN
      # allowlist dependency, no list-pipeline-jobs endpoint quirk.
      # The legacy plumbing (NVCF_SOURCE_* variables + API fetch) is
      # also emitted as a fallback so any in-flight trigger from a
      # prior nvcf-internal main can still resolve. Slated for
      # removal once both sides have fully cut over.
      printf 'NVCF_SOURCE_MANIFEST_JOB_ID=%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/release-manifest.env"
      printf 'NVCF_RELEASE_MANIFEST_B64=%s\n' "$(base64 -w 0 release-manifest.json)" >> "${CI_PROJECT_DIR}/release-manifest.env"
      echo "[function-autoscaler-release-manifest] dotenv keys:"
      cut -d= -f1 "${CI_PROJECT_DIR}/release-manifest.env"
  artifacts:
    paths:
      - release-manifest.json
    reports:
      dotenv: release-manifest.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/function-autoscaler\/v|nvcf-function-autoscaler-v)/

function-autoscaler-trigger-internal-release:
  # Live in publish (not Snapshot) so that slack-notify (Snapshot) can
  # take a real needs-dependency on us. With strategy: depend this job
  # blocks until the downstream pipeline finishes, so the publish stage
  # finishes only after the digest has actually been promoted to NVCR.
  # slack-notify then announces a release that has really shipped rather
  # than racing the downstream pipeline.
  stage: publish
  needs:
    # artifacts: true picks up release-manifest.env from the
    # release-manifest job (contains NVCF_RELEASE_MANIFEST_B64 for the
    # primary path + NVCF_SOURCE_MANIFEST_JOB_ID for legacy fallback).
    - job: function-autoscaler-release-manifest
      artifacts: true
  trigger:
    project: nvcf/nvcf-internal
    branch: main
    strategy: depend
  variables:
    NVCF_SERVICE_ID: function-autoscaler
    # Primary path: the downstream validate decodes this and writes
    # release-manifest.json. No HTTP, no JOB-TOKEN allowlist.
    NVCF_RELEASE_MANIFEST_B64: "$NVCF_RELEASE_MANIFEST_B64"
    NVCF_SOURCE_REPO_URL: "$CI_PROJECT_URL"
    NVCF_SOURCE_REPO_REF: "$CI_COMMIT_TAG"
    # Legacy fallback. Drop once nvcf-internal's runFetch HTTP branch
    # is removed and no in-flight tag pipelines reference it.
    NVCF_SOURCE_PROJECT_ID: "$CI_PROJECT_ID"
    NVCF_SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    NVCF_SOURCE_MANIFEST_JOB: "function-autoscaler-release-manifest"
    NVCF_SOURCE_MANIFEST_JOB_ID: "$NVCF_SOURCE_MANIFEST_JOB_ID"
    NVCF_SOURCE_MANIFEST_PATH: "release-manifest.json"
    NVCF_SOURCE_API_URL: "$CI_API_V4_URL"
    NVCF_SOURCE_JOB_TOKEN: "$CI_JOB_TOKEN"
    NVCF_RELEASE_BACKEND: "$NVCF_RELEASE_BACKEND"
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/function-autoscaler\/v|nvcf-function-autoscaler-v)/

# Slack release notification. Mirrors the legacy upstream's
# slack-notification job from cds/nvcf-cicd-pipeline. Posts to the
# backstage-helper notify_channel endpoint, which is the
# NVIDIA-internal indirection that handles Slack auth -- no token
# required in CI. Fires only on default-branch publishes after the
# real release tag is created.
function-autoscaler-slack-notify:
  # Snapshot is the only umbrella stage after publish, where
  # semantic-release-<svc> lives. GitLab needs requires the
  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot
  # Reuse the repo-local bazel-ci image (ci/Dockerfile.bazel ships
  # both curl and jq already; both warmed on CI runners from earlier
  # pipeline stages). curlimages/curl runs as a non-root security
  # user, so an apk install step fails there with "Unable to lock
  # database: Permission denied"; bazel-ci sidesteps that and
  # avoids a per-job install altogether.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: semantic-release-function-autoscaler
      artifacts: false
      optional: true
    # Services that release through nvcf-internal replace the legacy
    # <id>-image-push with the downstream-blocking trigger-internal-release
    # job. Real dep, not optional: if promotion/build fails or the downstream
    # pipeline is skipped, slack-notify never fires.
    - job: function-autoscaler-trigger-internal-release
      artifacts: false
  tags: [eks, nvcf-cds, prod]
  variables:
    SLACK_CHANNEL_ID: C08S6KLCEJH
  script:
    - |
      # bazel-ci ships curl + jq pre-installed; no apk step needed.
      # jq handles JSON encoding of the multi-line Slack message
      # below (backslashes / quotes / newlines in commit titles and
      # author names land safely).
      # Prefer CI_COMMIT_TAG on tag pipelines so the message carries the
      # real semver (the legacy bug printed "tag: unknown" because git
      # describe runs against a shallow CI clone where the tag is not
      # reachable). Strip the current or legacy release tag prefix so the
      # message shows just the version (e.g. "1.13.0" not
      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          src/control-plane-services/function-autoscaler/v*) TAG_DISPLAY="${CI_COMMIT_TAG#src/control-plane-services/function-autoscaler/v}" ;;
          nvcf-function-autoscaler-v*) TAG_DISPLAY="${CI_COMMIT_TAG#nvcf-function-autoscaler-v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='src/control-plane-services/function-autoscaler/v*' --match='nvcf-function-autoscaler-v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            src/control-plane-services/function-autoscaler/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#src/control-plane-services/function-autoscaler/v}" ;;
            nvcf-function-autoscaler-v*) TAG_DISPLAY="${LAST_RELEASE_TAG#nvcf-function-autoscaler-v}" ;;
          esac
        else
          TAG_DISPLAY=unknown
        fi
      fi
      # Multi-line Slack message matching the cloud-tasks convention.
      # Embedded newlines via $'\n' (ANSI-C quoting); jq --arg
      # JSON-encodes them as \n in the wire payload.
      # BT is a literal backtick (printf octal 140); Slack renders
      # backtick-wrapped values as inline code, which is the closest
      # Slack supports to highlighting the value after each label
      # (Slack has no inline text color). A literal backtick cannot
      # appear in this Go raw-string template, hence printf.
      BT=$(printf '\140')
      # By: the tagged commit's author (the merged change), not the tag
      # creator -- the release automation cuts every tag under one token.
      SLACK_MESSAGE=":rocket: ${SERVICE_NAME:-nvcf-function-autoscaler} release pipeline complete!"$'\n'
      SLACK_MESSAGE+="Project: ${BT}${CI_PROJECT_PATH}${BT} | Tag: ${BT}${TAG_DISPLAY}${BT} | Branch: ${BT}${CI_COMMIT_REF_NAME}${BT}"$'\n'
      SLACK_MESSAGE+="Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: ${BT}${CI_COMMIT_AUTHOR}${BT}"$'\n'
      SLACK_MESSAGE+="Commit Message: ${BT}${CI_COMMIT_TITLE}${BT}"
      jq -n --arg ch "${SLACK_CHANNEL_ID}" --arg msg "${SLACK_MESSAGE}" \
        '{channel_id: $ch, message: $msg}' > /tmp/slack.json
      curl -sSf -X POST 'https://backstage-helper.service.odp.nvidia.com/notify_channel?dry_run=false' \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d @/tmp/slack.json
  rules:
    # Fire only on tag pipelines. The default-branch pipeline that
    # triggered semantic-release will create the tag, which spawns a
    # second (tag-ref) pipeline; this job runs there. Firing on both
    # would post duplicate Slack messages (observed on
    # nvcf-ratelimiter-v1.13.0 release).
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/function-autoscaler\/v|nvcf-function-autoscaler-v)/

compute-next-release-version-nats-auth-callout:
  extends: .compute-next-release-version-service
  variables:
    SUBTREE: src/control-plane-services/nats-auth-callout
    SERVICE_NAME: nvcf-nats-auth-callout-service
    RELEASE_TAG_PREFIX: src/control-plane-services/nats-auth-callout/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-nats-auth-callout-service-v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_MERGE_REQUEST_IID
      changes: &nats_auth_callout_release_paths
        - src/control-plane-services/nats-auth-callout/**/*
        - deploy/helm/nats-auth-callout/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Tag pipelines need NEXT_VERSION too: the helm-package job's
    # chart-version input reads ${NEXT_VERSION}, and the image-push
    # job's NVCF_VERSION shell fallback consumes it when set. The
    # compute job's own script falls back to stripping the matching
    # configured release prefix on tag pipelines so downstream jobs
    # stamp artifacts with the tag semver.
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/nats-auth-callout\/v|nvcf-nats-auth-callout-service-v)/

semantic-release-nats-auth-callout:
  extends: .semantic-release-service
  variables:
    SUBTREE: src/control-plane-services/nats-auth-callout
    SERVICE_NAME: nvcf-nats-auth-callout-service
    RELEASE_TAG_PREFIX: src/control-plane-services/nats-auth-callout/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-nats-auth-callout-service-v
  needs:
    - job: compute-next-release-version-nats-auth-callout
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

nats-auth-callout-stage-nvcf-nats-auth-callout-service:
  extends:
    - .bazel-remote-probe
  stage: Prerequisites
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
  needs:
    - job: bazel-ci-image
      optional: true
      artifacts: false
    - job: subproject-validations
      optional: true
      artifacts: false
    - job: compute-next-release-version-nats-auth-callout
      artifacts: true
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    BAZEL_DISK_CACHE: $CI_PROJECT_DIR/.bazel-cache/disk
    BAZEL_REPO_CACHE: $CI_PROJECT_DIR/.bazel-cache/repo
  cache:
    - key:
        files:
          - src/control-plane-services/nats-auth-callout/MODULE.bazel.lock
          - src/control-plane-services/nats-auth-callout/.bazelversion
        prefix: nats-auth-callout-bazel-repo
      paths:
        - .bazel-cache/repo/
      policy: pull
    - key:
        files:
          - src/control-plane-services/nats-auth-callout/.bazelversion
          - src/control-plane-services/nats-auth-callout/.bazelrc
        prefix: nats-auth-callout-bazel-disk
      paths:
        - .bazel-cache/disk/
      policy: pull
  before_script:
    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[nats-auth-callout-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[nats-auth-callout-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/control-plane-services/nats-auth-callout
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/control-plane-services/nats-auth-callout/v}"
      else
        echo "[nats-auth-callout-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[nats-auth-callout-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[nats-auth-callout-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-nats-auth-callout}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvcf_nats_auth_callout_service",
          image = "//cmd/nvcf-nats-auth-callout-service:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvcf-nats-auth-callout-service",
      )
      EOF
      echo "[nats-auth-callout-stage-image] generated staging push package:"
      sed 's/^/[nats-auth-callout-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvcf-nats-auth-callout-service
      BAZEL_IMAGE_TARGET=//cmd/nvcf-nats-auth-callout-service:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvcf-nats-auth-callout-service"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvcf_nats_auth_callout_service
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvcf_nats_auth_callout_service.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
  artifacts:
    paths:
      - release-images/push_nvcf_nats_auth_callout_service.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/nats-auth-callout\/v|nvcf-nats-auth-callout-service-v)/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging
# registry). Named <image>-image-push-mr-manual so the UI button clearly
# reads as an image push (image names are unique, so this stays distinct
# even for multi-image services).
#
# It extends the tag-time nats-auth-callout-stage-nvcf-nats-auth-callout-service job for the build/push script
# (which branches to ncp-dev when PUSH_MR_IMAGE_TO_REGISTRY=true) plus the
# vault templates so it can fetch the ncp-dev RW key. before_script runs the
# vault setup first, then the stage job's bazel/go/crane setup. image is
# pinned to bazel-ci so the vault templates do not override it. allow_failure
# so a push failure (auth, registry quota) does not block the MR.
nvcf-nats-auth-callout-service-image-push-mr-manual:
  extends:
    - nats-auth-callout-stage-nvcf-nats-auth-callout-service
    - .nv-vault
    - .vault-reader-settings
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  variables:
    PUSH_MR_IMAGE_TO_REGISTRY: "true"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
    - !reference [nats-auth-callout-stage-nvcf-nats-auth-callout-service, before_script]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *nats_auth_callout_release_paths
      when: manual
      allow_failure: true

nats-auth-callout-release-manifest:
  stage: publish
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: compute-next-release-version-nats-auth-callout
      artifacts: true
      optional: true
    - job: nats-auth-callout-stage-nvcf-nats-auth-callout-service
      artifacts: true
  tags: [eks, nvcf-cds, prod]
  script:
    - |
      if [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/control-plane-services/nats-auth-callout/v}"
      else
        echo "[nats-auth-callout-release-manifest] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[nats-auth-callout-release-manifest] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      python3 - <<'PY'
      import datetime
      import json
      import os
      from pathlib import Path

      images = [
          json.loads(Path("release-images/push_nvcf_nats_auth_callout_service.json").read_text(encoding="utf-8")),
      ]
      manifest = {
          "schema_version": 1,
          "service_id": "nats-auth-callout",
          "service_name": "nvcf-nats-auth-callout-service",
          "source_repo_url": os.environ.get("CI_PROJECT_URL", ""),
          "source_project_id": os.environ.get("CI_PROJECT_ID", ""),
          "source_pipeline_id": os.environ.get("CI_PIPELINE_ID", ""),
          "git_sha": os.environ["CI_COMMIT_SHA"],
          "git_tag": os.environ.get("CI_COMMIT_TAG", ""),
          "version": os.environ["NVCF_VERSION"],
          "artifact_mode": "promote",
          "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "images": images,
      }
      Path(os.environ["CI_PROJECT_DIR"], "release-manifest.json").write_text(
          json.dumps(manifest, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY
      echo "[nats-auth-callout-release-manifest] wrote ${CI_PROJECT_DIR}/release-manifest.json"
    - |
      # Emit the manifest as a base64 string in the job's dotenv
      # artifact. The trigger-internal-release job below forwards it
      # to the downstream nvcf-internal pipeline as a single trigger
      # variable. Downstream validate decodes the var and writes the
      # manifest to disk -- no cross-project HTTP, no JOB-TOKEN
      # allowlist dependency, no list-pipeline-jobs endpoint quirk.
      # The legacy plumbing (NVCF_SOURCE_* variables + API fetch) is
      # also emitted as a fallback so any in-flight trigger from a
      # prior nvcf-internal main can still resolve. Slated for
      # removal once both sides have fully cut over.
      printf 'NVCF_SOURCE_MANIFEST_JOB_ID=%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/release-manifest.env"
      printf 'NVCF_RELEASE_MANIFEST_B64=%s\n' "$(base64 -w 0 release-manifest.json)" >> "${CI_PROJECT_DIR}/release-manifest.env"
      echo "[nats-auth-callout-release-manifest] dotenv keys:"
      cut -d= -f1 "${CI_PROJECT_DIR}/release-manifest.env"
  artifacts:
    paths:
      - release-manifest.json
    reports:
      dotenv: release-manifest.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/nats-auth-callout\/v|nvcf-nats-auth-callout-service-v)/

nats-auth-callout-trigger-internal-release:
  # Live in publish (not Snapshot) so that slack-notify (Snapshot) can
  # take a real needs-dependency on us. With strategy: depend this job
  # blocks until the downstream pipeline finishes, so the publish stage
  # finishes only after the digest has actually been promoted to NVCR.
  # slack-notify then announces a release that has really shipped rather
  # than racing the downstream pipeline.
  stage: publish
  needs:
    # artifacts: true picks up release-manifest.env from the
    # release-manifest job (contains NVCF_RELEASE_MANIFEST_B64 for the
    # primary path + NVCF_SOURCE_MANIFEST_JOB_ID for legacy fallback).
    - job: nats-auth-callout-release-manifest
      artifacts: true
  trigger:
    project: nvcf/nvcf-internal
    branch: main
    strategy: depend
  variables:
    NVCF_SERVICE_ID: nats-auth-callout
    # Primary path: the downstream validate decodes this and writes
    # release-manifest.json. No HTTP, no JOB-TOKEN allowlist.
    NVCF_RELEASE_MANIFEST_B64: "$NVCF_RELEASE_MANIFEST_B64"
    NVCF_SOURCE_REPO_URL: "$CI_PROJECT_URL"
    NVCF_SOURCE_REPO_REF: "$CI_COMMIT_TAG"
    # Legacy fallback. Drop once nvcf-internal's runFetch HTTP branch
    # is removed and no in-flight tag pipelines reference it.
    NVCF_SOURCE_PROJECT_ID: "$CI_PROJECT_ID"
    NVCF_SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    NVCF_SOURCE_MANIFEST_JOB: "nats-auth-callout-release-manifest"
    NVCF_SOURCE_MANIFEST_JOB_ID: "$NVCF_SOURCE_MANIFEST_JOB_ID"
    NVCF_SOURCE_MANIFEST_PATH: "release-manifest.json"
    NVCF_SOURCE_API_URL: "$CI_API_V4_URL"
    NVCF_SOURCE_JOB_TOKEN: "$CI_JOB_TOKEN"
    NVCF_RELEASE_BACKEND: "$NVCF_RELEASE_BACKEND"
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/nats-auth-callout\/v|nvcf-nats-auth-callout-service-v)/

# Slack release notification. Mirrors the legacy upstream's
# slack-notification job from cds/nvcf-cicd-pipeline. Posts to the
# backstage-helper notify_channel endpoint, which is the
# NVIDIA-internal indirection that handles Slack auth -- no token
# required in CI. Fires only on default-branch publishes after the
# real release tag is created.
nats-auth-callout-slack-notify:
  # Snapshot is the only umbrella stage after publish, where
  # semantic-release-<svc> lives. GitLab needs requires the
  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot
  # Reuse the repo-local bazel-ci image (ci/Dockerfile.bazel ships
  # both curl and jq already; both warmed on CI runners from earlier
  # pipeline stages). curlimages/curl runs as a non-root security
  # user, so an apk install step fails there with "Unable to lock
  # database: Permission denied"; bazel-ci sidesteps that and
  # avoids a per-job install altogether.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: semantic-release-nats-auth-callout
      artifacts: false
      optional: true
    # Services that release through nvcf-internal replace the legacy
    # <id>-image-push with the downstream-blocking trigger-internal-release
    # job. Real dep, not optional: if promotion/build fails or the downstream
    # pipeline is skipped, slack-notify never fires.
    - job: nats-auth-callout-trigger-internal-release
      artifacts: false
  tags: [eks, nvcf-cds, prod]
  variables:
    SLACK_CHANNEL_ID: C08S6KLCEJH
  script:
    - |
      # bazel-ci ships curl + jq pre-installed; no apk step needed.
      # jq handles JSON encoding of the multi-line Slack message
      # below (backslashes / quotes / newlines in commit titles and
      # author names land safely).
      # Prefer CI_COMMIT_TAG on tag pipelines so the message carries the
      # real semver (the legacy bug printed "tag: unknown" because git
      # describe runs against a shallow CI clone where the tag is not
      # reachable). Strip the current or legacy release tag prefix so the
      # message shows just the version (e.g. "1.13.0" not
      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          src/control-plane-services/nats-auth-callout/v*) TAG_DISPLAY="${CI_COMMIT_TAG#src/control-plane-services/nats-auth-callout/v}" ;;
          nvcf-nats-auth-callout-service-v*) TAG_DISPLAY="${CI_COMMIT_TAG#nvcf-nats-auth-callout-service-v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='src/control-plane-services/nats-auth-callout/v*' --match='nvcf-nats-auth-callout-service-v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            src/control-plane-services/nats-auth-callout/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#src/control-plane-services/nats-auth-callout/v}" ;;
            nvcf-nats-auth-callout-service-v*) TAG_DISPLAY="${LAST_RELEASE_TAG#nvcf-nats-auth-callout-service-v}" ;;
          esac
        else
          TAG_DISPLAY=unknown
        fi
      fi
      # Multi-line Slack message matching the cloud-tasks convention.
      # Embedded newlines via $'\n' (ANSI-C quoting); jq --arg
      # JSON-encodes them as \n in the wire payload.
      # BT is a literal backtick (printf octal 140); Slack renders
      # backtick-wrapped values as inline code, which is the closest
      # Slack supports to highlighting the value after each label
      # (Slack has no inline text color). A literal backtick cannot
      # appear in this Go raw-string template, hence printf.
      BT=$(printf '\140')
      # By: the tagged commit's author (the merged change), not the tag
      # creator -- the release automation cuts every tag under one token.
      SLACK_MESSAGE=":rocket: ${SERVICE_NAME:-nvcf-nats-auth-callout-service} release pipeline complete!"$'\n'
      SLACK_MESSAGE+="Project: ${BT}${CI_PROJECT_PATH}${BT} | Tag: ${BT}${TAG_DISPLAY}${BT} | Branch: ${BT}${CI_COMMIT_REF_NAME}${BT}"$'\n'
      SLACK_MESSAGE+="Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: ${BT}${CI_COMMIT_AUTHOR}${BT}"$'\n'
      SLACK_MESSAGE+="Commit Message: ${BT}${CI_COMMIT_TITLE}${BT}"
      jq -n --arg ch "${SLACK_CHANNEL_ID}" --arg msg "${SLACK_MESSAGE}" \
        '{channel_id: $ch, message: $msg}' > /tmp/slack.json
      curl -sSf -X POST 'https://backstage-helper.service.odp.nvidia.com/notify_channel?dry_run=false' \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d @/tmp/slack.json
  rules:
    # Fire only on tag pipelines. The default-branch pipeline that
    # triggered semantic-release will create the tag, which spawns a
    # second (tag-ref) pipeline; this job runs there. Firing on both
    # would post duplicate Slack messages (observed on
    # nvcf-ratelimiter-v1.13.0 release).
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/nats-auth-callout\/v|nvcf-nats-auth-callout-service-v)/

# Per-service extends consumed by the helm-package-nats-auth-callout and
# helm-push-nats-auth-callout-* jobs (instantiated from the cds-components
# include: block at the top of this file). The cds-component owns the
# concrete script (helm package + helm push to NGC); the extends below
# only add stage placement, needs, and the path-gated rules so the
# jobs run on the right pipeline kinds and pick up NEXT_VERSION from
# compute-next-release-version-nats-auth-callout's dotenv.

.nats-auth-callout-helm-package-extend:
  stage: publish
  needs:
    - job: compute-next-release-version-nats-auth-callout
      artifacts: true
      # 'optional: true' so the YAML validator does not reject the
      # pipeline on tag refs where the depended job might not be
      # scheduled (matches the image-push pattern). On tag pipelines
      # compute-next-release-version-nats-auth-callout fires (its rules
      # include the configured release tag prefix) and supplies
      # the NEXT_VERSION dotenv that chart-version reads.
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/nats-auth-callout\/v|nvcf-nats-auth-callout-service-v)/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *nats_auth_callout_release_paths

# Helm chart push to the OCI/image-registry surface (helm push
# oci://nvcr.io/...). Replaces the legacy cds-components/helm-push-
# ngc@0.16.6, which wrote only to NGC's chart-registry API and left
# the OCI manifest absent. Self-managed-stack Helmfile pulls via
# helm pull oci://, so the OCI write is the one that matters; this
# job's helm show chart readback at the end is a mandatory
# regression guard to prevent the same drift from re-emerging silently.
helm-push-nats-auth-callout-nvcf-internal:
  stage: publish
  # bazel-ci ships helm + jq + curl + unzip; alpine/helm:3.16.4 shipped
  # helm without jq, which made .vault-reader-before-script's secret
  # loop iterate 0 times and leave NGC_KEY unset (set -u then tripped
  # on the resulting unbound variable, original symptom in job
  # 336565515 on helm-admin-token-issuer-proxy-v1.4.2). Consolidating
  # on bazel-ci keeps every vault-using job on one image and reuses
  # the warmed cache from earlier pipeline stages.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: helm-package-nats-auth-callout
      artifacts: true
  variables:
    NGC_PATH: "0544956542906249"
  script:
    - |
      set -euo pipefail
      NGC_KEY="${NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL}"
      if [ -z "${NGC_KEY:-}" ]; then
        echo "[helm-push-nats-auth-callout-nvcf-internal] ERROR: NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL is unset; cannot login" >&2
        exit 1
      fi
      # The trailing "|| true" is load-bearing: under set -euo
      # pipefail, when ls finds no .tgz it exits non-zero, pipefail
      # surfaces that through the pipe into the command-substitution
      # exit, and set -e then kills the script before the explicit
      # empty-check below can print a useful diagnostic. Suppress the
      # pipeline exit so the guard can fire.
      chart_tgz=$(ls package/*.tgz 2>/dev/null | head -1 || true)
      if [ -z "${chart_tgz:-}" ]; then
        echo "[helm-push-nats-auth-callout-nvcf-internal] ERROR: no chart .tgz under package/ (helm-package-nats-auth-callout artifact missing?)" >&2
        ls -la package/ 2>&1 || true
        exit 1
      fi
      name=$(helm show chart "$chart_tgz" | awk -F': ' '/^name:/  {print $2; exit}')
      version=$(helm show chart "$chart_tgz" | awk -F': ' '/^version:/ {print $2; exit}')
      echo "[helm-push-nats-auth-callout-nvcf-internal] $name:$version -> oci://nvcr.io/${NGC_PATH}"
      if ! echo "$NGC_KEY" | helm registry login nvcr.io -u '$oauthtoken' --password-stdin; then
        echo "[helm-push-nats-auth-callout-nvcf-internal] ERROR: nvcr.io rejected the NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL credential (login unauthorized)." >&2
        echo "[helm-push-nats-auth-callout-nvcf-internal]   Verify or rotate the NGC key behind NGC_PUSH_SERVICE_KEY_NVCF_INTERNAL. This is not a code/CI defect." >&2
        exit 1
      fi
      helm push "$chart_tgz" "oci://nvcr.io/${NGC_PATH}"
      # Mandatory readback from the OCI surface. Without this, a regression
      # like issue #9 (chart-registry write succeeds, OCI surface 404s)
      # would slip through silently. Fails loud if the OCI manifest is
      # missing.
      helm show chart "oci://nvcr.io/${NGC_PATH}/$name" --version "$version"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/control-plane-services\/nats-auth-callout\/v|nvcf-nats-auth-callout-service-v)/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *nats_auth_callout_release_paths

compute-next-release-version-nvcf-unbound:
  extends: .compute-next-release-version-service
  variables:
    SUBTREE: src/compute-plane-services/nvcf-unbound
    SERVICE_NAME: nvcf-unbound
    RELEASE_TAG_PREFIX: src/compute-plane-services/nvcf-unbound/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-unbound-v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_MERGE_REQUEST_IID
      changes: &nvcf_unbound_release_paths
        - src/compute-plane-services/nvcf-unbound/**/*
        - deploy/helm/nvcf-unbound/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Tag pipelines need NEXT_VERSION too: the helm-package job's
    # chart-version input reads ${NEXT_VERSION}, and the image-push
    # job's NVCF_VERSION shell fallback consumes it when set. The
    # compute job's own script falls back to stripping the matching
    # configured release prefix on tag pipelines so downstream jobs
    # stamp artifacts with the tag semver.
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/nvcf-unbound\/v|nvcf-unbound-v)/

semantic-release-nvcf-unbound:
  extends: .semantic-release-service
  variables:
    SUBTREE: src/compute-plane-services/nvcf-unbound
    SERVICE_NAME: nvcf-unbound
    RELEASE_TAG_PREFIX: src/compute-plane-services/nvcf-unbound/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-unbound-v
  needs:
    - job: compute-next-release-version-nvcf-unbound
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Extend consumed by the helm-push-nvcf-unbound-*-classic jobs (the
# cds-components/helm-push-ngc include at the top of this file). The
# component owns the script (helm package readback + ngc registry chart
# push to https://helm.ngc.nvidia.com/<ngc-path>/); this extend only
# adds stage placement and the path-gated rules so the classic push
# runs on the same release-tag / default-branch pipelines as the OCI
# push. The component reads the chart version from the helm-package
# artifact, so no compute-next-release-version dependency is needed
# here.
.nvcf-unbound-helm-push-classic-extend:
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/nvcf-unbound\/v|nvcf-unbound-v)/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *nvcf_unbound_release_paths

nvcf-unbound-stage-nvcf-unbound-webhook:
  extends:
    - .bazel-remote-probe
  stage: Prerequisites
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
  needs:
    - job: bazel-ci-image
      optional: true
      artifacts: false
    - job: subproject-validations
      optional: true
      artifacts: false
    - job: compute-next-release-version-nvcf-unbound
      artifacts: true
      optional: true
  tags: [eks, nvcf-cds, prod]
  variables:
    BAZEL_DISK_CACHE: $CI_PROJECT_DIR/.bazel-cache/disk
    BAZEL_REPO_CACHE: $CI_PROJECT_DIR/.bazel-cache/repo
  cache:
    - key:
        files:
          - src/compute-plane-services/nvcf-unbound/MODULE.bazel.lock
          - src/compute-plane-services/nvcf-unbound/.bazelversion
        prefix: nvcf-unbound-bazel-repo
      paths:
        - .bazel-cache/repo/
      policy: pull
    - key:
        files:
          - src/compute-plane-services/nvcf-unbound/.bazelversion
          - src/compute-plane-services/nvcf-unbound/.bazelrc
        prefix: nvcf-unbound-bazel-disk
      paths:
        - .bazel-cache/disk/
      policy: pull
  before_script:
    - !reference [.bazel-remote-probe, before_script]
    - |
      # Always strip the --config=remote-write token: subtree jobs run in
      # their own workspace whose .bazelrc does not define that config, and
      # Bazel hard-fails on undefined configs ("Config value 'remote-write'
      # is not defined in any .rc file"). Cache-write behavior is expressed
      # with raw flags instead, which need no .rc definition.
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write /}"
      BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS//--config=remote-write/}"
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        # Protected refs (default branch + release tags) upload results and
        # warm the shared cache for MR consumers. Async so end-of-build does
        # not block on cache writes.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=true --remote_cache_async=true"
      else
        # Non-protected (MR) ref: read-only remote cache.
        BAZEL_REMOTE_FLAGS="${BAZEL_REMOTE_FLAGS} --remote_upload_local_results=false"
      fi
      export BAZEL_REMOTE_FLAGS
    - |
      if ! command -v go >/dev/null 2>&1; then
        echo "[nvcf-unbound-stage-image] installing Go 1.25.6 (not on PATH)"
        GO_VERSION="1.25.6"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) arch=amd64; GO_SHA256=f022b6aad78e362bcba9b0b94d09ad58c5a70c6ba3b7582905fababf5fe0181a ;;
          aarch64|arm64) arch=arm64; GO_SHA256=738ef87d79c34272424ccdf83302b7b0300b8b096ed443896089306117943dd5 ;;
          *) echo "[nvcf-unbound-stage-image] unsupported arch: $arch" >&2; exit 1 ;;
        esac
        GO_TGZ="go${GO_VERSION}.linux-${arch}.tar.gz"
        curl -fSL "https://go.dev/dl/${GO_TGZ}" -o "/tmp/${GO_TGZ}"
        echo "${GO_SHA256}  /tmp/${GO_TGZ}" | sha256sum -c -
        tar -xz -C /usr/local -f "/tmp/${GO_TGZ}"
        rm -f "/tmp/${GO_TGZ}"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      fi
      go version
    - |
      GOBIN="$CI_PROJECT_DIR/.release-bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      export PATH="$CI_PROJECT_DIR/.release-bin:$PATH"
      crane version
  script:
    - cd src/compute-plane-services/nvcf-unbound
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push: no NEXT_VERSION/tag exists on an MR
        # pipeline, so derive a unique, traceable tag from the MR and sha
        # for cluster-side testing of the branch before merge.
        NVCF_VERSION="mr.${CI_MERGE_REQUEST_IID:-${CI_COMMIT_REF_SLUG}}-${CI_COMMIT_SHORT_SHA}"
      elif [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/nvcf-unbound/v}"
      else
        echo "[nvcf-unbound-stage-image] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[nvcf-unbound-stage-image] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      if [ "${PUSH_MR_IMAGE_TO_REGISTRY:-}" = "true" ]; then
        # Manual pre-merge push targets the ncp-dev NGC registry directly
        # (the GitLab staging registry is not used for manual pushes) so the
        # image is pullable by stage clusters. Auth with the ncp-dev RW key
        # fetched from vault (see SECRETS_TO_RETRIEVE_IN_JSON on the
        # -image-push-mr-manual job).
        NVCF_STAGING_REGISTRY="nvcr.io/0651155215864979/ncp-dev"
        if [ -z "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW:-}" ]; then
          echo "[nvcf-unbound-stage-image] ERROR: ncp-dev key unset; cannot login to nvcr.io" >&2
          exit 1
        fi
        # Scope the auth key to the ncp-dev push path, not bare nvcr.io. A
        # host-wide nvcr.io login writes an "nvcr.io" docker-config key that
        # rules_oci longest-prefix-matches onto every nvcr.io pull, including
        # the public base nvcr.io/nvidia/distroless/cc; the scoped ncp-dev
        # token 403s that public read and suppresses the anonymous fallback.
        # Keying the auth to the push repo lets the base pull stay anonymous.
        # Mirrors the image_push_targets NVCF-10337 fix.
        NCP_DEV_AUTH=$(printf '$oauthtoken:%s' "${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}" | base64 -w0)
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "nvcr.io/0651155215864979/ncp-dev" "${NCP_DEV_AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      else
        # GitLab project registry image names allow only two path components
        # after ${CI_REGISTRY_IMAGE}. Keep service identity in the first
        # component and the staged image name in the second.
        : "${NVCF_STAGING_REGISTRY:=${CI_REGISTRY_IMAGE}/release-staging-nvcf-unbound}"
        STAGING_REGISTRY_HOST="${NVCF_STAGING_REGISTRY%%/*}"
        printf '%s' "${CI_REGISTRY_PASSWORD}" | crane auth login "${STAGING_REGISTRY_HOST}" -u "${CI_REGISTRY_USER}" --password-stdin
      fi
      export NVCF_STAGING_REGISTRY
      mkdir -p ci-release
      printf '%s\n%s\n%s\n' "${NVCF_VERSION}" "${CI_COMMIT_SHORT_SHA}" "${CI_COMMIT_SHA}" > ci-release/image_tags.txt
    - |
      cat > ci-release/BUILD.bazel <<EOF
      load("@rules_oci//oci:defs.bzl", "oci_push")

      oci_push(
          name = "push_nvcf_unbound_webhook",
          image = "//cmd/webhook:image_index",
          remote_tags = ":image_tags.txt",
          repository = "${NVCF_STAGING_REGISTRY}/nvcf-unbound-webhook",
      )
      EOF
      echo "[nvcf-unbound-stage-image] generated staging push package:"
      sed 's/^/[nvcf-unbound-stage-image]   /' ci-release/BUILD.bazel
    - |
      IMAGE_NAME=nvcf-unbound-webhook
      BAZEL_IMAGE_TARGET=//cmd/webhook:image_index
      STAGING_REPOSITORY="${NVCF_STAGING_REGISTRY}/nvcf-unbound-webhook"
      bazel run --stamp ${BAZEL_REMOTE_FLAGS} --disk_cache=$BAZEL_DISK_CACHE --repository_cache=$BAZEL_REPO_CACHE //ci-release:push_nvcf_unbound_webhook
      DIGEST="$(crane digest "${STAGING_REPOSITORY}:${NVCF_VERSION}")"
      STAGING_IMAGE="${STAGING_REPOSITORY}@${DIGEST}"
      export IMAGE_NAME BAZEL_IMAGE_TARGET STAGING_REPOSITORY DIGEST STAGING_IMAGE
      mkdir -p "$CI_PROJECT_DIR/release-images"
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      Path(os.environ["CI_PROJECT_DIR"], "release-images/push_nvcf_unbound_webhook.json").write_text(json.dumps({
          "name": os.environ["IMAGE_NAME"],
          "bazel_image_target": os.environ["BAZEL_IMAGE_TARGET"],
          "staging_repository": os.environ["STAGING_REPOSITORY"],
          "digest": os.environ["DIGEST"],
          "staging_image": os.environ["STAGING_IMAGE"],
      }, sort_keys=True) + "\n", encoding="utf-8")
      PY
  artifacts:
    paths:
      - release-images/push_nvcf_unbound_webhook.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/nvcf-unbound\/v|nvcf-unbound-v)/

# Manual opt-in: builds and pushes the MR's image to the ncp-dev NGC
# registry tagged mr.<iid>-<sha> for cluster-side testing of the branch
# before merge (stage clusters pull from ncp-dev, not the GitLab staging
# registry). Named <image>-image-push-mr-manual so the UI button clearly
# reads as an image push (image names are unique, so this stays distinct
# even for multi-image services).
#
# It extends the tag-time nvcf-unbound-stage-nvcf-unbound-webhook job for the build/push script
# (which branches to ncp-dev when PUSH_MR_IMAGE_TO_REGISTRY=true) plus the
# vault templates so it can fetch the ncp-dev RW key. before_script runs the
# vault setup first, then the stage job's bazel/go/crane setup. image is
# pinned to bazel-ci so the vault templates do not override it. allow_failure
# so a push failure (auth, registry quota) does not block the MR.
nvcf-unbound-webhook-image-push-mr-manual:
  extends:
    - nvcf-unbound-stage-nvcf-unbound-webhook
    - .nv-vault
    - .vault-reader-settings
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  variables:
    PUSH_MR_IMAGE_TO_REGISTRY: "true"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
    - !reference [nvcf-unbound-stage-nvcf-unbound-webhook, before_script]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *nvcf_unbound_release_paths
      when: manual
      allow_failure: true

nvcf-unbound-release-manifest:
  stage: publish
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: compute-next-release-version-nvcf-unbound
      artifacts: true
      optional: true
    - job: nvcf-unbound-stage-nvcf-unbound-webhook
      artifacts: true
  tags: [eks, nvcf-cds, prod]
  script:
    - |
      if [ -n "${NEXT_VERSION:-}" ]; then
        NVCF_VERSION="${NEXT_VERSION}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then
        NVCF_VERSION="${CI_COMMIT_TAG#src/compute-plane-services/nvcf-unbound/v}"
      else
        echo "[nvcf-unbound-release-manifest] ERROR: no NEXT_VERSION / CI_COMMIT_TAG" >&2
        exit 1
      fi
      export NVCF_VERSION
      echo "[nvcf-unbound-release-manifest] using NVCF_VERSION=${NVCF_VERSION}"
    - |
      python3 - <<'PY'
      import datetime
      import json
      import os
      from pathlib import Path

      images = [
          json.loads(Path("release-images/push_nvcf_unbound_webhook.json").read_text(encoding="utf-8")),
      ]
      manifest = {
          "schema_version": 1,
          "service_id": "nvcf-unbound",
          "service_name": "nvcf-unbound",
          "source_repo_url": os.environ.get("CI_PROJECT_URL", ""),
          "source_project_id": os.environ.get("CI_PROJECT_ID", ""),
          "source_pipeline_id": os.environ.get("CI_PIPELINE_ID", ""),
          "git_sha": os.environ["CI_COMMIT_SHA"],
          "git_tag": os.environ.get("CI_COMMIT_TAG", ""),
          "version": os.environ["NVCF_VERSION"],
          "artifact_mode": "promote",
          "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
          "images": images,
      }
      Path(os.environ["CI_PROJECT_DIR"], "release-manifest.json").write_text(
          json.dumps(manifest, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY
      echo "[nvcf-unbound-release-manifest] wrote ${CI_PROJECT_DIR}/release-manifest.json"
    - |
      # Emit the manifest as a base64 string in the job's dotenv
      # artifact. The trigger-internal-release job below forwards it
      # to the downstream nvcf-internal pipeline as a single trigger
      # variable. Downstream validate decodes the var and writes the
      # manifest to disk -- no cross-project HTTP, no JOB-TOKEN
      # allowlist dependency, no list-pipeline-jobs endpoint quirk.
      # The legacy plumbing (NVCF_SOURCE_* variables + API fetch) is
      # also emitted as a fallback so any in-flight trigger from a
      # prior nvcf-internal main can still resolve. Slated for
      # removal once both sides have fully cut over.
      printf 'NVCF_SOURCE_MANIFEST_JOB_ID=%s\n' "${CI_JOB_ID}" > "${CI_PROJECT_DIR}/release-manifest.env"
      printf 'NVCF_RELEASE_MANIFEST_B64=%s\n' "$(base64 -w 0 release-manifest.json)" >> "${CI_PROJECT_DIR}/release-manifest.env"
      echo "[nvcf-unbound-release-manifest] dotenv keys:"
      cut -d= -f1 "${CI_PROJECT_DIR}/release-manifest.env"
  artifacts:
    paths:
      - release-manifest.json
    reports:
      dotenv: release-manifest.env
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/nvcf-unbound\/v|nvcf-unbound-v)/

nvcf-unbound-trigger-internal-release:
  # Live in publish (not Snapshot) so that slack-notify (Snapshot) can
  # take a real needs-dependency on us. With strategy: depend this job
  # blocks until the downstream pipeline finishes, so the publish stage
  # finishes only after the digest has actually been promoted to NVCR.
  # slack-notify then announces a release that has really shipped rather
  # than racing the downstream pipeline.
  stage: publish
  needs:
    # artifacts: true picks up release-manifest.env from the
    # release-manifest job (contains NVCF_RELEASE_MANIFEST_B64 for the
    # primary path + NVCF_SOURCE_MANIFEST_JOB_ID for legacy fallback).
    - job: nvcf-unbound-release-manifest
      artifacts: true
  trigger:
    project: nvcf/nvcf-internal
    branch: main
    strategy: depend
  variables:
    NVCF_SERVICE_ID: nvcf-unbound
    # Primary path: the downstream validate decodes this and writes
    # release-manifest.json. No HTTP, no JOB-TOKEN allowlist.
    NVCF_RELEASE_MANIFEST_B64: "$NVCF_RELEASE_MANIFEST_B64"
    NVCF_SOURCE_REPO_URL: "$CI_PROJECT_URL"
    NVCF_SOURCE_REPO_REF: "$CI_COMMIT_TAG"
    # Legacy fallback. Drop once nvcf-internal's runFetch HTTP branch
    # is removed and no in-flight tag pipelines reference it.
    NVCF_SOURCE_PROJECT_ID: "$CI_PROJECT_ID"
    NVCF_SOURCE_PIPELINE_ID: "$CI_PIPELINE_ID"
    NVCF_SOURCE_MANIFEST_JOB: "nvcf-unbound-release-manifest"
    NVCF_SOURCE_MANIFEST_JOB_ID: "$NVCF_SOURCE_MANIFEST_JOB_ID"
    NVCF_SOURCE_MANIFEST_PATH: "release-manifest.json"
    NVCF_SOURCE_API_URL: "$CI_API_V4_URL"
    NVCF_SOURCE_JOB_TOKEN: "$CI_JOB_TOKEN"
    NVCF_RELEASE_BACKEND: "$NVCF_RELEASE_BACKEND"
  rules:
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/nvcf-unbound\/v|nvcf-unbound-v)/

# Slack release notification. Mirrors the legacy upstream's
# slack-notification job from cds/nvcf-cicd-pipeline. Posts to the
# backstage-helper notify_channel endpoint, which is the
# NVIDIA-internal indirection that handles Slack auth -- no token
# required in CI. Fires only on default-branch publishes after the
# real release tag is created.
nvcf-unbound-slack-notify:
  # Snapshot is the only umbrella stage after publish, where
  # semantic-release-<svc> lives. GitLab needs requires the
  # depended job to be in an earlier stage (same-stage needs error
  # with "not defined in current or prior stages"), so slack-notify
  # has to sit later than publish.
  stage: Snapshot
  # Reuse the repo-local bazel-ci image (ci/Dockerfile.bazel ships
  # both curl and jq already; both warmed on CI runners from earlier
  # pipeline stages). curlimages/curl runs as a non-root security
  # user, so an apk install step fails there with "Unable to lock
  # database: Permission denied"; bazel-ci sidesteps that and
  # avoids a per-job install altogether.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: semantic-release-nvcf-unbound
      artifacts: false
      optional: true
    # Services that release through nvcf-internal replace the legacy
    # <id>-image-push with the downstream-blocking trigger-internal-release
    # job. Real dep, not optional: if promotion/build fails or the downstream
    # pipeline is skipped, slack-notify never fires.
    - job: nvcf-unbound-trigger-internal-release
      artifacts: false
  tags: [eks, nvcf-cds, prod]
  variables:
    SLACK_CHANNEL_ID: C08S6KLCEJH
  script:
    - |
      # bazel-ci ships curl + jq pre-installed; no apk step needed.
      # jq handles JSON encoding of the multi-line Slack message
      # below (backslashes / quotes / newlines in commit titles and
      # author names land safely).
      # Prefer CI_COMMIT_TAG on tag pipelines so the message carries the
      # real semver (the legacy bug printed "tag: unknown" because git
      # describe runs against a shallow CI clone where the tag is not
      # reachable). Strip the current or legacy release tag prefix so the
      # message shows just the version (e.g. "1.13.0" not
      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          src/compute-plane-services/nvcf-unbound/v*) TAG_DISPLAY="${CI_COMMIT_TAG#src/compute-plane-services/nvcf-unbound/v}" ;;
          nvcf-unbound-v*) TAG_DISPLAY="${CI_COMMIT_TAG#nvcf-unbound-v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='src/compute-plane-services/nvcf-unbound/v*' --match='nvcf-unbound-v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            src/compute-plane-services/nvcf-unbound/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#src/compute-plane-services/nvcf-unbound/v}" ;;
            nvcf-unbound-v*) TAG_DISPLAY="${LAST_RELEASE_TAG#nvcf-unbound-v}" ;;
          esac
        else
          TAG_DISPLAY=unknown
        fi
      fi
      # Multi-line Slack message matching the cloud-tasks convention.
      # Embedded newlines via $'\n' (ANSI-C quoting); jq --arg
      # JSON-encodes them as \n in the wire payload.
      # BT is a literal backtick (printf octal 140); Slack renders
      # backtick-wrapped values as inline code, which is the closest
      # Slack supports to highlighting the value after each label
      # (Slack has no inline text color). A literal backtick cannot
      # appear in this Go raw-string template, hence printf.
      BT=$(printf '\140')
      # By: the tagged commit's author (the merged change), not the tag
      # creator -- the release automation cuts every tag under one token.
      SLACK_MESSAGE=":rocket: ${SERVICE_NAME:-nvcf-unbound} release pipeline complete!"$'\n'
      SLACK_MESSAGE+="Project: ${BT}${CI_PROJECT_PATH}${BT} | Tag: ${BT}${TAG_DISPLAY}${BT} | Branch: ${BT}${CI_COMMIT_REF_NAME}${BT}"$'\n'
      SLACK_MESSAGE+="Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}> | By: ${BT}${CI_COMMIT_AUTHOR}${BT}"$'\n'
      SLACK_MESSAGE+="Commit Message: ${BT}${CI_COMMIT_TITLE}${BT}"
      jq -n --arg ch "${SLACK_CHANNEL_ID}" --arg msg "${SLACK_MESSAGE}" \
        '{channel_id: $ch, message: $msg}' > /tmp/slack.json
      curl -sSf -X POST 'https://backstage-helper.service.odp.nvidia.com/notify_channel?dry_run=false' \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d @/tmp/slack.json
  rules:
    # Fire only on tag pipelines. The default-branch pipeline that
    # triggered semantic-release will create the tag, which spawns a
    # second (tag-ref) pipeline; this job runs there. Firing on both
    # would post duplicate Slack messages (observed on
    # nvcf-ratelimiter-v1.13.0 release).
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/nvcf-unbound\/v|nvcf-unbound-v)/

# Per-service extends consumed by the helm-package-nvcf-unbound and
# helm-push-nvcf-unbound-* jobs (instantiated from the cds-components
# include: block at the top of this file). The cds-component owns the
# concrete script (helm package + helm push to NGC); the extends below
# only add stage placement, needs, and the path-gated rules so the
# jobs run on the right pipeline kinds and pick up NEXT_VERSION from
# compute-next-release-version-nvcf-unbound's dotenv.

.nvcf-unbound-helm-package-extend:
  stage: publish
  needs:
    - job: compute-next-release-version-nvcf-unbound
      artifacts: true
      # 'optional: true' so the YAML validator does not reject the
      # pipeline on tag refs where the depended job might not be
      # scheduled (matches the image-push pattern). On tag pipelines
      # compute-next-release-version-nvcf-unbound fires (its rules
      # include the configured release tag prefix) and supplies
      # the NEXT_VERSION dotenv that chart-version reads.
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/nvcf-unbound\/v|nvcf-unbound-v)/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *nvcf_unbound_release_paths

# Helm chart push to the OCI/image-registry surface (helm push
# oci://nvcr.io/...). Replaces the legacy cds-components/helm-push-
# ngc@0.16.6, which wrote only to NGC's chart-registry API and left
# the OCI manifest absent. Self-managed-stack Helmfile pulls via
# helm pull oci://, so the OCI write is the one that matters; this
# job's helm show chart readback at the end is a mandatory
# regression guard to prevent the same drift from re-emerging silently.
helm-push-nvcf-unbound-ncp-dev:
  stage: publish
  extends:
    - .nv-vault
    - .vault-reader-settings
  # bazel-ci ships helm + jq + curl + unzip; alpine/helm:3.16.4 shipped
  # helm without jq, which made .vault-reader-before-script's secret
  # loop iterate 0 times and leave NGC_KEY unset (set -u then tripped
  # on the resulting unbound variable, original symptom in job
  # 336565515 on helm-admin-token-issuer-proxy-v1.4.2). Consolidating
  # on bazel-ci keeps every vault-using job on one image and reuses
  # the warmed cache from earlier pipeline stages.
  image: $CI_REGISTRY_IMAGE/bazel-ci:$BAZEL_CI_VERSION
  needs:
    - job: helm-package-nvcf-unbound
      artifacts: true
  variables:
    NGC_PATH: 0651155215864979/ncp-dev
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]
  script:
    - |
      set -euo pipefail
      NGC_KEY="${NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW}"
      if [ -z "${NGC_KEY:-}" ]; then
        echo "[helm-push-nvcf-unbound-ncp-dev] ERROR: NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW is unset; cannot login" >&2
        exit 1
      fi
      # The trailing "|| true" is load-bearing: under set -euo
      # pipefail, when ls finds no .tgz it exits non-zero, pipefail
      # surfaces that through the pipe into the command-substitution
      # exit, and set -e then kills the script before the explicit
      # empty-check below can print a useful diagnostic. Suppress the
      # pipeline exit so the guard can fire.
      chart_tgz=$(ls package/*.tgz 2>/dev/null | head -1 || true)
      if [ -z "${chart_tgz:-}" ]; then
        echo "[helm-push-nvcf-unbound-ncp-dev] ERROR: no chart .tgz under package/ (helm-package-nvcf-unbound artifact missing?)" >&2
        ls -la package/ 2>&1 || true
        exit 1
      fi
      name=$(helm show chart "$chart_tgz" | awk -F': ' '/^name:/  {print $2; exit}')
      version=$(helm show chart "$chart_tgz" | awk -F': ' '/^version:/ {print $2; exit}')
      echo "[helm-push-nvcf-unbound-ncp-dev] $name:$version -> oci://nvcr.io/${NGC_PATH}"
      if ! echo "$NGC_KEY" | helm registry login nvcr.io -u '$oauthtoken' --password-stdin; then
        echo "[helm-push-nvcf-unbound-ncp-dev] ERROR: nvcr.io rejected the NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW credential (login unauthorized)." >&2
        echo "[helm-push-nvcf-unbound-ncp-dev]   This key is sourced from vault kv/app/ncp/ngc-key. A login failure almost always means the stored key expired or was rotated on the NGC side without vault being updated -- rotate the key at that vault path. This is not a code/CI defect." >&2
        exit 1
      fi
      helm push "$chart_tgz" "oci://nvcr.io/${NGC_PATH}"
      # Mandatory readback from the OCI surface. Without this, a regression
      # like issue #9 (chart-registry write succeeds, OCI surface 404s)
      # would slip through silently. Fails loud if the OCI manifest is
      # missing.
      helm show chart "oci://nvcr.io/${NGC_PATH}/$name" --version "$version"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(src\/compute-plane-services\/nvcf-unbound\/v|nvcf-unbound-v)/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *nvcf_unbound_release_paths


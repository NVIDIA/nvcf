      # "nvcf-ratelimiter-v1.13.0").
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG_DISPLAY="${CI_COMMIT_TAG}"
        case "${CI_COMMIT_TAG}" in
          deploy/helm/container-cache/v*) TAG_DISPLAY="${CI_COMMIT_TAG#deploy/helm/container-cache/v}" ;;
          nvcf-container-cache-v*) TAG_DISPLAY="${CI_COMMIT_TAG#nvcf-container-cache-v}" ;;
        esac
      else
        LAST_RELEASE_TAG=$(git describe --tags --match='deploy/helm/container-cache/v*' --match='nvcf-container-cache-v*' --abbrev=0 2>/dev/null || true)
        if [ -n "${LAST_RELEASE_TAG:-}" ]; then
          TAG_DISPLAY="${LAST_RELEASE_TAG}"
          case "${LAST_RELEASE_TAG}" in
            deploy/helm/container-cache/v*) TAG_DISPLAY="${LAST_RELEASE_TAG#deploy/helm/container-cache/v}" ;;
            nvcf-container-cache-v*) TAG_DISPLAY="${LAST_RELEASE_TAG#nvcf-container-cache-v}" ;;

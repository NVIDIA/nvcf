      version=$(helm show chart "$chart_tgz" | awk -F': ' '/^version:/ {print $2; exit}')
      echo "[helm-push-admin-token-issuer-proxy-ncp-dev] $name:$version -> oci://nvcr.io/${NGC_PATH}"

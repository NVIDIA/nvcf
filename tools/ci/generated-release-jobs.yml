    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^(deploy\/helm\/admin-token-issuer-proxy\/v|helm-admin-token-issuer-proxy-v)/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *admin_token_issuer_proxy_release_paths


    RELEASE_TAG_PREFIX: migrations/openbao/v
    RELEASE_LEGACY_TAG_PREFIX: nvcf-openbao-migrations-v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NVCF_RELEASE_TAG_CLEANUP == "true"'

    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Dockerfile-based image build (buildah + multi-arch manifest, no
# Bazel). Tag-pipeline only: semantic-release-openbao-migrations creates a
# configured release tag, which triggers a new pipeline whose
# CI_COMMIT_TAG matches the rule below. The two build jobs each push a
# per-arch intermediate tag to the GitLab project registry; the manifest
# job combines them and pushes the multi-arch image to nvcr.io.
#
# Hidden base anchor: vault-fetched ncp-dev SERVICE_KEY, buildah
# settings, and the buildah image. The .vault-reader-settings extend
# brings in the JWT id_tokens block. The before_script installs unzip and jq
# before explicitly running the .nv-vault bootstrap and then the
# .vault-reader-before-script that exports
# NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW from
# kv/app/ncp/ngc-key.
.openbao-migrations-buildah:
  image: urm.nvidia.com/quay-remote/buildah/stable:v1.43.1
  extends:
    - .vault-reader-settings
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    NV_VAULT_VERSION: "2.5.0"
    SECRETS_TO_RETRIEVE_IN_JSON: >
      [
        {
          "path": "kv/app/ncp/ngc-key",
          "key": "NGC_KEY",
          "env_var": "NVCR_0651155215864979_NCP_DEV_SERVICE_KEY_RW"
        }
      ]
  before_script:
    - |
      if ! command -v unzip >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
        if command -v dnf >/dev/null 2>&1; then
          dnf install -y unzip jq
        elif command -v microdnf >/dev/null 2>&1; then
          microdnf install -y unzip jq
        elif command -v yum >/dev/null 2>&1; then
          yum install -y unzip jq
        fi
      fi
    - |
      # The shared .nv-vault template hard-codes the amd64 nvault_agent
      # whenever vault/bin/vault is missing. Dockerfile release jobs also
      # run on native arm64 runners, so pre-seed an arch-native binary and
      # let the template reuse it.
      case "$(uname -m)" in
        x86_64) vault_arch=amd64 ;;
        aarch64|arm64) vault_arch=arm64 ;;
        *) echo "[openbao-migrations-buildah] unsupported vault architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      mkdir -p vault/bin
      vault_zip="nvault_agent_v${NV_VAULT_VERSION}_linux_${vault_arch}.zip"
      vault_url="https://urm.nvidia.com/artifactory/sw-kaizen-data-generic/com/nvidia/vault/vault-agent/${NV_VAULT_VERSION}/${vault_zip}"
      if vault/bin/vault version >/dev/null 2>&1; then
        vault/bin/vault version
      else
        rm -f vault/bin/vault
        if command -v curl >/dev/null 2>&1; then
          curl -Lfo "vault/${vault_zip}" "${vault_url}"
        elif command -v wget >/dev/null 2>&1; then
          wget -q -O "vault/${vault_zip}" "${vault_url}"
        else
          echo "[openbao-migrations-buildah] neither curl nor wget is installed; cannot download nvault_agent" >&2
          exit 1
        fi
        unzip -oq "vault/${vault_zip}" -d vault/bin
        vault/bin/vault version
      fi
    - !reference [.nv-vault, before_script]
    - !reference [.vault-reader-before-script, before_script]


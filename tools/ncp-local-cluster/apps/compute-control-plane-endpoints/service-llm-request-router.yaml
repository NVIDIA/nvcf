apiVersion: v1
kind: Service
metadata:
  name: llm-request-router
  namespace: nvcf
spec:
  ports:
    - name: llm-grpc
      port: 50071
      targetPort: llm-grpc
      protocol: TCP
    - name: llm-quic
      port: 50072
      targetPort: llm-quic
      protocol: UDP

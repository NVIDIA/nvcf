#
# Check nvsnap's documentation against itself: every relative link, heading
# anchor and doc path resolves (in docs, code, scripts and the chart), and
# every maintained doc's table of contents matches its headings, and
# docs/REFERENCE.md (annotations, env vars, agent routes) matches the code. Markdown style is markdown-lint.yml's job;
# this one catches what style cannot, a doc that points at something that
# moved. Runs only when nvsnap or this workflow changes; it takes seconds.
#
# If this fails on your change, run the same check locally:
#
#   make -C src/compute-plane-services/nvsnap check-docs
#
# A stale table of contents is rewritten by scripts/docs/docs-toc.py (no
# arguments); edit the headings, never the generated list. A stale
# REFERENCE.md is rewritten by scripts/docs/reference.py.

name: nvsnap docs

on:
  push:
    branches: [main, 'release-**']
    paths: &paths
      # Code is included: a doc path named in a comment, script or chart
      # must exist too, so moving a doc and changing code both can break it.
      - 'src/compute-plane-services/nvsnap/**'
      - '.github/workflows/nvsnap-docs.yml'
  pull_request:
    branches: [main, 'release-**']
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvsnap-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check nvsnap doc links and contents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test the checkers
        working-directory: src/compute-plane-services/nvsnap/scripts/docs
        run: python3 -m unittest -v test_docs_checks

      - name: Check links, anchors and doc paths
        run: python3 src/compute-plane-services/nvsnap/scripts/docs/check-doc-links.py

      - name: Check tables of contents
        run: python3 src/compute-plane-services/nvsnap/scripts/docs/docs-toc.py --check

      - name: Check the generated reference matches the code
        run: python3 src/compute-plane-services/nvsnap/scripts/docs/reference.py --check

      - name: Check the figures match their script
        run: python3 src/compute-plane-services/nvsnap/docs/figures/scripts/figures.py --check

#
# When a service release is published, open a pull request moving the charts
# that deploy it to that version.
#
# Registered charts release automatically from main. For the release cascade
# and maintenance-train stack handoff, see:
# docs/dev/github-release-process.md#automatic-pin-bumps
#
# Which charts deploy the released service is declared, not derived; see
# tools/ci/chart-service-edge for why deriving it is wrong. A service whose
# charts have not declared the edge yet bumps nothing and says so.
#
# A stack can also declare an image tag it repeats in its own values, through
# values_files in tools/ci/github-release-subprojects.json. The compute-plane
# stack pins its NVCA and collector image tags that way. Those pins move here,
# with the charts, so the paths this job checks and stages cover deploy/stacks
# as well as deploy/helm. tools/chart-version-bumper tests that these paths
# cover every declared target. Moving them changes what the compute-plane stack
# renders, so the job then renders that stack's golden fixtures again; see
# tools/ci/refresh-compute-plane-goldens.
#
# A pin on the default branch only moves up. The bumper skips a release whose
# version is not above the pinned one, and, given --base, a release tagged on a
# commit the default branch does not contain. A backport cut on a release
# branch publishes a release too, and its version can sort below what the
# default branch already pins.

name: chart version bump

on:
  release:
    types: [published]
  # Manual entry point for re-running a release whose bump did not land, and
  # for exercising the job without cutting a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Service release tag, for example
          src/control-plane-services/notary/v1.9.0
        required: true

permissions:
  contents: read

concurrency:
  # One bump at a time. Several releases landing together refresh the same
  # pull request rather than racing on the same files.
  group: chart-version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The default for a release event is the tagged commit, but the pull
          # request targets the default branch. Bumping the tag's tree would
          # carry whatever the chart looked like then onto a branch cut from
          # today's main.
          ref: ${{ github.event.repository.default_branch }}
          # Full history: the pull request title is derived from every bump
          # commit on the shared branch, which needs the merge base with main.
          fetch-depth: 0
          # No credential left in the git config. The steps below run
          # repository code (go test, the bumper, the branch helper), and this
          # repository is public, so their fetches need none. Only the push and
          # pull request steps hold a token.
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          # Derived from the anchor, never a literal: tools/ci/check-go-version
          # fails any workflow that pins one.
          go-version-file: tools/go-toolchain/go.mod

      - name: Test the chart release tools
        # The bumper rewrites version fields in shipped charts, and the edge
        # audit decodes the same ownership declarations. Exercise both schemas
        # before either tool acts on a release.
        run: |
          go test -C tools/chart-version-bumper ./...
          go test -C tools/chart-service-edge ./...

      - name: Test the commit type helper
        # It decides the semver step of the chart release this bump causes.
        run: bash tools/ci/test-release-bump-type

      - name: Test the golden refresh helper
        # It commits rendered fixtures on the bump branch, and the branch
        # helper drops them again on the next run.
        run: bash tools/ci/test-refresh-compute-plane-goldens

      - name: Select the tag
        id: tag
        env:
          # Through env like every other step here. A release tag is chosen by
          # whoever pushes it, so expanding it into the script body is the
          # standard Actions injection shape.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${RELEASE_TAG}}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          # Chart releases move stack pins, which is stack-pin-bump.yml's job.
          # Everything else is a service release and is this job's business:
          # a tag that names no known service fails below rather than here, so
          # a service missing from the release metadata is visible.
          case "${tag}" in
            deploy/helm/*/v*) echo "applies=false" >> "${GITHUB_OUTPUT}"
                              echo "${tag} is a chart release; stack-pin-bump.yml handles it" ;;
            */v*)             echo "applies=true"  >> "${GITHUB_OUTPUT}" ;;
            *)                echo "applies=false" >> "${GITHUB_OUTPUT}"
                              echo "${tag} is not a subtree release tag; nothing to do" ;;
          esac

      - name: Check the chart to service edges
        if: steps.tag.outputs.applies == 'true'
        # Report-only. Runs here so the undeclared charts are listed in the same
        # log as a bump that reached fewer charts than someone expected.
        run: tools/ci/chart-service-edge --audit

      - name: Check out the bump branch
        if: steps.tag.outputs.applies == 'true'
        env:
          BRANCH: chore/chart-version-bumps
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The bump is applied ON the pull request branch, not on the default
          # branch and moved across afterwards. Bumping first and stashing the
          # result over a checkout collides whenever the branch already carries
          # a bump for the same chart, and a swallowed stash conflict either
          # drops that earlier bump or commits conflict markers. Starting here
          # also makes the run idempotent: the bumper sees the current value and
          # reports "already <version>".
          #
          # The shared branch is moved onto the default branch first, as the
          # stack workflow does. Its tree can predate the tools this run needs
          # (the bumper's "bump:" line, release-bump-type), and a stale branch
          # would either fail or fall back to a patch commit for a minor bump.
          #
          # The default branch also moves the same chart versions, through a
          # manual bump or a merged earlier bump. A plain rebase then stopped
          # on that conflict and every later release failed here, so the
          # helper regenerates a bump commit that no longer applies by running
          # the bumper again for the release it recorded. See the helper for
          # what it keeps, regenerates, drops, and refuses.
          #
          # The compute-plane golden fixtures are derived: a commit that
          # carries only them is dropped, and "Refresh the compute-plane
          # goldens" renders them again for whatever the branch then pins.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tools/ci/prepare-stack-pin-branch --derived deploy/stacks/nvcf-compute-plane/testdata/golden \
            "${BRANCH}" "${BASE_BRANCH}" tools/ci/chart-version-bumper --base "origin/${BASE_BRANCH}"

      - name: Apply the bump
        id: bump
        if: steps.tag.outputs.applies == 'true'
        env:
          # Through env, never expanded into the script body: a tag is chosen by
          # whoever pushes it, and ${{ }} interpolation into a run: block is the
          # standard Actions injection shape.
          TAG: ${{ steps.tag.outputs.tag }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          set -uo pipefail
          # +e, deliberately. GitHub invokes this as `bash -e`, and the bumper
          # exits 3 when a chart's appVersion and image tag disagree even though
          # it still applied every chart it could move safely. Aborting here
          # would throw those away and leave the refusal as the only outcome.
          # --base skips a tag the default branch does not contain, such as a
          # backport cut on a release branch. The checkout above fetched every
          # tag and branch, and the branch helper refreshed origin/<default>.
          tools/ci/chart-version-bumper --base "origin/${BASE_BRANCH}" \
            --tag "${TAG}" --write >/tmp/bump.out 2>/tmp/refusals
          status=$?
          cat /tmp/bump.out
          cat /tmp/refusals >&2
          # The exit code, not whether stderr is empty. SystemExit writes its
          # message to stderr too, so an unresolvable tag looks exactly like a
          # refused chart there. 3 means the charts that could move did; any
          # other non-zero means nothing moved and the run should stop.
          if [ "${status}" -ne 0 ] && [ "${status}" -ne 3 ]; then
            echo "bumper failed (exit ${status}); no chart was changed" >&2
            exit "${status}"
          fi
          if [ "${status}" -eq 3 ]; then
            {
              echo "refused<<CHART_BUMP_REFUSALS"
              cat /tmp/refusals
              echo "CHART_BUMP_REFUSALS"
            } >> "${GITHUB_OUTPUT}"
          fi
          # Scoped to the same paths the commit below stages. Repo-wide, any
          # unrelated modification in the workspace would set changed=true and
          # the commit would then abort with nothing staged.
          if git diff --quiet -- deploy/helm deploy/stacks; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "no chart or stack pin moved"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git --no-pager diff --stat -- deploy/helm deploy/stacks
          fi
          # The largest semver step any chart took, reported by the bumper as
          # "bump: <level>". Empty when nothing moved.
          echo "level=$(sed -n 's/^bump: //p' /tmp/bump.out | tail -n 1)" >> "${GITHUB_OUTPUT}"

      - name: Commit the bump
        id: commit
        if: steps.bump.outputs.changed == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          LEVEL: ${{ steps.bump.outputs.level }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add deploy/helm deploy/stacks
          # Carry the service bump level into chart commit labels. Chart source
          # release rules are documented in:
          # docs/dev/github-release-process.md#service-auto-tags
          type="$(tools/ci/release-bump-type for-level "${LEVEL}")"
          case "${type}" in
            *!) subject="${type%!}(charts)!: bump for ${TAG}" ;;
            *)  subject="${type}(charts): bump for ${TAG}" ;;
          esac
          # Separate -m flags rather than an embedded multi-line string: the
          # continuation lines of one would have to sit at column zero, which
          # ends the YAML block scalar this script lives in.
          if [ "${type}" = 'feat!' ]; then
            git commit \
              -m "${subject}" \
              -m "Opened by the chart version bump workflow on release of ${TAG}." \
              -m "BREAKING CHANGE: ${TAG} is a major release of the service this chart deploys."
          else
            git commit \
              -m "${subject}" \
              -m "Opened by the chart version bump workflow on release of ${TAG}."
          fi

          # The pull request squashes to one commit, so its title has to carry
          # the largest step among every bump accumulated on the branch.
          pr_type="$(tools/ci/release-bump-type for-branch "origin/${BASE_BRANCH}")"
          echo "pr_type=${pr_type}" >> "${GITHUB_OUTPUT}"

      - name: Check the compute-plane render inputs
        id: render
        if: steps.bump.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        # The compute-plane stack keeps golden copies of what it renders, and
        # its golden check fails when an image tag in its values moves without
        # them. The render reads nothing outside the stack, so a branch that
        # changes nothing there renders nothing and installs no tools.
        run: |
          set -euo pipefail
          echo "needed=$(tools/ci/refresh-compute-plane-goldens needed "origin/${BASE_BRANCH}")" >> "${GITHUB_OUTPUT}"

      - name: Install helm and helmfile (pinned, checksum-verified)
        if: steps.render.outputs.needed == 'true'
        # Not fatal. Without the tools the render below fails, and that failure
        # is reported on the pull request rather than holding back the bump.
        continue-on-error: true
        # The same pins as the helm charts job in build-test.yml. helmfile
        # v1.2.0+ breaks the ordering the stacks rely on, and the stacks
        # require helm v3.x.
        env:
          HELM_VERSION: "3.21.4"
          HELM_SHA256: "61f88ab166748cb19604d7884cb100ae9ccb13804ddeb98e08af167eacbb6a14"
          HELMFILE_VERSION: "1.1.9"
          HELMFILE_SHA256: "ee71196bb12460905b8cbe0ef67b28db51ef681b777cc212d8c0956475b51905"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -sSL --retry 3 -o helm.tar.gz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar xzf helm.tar.gz linux-amd64/helm

          curl -sSL --retry 3 -o helmfile.tar.gz \
            "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          echo "${HELMFILE_SHA256}  helmfile.tar.gz" | sha256sum -c -
          tar xzf helmfile.tar.gz helmfile

          mkdir -p "${RUNNER_TEMP}/bin"
          mv linux-amd64/helm helmfile "${RUNNER_TEMP}/bin/"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Refresh the compute-plane goldens
        id: goldens
        if: steps.render.outputs.needed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          set -uo pipefail
          # The fixtures go on top of the bump as a commit of their own, so a
          # bump commit holds only what the bumper wrote and the branch helper
          # can still regenerate it from its tag. The next run drops this
          # commit (--derived above) and renders the fixtures again for what
          # the branch then pins.
          #
          # +e, as in "Apply the bump": a failed render does not hold back the
          # bump. It commits nothing, the pull request says the fixtures are
          # stale, and the last step fails the run.
          tools/ci/refresh-compute-plane-goldens commit "origin/${BASE_BRANCH}" 2>&1 | tee /tmp/goldens.out
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            {
              echo "failed<<GOLDEN_REFRESH_FAILED"
              tail -n 15 /tmp/goldens.out
              echo "GOLDEN_REFRESH_FAILED"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Push the bump branch
        if: steps.bump.outputs.changed == 'true'
        env:
          BRANCH: chore/chart-version-bumps
          # The repository secret, not github.token: GitHub starts no workflow
          # for a push made with github.token, so the pull request's checks
          # never ran on the bot's commits until a person pushed. github.token
          # remains the fallback where the secret is absent, such as on a fork.
          PUSH_TOKEN: ${{ secrets.NV_GITHUB_TOKEN || github.token }}
        # A step of its own that runs no repository code, so the steps that do
        # never hold the token. The credential helper reads the token from
        # this step's environment when git asks for it. It is not written to
        # the git config, a remote URL, the command line, or the log. Hooks are
        # off, so nothing an earlier step left in .git runs here.
        run: |
          set -euo pipefail
          # Single quotes on purpose: the helper expands PUSH_TOKEN when git
          # runs it, so the token never appears on this command line.
          # shellcheck disable=SC2016
          git -c core.hooksPath=/dev/null \
            -c credential.helper= \
            -c 'credential.helper=!f() { [ "$1" = get ] || return 0; printf "username=x-access-token\npassword=%s\n" "${PUSH_TOKEN}"; }; f' \
            push --force-with-lease origin "${BRANCH}"

      - name: Open or refresh the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.NV_GITHUB_TOKEN || github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PR_TYPE: ${{ steps.commit.outputs.pr_type }}
          REFUSED: ${{ steps.bump.outputs.refused }}
          GOLDENS_FAILED: ${{ steps.goldens.outputs.failed }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="chore/chart-version-bumps"

          case "${PR_TYPE}" in
            *!) title="${PR_TYPE%!}(charts)!: bump chart versions for released services"
                breaking="BREAKING CHANGE: a pinned service moved to a new major version." ;;
            *)  title="${PR_TYPE}(charts): bump chart versions for released services"
                breaking="" ;;
          esac

          notes=""
          if [ -n "${REFUSED}" ]; then
            notes="$(printf '%s\n' \
              "" \
              "Some charts were not bumped:" \
              "" \
              '```' \
              "${REFUSED}" \
              '```' \
              "" \
              "A chart is refused when its \`appVersion\` and image tag disagree, or when the tag is floating. Reconciling those two fields is a decision, so it is left to a person rather than resolved during an automated bump.")"
          fi
          if [ -n "${GOLDENS_FAILED}" ]; then
            # Two leading blank lines: $(...) drops the trailing newline of
            # the refusal note, and the paragraphs need one blank line between.
            notes="${notes}$(printf '%s\n' \
              "" \
              "" \
              "The compute-plane golden render fixtures could not be rendered again, so they are stale and the golden check is expected to fail:" \
              "" \
              '```' \
              "${GOLDENS_FAILED}" \
              '```' \
              "" \
              "Render them with \`make -C deploy/stacks/nvcf-compute-plane generate-golden\` and push the result, or let the next bump run render them again.")"
          fi

          body="$(printf '%s\n' \
            "Opened by \`.github/workflows/chart-version-bump.yml\` when \`${TAG}\` was published." \
            "" \
            "The released tag identifies the version and source tree, so this is a direct update rather than a lookup of the newest published image." \
            "" \
            "Review the [release flow](${SERVER_URL}/${REPO}/blob/main/docs/dev/github-release-process.md#automatic-pin-bumps) and verify that the selected images are available from the intended registry routes before merge." \
            "" \
            "This PR targets main. Follow the [maintenance handoff](${SERVER_URL}/${REPO}/blob/main/docs/dev/github-release-process.md#patch-an-existing-component-minor) for supported release trains." \
            "" \
            "Image tags declared in a stack's own values are updated here. When one under \`deploy/stacks/nvcf-compute-plane\` moves, this workflow also renders that stack's golden fixtures again and commits them on top of the bumps." \
            "" \
            "Release notes: ${SERVER_URL}/${REPO}/releases/tag/${TAG}" \
            "${notes}" \
            "" \
            "If this pull request sits unmerged, later service releases add their bumps to the same branch, so merging it applies all of them." \
            "" \
            "Github commit:" \
            "${title}" \
            "${breaking}" \
            "")"

          # gh api, not `gh pr edit`. Against this repository `gh pr edit` fails
          # with "Projects (classic) is being deprecated ...
          # (repository.pullRequest.projectCards)", because it queries project
          # cards it does not need. The REST endpoint has no such dependency.
          number="$(gh api "repos/${REPO}/pulls?head=${REPO%%/*}:${branch}&state=open" -q '.[0].number')"
          if [ -n "${number}" ] && [ "${number}" != "null" ]; then
            jq -n --arg t "${title}" --arg b "${body}" '{title: $t, body: $b}' \
              | gh api -X PATCH "repos/${REPO}/pulls/${number}" --input - >/dev/null
            echo "refreshed pull request #${number}"
          else
            gh pr create --base main --head "${branch}" \
              --title "${title}" \
              --body "${body}"
          fi

      - name: Surface refusals
        if: steps.bump.outputs.refused != ''
        # Last, so it does not stop the safe bumps from being opened. A chart
        # that wanted a bump and could not take one is a finding, and a green
        # run would bury it.
        env:
          # Via env, not ${{ }} interpolation: expanding it into the script body
          # is the standard Actions injection shape, even for text this
          # repository produced.
          REFUSED: ${{ steps.bump.outputs.refused }}
        run: |
          echo "::error::charts refused the bump:"
          printf '%s\n' "${REFUSED}"
          exit 1

      - name: Surface a failed golden refresh
        # Last for the same reason as the refusals, and !cancelled() so a
        # refusal above does not hide it. Stale fixtures fail the golden check,
        # so the run fails too rather than leaving that to be found on the
        # pull request.
        if: ${{ !cancelled() && steps.goldens.outputs.failed != '' }}
        env:
          FAILED: ${{ steps.goldens.outputs.failed }}
        run: |
          echo "::error::the compute-plane golden fixtures were not rendered again:"
          printf '%s\n' "${FAILED}"
          exit 1

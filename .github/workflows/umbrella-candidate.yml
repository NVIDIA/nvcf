name: Assemble Umbrella Candidate

on:
  pull_request:
    paths:
      - 'deploy/releases/**'
      - 'tools/docs-version-sync/**'
      - 'tools/ci/assemble-umbrella-candidate'
      - 'tools/scripts/test/test-umbrella-candidate'
      - '.github/workflows/umbrella-candidate.yml'
      - '.github/workflows/umbrella-release-validation.yml'
  push:
    branches:
      - 'release-nvcf/**'

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble selected released stacks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # PR artifacts identify the reviewed head, not GitHub's synthetic merge.
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_REF: ${{ github.head_ref || github.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tools/docs-version-sync/go.mod
          cache: false
      - name: Allocate candidate output
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/umbrella-candidate.XXXXXX")
          echo "root=$work" >> "$GITHUB_OUTPUT"
      - name: Validate public releases and assemble candidate
        id: candidate
        env:
          CANDIDATE_WORK: ${{ steps.workspace.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          go build -C tools/docs-version-sync -o "$CANDIDATE_WORK/docs-version-sync" .
          tools/ci/assemble-umbrella-candidate --repo "$GITHUB_WORKSPACE" \
            --candidate-sha "$CANDIDATE_SHA" --event "$GITHUB_EVENT_NAME" \
            --base-sha "$BASE_SHA" --ref "$CANDIDATE_REF" \
            --tool "$CANDIDATE_WORK/docs-version-sync" --out "$CANDIDATE_WORK/artifacts"
      - name: Upload candidate for QA
        if: steps.candidate.outputs.assembled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: umbrella-candidate-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.root }}/artifacts/
          if-no-files-found: error
          retention-days: 30

name: Helper image validation

on:
  pull_request:
    paths:
      - 'infra/nonroot-images/**'
      - '.github/workflows/helper-image-validation.yml'
  push:
    branches: [main]
    paths:
      - 'infra/nonroot-images/**'
      - '.github/workflows/helper-image-validation.yml'

permissions:
  contents: read

jobs:
  helper-images:
    name: Helper packages and runtime (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Verify source checksum failures
        working-directory: infra/nonroot-images
        run: ./source-test.sh
      - name: Build local helper images
        working-directory: infra/nonroot-images
        env:
          PLATFORM: linux/${{ matrix.arch }}
          VERSION: validation
        run: docker buildx bake --set "*.platform=$PLATFORM" --set '*.output=type=docker'
      - name: Verify packages, tools and non-root execution
        working-directory: infra/nonroot-images
        env:
          PLATFORM: linux/${{ matrix.arch }}
          VERSION: validation
        run: ./test.sh

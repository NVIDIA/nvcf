# Validates Fern docs configuration on pull requests that touch docs or fern/.

name: Fern Docs CI

on:
  push:
    branches: ['docs/releases/**', 'docs/candidates/**']
  pull_request:
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'tools/ci/run-fern'
      - 'tools/ci/check-docs'
      - 'tools/ci/check-doc-version-sync'
      - 'tools/ci/check-doc-editions'
      - 'tools/ci/preview-docs'
      - 'tools/docs-version-sync/**'
      - 'tools/scripts/test/test-run-fern'
      - 'tools/scripts/test/test-preview-docs'
      - '.github/workflows/fern-docs-ci.yml'
  workflow_dispatch:
    inputs:
      preview:
        description: Publish an isolated hosted preview from this branch
        type: choice
        default: none
        options: [none, existing, edition]

permissions:
  contents: read

jobs:
  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # check-doc-version-sync resolves stack release tags to commits.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: fern/.node-version

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-toolchain/go.mod

      - name: Validate documentation
        run: ./tools/ci/check-docs

      - name: Test docs CI helpers
        run: |
          bash tools/scripts/test/test-run-fern
          bash tools/scripts/test/test-preview-docs

      - name: Test docs version and edition tooling
        run: go test -C tools/docs-version-sync ./...

  preview:
    name: Diagnostic Archive Preview
    if: github.event_name == 'workflow_dispatch' && inputs.preview != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: fern/.node-version
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-toolchain/go.mod
      - name: Generate isolated preview
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          PREVIEW: ${{ inputs.preview }}
          DOCS_PREVIEW_ID: nvcf-${{ github.run_id }}
          DOCS_PREVIEW_SKIP_COMMENT: '1'
        run: |
          set -euo pipefail
          if [ "$PREVIEW" = edition ]; then
            export DOCS_PREVIEW_CONFIG=fern/edition-preview.yml
          fi
          cp fern/edition-preview.yml fern/docs.yml
          go run -C tools/docs-version-sync . edition links --repo "$GITHUB_WORKSPACE"
          echo 'Diagnostic preview: four known legacy links remain strict-check blockers.' >> "$GITHUB_STEP_SUMMARY"
          ./tools/ci/run-fern generate --docs --preview --id "$DOCS_PREVIEW_ID" --force | tee "$RUNNER_TEMP/docs-preview.log"
          grep 'Published docs to' "$RUNNER_TEMP/docs-preview.log" >> "$GITHUB_STEP_SUMMARY"

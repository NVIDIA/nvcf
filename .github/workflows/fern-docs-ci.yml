# Validates Fern docs configuration on pull requests that touch docs or fern/.

name: Fern Docs CI

on:
  push:
    branches: ['docs/releases/**', 'docs/candidates/**']
  pull_request:
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'tools/ci/run-fern'
      - 'tools/ci/check-docs'
      - 'tools/ci/check-doc-version-sync'
      - 'tools/ci/check-doc-editions'
      - 'tools/ci/preview-docs'
      - 'tools/ci/check-live-doc-links'
      - 'tools/scripts/test/test-check-live-doc-links'
      - 'tools/docs-version-sync/**'
      - 'tools/scripts/test/test-run-fern'
      - 'tools/scripts/test/test-preview-docs'
      - '.github/workflows/fern-docs-ci.yml'
  workflow_run:
    workflows: [Publish Fern Docs]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      live_links:
        description: Check internal and external links on the published site
        type: boolean
        default: false
      preview:
        description: Publish an isolated hosted preview from this branch
        type: choice
        default: none
        options: [none, edition]

permissions:
  contents: read

jobs:
  fern-check:
    name: Fern Check
    if: github.event_name != 'workflow_run' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # check-doc-version-sync resolves stack release tags to commits.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: fern/.node-version

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-toolchain/go.mod

      - name: Test docs CI helpers
        run: |
          bash tools/scripts/test/test-run-fern
          bash tools/scripts/test/test-preview-docs
          bash tools/scripts/test/test-check-live-doc-links

      - name: Test docs version and edition tooling
        run: go test -C tools/docs-version-sync ./...

      - name: Validate documentation
        run: ./tools/ci/check-docs

      - name: Validate the staged edition layout
        if: ${{ !cancelled() }}
        run: ./tools/ci/preview-docs --check

  preview:
    name: Hosted Docs Preview
    if: github.event_name == 'workflow_dispatch' && inputs.preview != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: fern/.node-version
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-toolchain/go.mod
      - name: Generate isolated preview
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          DOCS_PREVIEW_ID: nvcf-${{ github.run_id }}
          DOCS_PREVIEW_SKIP_COMMENT: '1'
        run: |
          set -euo pipefail
          ./tools/ci/preview-docs | tee "$RUNNER_TEMP/docs-preview.log"
          grep '^Preview URL:' "$RUNNER_TEMP/docs-preview.log" >> "$GITHUB_STEP_SUMMARY"

  live-links:
    name: Published Docs Links
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.live_links) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # workflow_run checks out trusted main, never artifacts from the publisher.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: fern/.node-version
      - name: Check published links
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: ./tools/ci/check-live-doc-links "$RUNNER_TEMP/docs-link-report.json"
      - name: Retain link report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-link-report
          path: ${{ runner.temp }}/docs-link-report.json
          retention-days: 14
          if-no-files-found: error

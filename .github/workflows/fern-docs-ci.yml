# Validates Fern docs configuration on pull requests that touch docs or fern/.

name: Fern Docs CI

on:
  push:
    branches: ['docs/releases/**', 'docs/candidates/**']
  pull_request:
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'tools/ci/run-fern'
      - 'tools/ci/check-docs'
      - 'tools/ci/check-doc-version-sync'
      - 'tools/ci/check-doc-editions'
      - 'tools/ci/preview-docs'
      - 'tools/docs-version-sync/**'
      - 'tools/scripts/test/test-run-fern'
      - 'tools/scripts/test/test-preview-docs'
      - '.github/workflows/fern-docs-ci.yml'
  workflow_dispatch:
    inputs:
      preview:
        description: Publish an isolated hosted preview from this branch
        type: choice
        default: none
        options: [none, existing, edition, staging, index-status]

permissions:
  contents: read

jobs:
  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # check-doc-version-sync resolves stack release tags to commits.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: fern/.node-version

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-toolchain/go.mod

      - name: Test docs CI helpers
        run: |
          bash tools/scripts/test/test-run-fern
          bash tools/scripts/test/test-preview-docs

      - name: Test docs version and edition tooling
        run: go test -C tools/docs-version-sync ./...

      - name: Validate documentation
        run: ./tools/ci/check-docs

      - name: Validate the staged edition layout
        if: ${{ !cancelled() && hashFiles('fern/edition-preview.yml') != '' }}
        env:
          DOCS_PREVIEW_CONFIG: fern/edition-preview.yml
        run: ./tools/ci/preview-docs --check

  preview:
    name: Hosted Docs Preview
    if: github.event_name == 'workflow_dispatch' && inputs.preview != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: fern/.node-version
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-toolchain/go.mod
      - name: Generate isolated preview
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          PREVIEW: ${{ inputs.preview }}
          DOCS_PREVIEW_ID: nvcf-2214-p4-mirroring
          DOCS_PREVIEW_SKIP_COMMENT: '1'
        run: |
          set -euo pipefail
          if [ "$PREVIEW" = index-status ]; then
            node <<'JS'
          (async () => {
            const domain = 'nvidia-nvcf-editions-staging.docs.buildwithfern.com';
            const response = await fetch('https://registry.buildwithfern.com/v2/registry/docs/algolia-preview-whitelist/list', {
              headers: {Authorization: `Bearer ${process.env.FERN_TOKEN}`},
              signal: AbortSignal.timeout(30000),
            });
            console.log(`Search-index allowlist read: HTTP ${response.status}`);
            if (response.ok) {
              const data = await response.json();
              if (!Array.isArray(data.domains)) throw new Error('Unexpected index status response');
              console.log(`Staging host explicitly enabled: ${data.domains.includes(domain) || data.domains.includes(`${domain}/nvcf`)}`);
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
          elif [ "$PREVIEW" = staging ]; then
            node <<'JS'
          const fs = require('fs');
          const path = 'fern/docs.yml';
          let source = fs.readFileSync(path, 'utf8');
          const production = '  - url: nvidia-nvcf.docs.buildwithfern.com/nvcf\n    custom-domain: docs.nvidia.com/nvcf';
          if (source.split(production).length !== 2) throw new Error('Unexpected instance configuration');
          source = source.replace(production, '  - url: nvidia-nvcf-editions-staging.docs.buildwithfern.com/nvcf');
          source = source.replace('canonical-host: "docs.nvidia.com/nvcf"', 'canonical-host: "nvidia-nvcf-editions-staging.docs.buildwithfern.com/nvcf"');
          if (source.includes('custom-domain:') || source.includes('url: nvidia-nvcf.docs.buildwithfern.com')) throw new Error('Production instance remained configured');
          fs.writeFileSync(path, source);
          JS
            ./tools/ci/run-fern check
            ./tools/ci/run-fern generate --docs --instance nvidia-nvcf-editions-staging.docs.buildwithfern.com/nvcf --force --strict-broken-links
            echo 'Staging URL: https://nvidia-nvcf-editions-staging.docs.buildwithfern.com/nvcf' >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$PREVIEW" = edition ]; then
              export DOCS_PREVIEW_CONFIG=fern/edition-preview.yml
            fi
            ./tools/ci/preview-docs | tee "$RUNNER_TEMP/docs-preview.log"
            grep '^Preview URL:' "$RUNNER_TEMP/docs-preview.log" >> "$GITHUB_STEP_SUMMARY"
          fi

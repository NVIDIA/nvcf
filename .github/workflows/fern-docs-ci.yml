# Validates Fern docs configuration on pull requests that touch docs or fern/.

name: Fern Docs CI

on:
  push:
    branches: ['docs/releases/**', 'docs/candidates/**', 'docs/versions/**']
  pull_request:
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'tools/ci/run-fern'
      - 'tools/ci/check-docs'
      - 'tools/ci/check-doc-version-sync'
      - 'tools/ci/check-doc-editions'
      - 'tools/ci/preview-docs'
      - 'tools/ci/publish-docs'
      - 'tools/ci/check-doc-links'
      - 'tools/ci/run-lychee'
      - 'tools/ci/docs-links.toml'
      - 'tools/scripts/test/test-check-doc-links'
      - 'tools/docs-version-sync/**'
      - 'tools/scripts/test/test-run-fern'
      - 'tools/scripts/test/test-preview-docs'
      - 'tools/scripts/test/test-publish-docs'
      - '.github/workflows/fern-docs-ci.yml'
  workflow_dispatch:
    inputs:
      preview:
        description: Publish an isolated hosted preview from this branch
        type: choice
        default: none
        options: [none, edition, canonical]

permissions:
  contents: read

jobs:
  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # check-doc-version-sync resolves stack release tags to commits.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: fern/.node-version

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-toolchain/go.mod

      - name: Test docs CI helpers
        run: |
          bash tools/scripts/test/test-run-fern
          bash tools/scripts/test/test-preview-docs
          bash tools/scripts/test/test-publish-docs
          bash tools/scripts/test/test-check-doc-links

      - name: Test docs version and edition tooling
        run: go test -C tools/docs-version-sync ./...

      - name: Validate documentation
        run: ./tools/ci/check-docs

      - name: Validate the staged edition layout
        if: ${{ !cancelled() }}
        run: ./tools/ci/preview-docs --check

  preview:
    name: Hosted Docs Preview
    if: github.event_name == 'workflow_dispatch' && inputs.preview != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: fern/.node-version
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-toolchain/go.mod
      - name: Generate isolated preview
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          DOCS_PREVIEW_ID: nvcf-${{ github.run_id }}
          DOCS_PREVIEW_SKIP_COMMENT: '1'
          DOCS_PREVIEW_CONFIG: ${{ inputs.preview == 'canonical' && 'fern/docs.yml' || '' }}
        run: |
          set -euo pipefail
          # Rehearsal branch only: full static delivery on a separate Fern instance.
          go run -C tools/docs-version-sync . umbrella docs-stage \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/approved-docs"
          cp "$RUNNER_TEMP/approved-docs/docs-build-receipt.json" "$RUNNER_TEMP/docs-build-receipt.json"
          cd "$RUNNER_TEMP/approved-docs"
          python3 - <<'PYCONFIG'
          from pathlib import Path
          p = Path("fern/docs.yml")
          s = p.read_text()
          old = "nvidia-nvcf.docs.buildwithfern.com/nvcf"
          new = "nvidia-nvcf-maintained-104-20261106.docs.buildwithfern.com/nvcf"
          assert s.count(old) == 1
          s = s.replace(old, new).replace("    custom-domain: docs.nvidia.com/nvcf\n", "")
          s = s.replace('canonical-host: "docs.nvidia.com/nvcf"', 'canonical-host: "' + new + '"')
          s = s.replace('canonical-host: docs.nvidia.com/nvcf', 'canonical-host: "' + new + '"')
          assert "custom-domain:" not in s.split("title:", 1)[0]
          assert "nvidia-nvcf.docs.buildwithfern.com" not in s
          p.write_text(s)
          PYCONFIG
          "$GITHUB_WORKSPACE/tools/ci/run-fern" check
          "$GITHUB_WORKSPACE/tools/ci/run-fern" generate --docs \
            --instance nvidia-nvcf-maintained-104-20261106.docs.buildwithfern.com/nvcf \
            --strict-broken-links --no-prompt | tee "$RUNNER_TEMP/docs-preview.log"
          echo 'Staging URL: https://nvidia-nvcf-maintained-104-20261106.docs.buildwithfern.com/nvcf' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain staging source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-staging-receipt
          path: ${{ runner.temp }}/docs-build-receipt.json
          if-no-files-found: ignore

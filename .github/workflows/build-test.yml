name: build-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run docs validation
        run: ./tools/ci/check-docs

  go-lib-codegen:
    name: go-lib codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Run go-lib codegen freshness check
        run: ./tools/ci/check-go-codegen src/libraries/go/lib --install k8s.io/code-generator/cmd/deepcopy-gen@v0.34.2 --command 'make codegen-update'

  github-release-helper:
    name: GitHub release helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run release helper tests
        run: python3 tools/ci/test-github-release.py

  bazel-consolidation-inventory:
    name: bazel consolidation inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/bazel-consolidation-inventory/go.mod
          # setup-go looks for go.sum at the repository root by default, and
          # there is no module there. Point it at this module's lockfile so the
          # cache is used instead of warning that no dependency file was found.
          cache-dependency-path: tools/bazel-consolidation-inventory/go.sum

      - name: Vet and unit test
        working-directory: tools/bazel-consolidation-inventory
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
          go vet ./...
          go test ./...

      - name: End-to-end fixtures
        run: tools/scripts/test/test-bazel-consolidation-inventory

      # Running the tool against this repository is the check that matters:
      # unit tests and fixtures use synthetic inputs, so only this catches a
      # real MODULE.bazel form the parser cannot interpret.
      - name: Run the inventory against this repository
        run: tools/ci/bazel-consolidation-inventory

#
# nvstor checks that the Bazel row does not cover. The nvstor row in bazel.yml
# builds and tests nvstor-peer and the crates it depends on for amd64; this
# workflow adds rustfmt, clippy and the Cargo tests of those crates, the
# dependency license policy, the NOTICE and publication-hygiene checks, and the
# multi-arch nvstor-peer image (the Bazel row builds for the runner's own
# architecture only, and skips image targets, which are tagged manual). No
# RDMA device is needed: tests that need one are #[ignore]d and run by hand on
# RDMA hardware.

name: nvstor

on:
  push:
    branches: [main, 'release-**', 'release/**']
    paths: &paths
      - 'src/compute-plane-services/nvstor/**'
      - '.github/workflows/nvstor.yml'
      # The Bazel scaffold the image build depends on: rules_rust and the
      # Rust toolchain, the zig cross toolchain, the platforms and the OCI
      # image rules.
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.bazelrc'
      - '.bazelversion'
      - 'platforms/**'
      - 'rules/oci/**'
      - 'tools/bazel/**'
  pull_request:
    branches: [main, 'release-**', 'release/**']
    paths: *paths
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvstor-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo:
    name: cargo checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/compute-plane-services/nvstor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install rdma-core development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libibverbs-dev

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      # The Bazel-built crates. The other workspace members build with
      # Cargo and are not checked here yet.
      - name: Check Rust diagnostics
        run: cargo clippy --locked -p nvstor-core -p nvstor-rdma -p nvstor-peer --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p nvstor-core -p nvstor-rdma -p nvstor-peer

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      - name: Check dependency licenses, bans and sources
        run: cargo deny --locked check licenses bans sources

      - name: Check NOTICE is up to date
        run: python3 scripts/gen-notice.py --check

      - name: Check publication hygiene
        run: python3 scripts/check-hygiene.py

  image:
    name: nvstor-peer image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # One build of the image index: nvstor-peer for both architectures,
      # optimised by the image's own opt_binary whatever the compilation
      # mode, with rdma-core from the pinned packages for each architecture.
      - name: bazel build nvstor-peer-image_index
        env:
          TARGET: //src/compute-plane-services/nvstor/crates/nvstor-peer:nvstor-peer-image_index
        run: bazel build "$TARGET"

      - name: Check the index holds amd64 and arm64 images
        env:
          TARGET: //src/compute-plane-services/nvstor/crates/nvstor-peer:nvstor-peer-image_index
        run: |
          index="$(bazel cquery --output=files "$TARGET" 2>/dev/null)"
          python3 - "$index" <<'PY'
          import json, sys
          root = sys.argv[1]
          def blob(digest):
              with open(f"{root}/blobs/sha256/{digest.split(':', 1)[1]}") as f:
                  return json.load(f)
          with open(f"{root}/index.json") as f:
              top = json.load(f)
          archs = set()
          stack = [m["digest"] for m in top["manifests"]]
          while stack:
              m = blob(stack.pop())
              if "manifests" in m:
                  stack += [x["digest"] for x in m["manifests"]]
              else:
                  archs.add(blob(m["config"]["digest"])["architecture"])
          print("architectures:", sorted(archs))
          sys.exit(0 if archs == {"amd64", "arm64"} else 1)
          PY

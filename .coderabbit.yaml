# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for dsx-ai-factory/nvcf.
# Docs: https://docs.coderabbit.ai/reference/configuration
language: en-US
early_access: false
reviews:
  # "chill" keeps the reviewer focused on substantive issues over nits.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  # Pre-merge checks consolidate PR-metadata policy into CodeRabbit's single
  # status, replacing the standalone pr-title-check and pr-issue-check GitHub
  # Actions. Warning mode: they nudge the author, they do not block the merge
  # queue (raise to "error" to gate). The title check does both the Conventional
  # Commit format and the semantic "type matches the change" judgment a regex
  # cannot make.
  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        The title must follow Conventional Commits v1.0.0, grammar
        `type[(scope)][!]: subject`, with exactly one type prefix (never a
        compound like "type1+type2(scope):"). The scope and the breaking-change
        `!` are optional, EXCEPT that the customer-impact types feat, fix, and
        perf require a scope; docs, build, test, refactor, ci, chore, style, and
        revert may omit it. Ignore a leading Draft:/[Draft]/[draft]:/WIP marker
        when validating. Beyond format, the <type> must accurately reflect the
        primary nature of the diff, not merely be a valid type. Flag mismatches:
        a docs-only change (only *.md or
        docs/**) titled chore or fix should be docs; a CI/workflow-only change
        (.github/**, .gitlab-ci.yml, tools/ci/**) titled chore should be ci; and
        especially a bug fix or feature mislabeled as chore/docs/refactor, which
        would wrongly hide a customer-facing change from the release notes (feat,
        fix, and perf appear in release notes; docs, chore, ci, build, test,
        refactor, style do not). Do not flag PRs that legitimately span multiple
        types where the chosen type reflects the most significant change. See
        AGENTS.md commit conventions.
    issue_assessment:
      mode: warning
  # Skip generated, vendored, and binary-ish files so review focuses on
  # human-authored source.
  path_filters:
    - "!**/vendor/**"
    - "!**/testdata/**"
    - "!**/*.pb.go"
    - "!**/zz_generated.*"
    - "!**/*_generated.go"
    - "!**/MODULE.bazel.lock"
    - "!**/*.tgz"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/pnpm-lock.yaml"
    - "!tools/ci/generated-release-jobs.yml"
  path_instructions:
    - path: "src/**/*.go"
      instructions: >-
        Check Go error wrapping (%w), structured logging with required context
        fields (request/function/cluster/org id), and that request-handling
        changes add logs, tracing, and RED metrics per AGENTS.md.
    - path: "src/**/*.rs"
      instructions: >-
        Check error handling, tracing spans on cross-service calls, and that
        no secrets or full request bodies are logged.
    - path: "**/*.sql"
      instructions: >-
        Cassandra DDL migrations are forward-only and one keyspace per
        subdirectory. Flag destructive statements and missing IF NOT EXISTS.
    - path: "src/uis/nvcf-ui/ui/src/routes/**/*.tsx"
      instructions: >-
        Pages use TanStack Router file-based routing; see src/uis/nvcf-ui/ARCHITECTURE.md.
        A route file holds the createFileRoute options and the page component, and does not
        export the page or pending component. Routes orchestrate data: the loader starts the
        queries the page needs (ensureQueryData with revalidateIfStale: true when the page
        needs the data to render, a non-awaited prefetch otherwise), and components read them
        with the generated suspense hooks. Flag page data loaded outside the loader, a
        per-route errorComponent not recorded in ARCHITECTURE.md,
        domain building blocks (cards, badges, panels, domain hooks) defined in the route file
        instead of their feature, page components with a Page suffix, hand-written fetch
        calls where a generated hook exists, and ../ imports instead of the ~/ alias.
        Prefer KUI components from @nvidia/foundations-react-core over plain HTML where a
        natural fit exists; flag clear misses but use judgment.
    - path: "src/uis/nvcf-ui/ui/src/features/**"
      instructions: >-
        Feature folders hold domain code; see the Layers and Placement sections of
        src/uis/nvcf-ui/ARCHITECTURE.md. Flag any import from another feature
        (~/features/<other>/...) or from ~/routes; features are composed in route files, and
        domain-agnostic code graduates to ui/src/components or ui/src/hooks. Routes orchestrate
        data: components read queries their route's loader started rather than loading page
        data themselves, and a component reading non-awaited data sits inside an
        AsyncBoundary. Flag
        hand-written fetch calls where a generated hook exists and ../ imports instead
        of the ~/ alias. Prefer KUI components over plain HTML where a natural fit exists;
        flag clear misses but use judgment. New components should have co-located tests.
    - path: "src/uis/nvcf-ui/ui/src/components/**"
      instructions: >-
        Shared, domain-agnostic UI. Flag imports from ~/features or ~/routes; see
        src/uis/nvcf-ui/ARCHITECTURE.md.
    - path: "src/uis/nvcf-ui/ui/src/hooks/**"
      instructions: >-
        Shared, domain-agnostic hooks. Flag imports from ~/features or ~/routes; see
        src/uis/nvcf-ui/ARCHITECTURE.md.
    - path: "src/uis/nvcf-ui/ui/src/**/*.test.tsx"
      instructions: >-
        Pages are tested with renderWithRouter({ initialLocation }) from ~/testing/render,
        which renders the generated route tree. Components that use router hooks but are not
        routes use renderWithRouter({ routeTree }) with a test-local tree. Flag mocking of
        @tanstack/react-router and calls to setupServer in a test file (use server.use).
        Page tests sit beside their route file and are named after the page component.
        Tests should cover the happy path, error state, and empty state. Prefer accessible
        queries (getByRole, getByText) over test IDs.
    - path: "src/uis/nvcf-ui/ui/src/routeTree.gen.ts"
      instructions: >-
        Generated by the TanStack Router Vite plugin and committed. Do not review style.
        Only flag manual edits that do not match a change to ui/src/routes/.
    - path: "src/uis/nvcf-ui/ui/src/generated/**"
      instructions: >-
        This is generated code (from control-plane-openapi.yaml / nvcf-openapi.yaml / sis-openapi.yaml).
        Do NOT comment on code style, naming, or general best practices; Biome enforces formatting via CI.
        ONLY flag spec-consistency issues: generated code that doesn't match the current spec
        (e.g., missing or renamed fields, changed types, endpoints absent from codegen output),
        OR generated files that appear to have been manually edited without a corresponding spec change.
    - path: "src/uis/nvcf-ui/spec/*.yaml"
      instructions: >-
        These are the source of truth for the API. Generated output lives in
        ui/src/generated/ and must never be edited directly. Flag any PR that touches
        ui/src/generated/ without a corresponding spec change that justifies it.
  tools:
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    golangci-lint:
      enabled: true
    biome:
      enabled: true
chat:
  auto_reply: true

# Phase 2 workload in cluster a. run.sh replaces __BUSYBOX_IMAGE__ and
# applies it in the demo namespace.
#
# - Deployment echo: 2 busybox httpd replicas that answer with their pod name.
# - Service echo: exported by labelling it gds.nvidia.com/export=true.
# - Service frontend: a labelled pool frontend of pool demo (role
#   pool-frontend), exported by its labels.
# - Service api-svc: not labelled; exported only while the API-registered
#   pool api lists it in services[].
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  labels:
    app: echo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: httpd
          image: __BUSYBOX_IMAGE__
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /www && echo "$HOSTNAME" > /www/index.html && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  labels:
    app: echo
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: echo
    gds.nvidia.com/export: "true"
    gds.nvidia.com/role: pool-frontend
    gds.nvidia.com/pool: demo
  annotations:
    gds.nvidia.com/pool-models: demo-model
    gds.nvidia.com/hardware-class: k3d
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  labels:
    app: echo
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 8080
      targetPort: http

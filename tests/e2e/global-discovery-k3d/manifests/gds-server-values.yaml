# Values of the gds-server chart for phase 1: the memory store with one
# replica on a single k3d cluster. run.sh adds image.repository, image.tag
# and region with --set.
store:
  kind: memory
replicaCount: 1
logLevel: debug
# One replica with minAvailable 1 would block node drains of the test cluster.
podDisruptionBudget:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

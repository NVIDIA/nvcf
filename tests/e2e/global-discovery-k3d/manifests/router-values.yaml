# Values of the llm-request-router chart (Stargate) for phase 3 in cluster a:
# one replica, no backend router, open worker auth, and the GDS export of the
# router Service. run.sh adds the image and the globalDiscovery URLs and ids
# with --set. With E2E_ROUTER_MODE=direct (the default) it adds
# router-direct-values.yaml (two replicas in direct mode); with
# E2E_ROUTER_MODE=single it sets kubernetes.advertisedHostnameTemplate to a
# name the Pylon in b resolves through a hosts entry.
llmRequestRouter:
  replicaCount: 1
  image:
    registry: ""
    pullPolicy: Never
  auth:
    workerAuthEndpoint: ""
    allowOpen: true
  vault:
    noVaultAnnotations: true
  discovery:
    # The GDS URL of the test is plaintext http.
    allowInsecureRemoteWatchHttp: true
  readiness:
    warmupMs: 0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  globalDiscovery:
    enabled: true
    export:
      enabled: true
    dialScheme: http

# Phase 3 Pylon in cluster b: a plain Deployment with the OpenAI-compatible
# sample backend as a sidecar. Pylon finds the router of cluster a only
# through GDS (--gds-url, no --stargate-address). run.sh replaces the
# __...__ placeholders and applies it in the pylon namespace.
#
# Registration dials the Stargate pod IP from GDS. The reverse tunnel dials
# the hostname Stargate advertises (__ROUTER_HOST__), which a deployment
# serves from DNS or a load balancer reachable from every cluster (design
# 4.5); here a hosts entry maps it to the Stargate pod IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pylon
  labels:
    app: gds-e2e-pylon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gds-e2e-pylon
  template:
    metadata:
      labels:
        app: gds-e2e-pylon
    spec:
      terminationGracePeriodSeconds: 5
      hostAliases:
        - ip: __ROUTER_IP__
          hostnames:
            - __ROUTER_HOST__
      containers:
        - name: backend
          image: __SAMPLE_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
        - name: pylon
          image: __PYLON_IMAGE__
          imagePullPolicy: Never
          args:
            - --upstream-http-base-url=http://127.0.0.1:8000
            - --gds-url=__GDS_URL__
            - --gds-clusterset=__CLUSTERSET__
            - --inference-server-id=__CLUSTER_ID__.gds-e2e.pylon.$(POD_NAME)
            - --cluster-id=__CLUSTER_ID__
            - --model-name=test-model
            - --backend-connectivity=reverse
            - --upstream-health-path=/health
            - --wait-for-upstream
            - --quic-insecure
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The router accepts every worker (auth.allowOpen); Pylon still
            # sends a bearer token.
            - name: STARGATE_AUTH_TOKEN
              value: gds-e2e-open
            - name: RUST_LOG
              value: info
          ports:
            - name: metrics
              containerPort: 9089

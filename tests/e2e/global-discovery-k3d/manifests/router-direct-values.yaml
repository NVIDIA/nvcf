# Direct router mode for phase 3 (E2E_ROUTER_MODE=direct, the default), on
# top of router-values.yaml: two Stargate replicas of a Deployment without
# the backend router, with globalDiscovery enabled. The exported ClusterIP
# Service selects the Stargate pods, each pod advertises its pod IP for gRPC
# and the reverse tunnel, and the Pylon in b dials each pod. The hostname
# template is each pod's identity (gRPC authority and QUIC SNI); Pylon only
# sends it, so it needs no DNS entry in b.
llmRequestRouter:
  replicaCount: 2
  backendRouter:
    enabled: false
  kubernetes:
    advertisedHostnameTemplate: "{pod_name}.llm-request-router-headless.{namespace}.svc.cluster.local"

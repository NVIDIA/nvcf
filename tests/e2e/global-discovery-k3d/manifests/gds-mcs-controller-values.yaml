# Values of the gds-mcs-controller chart for phases 2 and 3. run.sh adds the
# image, gds.urls (the hub's NodePort), clusterset.id and cluster.id with
# --set. Two replicas exercise leader election.
fullnameOverride: gds-mcs-controller
replicaCount: 2
gds:
  allowInsecureHttp: true
cluster:
  region: e2e-local
logLevel: debug
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

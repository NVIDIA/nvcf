#
# OpenAI-compatible sample backend for the Pylon Operator k3d end-to-end test.
# It serves GET /health, GET /v1/models (model id test-model) and
# POST /v1/chat/completions on port 8000. run.sh applies this file with -n, so
# it carries no namespace. run.sh also fills in the two placeholders below
# from E2E_SAMPLE_IMAGE, the sample image, and E2E_SAMPLE_IMAGE_PULL_SECRETS,
# its pull Secrets as a YAML flow list: [] with IMAGE_SOURCE=local and
# [{"name": "ngc-pull"}] with IMAGE_SOURCE=ngc.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-compatible-sample
  labels:
    app.kubernetes.io/name: openai-compatible-sample
    app.kubernetes.io/part-of: pylon-operator-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openai-compatible-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openai-compatible-sample
        app.kubernetes.io/part-of: pylon-operator-e2e
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      imagePullSecrets: ${E2E_SAMPLE_IMAGE_PULL_SECRETS}
      containers:
        - name: backend
          image: ${E2E_SAMPLE_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: openai-compatible-sample
  labels:
    app.kubernetes.io/name: openai-compatible-sample
    app.kubernetes.io/part-of: pylon-operator-e2e
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openai-compatible-sample
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

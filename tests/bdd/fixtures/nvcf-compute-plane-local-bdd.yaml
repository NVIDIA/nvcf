# Single-cluster Helmfile fixture for the BDD suite.
#
# The REPLACE_WITH_SAMPLE_NGC_ORG / REPLACE_WITH_SAMPLE_NGC_TEAM
# placeholders below are overwritten by the feature's Background via
# `I update yaml file ... with keys:` using ${SAMPLE_NGC_ORG} and
# ${SAMPLE_NGC_TEAM}. The literal values are never committed here.
# If a future feature copies this fixture without performing the
# substitution, helmfile pulls images from a path that obviously
# does not resolve, which is the intended failure mode.

global:
  helm:
    sources:
      repository: "REPLACE_WITH_SAMPLE_NGC_ORG/REPLACE_WITH_SAMPLE_NGC_TEAM"

  image:
    repository: REPLACE_WITH_SAMPLE_NGC_ORG/REPLACE_WITH_SAMPLE_NGC_TEAM

  nvcaOperator:
    # NVCA subtracts the utils reservation plus small sidecars from every
    # instance type. The default Helm resource limit gates keep that
    # accounting on. This smaller local reservation keeps NCP.GPU.H100_1x
    # registered on hosts with about 8 CPUs.
    utils:
      resources:
        cpu: "1"
        memory: 2Gi
    selfManaged:
      featureGateValues:
        - -EnforceContainerFunctionResourceLimits
        - -EnforceContainerTaskResourceLimits
      icmsServiceURL: http://api.sis.svc.cluster.local:8080
      revalServiceURL: http://reval.nvcf.svc.cluster.local:8080
      natsURL: nats://nats.nats-system.svc.cluster.local:4222

# Local BDD does not install the optional observability stack.
observability:
  profile: disabled

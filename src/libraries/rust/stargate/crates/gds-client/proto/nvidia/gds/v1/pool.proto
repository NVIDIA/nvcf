syntax = "proto3";

package nvidia.gds.v1;

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "nvidia/gds/v1/common.proto";
import "nvidia/gds/v1/mcs.proto";

option go_package = "github.com/NVIDIA/nvcf/src/control-plane-services/global-discovery/api/gen/go/nvidia/gds/v1;gdsv1";

// PoolService is the pool and router registry.
//
// A Pool exists when a labelled export names it (Service labels
// gds.nvidia.com/role=pool-frontend, kv-relay or pylon and
// gds.nvidia.com/pool=<name>), when RegisterPool registered it, when a pool
// agent registered through RegisterPoolAgent, or any combination; all are
// merged by (cluster, pool name). Static metadata comes from the export's
// labels and annotations, dynamic state (worker counts, DRAINING) from this
// API, and per-process identity and liveness from the pool's agents.
//
// A pool agent is one process kind of a pool: the OpenAI frontend (OPENAI),
// the Dynamo PoolRelay (KV_RELAY) or Pylon (PYLON). Each has at most one
// label source (its exported Service) and any number of API registrations,
// one per process instance (agent_id), each with its own lease; they are
// merged by (pool, role). OPENAI and PYLON are ingress agents: the pool is
// live while an ingress agent is live. See Pool.agents.
//
// Routers are derived from exports labelled gds.nvidia.com/role=router; they
// are never registered.
service PoolService {
  // RegisterPool registers a pool or re-registers it. It is idempotent on
  // (cluster, name): the existing pool_id is returned and a new lease epoch
  // is minted. The server assigns pool_id unless the request names one; a
  // pool_id that differs from the pool already holding the name fails with
  // ALREADY_EXISTS and reason POOL_NAME_TAKEN.
  rpc RegisterPool(RegisterPoolRequest) returns (RegisterPoolResponse) {
    option (google.api.http) = {
      post: "/v1/clustersets/{clusterset}/pools"
      body: "*"
    };
  }

  // UpdatePool changes the writer-owned fields named in update_mask.
  // generation must exceed the stored one (STALE_GENERATION).
  rpc UpdatePool(UpdatePoolRequest) returns (UpdatePoolResponse) {
    option (google.api.http) = {
      patch: "/v1/clustersets/{clusterset}/pools/{pool_id}"
      body: "*"
    };
  }

  // HeartbeatPool renews the pool lease and optionally reports worker counts
  // and the desired state. The epoch must be the current one
  // (LEASE_EPOCH_MISMATCH). API pools heartbeat every 20 s by default.
  rpc HeartbeatPool(HeartbeatPoolRequest) returns (HeartbeatPoolResponse) {
    option (google.api.http) = {
      post: "/v1/clustersets/{clusterset}/pools/{pool_id}:heartbeat"
      body: "*"
    };
  }

  // DeregisterPool removes the API registration and every agent
  // registration of the pool. Watchers receive a DELETE event with state
  // GONE. Deregistering an unknown pool succeeds.
  rpc DeregisterPool(DeregisterPoolRequest) returns (DeregisterPoolResponse) {
    option (google.api.http) = {delete: "/v1/clustersets/{clusterset}/pools/{pool_id}"};
  }

  // RegisterPoolAgent registers one process instance of a pool agent, or
  // re-registers it. It is idempotent on (cluster, pool_name, agent.role,
  // agent.agent_id): a new lease epoch is minted for that registration. The
  // pool is created when it does not exist, under
  // the deterministic pool_id of (clusterset, cluster, pool_name); a pool_id
  // in the request that differs from the pool holding the name fails with
  // ALREADY_EXISTS and reason POOL_NAME_TAKEN. generation must exceed the
  // stored one (STALE_GENERATION).
  rpc RegisterPoolAgent(RegisterPoolAgentRequest) returns (RegisterPoolAgentResponse) {
    option (google.api.http) = {
      post: "/v1/clustersets/{clusterset}/pool-agents"
      body: "*"
    };
  }

  // HeartbeatPoolAgent renews one registration's lease and optionally
  // replaces its attributes. The epoch must be the current one
  // (LEASE_EPOCH_MISMATCH).
  rpc HeartbeatPoolAgent(HeartbeatPoolAgentRequest) returns (HeartbeatPoolAgentResponse) {
    option (google.api.http) = {
      post: "/v1/clustersets/{clusterset}/pools/{pool_id}/agents/{role}:heartbeat"
      body: "*"
    };
  }

  // DeregisterPoolAgent removes one registration. The agent stays while its
  // export or another registration remains; the pool stays while an export,
  // the pool registration or another agent remains. Deregistering an unknown
  // registration succeeds.
  rpc DeregisterPoolAgent(DeregisterPoolAgentRequest) returns (DeregisterPoolAgentResponse) {
    option (google.api.http) = {delete: "/v1/clustersets/{clusterset}/pools/{pool_id}/agents/{role}"};
  }

  // GetPool returns one pool.
  rpc GetPool(GetPoolRequest) returns (GetPoolResponse) {
    option (google.api.http) = {get: "/v1/clustersets/{clusterset}/pools/{pool_id}"};
  }

  // ListPools returns the pools of a clusterset that match every filter set.
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse) {
    option (google.api.http) = {get: "/v1/clustersets/{clusterset}/pools"};
  }

  // WatchPools streams the matching pools: a snapshot, then deltas and
  // bookmarks. See EventType.
  rpc WatchPools(WatchPoolsRequest) returns (stream WatchPoolsResponse) {
    option (google.api.http) = {get: "/v1/clustersets/{clusterset}/pools:watch"};
  }

  // ListRouters returns the routers derived from exports labelled
  // gds.nvidia.com/role=router.
  rpc ListRouters(ListRoutersRequest) returns (ListRoutersResponse) {
    option (google.api.http) = {get: "/v1/clustersets/{clusterset}/routers"};
  }

  // WatchRouters streams the matching routers: a snapshot, then deltas and
  // bookmarks. See EventType.
  rpc WatchRouters(WatchRoutersRequest) returns (stream WatchRoutersResponse) {
    option (google.api.http) = {get: "/v1/clustersets/{clusterset}/routers:watch"};
  }
}

// PoolState is the desired or derived state of a pool.
//
// Derivation: REGISTERED until an ingress agent (OPENAI or PYLON) is live,
// or, for an API-only pool without agents, until its first heartbeat; then
// desired_state (ACTIVE or DRAINING) while the pool is live, UNHEALTHY
// otherwise. A pool is live while its cluster lease is active and an ingress
// agent has a ready endpoint, or while an ingress agent's lease is active. A
// pool whose ingress is the frontend URL of its API registration (no
// services, no labelled export) is also live while its own lease is active,
// whatever agents it has. A pool whose only live agent is a KV_RELAY stays
// REGISTERED. GONE after DeregisterPool or when the labelled exports, the API
// registration and every agent registration are gone; a GONE pool is kept as
// a tombstone for one bookmark interval.
enum PoolState {
  POOL_STATE_UNSPECIFIED = 0;
  POOL_STATE_REGISTERED = 1;
  POOL_STATE_ACTIVE = 2;
  POOL_STATE_DRAINING = 3;
  POOL_STATE_UNHEALTHY = 4;
  POOL_STATE_GONE = 5;
}

// FrontendRole is what a pool endpoint or Service serves.
enum FrontendRole {
  FRONTEND_ROLE_UNSPECIFIED = 0;
  // OpenAI-compatible HTTP frontend; the dispatch address for routers.
  // Label role pool-frontend.
  FRONTEND_ROLE_OPENAI = 1;
  // KV event relay (Dynamo PoolRelay). Label role kv-relay. Dials routers
  // over gRPC; not an ingress.
  FRONTEND_ROLE_KV_RELAY = 2;
  // Pylon transport: registers with routers and carries requests over its
  // reverse tunnel. Label role pylon. An ingress with no inbound address.
  FRONTEND_ROLE_PYLON = 3;
}

// AgentSource says where a pool agent is known from.
enum AgentSource {
  AGENT_SOURCE_UNSPECIFIED = 0;
  // An exported Service with the agent's role label.
  AGENT_SOURCE_LABEL = 1;
  // A RegisterPoolAgent registration.
  AGENT_SOURCE_API = 2;
  // Both.
  AGENT_SOURCE_BOTH = 3;
}

// DialMode says how routers and a pool agent connect.
enum DialMode {
  DIAL_MODE_UNSPECIFIED = 0;
  // Routers dial the agent (OPENAI frontend).
  DIAL_MODE_INBOUND = 1;
  // The agent dials the routers (PYLON, KV_RELAY).
  DIAL_MODE_OUTBOUND = 2;
}

// PoolAgentRegistration is one process instance's registration of an agent
// role, with its own lease.
message PoolAgentRegistration {
  // Identity of the registering process (a Pylon inference_server_id, a
  // relay pod name); unique within the agent.
  string agent_id = 1;
  Lease lease = 2;
  // Writer-owned, at most 16 entries.
  map<string, string> attributes = 3;
  // Writer generation.
  uint64 generation = 4;
  google.protobuf.Timestamp registered_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// PoolAgent is one process kind of a pool, merged from its exported Service
// and its API registrations. There is at most one per (pool, role).
message PoolAgent {
  FrontendRole role = 1;
  AgentSource source = 2;
  // The exported Service, when source has LABEL.
  ServiceRef service = 3;
  // Port routers dial for INBOUND agents; empty for OUTBOUND.
  string port_name = 4;
  // Endpoints of the exported Service; 0 without a label source.
  int32 endpoint_count = 5;
  // Ready endpoints while the cluster lease is active.
  int32 ready_endpoint_count = 6;
  // Fields 7, 8, 10, 12, 13 and 14 mirror the registration in registrations
  // whose lease expires last (the freshest); unset without a registration.
  Lease lease = 7;
  string agent_id = 8;
  DialMode dial_mode = 9;
  map<string, string> attributes = 10;
  // Derived: a ready endpoint while the cluster lease is active, or any
  // active registration lease.
  bool live = 11;
  uint64 generation = 12;
  google.protobuf.Timestamp registered_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // Every registration of this role, sorted by agent_id. One per process
  // instance, for example one per Pylon pod.
  repeated PoolAgentRegistration registrations = 15;
  // Registrations whose lease is active.
  int32 active_registration_count = 16;
}

// Location places a pool.
message Location {
  string region = 1;
  // Data center, from the gds.nvidia.com/dc annotation or the API.
  string dc = 2;
  // Cluster id of the pool; required.
  string cluster = 3;
  repeated string zones = 4;
}

// ModelServed is a model a pool serves.
message ModelServed {
  string model_id = 1;
  repeated string aliases = 2;
  map<string, string> attributes = 3;
}

// ServiceRef names an exported Service in the pool's cluster.
message ServiceRef {
  string namespace = 1;
  string name = 2;
  FrontendRole role = 3;
}

// FrontendEndpoint is a dialable entry point of a pool. Exactly one of url
// and service is set. A client resolves service to the derived Service of the
// import in its own cluster:
// derived-<hash>.<namespace>.svc.cluster.local, with the port named
// port_name.
message FrontendEndpoint {
  FrontendRole role = 1;
  // Static URL, for pools fronted by a load balancer.
  string url = 2;
  // Exported Service in the pool's cluster.
  ServiceRef service = 3;
  // Service port to dial; defaults to the gds.nvidia.com/http-port-name
  // annotation, then http.
  string port_name = 4;
}

// Pool is the unit of routing, nominally one Dynamo graph deployment.
message Pool {
  string clusterset = 1;
  // Server-assigned UUID unless given at registration; stable for the pool's
  // life.
  string pool_id = 2;
  // DNS label unique within (clusterset, cluster).
  string name = 3;
  Location location = 4;
  // Free-form hardware class, for example b200-ib.
  string hardware_class = 5;
  // At most 256 entries.
  repeated ModelServed models = 6;
  int32 worker_count = 7;
  int32 ready_worker_count = 8;
  // Dispatch entries. Always contains the OPENAI entry: the exported
  // frontend Service for label-derived pools, the caller's url for API pools.
  repeated FrontendEndpoint frontends = 9;
  // Exported Services in the pool's cluster used for the endpoint join.
  repeated ServiceRef services = 10;
  map<string, string> labels = 11;
  // ACTIVE or DRAINING; set through the API overlay.
  PoolState desired_state = 12;
  // Derived state, see PoolState.
  PoolState state = 13;
  // Lease of an API registration; unset for label-only pools.
  Lease lease = 14;
  // Writer generation of the API registration.
  uint64 generation = 15;
  // Identity of the registering writer.
  string owner_id = 16;
  google.protobuf.Timestamp registered_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  // Endpoints joined from the imports of the pool's Services in
  // location.cluster, one entry per Service. Counts are always set; the
  // endpoint lists only when include_endpoints is requested.
  repeated ClusterEndpoints endpoints = 19;
  // Ready endpoints across the pool's OPENAI frontend Services. Routers that
  // dispatch inbound skip pools with none.
  int32 ready_endpoint_count = 20;
  // One entry per role present (OPENAI, KV_RELAY, PYLON), sorted by role.
  repeated PoolAgent agents = 21;
  // True while a KV_RELAY agent is live: KV cache facts are available for
  // this pool.
  bool kv_relay_live = 22;
  // Ready endpoints across the ingress agents (OPENAI and PYLON).
  int32 ready_ingress_count = 23;
}

// RouterMode says what the replicas of a Router are, from the export
// annotation gds.nvidia.com/router-mode.
enum RouterMode {
  // The annotation is absent or has an unknown value. Clients treat it as
  // ROUTER_MODE_BACKEND_ROUTER, the mode of exports made before router
  // modes existed.
  ROUTER_MODE_UNSPECIFIED = 0;
  // Annotation value backend-router: the replicas are stargate-k8s-router
  // pods that forward registration by authority and the QUIC tunnel by SNI
  // to the Stargate pods of their cluster. A pylon learns the per-pod
  // authorities from WatchStargates; replica identities are k8s-router pod
  // names and are not authorities.
  ROUTER_MODE_BACKEND_ROUTER = 1;
  // Annotation value direct: the replicas are the Stargate pods themselves
  // and a pylon dials each one. A replica's authority, QUIC SNI and TLS
  // name are hostname_template with {pod_name} replaced by its identity.
  ROUTER_MODE_DIRECT = 2;
}

// RouterReplica is one endpoint of a router Service.
message RouterReplica {
  string address = 1;
  AddressType address_type = 2;
  bool ready = 3;
  string hostname = 4;
  string zone = 5;
  // Pod identity of the replica: the EndpointSlice endpoint hostname when
  // set, else the pod name the MCS controller exports as the endpoint
  // attribute targetRef.name, else empty. In direct mode a client forms the
  // replica's authority as Router.hostname_template with {pod_name} replaced
  // by the identity, plus ":" and Router.grpc_port (no authority when the
  // template or the identity is empty). In backend-router mode the identity
  // is a k8s-router pod name and not an authority.
  string identity = 6;
}

// Router is derived from one export labelled gds.nvidia.com/role=router, one
// per (cluster, namespace, name). Pylons use its ready replicas as seeds,
// <dial_scheme>://<replica address>:<grpc_port>, so that a seed reaches the
// routers of this cluster even when other clusters export the same namespace
// and name into one shared import.
message Router {
  string cluster = 1;
  string region = 2;
  string namespace = 3;
  string name = 4;
  ServiceType type = 5;
  LeaseState cluster_lease_state = 6;
  // Port named by gds.nvidia.com/grpc-port-name (default grpc); 0 if absent.
  int32 grpc_port = 7;
  // Port named by gds.nvidia.com/http-port-name (default http); 0 if absent.
  int32 http_port = 8;
  // http or https, from gds.nvidia.com/dial-scheme.
  string dial_scheme = 9;
  repeated RouterReplica replicas = 10;
  map<string, string> labels = 11;
  map<string, string> annotations = 12;
  // UDP port of the reverse tunnel, named by gds.nvidia.com/quic-port-name
  // (default quic); 0 if absent. Informational for Pylon, whose tunnel
  // address comes from the registration ack.
  int32 quic_port = 13;
  // Every port of the exported Service, for consumers whose protocol GDS
  // does not name.
  repeated ServicePort ports = 14;
  // From the annotation gds.nvidia.com/router-mode (backend-router or
  // direct, case-insensitive); ROUTER_MODE_UNSPECIFIED when the annotation
  // is absent or unknown. Clients treat ROUTER_MODE_UNSPECIFIED as
  // ROUTER_MODE_BACKEND_ROUTER for compatibility.
  RouterMode router_mode = 15;
  // The annotation gds.nvidia.com/hostname-template verbatim, for example
  // {pod_name}.stargate.example.com; empty when absent. In direct mode a
  // replica's authority is this template with its single {pod_name}
  // replaced by RouterReplica.identity, plus ":" and grpc_port, for example
  // stargate-0.stargate.example.com:50071. The same host is the QUIC SNI and
  // the TLS name of the replica.
  string hostname_template = 16;
}

message RegisterPoolRequest {
  string clusterset = 1;
  // Writer-owned fields: pool_id (optional), name, location, hardware_class,
  // models, worker_count, ready_worker_count, frontends, services, labels,
  // desired_state and owner_id. Server-owned fields are ignored.
  Pool pool = 2;
  // Pool lease duration; clamped to [10 s, 5 m]; 60 s when unset.
  google.protobuf.Duration lease_ttl = 3;
  // Writer generation, max(previous + 1, unix milliseconds).
  uint64 generation = 4;
}

message RegisterPoolResponse {
  // The stored pool with its pool_id and newly minted lease.
  Pool pool = 1;
  google.protobuf.Timestamp server_time = 2;
}

message UpdatePoolRequest {
  string clusterset = 1;
  string pool_id = 2;
  // New values of the fields named in update_mask.
  Pool pool = 3;
  // Writer-owned Pool field paths, for example worker_count or
  // desired_state. An empty mask replaces every writer-owned field.
  google.protobuf.FieldMask update_mask = 4;
  // Writer generation, max(previous + 1, unix milliseconds).
  uint64 generation = 5;
}

message UpdatePoolResponse {
  Pool pool = 1;
}

message HeartbeatPoolRequest {
  string clusterset = 1;
  string pool_id = 2;
  // The lease epoch returned by RegisterPool.
  uint64 epoch = 3;
  // Optional worker counts; unchanged when unset.
  optional int32 worker_count = 4;
  optional int32 ready_worker_count = 5;
  // ACTIVE or DRAINING; unchanged when UNSPECIFIED.
  PoolState desired_state = 6;
}

message HeartbeatPoolResponse {
  Lease lease = 1;
  // Derived state after the heartbeat.
  PoolState state = 2;
  google.protobuf.Timestamp server_time = 3;
}

message DeregisterPoolRequest {
  string clusterset = 1;
  string pool_id = 2;
}

message DeregisterPoolResponse {}

message RegisterPoolAgentRequest {
  string clusterset = 1;
  // Cluster id of the pool; required.
  string cluster = 2;
  // Pool name, a DNS label unique within (clusterset, cluster); required.
  string pool_name = 3;
  // Optional; must equal the pool's id when the pool exists.
  string pool_id = 4;
  // Writer-owned fields: role (OPENAI, KV_RELAY or PYLON), agent_id
  // (required, at most 253 bytes) and attributes. Other fields are ignored.
  PoolAgent agent = 5;
  // Agent lease duration; clamped to [10 s, 5 m]; 60 s when unset.
  google.protobuf.Duration lease_ttl = 6;
  // Writer generation, max(previous + 1, unix milliseconds).
  uint64 generation = 7;
}

message RegisterPoolAgentResponse {
  string pool_id = 1;
  // The merged agent; registration carries this process's newly minted
  // lease.
  PoolAgent agent = 2;
  PoolAgentRegistration registration = 5;
  // Derived pool state after the registration.
  PoolState pool_state = 3;
  google.protobuf.Timestamp server_time = 4;
}

message HeartbeatPoolAgentRequest {
  string clusterset = 1;
  string pool_id = 2;
  FrontendRole role = 3;
  // The lease epoch returned by RegisterPoolAgent.
  uint64 epoch = 4;
  // Replaces the registration's attributes when non-empty.
  map<string, string> attributes = 5;
  // The registering process; required.
  string agent_id = 6;
}

message HeartbeatPoolAgentResponse {
  Lease lease = 1;
  // Derived pool state after the heartbeat.
  PoolState pool_state = 2;
  google.protobuf.Timestamp server_time = 3;
}

message DeregisterPoolAgentRequest {
  string clusterset = 1;
  string pool_id = 2;
  FrontendRole role = 3;
  // The registering process; required. A REST caller passes it as the
  // agent_id query parameter.
  string agent_id = 4;
}

message DeregisterPoolAgentResponse {}

message GetPoolRequest {
  string clusterset = 1;
  string pool_id = 2;
  bool include_endpoints = 3;
}

message GetPoolResponse {
  Pool pool = 1;
}

// ListPoolsRequest filters are combined with AND; an empty filter matches
// everything.
message ListPoolsRequest {
  string clusterset = 1;
  string region = 2;
  string dc = 3;
  string cluster = 4;
  string hardware_class = 5;
  // Matches a model_id or an alias.
  string model = 6;
  // Matches any of the listed derived states; all states except GONE when
  // empty.
  repeated PoolState states = 7;
  // Matches pool labels.
  LabelSelector selector = 8;
  bool include_endpoints = 9;
}

message ListPoolsResponse {
  repeated Pool pools = 1;
  // Revision of the view the list was taken from; usable as resume_revision.
  string revision = 2;
}

// WatchPoolsRequest takes the filters of ListPoolsRequest.
message WatchPoolsRequest {
  string clusterset = 1;
  string region = 2;
  string dc = 3;
  string cluster = 4;
  string hardware_class = 5;
  string model = 6;
  repeated PoolState states = 7;
  LabelSelector selector = 8;
  bool include_endpoints = 9;
  // Revision from a previous SNAPSHOT_END, BOOKMARK or delta.
  string resume_revision = 10;
}

// WatchPoolsResponse is one watch event.
message WatchPoolsResponse {
  EventType type = 1;
  // Set for UPSERT and DELETE. A DELETE carries state GONE.
  Pool pool = 2;
  // Set for SNAPSHOT_END, BOOKMARK and every delta.
  string revision = 3;
}

message ListRoutersRequest {
  string clusterset = 1;
  string region = 2;
  string cluster = 3;
}

message ListRoutersResponse {
  repeated Router routers = 1;
  // Revision of the view the list was taken from; usable as resume_revision.
  string revision = 2;
}

message WatchRoutersRequest {
  string clusterset = 1;
  string region = 2;
  string cluster = 3;
  // Revision from a previous SNAPSHOT_END, BOOKMARK or delta.
  string resume_revision = 4;
}

// WatchRoutersResponse is one watch event.
message WatchRoutersResponse {
  EventType type = 1;
  // Set for UPSERT and DELETE.
  Router router = 2;
  // Set for SNAPSHOT_END, BOOKMARK and every delta.
  string revision = 3;
}

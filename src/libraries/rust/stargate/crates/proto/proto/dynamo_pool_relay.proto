syntax = "proto3";

package dynamo.pool.relay.v1;

import "google/protobuf/empty.proto";

// Read-only stats API of the Pool Relay that serves one locality, on a loopback
// address.
//
// Snapshots are complete: each KvUsageSnapshot or LoadSnapshot replaces the
// previous one on the same stream. Nothing is merged across snapshots, and a
// pool or model missing from a snapshot is not currently known to the Relay.
//
// Gauges describe the moment of observation. Fields ending in `_total` are
// cumulative counters that never decrease within one `relay_incarnation`;
// consumers must treat a changed `relay_incarnation` as a counter reset.
//
// An unset `optional` field means "unknown", never zero. It is unset whenever
// the owning message's DataStatus is not COMPLETE, unless documented otherwise.
//
// `RelayMessageMetadata.emitted_at_unix_ms` is when the Relay emitted the
// message; `source_observed_at_unix_ms` fields are when the underlying data was
// observed (the oldest contributing source when several contribute). Their
// difference is the data's age at emit time.
//
// All timestamps are milliseconds since the Unix epoch; 0 means unknown.
//
// "Expected" sources are publishers of the load protocol this Relay reads.
// Routers and frontends that predate it are not counted, so a mixed-version
// deployment can report COMPLETE while missing their load. Workers that predate
// periodic KV usage replay report usage only when it changes, so after the Relay
// resubscribes their usage is unknown until it next changes.
service PoolRelay
{
  // Streams each pool's index of cached KV blocks. The index format is named
  // by each producer (currently a cuckoo filter).
  //
  // Initial sync: for every catalog pool the Relay sends `stats`, then `frame`s
  // for that pool. SNAPSHOT_CHUNK frames carry a full index and are followed by
  // DELTA frames. Every frame names its producer generation, and each DELTA's
  // `base_sequence` equals the `sequence` of the frame before it.
  //
  // Fencing: the Relay forwards deltas as they arrive and re-samples each pool
  // at least once per second. When the pool becomes incomplete (an expected
  // rank is not materialized) or its frames can no longer be forwarded, the
  // Relay sends `stats` with a non-COMPLETE status and stops forwarding deltas;
  // consumers must stop trusting that pool's index. Deltas forwarded before the
  // fence may already reflect the incomplete pool. When the pool recovers, the
  // Relay sends `stats` with COMPLETE followed by a fresh snapshot, which
  // replaces the consumer's index. A consumer too slow for a pool's frames is
  // fenced the same way; its snapshot is re-sent after a delay that grows while
  // it keeps falling behind. `stats` is also re-sent whenever
  // `capacity_omissions` grows.
  //
  // Retirement: when a pool leaves the catalog or its producer generation
  // changes, the Relay sends `retired` for the old generation; consumers must
  // drop its index. A new generation then starts again with initial sync.
  //
  // Heartbeat: after the initial catalog is synced, and about once per second
  // after that, the Relay sends `heartbeat` with the catalog revision it mirrors.
  //
  // The stream ends with an error status when it can no longer be continued
  // (for example the Relay is shutting down); consumers reconnect and start
  // over. A pool that disappears or restarts never ends the stream; it is
  // retired.
  rpc WatchKvBlockIndex(google.protobuf.Empty) returns (stream KvBlockIndexUpdate);

  // Streams per-pool KV cache usage. The first message is sent once the Relay
  // has built its first aggregate; later messages follow about once per second.
  // Slow consumers skip intermediate snapshots.
  rpc WatchKvUsage(google.protobuf.Empty) returns (stream KvUsageSnapshot);

  // Streams per-pool scheduler load and per-model frontend load, with the same
  // cadence and skipping behavior as WatchKvUsage.
  rpc WatchLoad(google.protobuf.Empty) returns (stream LoadSnapshot);
}

// Identifies the Relay instance that emitted a message.
message RelayMessageMetadata
{
  // Random value chosen each time the Relay starts. A change means every
  // cumulative `_total` counter and every index producer generation was reset.
  fixed64 relay_incarnation = 1;
  uint64 emitted_at_unix_ms = 2;
}

// Coverage of the data in a message.
enum DataStatus {
  DATA_STATUS_UNSPECIFIED = 0;
  // Every expected source contributed; all documented optional fields are set.
  DATA_STATUS_COMPLETE = 1;
  // Some but not all expected sources contributed; aggregate optional fields
  // are unset because a partial sum would be misleading.
  DATA_STATUS_DEGRADED = 2;
  // No expected source contributed.
  DATA_STATUS_UNAVAILABLE = 3;
}

// Whether an identity component was configured explicitly or derived from defaults.
enum IdentitySource {
  IDENTITY_SOURCE_UNSPECIFIED = 0;
  IDENTITY_SOURCE_DEFAULT_DERIVED = 1;
  IDENTITY_SOURCE_EXPLICIT = 2;
}

enum WorkerRole {
  WORKER_ROLE_UNSPECIFIED = 0;
  // Workers run both prefill and decode.
  WORKER_ROLE_AGGREGATED = 1;
  WORKER_ROLE_PREFILL = 2;
  WORKER_ROLE_DECODE = 3;
  WORKER_ROLE_ENCODE = 4;
}

// Stable identity of a worker pool: workers that share KV cache semantics and a
// routing scope within one locality. All fields together form the key.
message PoolIdentity
{
  // Digest of the settings that determine KV block contents (e.g. model, block size).
  bytes cache_semantics_digest = 1;
  IdentitySource cache_semantics_source = 2;
  // Digest of the scope within which requests are routed among the pool's workers.
  bytes routing_scope_digest = 3;
  IdentitySource routing_scope_source = 4;
  // Opaque id of the locality the Relay serves, typically one data center. A
  // locality may span availability zones. Derived from the Relay's `--dc-id`,
  // so it is stable while that value is.
  fixed64 locality_id = 5;
}

// A model as registered with Dynamo.
message ModelRegistration
{
  // Canonical model name.
  string model = 1;
  // Base model; equals `model` unless `model` is a LoRA adapter.
  string base_model = 2;
  // LoRA adapter name; unset for base models.
  optional string adapter = 3;
  // Other names under which the model is served.
  repeated string aliases = 4;
}

// ---------------------------------------------------------------------------
// WatchKvBlockIndex
// ---------------------------------------------------------------------------

// Parameters needed to decode a cuckoo-filter index payload.
message CuckooFormat
{
  uint32 format_version = 1;
  fixed64 seed = 2;
  uint64 bucket_count = 3;
  uint32 fingerprint_bits = 4;
  uint32 slots_per_bucket = 5;
}

// One producer generation of a pool's index. Frames, stats, and retirements
// apply only to the generation they name.
message IndexProducer
{
  PoolIdentity pool = 1;
  // Changes when the Relay recreates the pool's index.
  fixed64 producer_incarnation = 2;
  // Changes when the pool's worker layout changes within an incarnation.
  uint64 layout_generation = 3;
  // How to decode this generation's frame payloads.
  oneof format
  {
    CuckooFormat cuckoo = 4;
  }
}

enum IndexFrameKind {
  INDEX_FRAME_KIND_UNSPECIFIED = 0;
  // Part of a full snapshot. A snapshot replaces the consumer's index for the
  // generation.
  INDEX_FRAME_KIND_SNAPSHOT_CHUNK = 1;
  // Incremental change applied on top of all earlier frames of the generation.
  INDEX_FRAME_KIND_DELTA = 2;
}

message IndexFrame
{
  IndexProducer producer = 1;
  // Publication sequence this frame applies on top of; equals `sequence` for
  // snapshot chunks.
  uint64 base_sequence = 2;
  // Publication sequence after applying this frame.
  uint64 sequence = 3;
  IndexFrameKind kind = 4;
  // Encoded in the producer's format.
  bytes payload = 5;
}

// The named producer generation is gone; consumers must drop its index.
message IndexRetired
{
  IndexProducer producer = 1;
}

// State of a pool's index in the Relay.
message IndexStats
{
  IndexProducer producer = 1;
  // Latest publication sequence the Relay has produced for this generation.
  uint64 publication_sequence = 2;
  // Worker ranks whose KV state is present in the index.
  uint64 materialized_ranks = 3;
  uint64 unique_blocks = 4;
  // COMPLETE: exactly the expected ranks are materialized. DEGRADED: some
  // ranks are materialized but not exactly the expected ones, or the Relay
  // stopped forwarding this generation's frames. UNAVAILABLE: none are.
  DataStatus status = 5;
  // Cumulative count of blocks the index could not hold because it was full.
  // Lookups may miss those blocks; this does not affect `status`.
  uint64 capacity_omissions = 6;
  // When the Relay sampled the pool's index state for these stats.
  uint64 source_observed_at_unix_ms = 7;
}

message IndexHeartbeat
{
  // Revision of the pool catalog the stream currently mirrors: every pool of
  // this revision has been announced and every pool removed by it retired.
  uint64 catalog_revision = 1;
}

message KvBlockIndexUpdate
{
  RelayMessageMetadata metadata = 1;
  oneof update
  {
    IndexFrame frame = 2;
    IndexRetired retired = 3;
    IndexStats stats = 4;
    IndexHeartbeat heartbeat = 5;
  }
}

// ---------------------------------------------------------------------------
// WatchKvUsage
// ---------------------------------------------------------------------------

message KvUsageSnapshot
{
  RelayMessageMetadata metadata = 1;
  // Every catalog pool, including pools with no usable data (status UNAVAILABLE).
  repeated PoolKvUsage pools = 2;
}

message PoolKvUsage
{
  PoolIdentity pool = 1;
  repeated ModelRegistration models = 2;
  // Roles of the pool's workers; more than one for a mixed-role pool.
  repeated WorkerRole roles = 3;
  uint32 block_size_tokens = 4;
  // Worker ranks the pool's runtime configuration declares.
  uint64 expected_ranks = 5;
  // Declared ranks that have reported KV usage.
  uint64 observed_ranks = 6;
  // Set only when COMPLETE.
  optional uint64 capacity_blocks = 7;
  // Set only when COMPLETE.
  optional uint64 used_blocks = 8;
  // COMPLETE: every expected rank reported usage and capacity. DEGRADED: some
  // expected ranks reported. UNAVAILABLE: no rank reported, or the pool is not
  // active.
  DataStatus status = 9;
  uint64 source_observed_at_unix_ms = 10;
}

// ---------------------------------------------------------------------------
// WatchLoad
// ---------------------------------------------------------------------------

message LoadSnapshot
{
  RelayMessageMetadata metadata = 1;
  // Every catalog pool, including pools with no usable data.
  repeated PoolView pools = 2;
  // Every model registered by a catalog pool or served by a frontend.
  repeated ModelView models = 3;
}

// Request counts reported by frontends. Present on models only.
message RequestLifecycleStats
{
  // Cumulative over every frontend the Relay has heard from during its
  // `relay_incarnation`, including frontends that have since left. Set even
  // when the view is not COMPLETE; frontends that have not reported yet are
  // missing from them.
  uint64 requests_started_total = 1;
  uint64 requests_completed_total = 2;
  uint64 requests_failed_total = 3;
  uint64 requests_cancelled_total = 4;
  // Admitted requests that have not produced their first output token yet:
  // being tokenized, queued, routed, or prefilled. Set only when COMPLETE.
  optional uint64 requests_awaiting_first_token = 5;
  // Requests producing output tokens. Set only when COMPLETE.
  optional uint64 requests_generating = 6;
}

// Token load. Each field is documented with the view that carries it.
message TokenLoadStats
{
  // Pools: uncached prompt tokens the routers' schedulers have assigned to the
  // pool and that are waiting for or undergoing prefill.
  optional uint64 active_prefill_tokens = 1;
  // Pools: KV blocks the routers' schedulers attribute to running requests.
  optional uint64 active_decode_blocks = 2;
  // Models: prompt tokens of `requests_awaiting_first_token`.
  optional uint64 awaiting_first_token_input_tokens = 3;
  // Models: prompt tokens of every in-flight request.
  optional uint64 inflight_input_tokens = 4;
  // Models: cumulative, with the same rules as the `_total` request counters.
  optional uint64 input_tokens_total = 5;
  optional uint64 output_tokens_total = 6;
}

// Prompt token counts are known once a request has been tokenized; requests
// still being tokenized contribute zero input tokens. Gauges are set only when
// `status` is COMPLETE.
message LoadView
{
  // Unset for pools.
  RequestLifecycleStats requests = 1;
  TokenLoadStats tokens = 2;
  DataStatus status = 3;
  // Oldest source report contributing to this view; 0 when there is none.
  uint64 source_observed_at_unix_ms = 4;
}

// Expected frontends are the frontends registered in discovery plus every
// frontend that published within the last few seconds. A frontend that
// publishes but does not list a model is not serving it and contributes zero.
message ModelDeploymentStatus
{
  uint64 expected_frontends = 1;
  // Expected frontends that published recently.
  uint64 observed_frontends = 2;
  // Observed frontends that list the model and are ready to serve.
  uint64 ready_frontends = 3;
  // Catalog pools that serve the model; empty when only frontends know it.
  repeated PoolIdentity serving_pools = 4;
}

// Model load: `load.status` is COMPLETE when frontend discovery succeeded and
// every expected frontend published recently, DEGRADED when some are silent or
// discovery failed, and UNAVAILABLE when none published recently.
message ModelView
{
  ModelRegistration model = 1;
  LoadView load = 2;
  ModelDeploymentStatus deployment = 3;
}

// Derived from the pool's worker membership.
message PoolDeploymentStatus
{
  // Roles of the pool's workers; more than one for a mixed-role pool.
  repeated WorkerRole roles = 1;
  // Set while the pool is active.
  optional uint64 live_workers = 2;
  // Sum over workers of max concurrent sequences times data-parallel size. Set
  // while the pool is active and every worker declares its limit.
  optional uint64 max_concurrency = 3;
}

// Pool load as seen by the routers' schedulers: `load.status` is COMPLETE when
// every expected scheduler reported every expected rank recently, DEGRADED when
// coverage is partial, and UNAVAILABLE when no scheduler reported recently or
// the pool is not active.
message PoolView
{
  PoolIdentity pool = 1;
  LoadView load = 2;
  PoolDeploymentStatus deployment = 3;
}

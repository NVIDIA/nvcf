# logback-test.xml replaces real newlines with literal \n, turning a stack trace into one huge
# physical line. This causes IntelliJ to freeze when tests are run from a terminal within the IDE.
# For example, I found single log lines around 27K to 40K characters long. That is exactly the
# kind of thing IntelliJ’s terminal can struggle to render, especially if soft wrapping is enabled.
# Commenting out here and also deleted the same setup in IntegrationTest.java.
#logging:
#  config: classpath:logback-test.xml

spring:
  application:
    name: icms-core-test
    env: test
    version: 0.0.1-test
    host:
      id: local-test-host
      dc: local-test-id
  cloud:
    kubernetes:
      config:
        enabled: false

nv-boot:
  reloadable-properties:
    enabled: true
    file: local_env/vault/secrets.json
    poll-duration: 300s

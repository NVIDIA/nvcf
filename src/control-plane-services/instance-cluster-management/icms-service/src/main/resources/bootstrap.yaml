logging:
  config: classpath:logback-spring.xml

spring:
  application:
    name: icms-api
    version: ${SPRING_APPLICATION_VERSION:0.0.1-dummy-version}
    env: default
    host:
      id: ${HOSTNAME:${spring.application.name}-${random.int}-host}
      dc: ${AWS_REGION:${spring.application.name}-${random.uuid}-dc}
  cloud:
    kubernetes:
      config:
        enabled: ${REMOTE_CONFIG_ENABLED:false}
        # Self-hosted: chart overrides via REMOTE_CONFIG_NAME (release-scoped fullname pattern in sis-colocated-deploy).
        name: ${REMOTE_CONFIG_NAME:icms-api-remote-config}
        fail-fast: true
        retry:
          enabled: true
          max-attempts: 6
      reload:
        enabled: true
        mode: event
        strategy: refresh
        monitoring-config-maps: true
        monitoring-secrets: false

nv-boot:
  reloadable-properties:
    enabled: true
    file: file:/home/tomcat/vault-agent/secrets/vault-secrets.json
    poll-duration: 300s

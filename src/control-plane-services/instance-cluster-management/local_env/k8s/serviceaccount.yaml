apiVersion: v1
kind: ServiceAccount
metadata:
  name: picasso-sa
  namespace: picasso-local
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: picasso-role
  namespace: picasso-local
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: picasso-role-binding
  namespace: picasso-local
subjects:
  - kind: ServiceAccount
    name: picasso-sa
roleRef:
  kind: Role
  name: picasso-role
  apiGroup: rbac.authorization.k8s.io

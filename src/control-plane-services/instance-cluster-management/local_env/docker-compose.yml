# Local development: CQL on localhost:9042 (matches spring.cassandra defaults for profile `local`).
# Maven / Testcontainers use docker-compose.test.yml (ephemeral publish) to avoid reactor port clashes.
name: icms-local

services:
  cassandra:
    image: cassandra:5
    ports:
      - "9042:9042"
    environment:
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=256M
      - DC=datacenter1
      - LANG=C.UTF-8
    volumes:
      - ./cassandra/cassandra.yaml:/etc/cassandra/cassandra.yaml
      - ./cassandra/keystore.node0:/etc/cassandra/keystore.node0
      - ./cassandra/truststore.node0:/etc/cassandra/truststore.node0
      - ./cassandra/schema:/docker-entrypoint-initdb.d
      - ./cassandra/entrypoint.sh:/entrypoint.sh
    command:
      - /bin/bash
      - -c
      - |
        chmod +x /entrypoint.sh
        nohup /entrypoint.sh & cassandra -f -R
    # Healthy once entrypoint.sh has applied the cql init scripts. The
    # cassandra-populate profile service waits for this before seeding.
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/cassandra/.schema-init-done"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s
  # Optional one-shot seeder: load CSV exports (cqlsh COPY TO format, one
  # <table>.csv per table) into Cassandra after the schema init entrypoint.
  # Not started by a plain `docker compose up`. To seed:
  #   ICMS_CSV_DIR=/path/to/csv-exports docker compose --profile populate up
  cassandra-populate:
    image: cassandra:5
    profiles:
      - populate
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - KEYSPACE=test
      - CSV_DIR=/csv
    volumes:
      - ${ICMS_CSV_DIR:-./csv}:/csv:ro
      - ./cassandra/populate-data.sh:/populate-data.sh:ro
    command:
      - /bin/bash
      - /populate-data.sh
    restart: "no"
  aws:
    image: localstack/localstack:4.3
    environment:
      - SERVICES=sqs,sns,sts
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - '4566:4566'
      - '8081:8081'
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./aws/startup.sh:/etc/localstack/init/ready.d/startup.sh
  nats:
    image: nats:2.10
    ports:
      - "4222:4222"
      - "4242:4242"
      - "4282:4282"
    volumes:
      - ./nats/nats-server.conf:/nats-server.conf

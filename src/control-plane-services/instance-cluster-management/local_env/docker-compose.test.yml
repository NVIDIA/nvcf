# Integration tests only (nvcf-core / icms-service IntegrationTestConfiguration). Ephemeral host
# port for CQL so icms-core then icms-service Surefire runs do not collide on localhost:9042.
name: icms-test

services:
  aws:
    image: localstack/localstack:4.3
    environment:
      - SERVICES=sqs,sns,sts
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "4566"
      - "8081"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./aws/startup.sh:/etc/localstack/init/ready.d/startup.sh
  cassandra:
    image: cassandra:5
    ports:
      - "9042"
    environment:
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=256M
      - DC=datacenter1
      - LANG=C.UTF-8
    volumes:
      - ./cassandra/cassandra.yaml:/etc/cassandra/cassandra.yaml
      - ./cassandra/keystore.node0:/etc/cassandra/keystore.node0
      - ./cassandra/truststore.node0:/etc/cassandra/truststore.node0
      - ./cassandra/schema:/docker-entrypoint-initdb.d
      - ./cassandra/entrypoint.sh:/entrypoint.sh
    command:
      - /bin/bash
      - -c
      - nohup /entrypoint.sh & cassandra -f -R
  nats:
    image: nats:2.11
    ports:
      - "4222"
      - "4242"
      - "4282"
    volumes:
      - ./nats/nats-server.conf:/nats-server.conf

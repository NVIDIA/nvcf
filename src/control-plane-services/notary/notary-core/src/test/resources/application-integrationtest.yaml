spring:
  jmx:
    enabled: false
  autoconfigure:
    exclude: org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration
  cloud:
    discovery:
      enabled: false
  main:
    allow-bean-definition-overriding: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/.well-known/jwks.json
          jws-algorithms: ES256
  web:
    error:
      whitelabel:
        enabled: false

logging:
  level:
    root: INFO
    com.nvidia: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security.oauth2.jwt: TRACE
    org.springframework.web.servlet.mvc.method.annotation: TRACE

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,metrics
    jmx:
      exposure:
        exclude: '*'
      domain: localhost
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include:
            - readinessState
        liveness:
          include:
            - livenessState
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    vault:
      enabled: false
  metrics:
    enable:
      all: true
    tags:
      env: ${spring.application.env}
      micro_service: ${spring.application.name}
      host_id: ${spring.application.host.id}
      host_dc: ${spring.application.host.dc}
  observations:
    annotations:
      enabled: true
  forward-headers-strategy: framework

notary:
  issuer-url: http://assertion.issuer.test
  signing-scope: notary-test-sign
  private-jwks: ${kv.private-key-jwks.keys}
  signing-kid: ${kv.signing-key.kid}
  signing-algorithm: ${kv.signing-key.alg}
  max-assertions-request-size: 2048
  required-audiences:
    - "s:xqlnhnfz6tjcz-ashudoahdkz6zrpjttwhaxjhaketm"

springdoc:
  api-docs:
    enabled: false

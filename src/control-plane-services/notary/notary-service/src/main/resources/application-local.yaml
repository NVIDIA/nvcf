spring:
  application:
    version: local

notary:
  # Local dev defaults to issuer-only validation so developers don't have to wire
  # an explicit audience list to boot. Set NOTARY_REQUIRE_AUDIENCE=true
  # (and NOTARY_REQUIRED_AUDIENCES_0=...) when you want to exercise the
  # audience-check path locally.
  require-audience: false
  required-audiences: []

logging:
  level:
    root: INFO
    org.springframework.security.web.access: DEBUG
    org.springframework.web.HttpLogging: DEBUG
    org.springframework.web.servlet.mvc: TRACE

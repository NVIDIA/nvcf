spring:
  application:
    version: ncp
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://api.nvcf.svc.cluster.local
          jwk-set-uri: http://openbao-server.vault-system.svc:8200/v1/services/nvcf-api/jwt/jwks

logging:
  level:
    root: WARN

notary:
  issuer-url: http://notary.nvcf.svc.cluster.local:8080
  signing-scope: ${AUTH_TOKEN_SCOPE:notary-sign}
  # NCP does not bind tokens by audience — the issuer check alone is sufficient.
  # require-audience=false opts out of the default fail-closed behavior, allowing
  # required-audiences to be empty.
  require-audience: false
  required-audiences: []

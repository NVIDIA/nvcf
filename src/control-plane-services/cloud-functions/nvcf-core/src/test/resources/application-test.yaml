    utils-container-image:
      go: stg.nvcr.io/nv-cf/nvcf-core/nvcf_worker_utils:2.2.1
    otel-container: docker.io/otel/opentelemetry-collector:0.74.0
    niclls-container: stg.nvcr.io/nv-cf/nvcf-core/niclls:0.0.1
    ess-agent-container: stg.nvcr.io/nv-cf/nvcf-core/ess-agent:0.0.4
    otel-collector-container: stg.nvcr.io/nv-cf/nvcf-core/byoo-otel-collector:1.2.3
    llm-credential-manager-image: stg.nvcr.io/nv-cf/nvcf-core/llm-credential-manager:0.1.0
    llm-router-client-image: stg.nvcr.io/nv-cf/nvcf-core/llm-worker:0.1.0
  aws:
    access-key-id: ${kv.aws.accessKeyId}
    secret-access-key: ${kv.aws.secretAccessKey}
    region: us-east-1
    endpoint: http://localhost:4566
    s3:
      provisioned-region: us-east-1
      results:
        bucket-name: b-strap-results
        role-arn: arn:aws:iam::000000000000:role/strap-s3-presigned-download-url
      assets:
        bucket-name: b-strap-assets
        role-arn: arn:aws:iam::000000000000:role/strap-s3-presigned-upload-url
    token:
      role-arn: arn:aws:iam::000000000000:role/strap-worker-role
  icms:
    base-url: http://localhost:9096
    allocator:
      enabled: true
  api-keys:
    base-url: http://localhost:9093
  account:
    max-functions-allowed: 50
    max-tasks-allowed: 50
  scheduler:
    enabled: false
  notary:
    jwt:
      issuer-uri: http://localhost:9097
      jwk-set-uri: http://localhost:9097/.well-known/jwks.json
      jws-algorithms: ES256
    base-url: http://localhost:9097
    audiences:
      sbs: sbs-svc-id
      ess: ess-svc-id
      nvcf: nvcf-svc-id
      turn: turn-svc-id
  ess:
    base-url: http://localhost:9098
  reval:
    enabled-accounts: test-nca-id, test-nca-id-3
    base-url: http://localhost:9099
  jwks:
    private-jwks: ${kv.jwks}
    jwe-key-mapping:
      current-kid: ${kv.kid}
  nats:
    url: tls://${nvcf.aws.region}.aws.cloud.pnats.stg.nvcf.nvidia.com:4222
    worker-url: tls://connect.pnats.stg.nvcf.nvidia.com:4222
    region: ${spring.application.host.dc}
    replicas: 1
    management-timeout: 10s
    storage-type: memory
    request-queue-subject-migration-enabled: false
    region-placement-tag: aws-region
    api-user: ${kv.nats.api-auth.user}
    api-user-seed: ${kv.nats.api-auth.user-seed}
    oauth2-properties:
      enabled: false
      base-url: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
      client-id: ${kv.oauth2.client-id}
      client-secret: ${kv.oauth2.client-secret}
  rate-limiters:
    account-rate-limiter:
      policy: BUCKET
      allowed-invocations-per-second: 200
      overrides:
        - policy: BUCKET
          nca-id: test-nca-id
          allowed-invocations-per-second: 100
        - policy: LEGACY
          nca-id: test-nca-id-2
          allowed-invocations-per-second: 150
    function-rate-limiter:
      policy: BUCKET
      allowed-invocations-per-second: 250
      overrides:
        - policy: BUCKET
          function-id: 571114ac-13a2-4243-8f9f-1ccbee3b374f
          function-version-id: 40bf77b3-c59f-42ed-bbb9-32ac2092d70b
          allowed-invocations-per-second: 300

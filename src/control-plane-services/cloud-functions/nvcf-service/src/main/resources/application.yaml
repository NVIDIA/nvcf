spring:
  cassandra:
    local-datacenter: datacenter1  # ${CASSANDRA_DATACENTER:us-west-2}
    advanced:
      speculative-execution-policy:
        class: ConstantSpeculativeExecutionPolicy
        max-executions: 1
        delay: 500 # milliseconds
      connection:
        max-requests-per-connection: 10000
        pool:
          local:
            size: 2
      retry-policy:
        class: com.nvidia.boot.cassandra.retry.NextHostRetryPolicy
    port: 9042
    password: ${kv.cassandra.password}
    username: ${kv.cassandra.username}
    compression: lz4
    connection:
      connect-timeout: 10s
      init-query-timeout: 10s
    pool:
      heartbeat-interval: 30s
      idle-timeout: 60s
    request:
      consistency: local_quorum
      page-size: 5000
      serial-consistency: local_serial
      timeout: 10s
    session-name: nvcf-api-session
    session-metrics:
      - bytes-sent
      - connected-nodes
      - cql-requests
    node-metrics:
      - pool.open-connections
      - pool.in-flight
  codec:
    max-in-memory-size: 6MB
  threads:
    virtual:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9092
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/.well-known/jwks.json
          jws-algorithms: ES256
      client:
        registration:
          icms:
            provider: icms
            client-id: ${kv.oauth2.client-id}
            client-secret: ${kv.oauth2.client-secret}
            authorization-grant-type: client_credentials
            scope: instance-request,cluster_listing,instance_types,cluster-management
          api-keys:
            provider: api-keys
            client-id: ${kv.oauth2.client-id}
            client-secret: ${kv.oauth2.client-secret}
            authorization-grant-type: client_credentials
            scope: pdp-evaluate
          ess:
            provider: ess
            client-id: ${kv.oauth2.client-id}
            client-secret: ${kv.oauth2.client-secret}
            authorization-grant-type: client_credentials
            scope: ess:secrets-admin,ess:entities-admin
          notary:
            provider: notary
            client-id: ${kv.oauth2.client-id}
            client-secret: ${kv.oauth2.client-secret}
            authorization-grant-type: client_credentials
            scope: make-assertion
          reval:
            provider: reval
            client-id: ${kv.oauth2.client-id}
            client-secret: ${kv.oauth2.client-secret}
            authorization-grant-type: client_credentials
            scope: helmreval:validate
        provider:
          icms:
            token-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/token
          api-keys:
            token-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/token
          ess:
            token-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/token
          notary:
            token-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/token
          reval:
            token-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/token

logging:
  level:
    com.nvidia: DEBUG
    org.springframework.web: DEBUG

management:
  tracing:
    export:
      enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  opentelemetry:
    resource-attributes:
      cloud.provider: ${CLOUD_PROVIDER:aws}
      cloud.region: ${nvcf.aws.region}
      deployment.profiles: ${spring.profiles.active}
      host.dc: ${spring.application.host.dc}
      host.id: ${spring.application.host.id}
      host.name: ${spring.application.host.id}
      service.name: ${spring.application.name}
      service.version: ${spring.application.version}
      service.namespace: nvcf
    tracing:
      export:
        otlp:
          compression: gzip
          headers:
            lightstep-access-token: ${kv.tracing.accessToken}
          timeout: 30s
          transport: http
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      cache:
        time-to-live: 2s
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include:
            - readinessState
            - cassandra
            - nats
        liveness:
          include:
            - livenessState
            - cassandra
            - nats
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    vault:
      enabled: false
    kubernetes:
      enabled: false
  metrics:
    enable:
      all: true
    tags:
      env: ${spring.application.env}
      micro_service: ${spring.application.name}
      service_version: ${spring.application.version}
      host_id: ${spring.application.host.id}
      host_dc: ${spring.application.host.dc}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": "5ms,10ms,25ms,50ms,75ms,100ms,200ms,300ms,400ms,500ms,750ms,1s,2s,3s,4s,5s,10s,15s,20s,30s"
  observations:
    annotations:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  server:
    port: 8181

server:
  port: 8080
  compression:
    enabled: true
  forward-headers-strategy: framework

nvcf:
  fqdn: http://localhost:${server.port}
  global-fqdn-grpc: http://localhost:${grpc.server.port}
  sidecars:
    tracing-key: ${kv.worker-tracing}
    hostname: stg.nvcr.io
    image-pull-secret: ${kv.sidecars.image-pull-secret}
  registries:
    recognized:
      container:
        docker:
          name: "Docker Hub Registry"
          hostname: "docker.io"
          call-timeout: PT10S
          oauth2:
            base-url: https://auth.docker.io/
            group-scope: pull
        ngc:
          name: "NGC Private Registry"
          hostname: "stg.nvcr.io"
          call-timeout: PT10S
          read-timeout: PT10S
          write-timeout: PT10S
          connection-timeout: PT10S
        ecr:
          name: "AWS ECR Private Registry"
          hostname: "dkr.ecr.amazonaws.com"
          call-timeout: PT10S
        ecr-public:
          name: "AWS ECR Public Registry"
          hostname: "public.ecr.aws"
          call-timeout: PT10S
        volcengine:
          name: "Volcano Engine Registry"
          hostname: "cr.volces.com"
          call-timeout: PT10S
        acr:
          name: "Azure Container Registry"
          hostname: "azurecr.io"
          call-timeout: PT10S
      helm:
        docker:
          name: "Docker Hub Registry"
          hostname: "docker.io"
          call-timeout: PT10S
          oauth2:
            base-url: https://auth.docker.io/
            group-scope: pull
        ngc:
          name: "NGC Private Registry"
          hostname: "helm.stg.ngc.nvidia.com"
          call-timeout: PT10S
          read-timeout: PT10S
          write-timeout: PT10S
          connection-timeout: PT10S
          oauth2:
            base-url: https://stg.authn.nvidia.com
            group-scope: ngc-stg
        ecr:
          name: "AWS ECR Private Registry"
          hostname: "dkr.ecr.amazonaws.com"
          call-timeout: PT10S
        ecr-public:
          name: "AWS ECR Public Registry"
          hostname: "public.ecr.aws"
          call-timeout: PT10S
        volcengine:
          name: "Volcano Engine Registry"
          hostname: "cr.volces.com"
          call-timeout: PT10S
        acr:
          name: "Azure Container Registry"
          hostname: "azurecr.io"
          call-timeout: PT10S
      model:
        ngc:
          name: "NGC Private Registry"
          hostname: "api.stg.ngc.nvidia.com"
          call-timeout: PT10S
          read-timeout: PT10S
          write-timeout: PT10S
          connection-timeout: PT10S
          oauth2:
            base-url: https://stg.authn.nvidia.com
            group-scope: ngc-stg
      resource:
        ngc:
          name: "NGC Private Registry"
          hostname: "api.stg.ngc.nvidia.com"
          call-timeout: PT10S
          read-timeout: PT10S
          write-timeout: PT10S
          connection-timeout: PT10S
          oauth2:
            base-url: https://stg.authn.nvidia.com
            group-scope: ngc-stg
  account:
    max-functions-allowed: 50
    max-tasks-allowed: 50
  scheduler:
    enabled: true
    function-deployments:
      current-region: ${spring.application.region}
      # Default to the current region for single-region deployments. Multi-region
      # environments must override this with the same ordered list in every region.
      regions:
        - ${spring.application.region}
  icms:
    allocator:
      maximum-target-latency: PT10S
  worker:
    delegated-token:
      enabled: false
  notary:
    jwt:
      issuer-uri: ${nvcf.notary.base-url}
      jwk-set-uri: ${nvcf.notary.jwt.issuer-uri}/.well-known/jwks.json
      jws-algorithms: ES256
    audiences:
      sbs: sbs-api
      ess: ess-api
      nvcf: nvcf-api
      turn: turn-api
  jwks:
    private-jwks: ${kv.jwks}
    jwe-key-mapping:
      current-kid: ${kv.kid}
  nats:
    region: ${spring.application.host.dc}
    replicas: 3
    management-timeout: 10s
    storage-type: memory
    region-placement-tag: aws-region
    api-user: ${kv.nats.api-auth.user}
    api-user-seed: ${kv.nats.api-auth.user-seed}
  rate-limiters:
    account-rate-limiter:
      policy: LEGACY
      allowed-invocations-per-second: 200
    function-rate-limiter:
      policy: LEGACY
      allowed-invocations-per-second: 200

grpc:
  server:
    port: 9090
    # enable keep alive pings to all live connections with client to check if they are still connected.
    enable-keep-alive: true
    # frequency of sending keep alive pings.
    keep-alive-time: 15m
    # duration within which the keep alive ack ping is expected before disconnecting.
    keep-alive-timeout: 10s
    # worst keep alive pings frequency the client can set. No client can send keep alive pings with frequency lesser than this.
    permit-keep-alive-time: 1s
    # whether keepalive will be performed when there are no outstanding RPC on a connection
    permit-keep-alive-without-calls: true
    # support large worker responses
    max-inbound-message-size: ${spring.codec.max-in-memory-size}
    shutdown-grace-period: 20m

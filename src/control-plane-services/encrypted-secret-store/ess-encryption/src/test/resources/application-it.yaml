encryption:
  # Negative grace period absorbs WSL2 wall-clock backward jumps (Hyper-V time-sync corrections
  # can rewind System.currentTimeMillis() by > ~1s at a time on WSL2 hosts).
  mekRotationGracePeriod: PT-10S
  integrityChecks:
    populationEnabled: false
    validationEnabled: false
  rollout:
    enabled: true
    useDefaultKey: true
    useAllowList: false
    allowList: "org1,org2,org3,org4,org5,org6,org7"
  rotation:
    enabled: true
    scheduled:
      enabled: false # trigger manually
      period: 77d
      fetchSize: 100
      backpressurePageCount: 4
      cron: "${random.int[0,60)} ${random.int[0,60)} ${random.int[0,24)} * * * *" # Every day at random hour, minute and second. To reduce likelihood of collision, randomize day as well
  reencryption:
    enabled: true
    scheduled:
      enabled: false # trigger manually
  promotion:
    validation-payloads:
      - "xyz"
      - "test value"
      - '{"data": {"field1": "asd", "field2": {"subfield3": "agoaldksglgsaldsagoaldksglgsaldsagoaldksglgsaldsagoaldksglgsaldsagoa"}}}'

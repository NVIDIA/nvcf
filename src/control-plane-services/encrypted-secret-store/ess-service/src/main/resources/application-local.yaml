spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.micrometer.metrics.autoconfigure.ssl.SslMetricsAutoConfiguration
  cassandra:
    username: PLACEHOLDER
    password: PLACEHOLDER
    local-datacenter: datacenter1
    contact-points: 127.0.0.1
    keyspace-name: ess
    ssl:
      enabled: false
      bundle: ~

ess:
  auth:
    operator:
      iss: DUMMY # FILL ME OUT
      client-id: DUMMY # FILL ME OUT
    service-id: DUMMY # FILL ME OUT

# Comment out if too noisy
logging:
  exception-conversion-word: "%wEx"
  level:
    com.nvidia: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.cassandra.core.cql.ReactiveCqlTemplate: DEBUG
    com.nvidia.ess.health.CustomCassandraHealthIndicator: DEBUG

encryption:
  immutableTable:
    nekv2WriteEnabled: true
    nekv2ReadEnabled: true
    nekv1FallbackReadEnabled: false
  integrityChecks:
    populationEnabled: true
    validationEnabled: true

management:
  tracing:
    enabled: false
  health:
    ssl:
      enabled: false

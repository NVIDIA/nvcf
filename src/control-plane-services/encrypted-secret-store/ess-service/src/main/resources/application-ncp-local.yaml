spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.micrometer.metrics.autoconfigure.ssl.SslMetricsAutoConfiguration
  cassandra:
    username: PLACEHOLDER
    password: PLACEHOLDER
    local-datacenter: datacenter1
    contact-points: 127.0.0.1
    keyspace-name: ess
    ssl:
      enabled: false
      bundle: ~

ess:
  auth:
    operator:
      iss: disabled
      client-id: disabled
    service-id: ess-api # api.ess.svc.cluster.local
    notary:
      ttl: 3h
  secret-size:
    max: 32KB

encryption:
  immutableTable:
    nekv2WriteEnabled: true
    nekv2ReadEnabled: true
    nekv1FallbackReadEnabled: false
  integrityChecks:
    populationEnabled: true
    validationEnabled: true

management:
  endpoint:
    health:
      group:
       liveness:
          include:
            - customcassandra
  tracing:
    enabled: false
  health:
    ssl:
      enabled: false

warmup:
  blockHealthStatusUntilComplete: false
# Generates the checked-in Go, grpc-gateway and OpenAPI code under api/gen.
# The plugins are local binaries; hack/proto.sh lists the pinned versions.
# The vendored google/api protos are inputs only: their Go code comes from
# google.golang.org/genproto/googleapis/api.
version: v2
inputs:
  - directory: api/proto
    paths:
      - api/proto/nvidia
plugins:
  - local: protoc-gen-go
    out: api/gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: api/gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: api/gen/go
    opt:
      - paths=source_relative
      - generate_unbound_methods=false
  - local: protoc-gen-openapiv2
    out: api/gen/openapi
    opt:
      - allow_merge=true
      - merge_file_name=gds
      - output_format=json

# Integration tests only (IntegrationTestConfiguration). Ephemeral host port for CQL so successive
# Surefire runs do not collide on localhost:9042.
name: nvcf-api-keys-test

services:
  cassandra:
    image: cassandra:5
    ports:
      - "9042"
    environment:
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=256M
      - DC=datacenter1
      - LANG=C.UTF-8
    volumes:
      - ./cassandra/cassandra.yaml:/etc/cassandra/cassandra.yaml
      - ./cassandra/keystore.node0:/etc/cassandra/keystore.node0
      - ./cassandra/truststore.node0:/etc/cassandra/truststore.node0
      # Bind schema files individually. Bazel runfiles expose files as
      # symlinks, and a directory bind would preserve those symlinks inside
      # Cassandra instead of mounting their contents.
      - ./cassandra/schema/0001_initial_schema.cql:/docker-entrypoint-initdb.d/0001_initial_schema.cql
      - ./cassandra/entrypoint.sh:/entrypoint.sh
    command:
      - /bin/bash
      - -c
      - nohup /entrypoint.sh & cassandra -f -R

spring:
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:cassandra.cassandra-system.svc.cluster.local}
    keyspace-name: api_keys_api
    local-datacenter: ${CASSANDRA_DATACENTER:ncp}
    ssl:
      enabled: false
      bundle: ""

management:
  tracing:
    export:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: https://dummy:8282
          headers:
            lightstep-access-token: unused

apikeys:
  nca-id: ${NVCF_NCA_ID:nvcf-default}  # Hardcoded till we support multitenancy in self-hosted env
  service-id-map:
    nvcf: ${NVCF_SERVICE_ID:nvidia-cloud-functions-ncp-service-id-aketm}
    nvct: ${NVCT_SERVICE_ID:nvidia-cloud-tasks-ncp-service-id-nvcttasks}
  key-prefix: nvapi-nvcf-stg-
  keep-after-expired-duration: P2D

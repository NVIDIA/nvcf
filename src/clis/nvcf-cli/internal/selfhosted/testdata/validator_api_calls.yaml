# Kubernetes API calls the cluster-validator makes, per role, when nvcf-cli
# launches it: VALIDATOR_PREFLIGHT=true, the enforcement test disabled, and no
# networkPolicies pairs in its ConfigMap. Taken from the call sites in
# src/compute-plane-services/nvca/internal/clustervalidator, named under
# "callers". TestValidatorRBAC_MatchesTheValidatorsCalls holds the CLI's
# ClusterRole and Role to this list exactly, so a call added to the validator
# must be added here and granted, and a grant nothing calls must go.
#
# Discovery and the in-cluster /readyz dial, which sends no credentials, need
# no grant and are not listed.
compute-plane:
  cluster:
    - {group: "", resource: nodes, verbs: [list],
       callers: [checkPrerequisites, checkControlPlaneHealth, detectManagedClusterProvider, checkGPUResources]}
    - {group: "", resource: pods, verbs: [list],
       callers: [checkControlPlaneHealth, checkNetworkPolicies, checkGPUOperator]}
    - {group: "", resource: namespaces, verbs: [get], callers: [checkGPUOperator]}
    - {group: "", resource: namespaces, verbs: [list, delete], callers: [sweepOrphanTestNamespaces]}
    - {group: admissionregistration.k8s.io, resource: mutatingwebhookconfigurations, verbs: [list],
       callers: [checkWebhookSupport]}
    - {group: admissionregistration.k8s.io, resource: validatingwebhookconfigurations, verbs: [list],
       callers: [checkWebhookSupport]}
    - {group: networking.k8s.io, resource: networkpolicies, verbs: [list], callers: [checkNetworkPolicies]}
    - {group: storage.k8s.io, resource: csidrivers, verbs: [get], callers: [checkSMBCSIDriver]}
    - {group: apps, resource: deployments, verbs: [get, list], callers: [detectSMBVersion]}
  nonResourceURLs:
    - {url: /readyz, verbs: [get], callers: [probeReadyz]}
    - {url: /version, verbs: [get], callers: [checkPrerequisites, checkControlPlaneHealth]}
  namespaced:
    - {group: "", resource: configmaps, verbs: [get], callers: [LoadNetworkCheckConfig]}
control-plane:
  cluster:
    - {group: "", resource: nodes, verbs: [list],
       callers: [checkPrerequisites, checkControlPlaneHealth, detectManagedClusterProvider, checkNodeToNode]}
    - {group: "", resource: pods, verbs: [list],
       callers: [checkControlPlaneHealth, checkNetworkPolicies, checkEnvoyGateway, waitForProbePods, assess]}
    - {group: "", resource: pods, verbs: [create, delete], callers: [runNodeToNodeChecker, checkNodeToNode]}
    - {group: "", resource: namespaces, verbs: [get], callers: [checkEnvoyGateway]}
    - {group: "", resource: namespaces, verbs: [list, delete],
       callers: [sweepOrphanTestNamespaces, sweepOrphanN2NNamespaces, checkNodeToNode]}
    - {group: "", resource: namespaces, verbs: [create], callers: [createNodeToNodeNamespace]}
    - {group: "", resource: services, verbs: [list], callers: [checkExternalLoadBalancerFor]}
    - {group: "", resource: events, verbs: [list], callers: [probeSandboxEvents]}
    - {group: admissionregistration.k8s.io, resource: mutatingwebhookconfigurations, verbs: [list],
       callers: [checkWebhookSupport]}
    - {group: admissionregistration.k8s.io, resource: validatingwebhookconfigurations, verbs: [list],
       callers: [checkWebhookSupport]}
    - {group: networking.k8s.io, resource: networkpolicies, verbs: [list], callers: [checkNetworkPolicies]}
    - {group: networking.k8s.io, resource: networkpolicies, verbs: [create], callers: [n2nProbe.run]}
    - {group: storage.k8s.io, resource: storageclasses, verbs: [list], callers: [checkStorageClass]}
    - {group: storage.k8s.io, resource: storageclasses, verbs: [get], callers: [checkNamedStorageClass]}
    - {group: apps, resource: daemonsets, verbs: [list], callers: [sweepLegacyOrphanN2NDaemonSets, listEnvoyProxies]}
    - {group: apps, resource: daemonsets, verbs: [create, delete],
       callers: [checkNodeToNode, sweepLegacyOrphanN2NDaemonSets]}
    - {group: apps, resource: deployments, verbs: [list], callers: [scanNamespace, listEnvoyProxies]}
    - {group: apps, resource: statefulsets, verbs: [list], callers: [scanNamespace]}
    - {group: apps, resource: controllerrevisions, verbs: [get], callers: [updateRevisionCreated]}
    - {group: gateway.networking.k8s.io, resource: gateways, verbs: [list],
       callers: [nvcfGatewayClassesIn, nvcfGatewayImplementations]}
    - {group: gateway.networking.k8s.io, resource: gatewayclasses, verbs: [list],
       callers: [nvcfGatewayImplementations]}
    - {group: gateway.networking.k8s.io, resource: httproutes, verbs: [list], callers: [discoverNVCFGatewaysIn]}
    - {group: gateway.networking.k8s.io, resource: grpcroutes, verbs: [list], callers: [discoverNVCFGatewaysIn]}
    - {group: gateway.networking.k8s.io, resource: tcproutes, verbs: [list], callers: [discoverNVCFGatewaysIn]}
    - {group: gateway.networking.k8s.io, resource: udproutes, verbs: [list], callers: [discoverNVCFGatewaysIn]}
  nonResourceURLs:
    - {url: /readyz, verbs: [get], callers: [probeReadyz]}
    - {url: /version, verbs: [get], callers: [checkPrerequisites, checkControlPlaneHealth]}
  namespaced:
    - {group: "", resource: configmaps, verbs: [get], callers: [LoadNetworkCheckConfig]}

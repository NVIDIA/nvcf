# GENERATED by internal/manifests -- do not edit.
# Regenerate with: go generate ./internal/manifests/...
#
# Restore placeholder for a criu-v2 (in-namespace) checkpoint of vllm-small.
#
# Dumb reaper: same image as the source (CRIU's path-based file checks resolve
# against an identical rootfs), bash pid1 reaps orphans, no restore-entrypoint
# and no hostPID -- the pod keeps its own fresh pid namespace, which is where
# the in-namespace CRIU restores the dumped session. The agent drives
# everything on POST /v1/restore. See internal/agent/restore_v2.go.
apiVersion: v1
kind: Pod
metadata:
  name: vllm-small-restored
  namespace: nvsnap-system
  labels:
    app: vllm-small-restored
    nvsnap.io/demo: "true"
spec:
  automountServiceAccountToken: false
  # IMPORTANT: must run on the same node as the source pod's checkpoint.
  # test-e2e.sh substitutes __NODE_NAME__ from the source pod's status.
  nodeName: __NODE_NAME__

  imagePullSecrets:
    - name: nvsnap-pull-secret

  containers:
    - name: restore
      image: vllm/vllm-openai:v0.20.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -e
          mkdir -p /var/run/vllm
          # Push this pod's own pid allocations clear of the range the dump
          # captured, so CRIU's exact-pid forks find those pids free.
          #
          # Load-bearing, and quiet when it is missing. Without it the login
          # shell forks a few hundred times sourcing profile.d before the tail
          # below starts, parking a long-lived process inside the restored pid
          # range; CRIU then dies with "Can't fork for <pid>: File exists" on
          # most attempts, and passes on the rest, which reads as flakiness
          # rather than breakage.
          #
          # This was deleted once on the belief that the write returns EPERM
          # inside a container. It does not: /proc is mounted rw here and the
          # write succeeds -- measured, next child landed at pid 100003.
          # The agent independently refuses to restore into a placeholder whose
          # pid range was never pushed up, so removing this line fails loudly
          # instead of silently.
          echo 100000 > /proc/sys/kernel/ns_last_pid || echo "(ns_last_pid bump FAILED -- restore will collide)"
          # Restored workload stdio is a plain-file fd on /vllm.out (the
          # source manifest's setsid convention); surface it via kubelet.
          touch /vllm.out
          tail -F /vllm.out &
          while true; do sleep 30; done
      env:
        # CHECKPOINT_ID intentionally in block style -- test-e2e.sh's sed
        # substitution advances to the NEXT line.
        - name: CHECKPOINT_ID
          value: "__CHECKPOINT_ID__"
        - { name: HF_HOME, value: "/root/.cache/huggingface" }
      readinessProbe:
        httpGet:
          path: /v1/models
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 60
      securityContext:
        privileged: true
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"
      volumeMounts:
        - { name: checkpoints, mountPath: /checkpoints }
        - { name: dev-shm, mountPath: /dev/shm }

  volumes:
    - name: checkpoints
      hostPath:
        path: /var/lib/containerd/nvsnap-checkpoints
        type: Directory
    - name: dev-shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi

  restartPolicy: Never

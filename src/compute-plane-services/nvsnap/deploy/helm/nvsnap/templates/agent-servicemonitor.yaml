#
# The agents' /metrics for the cluster's Prometheus (docs/operate/METRICS.md):
# served on the API port, without authentication.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvsnap-agent
  namespace: {{ .Values.agent.metrics.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "nvsnap.agent.labels" . | nindent 4 }}
    {{- range $k, $v := .Values.agent.metrics.serviceMonitor.labels }}
    {{ $k }}: {{ $v | toString | quote }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "nvsnap.agent.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  endpoints:
    - port: http-api
      path: /metrics
      interval: {{ .Values.agent.metrics.serviceMonitor.interval }}
{{- end }}

#
# The capture and restore history dashboard (docs/operate/METRICS.md), for a
# Grafana whose dashboard sidecar loads ConfigMaps labelled
# grafana_dashboard. The JSON is files/grafana-dashboard-nvsnap-history.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nvsnap.fullname" . }}-dashboard-history
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    {{- include "nvsnap.labels" . | nindent 4 }}
    {{- range $k, $v := .Values.agent.metrics.dashboard.labels }}
    {{ $k }}: {{ $v | toString | quote }}
    {{- end }}
data:
  nvsnap-history.json: |-
    {{ .Files.Get "files/grafana-dashboard-nvsnap-history.json" | nindent 4 }}
{{- end }}

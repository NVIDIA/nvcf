{{- if and .Values.webhook.enabled .Values.webhook.ephemeralContainerPolicy.enabled }}
# The webhook places nvsnap volumes (node-wide directories: the node
# bundle, checkpoints, GPU stores) in pods at creation, and checks every
# mount the pod declares then. An ephemeral container is added later,
# through pods/ephemeralcontainers, which the webhook does not see: this
# policy keeps it from mounting an nvsnap volume. Rendered whenever it is
# enabled, so a cluster without the API (before Kubernetes 1.30) fails the
# install instead of silently going without it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: nvsnap-ephemeral-container-volumes
  labels:
    {{- include "nvsnap.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  validations:
    - expression: >-
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c, !has(c.volumeMounts) ||
        c.volumeMounts.all(m, !m.name.startsWith('nvsnap-')))
      message: "an ephemeral container may not mount an nvsnap volume"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: nvsnap-ephemeral-container-volumes
  labels:
    {{- include "nvsnap.labels" . | nindent 4 }}
spec:
  policyName: nvsnap-ephemeral-container-volumes
  validationActions: [Deny]
{{- end }}

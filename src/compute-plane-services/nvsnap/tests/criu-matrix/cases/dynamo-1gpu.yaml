# Dynamo with one single-GPU worker: the cheapest Dynamo shape, without a
# multi-node engine.
kind: DynamoGraphDeployment
podsPerInstance: 1
gpusPerPod: 1
dynamo:
  etcdNats: true
function:
  inferenceUrl: /v1/chat/completions
  healthUri: /health
  requires: [DynamoGraphDeployment]

# SGLang, Kimi K2.6 NVFP4 (as bench-kimi-k2).
# TP=8 as two pods of four GPUs (GB300 nodes have four), multi-pod capture opt-in.
kind: StatefulSet
launch: exec
podsPerInstance: 2
gpusPerPod: 4
criuCapture: true
engine: sglang
image: docker.io/lmsysorg/sglang:v0.5.12.post1
model: nvidia/Kimi-K2.6-NVFP4
servedModelName: nvidia/Kimi-K2.6-NVFP4
maxModelLen: 32768
gpuMemoryUtilization: 0.85
extraArgs: --trust-remote-code --fp4-gemm-backend flashinfer_trtllm
function:
  inferenceUrl: /v1/chat/completions
  secrets: [HF_TOKEN]

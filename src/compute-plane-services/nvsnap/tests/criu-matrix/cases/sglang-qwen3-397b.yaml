# SGLang, Qwen3.5 397B A17B NVFP4 (as bench-qwen3-397b).
# TP=8 as two pods of four GPUs (GB300 nodes have four), multi-pod capture opt-in.
kind: StatefulSet
launch: exec
podsPerInstance: 2
gpusPerPod: 4
criuCapture: true
engine: sglang
image: docker.io/lmsysorg/sglang:v0.5.12.post1
model: nvidia/Qwen3.5-397B-A17B-NVFP4
servedModelName: nvidia/Qwen3.5-397B-A17B-NVFP4
maxModelLen: 32768
gpuMemoryUtilization: 0.85
extraArgs: --trust-remote-code --moe-runner-backend flashinfer_trtllm --fp4-gemm-backend flashinfer_cutlass --attention-backend trtllm_mha
function:
  inferenceUrl: /v1/chat/completions
  secrets: [HF_TOKEN]

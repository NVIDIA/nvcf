# SGLang, MiniMax M2.7 NVFP4 (as bench-minimax-m2).
# TP=8 as two pods of four GPUs (GB300 nodes have four), multi-pod capture opt-in.
kind: StatefulSet
launch: exec
podsPerInstance: 2
gpusPerPod: 4
criuCapture: true
engine: sglang
image: docker.io/lmsysorg/sglang:v0.5.12.post1
model: nvidia/MiniMax-M2.7-NVFP4
servedModelName: nvidia/MiniMax-M2.7-NVFP4
maxModelLen: 32768
gpuMemoryUtilization: 0.85
extraArgs: --trust-remote-code --moe-runner-backend flashinfer_cutlass --fp4-gemm-backend flashinfer_cutlass
function:
  inferenceUrl: /v1/chat/completions
  secrets: [HF_TOKEN]

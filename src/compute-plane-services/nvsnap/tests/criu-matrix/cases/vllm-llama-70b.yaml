# vLLM, Llama 3.1 70B FP8, TP=2 on one pod (as the container function vllm-llama-3-1-70b).
kind: Deployment
launch: exec
gpusPerPod: 2
model: nvidia/Llama-3.1-70B-Instruct-FP8
servedModelName: llama-70b
maxModelLen: 1024
gpuMemoryUtilization: 0.85
function:
  inferenceUrl: /v1/chat/completions
  secrets: [HF_TOKEN]

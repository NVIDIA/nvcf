{{- $name := include "matrix.name" . }}
{{- $ann := dict }}
{{- if .Values.criuCapture }}{{ $_ := set $ann "nvsnap.io/criu-capture" "true" }}{{ end }}
{{- if eq .Values.kind "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ $name }}}
spec:
  serviceName: {{ $name }}-ranks
  replicas: {{ .Values.podsPerInstance }}
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: {{ $name }}}}
  template:
    metadata:
      labels: {app: {{ $name }}}
      {{- with $ann }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "matrix.podSpec" . | nindent 6 }}
{{- else if eq .Values.kind "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ $name }}}}
  template:
    metadata:
      labels: {app: {{ $name }}}
      {{- with $ann }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "matrix.podSpec" . | nindent 6 }}
{{- else if eq .Values.kind "Pod" }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $name }}-0
  labels: {app: {{ $name }}}
spec:
  {{- include "matrix.podSpec" . | nindent 2 }}
{{- else if eq .Values.kind "LeaderWorkerSet" }}
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata: {name: {{ $name }}}
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: {{ .Values.podsPerInstance }}
    workerTemplate:
      metadata:
        labels: {app: {{ $name }}}
        {{- with $ann }}
        annotations: {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        {{- include "matrix.podSpec" . | nindent 8 }}
{{- else if eq .Values.kind "DynamoGraphDeployment" }}
{{- /* The Dynamo operator turns this into Grove PodCliques: a frontend and
       a vLLM worker, multi-node when podsPerInstance > 1, as production
       Dynamo functions run. The operator adds probes and /dev/shm. */}}
{{- $v := .Values }}
{{- $tp := mul $v.podsPerInstance $v.gpusPerPod }}
{{- /* v1alpha1: the version NVCF accepts in a Helm function; the operator
       stores it as v1beta1. */}}
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata: {name: {{ $name }}}
spec:
  backendFramework: vllm
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: {{ $v.dynamo.image }}
    VllmWorker:
      componentType: worker
      replicas: 1
      {{- if gt (int $v.podsPerInstance) 1 }}
      multinode: {nodeCount: {{ $v.podsPerInstance }}}
      {{- end }}
      resources:
        limits:
          gpu: {{ $v.gpusPerPod | quote }}
      extraPodMetadata:
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
          {{- range $k, $val := $ann }}
          {{ $k }}: {{ $val | quote }}
          {{- end }}
      extraPodSpec:
        mainContainer:
          image: {{ $v.dynamo.image }}
          command: ["python3", "-m", "dynamo.vllm"]
          args: ["--model", "{{ $v.model }}", "--tensor-parallel-size", "{{ $tp }}", "--max-model-len", "{{ $v.maxModelLen }}", "--gpu-memory-utilization", "{{ $v.gpuMemoryUtilization }}"]
          env:
            - {name: HF_HUB_DISABLE_XET, value: "1"}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- else }}
{{- fail (printf "kind %q: want StatefulSet, Deployment, Pod, LeaderWorkerSet or DynamoGraphDeployment" .Values.kind) }}
{{- end }}

{{- $name := include "matrix.name" . }}
{{- $ann := dict }}
{{- if .Values.criuCapture }}{{ $_ := set $ann "nvsnap.io/criu-capture" "true" }}{{ end }}
{{- if eq .Values.kind "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ $name }}}
spec:
  serviceName: {{ $name }}-ranks
  replicas: {{ .Values.podsPerInstance }}
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: {{ $name }}}}
  template:
    metadata:
      labels: {app: {{ $name }}}
      {{- with $ann }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "matrix.podSpec" . | nindent 6 }}
{{- else if eq .Values.kind "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ $name }}}}
  template:
    metadata:
      labels: {app: {{ $name }}}
      {{- with $ann }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "matrix.podSpec" . | nindent 6 }}
{{- else if eq .Values.kind "Pod" }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $name }}-0
  labels: {app: {{ $name }}}
spec:
  {{- include "matrix.podSpec" . | nindent 2 }}
{{- else if eq .Values.kind "LeaderWorkerSet" }}
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata: {name: {{ $name }}}
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: {{ .Values.podsPerInstance }}
    workerTemplate:
      metadata:
        labels: {app: {{ $name }}}
        {{- with $ann }}
        annotations: {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        {{- include "matrix.podSpec" . | nindent 8 }}
{{- else }}
{{- fail (printf "kind %q: want StatefulSet, Deployment, Pod or LeaderWorkerSet" .Values.kind) }}
{{- end }}

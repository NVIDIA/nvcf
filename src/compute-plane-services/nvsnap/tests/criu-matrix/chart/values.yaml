# Injected by NVCF for Helm functions.
helmChartServiceName: nvsnap-criu-matrix
ngcImagePullSecretName: ""

# The controller that owns the pods: StatefulSet, Deployment, Pod (bare) or
# LeaderWorkerSet (needs the LWS CRD on the cluster).
kind: StatefulSet
# Pods per instance. More than one makes a multi-node engine: one rank per
# pod, tensor parallel across them.
podsPerInstance: 1
gpusPerPod: 1

# How the container starts the engine:
#   shell  - the engine is a child of the container's shell
#   setsid - the engine is detached from the shell with setsid
#   exec   - the engine is the container's pid 1
launch: exec

# vllm, sglang, or command: run .Values.command, the image's own server
# (a NIM's start script, for example).
engine: vllm
command: ""
image: docker.io/vllm/vllm-openai:v0.20.0
model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
servedModelName: ""
# Appended to the engine's command line.
extraArgs: ""
maxModelLen: 2048
gpuMemoryUtilization: 0.1
port: 8000
# Readiness path on rank 0 (empty: /v1/models, else /health).
healthPath: ""

# Run the engine as this user (unset: the image's user, root for the stock
# vLLM image).
runAsUser: null
# Set HF_HOME in the engine's env (empty: the engine uses the Hugging Face
# default, and nvsnap mounts the model for it).
hfHome: ""

# Multi-pod instances are captured only on request.
criuCapture: false

# kind DynamoGraphDeployment: the Dynamo runtime image, matching the
# cluster's Dynamo operator.
dynamo:
  image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1
  # Run etcd and NATS in the function's namespace and point the workers at
  # them (NATS request plane), as production Dynamo functions do. Discovery
  # stays Kubernetes either way: the operator sets it.
  etcdNats: false
  # Discovery backend the operator wires the components to
  # (nvidia.com/dynamo-discovery-backend), for example etcd as production
  # Dynamo functions run; empty keeps the operator's default (kubernetes).
  discoveryBackend: ""
  # A fixed Dynamo namespace (DYN_NAMESPACE) for every component instead of
  # the one the operator derives from the Kubernetes namespace (and the
  # frontend's DYN_NAMESPACE_PREFIX to match); empty keeps
  # the operator's.
  namespace: ""
  etcdImage: quay.io/coreos/etcd:v3.5.17
  natsImage: docker.io/library/nats:2.10-alpine

# A fresh cache and capture identity (nvsnap.io/cache-salt) for runs that
# must not reuse another run's cache set or checkpoints. Empty keeps the
# configuration's own.
cacheSalt: ""

# Memory-backed /dev/shm for NCCL (the container default is 64 MiB).
shmSize: 8Gi

# Anything else the case needs in the engine's env.
extraEnv: []

resources:
  requests: {cpu: "4", memory: 32Gi}
  limits: {cpu: "16", memory: 128Gi}

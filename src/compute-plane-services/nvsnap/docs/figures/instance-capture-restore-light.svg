<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc"><title id="title">Instance capture and restore</title><desc id="desc">Rank 0's agent captures every member of an opted-in instance at one freeze point; a later instance's pods become placeholders that the leader's agent restores together.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#1b1f24"/></marker><marker id="arrow-warn" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#bf3989"/></marker></defs><rect width="980" height="470" fill="#ffffff"/><text x="24" y="34" font-size="18" font-weight="bold" fill="#1b1f24" font-family="Arial, Helvetica, sans-serif">Instance capture and restore</text>
<rect x="20" y="54" width="940" height="170" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="32" y="74" font-size="12" font-weight="bold" fill="#57606a" font-family="Arial, Helvetica, sans-serif">Capture (internal/agent/criu_group.go, group_freeze.go)</text>
<rect x="40" y="90" width="170" height="110" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="125.0" y="133.0" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Ready instance</text><text x="125.0" y="149.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">ranks + companions</text><text x="125.0" y="165.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">opted in</text>
<rect x="250" y="90" width="190" height="110" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="345.0" y="133.0" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Checks</text><text x="345.0" y="149.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">engine whole, probes,</text><text x="345.0" y="165.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">agents settled, preflight</text>
<rect x="480" y="90" width="200" height="110" rx="8" fill="#f3fae8" stroke="#76b900" stroke-width="1.5"/><text x="580.0" y="133.0" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Freeze point</text><text x="580.0" y="149.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">all members stop</text><text x="580.0" y="165.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">together, or all abort</text>
<rect x="720" y="90" width="220" height="110" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="830.0" y="133.0" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Each node dumps its member</text><text x="830.0" y="149.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">GPU memory, CRIU images,</text><text x="830.0" y="165.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">rootfs diff, group record</text>
<path d="M210 145 L248 145" fill="none" stroke="#1b1f24" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M440 145 L478 145" fill="none" stroke="#1b1f24" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M680 145 L718 145" fill="none" stroke="#1b1f24" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="244" width="940" height="206" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="32" y="264" font-size="12" font-weight="bold" fill="#57606a" font-family="Arial, Helvetica, sans-serif">Restore (internal/webhook/criu_group.go, internal/agent/gpushare_group_restore.go)</text>
<rect x="40" y="280" width="170" height="110" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="125.0" y="323.0" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">New instance</text><text x="125.0" y="339.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">same configuration</text><text x="125.0" y="355.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">and size</text>
<rect x="250" y="280" width="190" height="110" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="345.0" y="323.0" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Placeholders</text><text x="345.0" y="339.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">one per slot, admitted</text><text x="345.0" y="355.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">by the webhook</text>
<rect x="480" y="280" width="200" height="110" rx="8" fill="#f3fae8" stroke="#76b900" stroke-width="1.5"/><text x="580.0" y="323.0" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">CRIU restore</text><text x="580.0" y="339.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">one address map,</text><text x="580.0" y="355.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">connections locked</text>
<rect x="720" y="280" width="220" height="110" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="830.0" y="323.0" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Unlock all, then resume</text><text x="830.0" y="339.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">GPUs with the handle</text><text x="830.0" y="355.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">exchange; companions last</text>
<path d="M210 335 L248 335" fill="none" stroke="#1b1f24" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M440 335 L478 335" fill="none" stroke="#1b1f24" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M680 335 L718 335" fill="none" stroke="#1b1f24" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M830 200 L830 240 L345 240 L345 278" fill="none" stroke="#1b1f24" stroke-width="1.5" marker-end="url(#arrow)"/><text x="590" y="234" font-size="11" fill="#57606a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">checkpoints fetched to each node</text>
<text x="250" y="420" font-size="11" fill="#57606a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A member that cannot restore with its instance starts the instance cold; a failed restore blocks the checkpoints.</text>
</svg>

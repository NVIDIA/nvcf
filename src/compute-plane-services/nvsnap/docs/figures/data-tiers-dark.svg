<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc"><title id="title">Where a checkpoint lives</title><desc id="desc">A capture writes to its node's disk and copies to cluster storage in the background; a restore takes the first copy it finds: L1, L2, L3, then L4.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#e6edf3"/></marker><marker id="arrow-warn" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#ff7bc5"/></marker></defs><rect width="980" height="360" fill="#0d1117"/><text x="24" y="34" font-size="18" font-weight="bold" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif">Where a checkpoint lives</text>
<rect x="40" y="70" width="200" height="90" rx="8" fill="#1c2a10" stroke="#76b900" stroke-width="1.5"/><text x="140.0" y="111.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Capture</text><text x="140.0" y="127.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">on the source node</text>
<rect x="300" y="70" width="180" height="90" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="390.0" y="111.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">L1: node disk</text><text x="390.0" y="127.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">written first</text>
<rect x="570" y="70" width="160" height="90" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="650.0" y="111.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">rwx-&lt;hash&gt;</text><text x="650.0" y="127.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">written once</text>
<rect x="810" y="70" width="150" height="90" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="885.0" y="111.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">rox-&lt;hash&gt;</text><text x="885.0" y="127.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">read-only twin</text>
<path d="M240 115 L298 115" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480 115 L568 115" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="524" y="105" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">background</text>
<path d="M730 115 L808 115" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="769" y="105" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">promote</text>
<text x="570" y="180" font-size="11" fill="#9198a1" text-anchor="start" font-family="Arial, Helvetica, sans-serif">L2: cluster storage (or a shared filesystem)</text>
<rect x="40" y="220" width="200" height="100" rx="8" fill="#1c2a10" stroke="#76b900" stroke-width="1.5"/><text x="140.0" y="258.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Restore</text><text x="140.0" y="274.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">EnsureLocal</text><text x="140.0" y="290.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(cascade_fetch.go)</text>
<rect x="300" y="220" width="140" height="100" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="370.0" y="266.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1. L1</text><text x="370.0" y="282.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">this node</text>
<rect x="470" y="220" width="140" height="100" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="540.0" y="258.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2. L2</text><text x="540.0" y="274.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">shared fs, then</text><text x="540.0" y="290.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">the rox volume</text>
<rect x="640" y="220" width="140" height="100" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="710.0" y="258.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3. L3</text><text x="710.0" y="274.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">peer agents,</text><text x="710.0" y="290.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">least loaded</text>
<rect x="810" y="220" width="150" height="100" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="885.0" y="258.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4. L4</text><text x="885.0" y="274.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">object store,</text><text x="885.0" y="290.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">cross-cluster</text>
<path d="M240 270 L298 270" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M440 270 L468 270" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="454" y="262" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">miss</text>
<path d="M610 270 L638 270" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="624" y="262" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">miss</text>
<path d="M780 270 L808 270" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="794" y="262" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">miss</text>
<text x="300" y="344" font-size="11" fill="#9198a1" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A node that fetches a checkpoint registers as a peer for it, so every restore adds a source.</text>
</svg>

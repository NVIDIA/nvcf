<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc"><title id="title">The group freeze</title><desc id="desc">Every member waits at the freeze point; the leader releases them together once all arrive, and aborts them all if one ends first or does not take its release. The same happens after the dump.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#e6edf3"/></marker><marker id="arrow-warn" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#ff7bc5"/></marker></defs><rect width="980" height="420" fill="#0d1117"/><text x="24" y="34" font-size="18" font-weight="bold" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif">The group freeze</text>
<rect x="70" y="60" width="140" height="46" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="140.0" y="79.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">member 0</text><text x="140.0" y="95.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">own node's agent</text>
<path d="M140 106 L140 148" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="180" y="132" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">prepares</text>
<rect x="70" y="150" width="140" height="40" rx="8" fill="#1c2a10" stroke="#76b900" stroke-width="1.5"/><text x="140.0" y="174.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">waits at the point</text>
<path d="M140 190 L140 248" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="250" width="140" height="40" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="140.0" y="266.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">dump</text><text x="140.0" y="282.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">then wait (post)</text>
<path d="M140 290 L140 338" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="340" width="140" height="40" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="140.0" y="364.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">capture ends</text>
<rect x="270" y="60" width="140" height="46" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="340.0" y="79.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">member 1</text><text x="340.0" y="95.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">own node's agent</text>
<path d="M340 106 L340 148" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="380" y="132" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">prepares</text>
<rect x="270" y="150" width="140" height="40" rx="8" fill="#1c2a10" stroke="#76b900" stroke-width="1.5"/><text x="340.0" y="174.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">waits at the point</text>
<path d="M340 190 L340 248" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="270" y="250" width="140" height="40" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="340.0" y="266.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">dump</text><text x="340.0" y="282.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">then wait (post)</text>
<path d="M340 290 L340 338" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>

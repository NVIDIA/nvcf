<rect x="470" y="60" width="140" height="46" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="540.0" y="79.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">member 2</text><text x="540.0" y="95.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">own node's agent</text>
<path d="M540 106 L540 148" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="580" y="132" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">prepares</text>
<rect x="470" y="150" width="140" height="40" rx="8" fill="#1c2a10" stroke="#76b900" stroke-width="1.5"/><text x="540.0" y="174.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">waits at the point</text>
<path d="M540 190 L540 248" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470" y="250" width="140" height="40" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="540.0" y="266.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">dump</text><text x="540.0" y="282.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">then wait (post)</text>
<path d="M540 290 L540 338" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470" y="340" width="140" height="40" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="540.0" y="364.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">capture ends</text>
<rect x="700" y="140" width="260" height="60" rx="8" fill="#1c2a10" stroke="#76b900" stroke-width="1.5"/><text x="830.0" y="166.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Leader (driveGroupFreeze)</text><text x="830.0" y="182.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">all arrived: release all</text>
<path d="M210 170 L270 170" fill="none" stroke="#76b900" stroke-width="2"/>
<path d="M410 170 L470 170" fill="none" stroke="#76b900" stroke-width="2"/>
<path d="M700 170 L612 170" fill="none" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="700" y="230" width="260" height="76" rx="8" fill="#161b22" stroke="#ff7bc5" stroke-width="1.5"/><text x="830.0" y="256.0" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Abort all</text><text x="830.0" y="272.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">a member ended first, a release</text><text x="830.0" y="288.0" font-size="11" fill="#9198a1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">was not taken, or time ran out</text>
<path d="M700 268 L612 268" fill="none" stroke="#ff7bc5" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-warn)"/>
<text x="700" y="340" font-size="11" fill="#9198a1" text-anchor="start" font-family="Arial, Helvetica, sans-serif">internal/agent/group_freeze.go</text>
<text x="700" y="356" font-size="11" fill="#9198a1" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Phases: before the dump, and "post" after it.</text>
</svg>

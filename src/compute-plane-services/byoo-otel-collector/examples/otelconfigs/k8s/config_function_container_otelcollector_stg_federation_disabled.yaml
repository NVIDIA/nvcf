receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_POD_IP:-0.0.0.0}:14357
      http:
        endpoint: ${env:OTEL_POD_IP:-0.0.0.0}:14358
  prometheus:
    config:
      scrape_configs:
        - job_name: opentelemetry-collector
          metric_relabel_configs:
            - action: keep
              regex: (otelcol_.*)
              source_labels:
                - __name__
          scrape_interval: 30s
          scrape_timeout: 25s
          static_configs:
            - targets:
                - ${env:OTEL_POD_IP:-0.0.0.0}:18888
exporters:
  otlp_http/OTEL_COLLECTOR-nv-otelcollector-stg-metrics:
    endpoint: endpoint:4317
    headers:
      Authorization: Bearer ${file:/etc/byoo-otel-collector/secrets/nv-otelcollector-stg}
  otlp_http/OTEL_COLLECTOR-nv-otelcollector-stg-traces:
    endpoint: endpoint:4318
    headers:
      Authorization: Bearer ${file:/etc/byoo-otel-collector/secrets/nv-otelcollector-stg}
processors:
  attributes/add-metadata:
    actions:
      - action: insert
        key: nca_id
        value: ${env:NCA_ID:-unknown}
      - action: insert
        key: cloud_provider
        value: ${env:NVCF_CLOUD_PROVIDER:-unknown}
      - action: insert
        key: instance_id
        value: ${env:NVCF_INSTANCE_ID:-unknown}
      - action: insert
        key: host.id
        value: ${env:NVCF_INSTANCE_ID:-unknown}
      - action: insert
        key: function_id
        value: ${env:NVCF_FUNCTION_ID:-unknown}
      - action: insert
        key: function_version_id
        value: ${env:NVCF_FUNCTION_VERSION_ID:-unknown}
      - action: insert
        key: cloud_region
        value: fake-zone-name
      - action: insert
        key: origin
        value: nvcf-byoo
  batch:
    send_batch_max_size: 8192
    send_batch_size: 4096
    timeout: 400ms
  filter/metrics:
    metrics:
      exclude:
        match_type: strict
        metric_names:
          - scrape_duration_seconds
          - scrape_samples_post_metric_relabeling
          - scrape_samples_scraped
          - scrape_series_added
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 10
  metrics_transform:
    transforms:
      - action: update
        include: ^.*$
        match_type: regexp
        operations:
          - action: add_label
            new_label: nca_id
            new_value: ${env:NCA_ID:-unknown}
          - action: add_label
            new_label: cloud_provider
            new_value: ${env:NVCF_CLOUD_PROVIDER:-unknown}
          - action: add_label
            new_label: instance_id
            new_value: ${env:NVCF_INSTANCE_ID:-unknown}
          - action: add_label
            new_label: host.id
            new_value: ${env:NVCF_INSTANCE_ID:-unknown}
          - action: add_label
            new_label: function_id
            new_value: ${env:NVCF_FUNCTION_ID:-unknown}
          - action: add_label
            new_label: function_version_id
            new_value: ${env:NVCF_FUNCTION_VERSION_ID:-unknown}
          - action: add_label
            new_label: cloud_region
            new_value: fake-zone-name
          - action: add_label
            new_label: origin
            new_value: nvcf-byoo
  resource:
    attributes:
      - action: delete
        key: service.instance.id
      - action: insert
        key: instance_id
        value: ${env:NVCF_INSTANCE_ID:-unknown}
  transform/drop_empty_labels:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(resource.attributes, Filter(resource.attributes, (_, v) => v != ""))
      - context: scope
        statements:
          - set(scope.attributes, Filter(scope.attributes, (_, v) => v != ""))
extensions:
  cgroup_runtime:
    gomaxprocs:
      enabled: true
    gomemlimit:
      enabled: true
      ratio: 0.8
  healthcheckv2:
    component_health:
      include_permanent_errors: true
      include_recoverable_errors: true
      recovery_duration: 1m
    http:
      config:
        enabled: false
      endpoint: ${env:OTEL_POD_IP:-0.0.0.0}:13133
      status:
        enabled: true
        path: /health
    use_v2: true
service:
  telemetry:
    logs:
      initial_fields:
        public: "true"
      level: warn
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:OTEL_POD_IP:-0.0.0.0}
                port: 18888
    resource:
      attributes:
        - name: service.namespace
          value: sr-fake-namespace
        - name: service.name
          value: byoo-otel-collector
        - name: function.id
          value: fake-function-id
        - name: function.version.id
          value: fake-function-version-id
    traces:
      processors:
        - batch:
            exporter:
              otlp:
                endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
                headers:
                  - name: lightstep-access-token
                    value: ${env:OTEL_TRACING_ACCESS_TOKEN}
                protocol: grpc
  pipelines:
    metrics:
      receivers:
        - otlp
        - prometheus
      exporters:
        - otlp_http/OTEL_COLLECTOR-nv-otelcollector-stg-metrics
      processors:
        - memory_limiter
        - filter/metrics
        - resource
        - transform/drop_empty_labels
        - metrics_transform
        - batch
    traces:
      receivers:
        - otlp
      exporters:
        - otlp_http/OTEL_COLLECTOR-nv-otelcollector-stg-traces
      processors:
        - memory_limiter
        - attributes/add-metadata
        - batch
  extensions:
    - healthcheckv2
    - cgroup_runtime

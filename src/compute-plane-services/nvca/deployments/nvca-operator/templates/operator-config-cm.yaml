{{- include "nvcaop.validateTransportTrust" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvca-operator-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvcaop.labels" . | nindent 4 }}
{{- $operatorConfig := .Values.operatorConfig | default dict }}
{{- $workload := $operatorConfig.workload | default dict }}
{{- $transportTLS := $workload.transportTLS | default dict }}
{{- $trustBundle := $transportTLS.trustBundle | default dict }}
{{- $secretKeyRef := $trustBundle.secretKeyRef | default dict }}
data:
  config.yaml: |
    workload:
      transportTLS:
        trustBundle:
          secretKeyRef:
            name: {{ $secretKeyRef.name | default "" | quote }}
            key: {{ $secretKeyRef.key | default "ca.crt" | quote }}
        fingerprint: {{ $transportTLS.fingerprint | default "" | quote }}
        {{- if $transportTLS.installedBundleMountPath }}
        installedBundleMountPath: {{ $transportTLS.installedBundleMountPath | quote }}
        {{- end }}

# NVCA owns this catalog and installs it with the NVCA chart. It records, for
# each exact CSI provisioner, the PVC access modes qualified end to end in an
# NVCF cache workflow. Nothing else is declared: NVCA derives how caching runs
# from these modes.
#
#   ReadWriteMany              one shared claim; readers mount it read-only
#   ReadWriteOnce+ReadOnlyMany writer takes the claim; readers get ROX on it
#
# Function model caching keeps its readers in the request namespace, so either
# shape works. Helm model caching must reach other namespaces, which a
# ReadWriteMany claim does natively and the ROX shape does not, except on
# NVMesh, whose volume handles encode the namespace.
#
# An empty accessModes list means nothing is qualified yet, so both workflows
# are off for that driver. A provisioner absent from this file is unsupported.
# Enabling a backend is an edit here, backed by a qualification run.
apiVersion: storage.nvcf.nvidia.com/v1alpha1
kind: StorageCapabilityCatalog
drivers:
  nvmesh-csi.excelero.com:
    provider: nvmesh
    accessModes:
      - ReadWriteOnce
      - ReadOnlyMany
    # The reader PV is XFS on the same filesystem as the writer, so it needs
    # nouuid and norecovery or the mount fails outright.
    readerMountOptions:
      - ro
      - norecovery
      - nouuid
  csi.weka.io:
    provider: weka
    # Fresh RWX and ROX claims were tested, but the cache workflow itself is
    # not qualified yet. Pending a qualification run on the Weka cluster.
    accessModes: []
    readerMountOptions: []
  fss.csi.oraclecloud.com:
    provider: ociFss
    # An RWX claim was tested; its readers used read-only Pod mounts, which is
    # not evidence for a ReadOnlyMany claim. The cache workflow is not
    # qualified yet. Pending a qualification run on the OCI cluster.
    accessModes: []
    readerMountOptions: []
  lustre.csi.oraclecloud.com:
    provider: ociLustre
    # No PVC access mode has been qualified in an NVCF cache workflow.
    accessModes: []
    readerMountOptions: []

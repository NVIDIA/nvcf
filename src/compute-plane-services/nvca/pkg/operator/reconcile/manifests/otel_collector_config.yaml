receivers:
  # Cluster-wide watch of Kubernetes Events (no namespace scoping) so Pod Events
  # in per-instance namespaces (sr-<uuid>) and ICMSRequest Events are all
  # captured.
  k8sobjects:
    auth_type: serviceAccount
    # Re-list existing Events on start so a collector restart does not lose
    # in-flight signals (within Kubernetes Event retention).
    include_initial_state: true
    objects:
      - name: events
        mode: watch

processors:
  batch:
    timeout: 2s
    send_batch_size: 50
    send_batch_max_size: 100

  memory_limiter:
    check_interval: 1s
    limit_percentage: ${env:NVCA_OTEL_COLLECTOR_MEMORY_LIMIT_PERCENTAGE}
    spike_limit_percentage: ${env:NVCA_OTEL_COLLECTOR_SPIKE_LIMIT_PERCENTAGE}

  filter:
    error_mode: ignore
    logs:
      log_record:
        - resource.attributes["k8s.object.kind"] != "Pod"

  transform/normalize:
    error_mode: ignore
    log_statements:
      # k8sobjects (watch) delivers each Event under log.body["object"]; lift the
      # fields the downstream Pod filter and enrichment rely on into attributes.
      - set(resource.attributes["k8s.object.kind"], log.body["object"]["involvedObject"]["kind"]) where IsMap(log.body) and log.body["object"]["involvedObject"]["kind"] != nil
      - set(resource.attributes["k8s.pod.uid"], log.body["object"]["involvedObject"]["uid"]) where resource.attributes["k8s.object.kind"] == "Pod"
      - set(resource.attributes["k8s.object.fieldpath"], log.body["object"]["involvedObject"]["fieldPath"]) where IsMap(log.body) and log.body["object"]["involvedObject"]["fieldPath"] != nil
      # Only run when fieldpath contains {...} so ExtractPatterns has "name" key (avoids "key not found in map" warn)
      - set(resource.attributes["k8s.container.name"], ExtractPatterns(resource.attributes["k8s.object.fieldpath"], "{(?P<name>[^}]+)}")["name"]) where resource.attributes["k8s.object.fieldpath"] != nil and IsMatch(resource.attributes["k8s.object.fieldpath"], ".*\\{[^}]+\\}.*")
      - set(log.attributes["k8s.event.reason"], log.body["object"]["reason"]) where IsMap(log.body) and log.body["object"]["reason"] != nil

  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    wait_for_metadata: true
    wait_for_metadata_timeout: 30s
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.pod.start_time
        - k8s.container.name
        - container.image.name
        - container.image.tag
      annotations:
        - key: nvcf.nvidia.io/backend
          tag_name: cluster_name
        - key: nvcf.nvidia.io/instance-type-name
          tag_name: instance_type_name
        - key: nca-id
          tag_name: nca_id
      labels:
        - key: nvcf.nvidia.io/deployment-id
          tag_name: deployment_id
        - key: nvcf.nvidia.io/gpu-specification-id
          tag_name: gpu_specification_id
        - key: function-id
          tag_name: function_id
        - key: function-version-id
          tag_name: function_version_id
        - key: task-id
          tag_name: task_id
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid

  transform:
    error_mode: ignore
    log_statements:
      - set(log.attributes["cluster_id"], resource.attributes["cluster_name"]) where resource.attributes["cluster_name"] != nil
      - set(log.attributes["deployment_id"], resource.attributes["deployment_id"]) where resource.attributes["deployment_id"] != nil
      - set(log.attributes["gpu_specification_id"], resource.attributes["gpu_specification_id"]) where resource.attributes["gpu_specification_id"] != nil
      - set(log.attributes["instance_id"], resource.attributes["k8s.pod.name"]) where resource.attributes["k8s.pod.name"] != nil
      - set(log.attributes["namespace"], resource.attributes["function_version_id"]) where resource.attributes["function_version_id"] != nil
      # Tasks are keyed by task-id in FnDs; override function_version_id when present.
      - set(log.attributes["namespace"], resource.attributes["task_id"]) where resource.attributes["task_id"] != nil and resource.attributes["task_id"] != ""
      # Pod-lane event_name: Pod.<container>.<reason> when the Event targets a
      # specific container, else Pod.<reason>. Distinguishes container/helm/task
      # Pod signals for FnDs consumers.
      - set(log.attributes["event_name"], Concat(["Pod", resource.attributes["k8s.container.name"], log.attributes["k8s.event.reason"]], ".")) where log.attributes["k8s.event.reason"] != nil and resource.attributes["k8s.container.name"] != nil
      - set(log.attributes["event_name"], Concat(["Pod", log.attributes["k8s.event.reason"]], ".")) where log.attributes["k8s.event.reason"] != nil and resource.attributes["k8s.container.name"] == nil
      - set(log.attributes["source"], "nvca")
      - set(log.attributes["nca_id"], resource.attributes["nca_id"]) where resource.attributes["nca_id"] != nil
      - set(log.attributes["function_id"], resource.attributes["function_id"]) where resource.attributes["function_id"] != nil
      - set(log.attributes["instance_type_name"], resource.attributes["instance_type_name"]) where resource.attributes["instance_type_name"] != nil
      - set(log.attributes["k8s.node.name"], resource.attributes["k8s.node.name"]) where resource.attributes["k8s.node.name"] != nil
      - set(log.attributes["k8s.namespace.name"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
      - set(log.attributes["k8s.pod.start_time"], resource.attributes["k8s.pod.start_time"]) where resource.attributes["k8s.pod.start_time"] != nil
      - set(log.attributes["k8s.container.name"], resource.attributes["k8s.container.name"]) where resource.attributes["k8s.container.name"] != nil
      - set(log.attributes["container.image.name"], resource.attributes["container.image.name"]) where resource.attributes["container.image.name"] != nil
      - set(log.attributes["container.image.tag"], resource.attributes["container.image.tag"]) where resource.attributes["container.image.tag"] != nil

  # Drop records missing required ledger API fields
  filter/required-fields:
    error_mode: ignore
    logs:
      log_record:
        - log.attributes["namespace"] == nil
        - log.attributes["namespace"] == ""
        - log.attributes["event_name"] == nil
        - log.attributes["event_name"] == ""

  # ICMS lane: keep only ICMSRequest Events with a known reason; everything else
  # is handled by the Pod lane or is noise that must not reach FnDs.
  filter/icms-events:
    error_mode: ignore
    logs:
      log_record:
        - resource.attributes["k8s.object.kind"] != "ICMSRequest"
        - not(log.attributes["k8s.event.reason"] in ["InstanceCreation", "InstanceStatusUpdate", "InstanceTermination", "ModelCaching"])

  # ICMS lane: lift nvcf.nvidia.io/* annotations stamped by NVCA (via AnnotatedEventf)
  # onto ICMSRequest Events into flat log.attributes so the FnDs exporter can read them.
  # k8sattributes is intentionally omitted: the annotations carry all ledger fields already.
  transform/lift-icms-annotations:
    error_mode: ignore
    log_statements:
      - set(log.attributes["icms_request_id"], log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/icms-request-id"]) where log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/icms-request-id"] != nil
      - set(log.attributes["namespace"], log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/function-version-id"]) where log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/function-version-id"] != nil
      # Tasks are keyed by task-id in FnDs; override function_version_id when present.
      - set(log.attributes["namespace"], log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/task-id"]) where log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/task-id"] != nil and log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/task-id"] != ""
      - set(log.attributes["instance_id"], log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/instance-id"]) where log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/instance-id"] != nil
      - set(log.attributes["cluster_id"], log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/cluster-id"]) where log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/cluster-id"] != nil
      - set(log.attributes["nca_id"], log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/nca-id"]) where log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/nca-id"] != nil
      - set(log.attributes["function_id"], log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/function-id"]) where log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/function-id"] != nil
      - set(log.attributes["instance_state"], log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/instance-state"]) where log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/instance-state"] != nil
      - set(log.attributes["failure_category"], log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/failure-category"]) where log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/failure-category"] != nil
      - set(log.attributes["termination_cause"], log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/termination-cause"]) where log.body["object"]["metadata"]["annotations"]["nvcf.nvidia.io/termination-cause"] != nil
      - set(log.attributes["source"], "nvca")

  # ICMS lane: synthesize event_name = "ICMSRequest.<reason>[.<instance_state>]".
  # The state segment is included when the Event carries an instance-state annotation
  # (instance-level events); request-level events omit it.
  transform/synth-icms-event-name:
    error_mode: ignore
    log_statements:
      - set(log.attributes["event_name"], Concat(["ICMSRequest", log.attributes["k8s.event.reason"], log.attributes["instance_state"]], ".")) where log.attributes["k8s.event.reason"] != nil and log.attributes["instance_state"] != nil
      - set(log.attributes["event_name"], Concat(["ICMSRequest", log.attributes["k8s.event.reason"]], ".")) where log.attributes["k8s.event.reason"] != nil and log.attributes["instance_state"] == nil

extensions:
{{ if .UseOAuth2 }}
  oauth2client:
    client_id: ${env:NVCA_OTEL_COLLECTOR_OAUTH_CLIENT_ID}
    client_secret_file: ${env:NVCA_OTEL_COLLECTOR_OAUTH_CLIENT_SECRET_FILE}
    token_url: "${env:NVCA_OTEL_COLLECTOR_OAUTH_TOKEN_URL}"
    scopes: ["write"]
{{ else }}
  bearertokenauth:
    filename: "${env:NGC_SERVICE_API_KEY_FILE}"
{{ end }}
  health_check:
    endpoint: ":${env:NVCA_OTEL_COLLECTOR_HEALTH_CHECK_PORT}"

exporters:
  otlphttp/fnds:
    logs_endpoint: "${env:NVCA_OTEL_COLLECTOR_FNDS_ENDPOINT}"
    encoding: proto
    compression: gzip
    headers:
      X-Data-Source: "kubernetes-events"
    auth:
      authenticator: ${env:NVCA_OTEL_COLLECTOR_AUTHENTICATOR}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

service:
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: ${env:NVCA_OTEL_COLLECTOR_METRICS_PORT}
    logs:
      level: info
      encoding: json

  extensions:
    - health_check
    - ${env:NVCA_OTEL_COLLECTOR_AUTHENTICATOR}

  pipelines:
    logs:
      receivers:
        - k8sobjects
      processors:
        - memory_limiter
        # normalize lifts body["object"] fields into attributes, so it must run
        # before the kind==Pod filter and k8sattributes enrichment.
        - transform/normalize
        - filter
        - k8sattributes
        - transform
        - filter/required-fields
        - batch
      exporters:
        - otlphttp/fnds

    logs/icms-events:
      receivers:
        - k8sobjects
      processors:
        - memory_limiter
        # normalize runs first to set k8s.object.kind and k8s.event.reason so
        # filter/icms-events and synth-icms-event-name can read them.
        - transform/normalize
        - filter/icms-events
        - transform/lift-icms-annotations
        - transform/synth-icms-event-name
        - filter/required-fields
        - batch
      exporters:
        - otlphttp/fnds

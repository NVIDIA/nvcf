[package]
name = "nvstor-csi"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false
description = "nvstor CSI driver — Kubernetes persistent volume integration"

[[bin]]
name = "nvstor-csi"
path = "src/main.rs"

[dependencies]
nvstor-core = { path = "../../crates/nvstor-core" }
nvstor-metadata = { path = "../../crates/nvstor-metadata" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }

tempfile = "3"

[build-dependencies]
tonic-build = "0.12"

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nvstor-server
  namespace: nvstor-storage
  labels:
    app.kubernetes.io/name: nvstor
    app.kubernetes.io/component: server
spec:
  serviceName: nvstor-server-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nvstor
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvstor
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nvstor
                    app.kubernetes.io/component: server
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: init-dirs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /data/nvstor/wal /data/nvstor/chunks /data/nvstor/metadata
              chown -R 1000:1000 /data/nvstor
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /data/nvstor
      containers:
        - name: nvstor-server
          image: nvstor-server
          imagePullPolicy: Always
          args:
            - --config=/config/nvstor-server.toml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NVSTOR_ADVERTISE_ADDR
              value: "$(POD_NAME).nvstor-server-headless.$(POD_NAMESPACE).svc.cluster.local:9100"
          ports:
            - name: grpc
              containerPort: 9100
              protocol: TCP
            - name: http
              containerPort: 9101
              protocol: TCP
            - name: raft
              containerPort: 9102
              protocol: TCP
            - name: s3
              containerPort: 9000
              protocol: TCP
            - name: nbd
              containerPort: 10809
              protocol: TCP
            - name: nfs
              containerPort: 2049
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data/nvstor
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: nvstor-server-config
        # nvstor manages its own storage - use hostPath to access node disks directly
        - name: data
          hostPath:
            path: /var/lib/nvstor
            type: DirectoryOrCreate

# nvstor NFS PersistentVolume for CRIU Checkpoints
# No CSI driver needed — K8s has built-in NFS PV support.
#
# Usage:
#   1. Deploy nvstor server (statefulset.yaml + service.yaml)
#   2. Apply this file: kubectl apply -f nfs-pv.yaml
#   3. Mount PVC in pods that need checkpoint storage

apiVersion: v1
kind: PersistentVolume
metadata:
  name: nvstor-nfs-pv
  labels:
    app: nvstor
    type: nfs
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: nvstor-server.nvstor-storage.svc.cluster.local
    path: /export
  mountOptions:
    - nfsvers=3
    - tcp
    - nolock

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nvstor-nfs-pvc
  labels:
    app: nvstor
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: nvstor-nfs-pv

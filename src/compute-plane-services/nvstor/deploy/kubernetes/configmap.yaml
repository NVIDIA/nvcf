apiVersion: v1
kind: ConfigMap
metadata:
  name: nvstor-server-config
  namespace: nvstor-storage
  labels:
    app.kubernetes.io/name: nvstor
    app.kubernetes.io/component: server
data:
  nvstor-server.toml: |
    [node]
    id = 0
    name = "nvstor-server"

    [cluster]
    name = "nvstor-cluster"
    bootstrap = false
    seeds = [
      "nvstor-server-0.nvstor-server-headless.nvstor-storage.svc.cluster.local:9102",
      "nvstor-server-1.nvstor-server-headless.nvstor-storage.svc.cluster.local:9102",
      "nvstor-server-2.nvstor-server-headless.nvstor-storage.svc.cluster.local:9102",
    ]

    [storage]
    data_path = "/data/nvstor"
    chunk_size = 16777216
    direct_io = true
    verify_checksums = true
    gc_enabled = true
    gc_interval_secs = 300

    [network]
    grpc_port = 9100
    http_port = 9101
    raft_port = 9102
    s3_port = 9000
    nbd_port = 10809
    nfs_port = 2049
    rdma_port = 9877

    [nfs]
    # Who may mount the NFS export (it has no other authentication). Empty
    # admits loopback only, so no client can mount until you list them:
    # before deploying, list your node CIDRs (the CSI node plugin uses host
    # networking) and pod CIDR (the controller's mount), adding IPv6 or
    # 100.64.0.0/10 ranges if your cluster uses them, e.g.
    #   allow_clients = ["10.0.0.0/16", "fd00:10::/56"]
    allow_clients = []

    [limits]
    max_connections = 10000
    request_timeout_secs = 30
    idle_timeout_secs = 300
    max_object_size = 5368709120

    [logging]
    json = true
    level = "info"

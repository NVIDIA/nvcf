---
# ServiceMonitor for Prometheus Operator
# This is optional - only needed if using Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvstor-server
  namespace: nvstor-storage
  labels:
    app.kubernetes.io/name: nvstor
    app.kubernetes.io/component: server
    release: prometheus  # Match your Prometheus Operator release
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvstor
      app.kubernetes.io/component: server
  namespaceSelector:
    matchNames:
      - nvstor-storage
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

---
# PodMonitor (alternative to ServiceMonitor)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nvstor-server-pods
  namespace: nvstor-storage
  labels:
    app.kubernetes.io/name: nvstor
    app.kubernetes.io/component: server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvstor
      app.kubernetes.io/component: server
  namespaceSelector:
    matchNames:
      - nvstor-storage
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s

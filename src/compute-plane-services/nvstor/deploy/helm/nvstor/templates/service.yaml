apiVersion: v1
kind: Service
metadata:
  name: {{ include "nvstor-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvstor-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpc.port }}
      targetPort: grpc
      protocol: TCP
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: http
      protocol: TCP
    - name: s3
      port: {{ .Values.service.s3.port }}
      targetPort: s3
      protocol: TCP
    - name: nbd
      port: {{ .Values.service.nbd.port }}
      targetPort: nbd
      protocol: TCP
    - name: nfs
      port: {{ .Values.service.nfs.port }}
      targetPort: nfs
      protocol: TCP
  selector:
    {{- include "nvstor-server.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nvstor-server.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvstor-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: grpc
      port: {{ .Values.service.grpc.port }}
      targetPort: grpc
      protocol: TCP
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: http
      protocol: TCP
    - name: raft
      port: {{ .Values.service.raft.port }}
      targetPort: raft
      protocol: TCP
    - name: s3
      port: {{ .Values.service.s3.port }}
      targetPort: s3
      protocol: TCP
    - name: nbd
      port: {{ .Values.service.nbd.port }}
      targetPort: nbd
      protocol: TCP
    - name: nfs
      port: {{ .Values.service.nfs.port }}
      targetPort: nfs
      protocol: TCP
  selector:
    {{- include "nvstor-server.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nvstor-server.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvstor-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.service.http.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nvstor-server.selectorLabels" . | nindent 4 }}

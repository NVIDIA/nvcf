apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nvstor-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvstor-server.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nvstor-server.headlessServiceName" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "nvstor-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nvstor-server.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.http.port }}"
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 120
      {{- if .Values.imagePullSecrets.name }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-dirs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /data/nvstor/wal /data/nvstor/chunks /data/nvstor/metadata
              chown -R 1000:1000 /data/nvstor
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /data/nvstor
      containers:
        - name: nvstor-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/config/nvstor-server.toml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NVSTOR_ADVERTISE_ADDR
              value: "$(POD_NAME).{{ include "nvstor-server.headlessServiceName" . }}.$(POD_NAMESPACE).svc.cluster.local:{{ .Values.service.grpc.port }}"
            {{- if .Values.auth.secretName }}
            - name: NVSTOR_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: accessKey
            - name: NVSTOR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: secretKey
            {{- end }}
            {{- if .Values.kms.secretName }}
            - name: NVSTOR_KMS_ROOT_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.secretName }}
                  key: rootPassphrase
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpc.port }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.service.http.port }}
              protocol: TCP
            - name: raft
              containerPort: {{ .Values.service.raft.port }}
              protocol: TCP
            - name: s3
              containerPort: {{ .Values.service.s3.port }}
              protocol: TCP
            - name: nbd
              containerPort: {{ .Values.service.nbd.port }}
              protocol: TCP
            - name: nfs
              containerPort: {{ .Values.service.nfs.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data/nvstor
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/nvstor/tls
              readOnly: true
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: {{ include "nvstor-server.fullname" . }}-config
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        {{- if eq .Values.storage.type "hostPath" }}
        - name: data
          hostPath:
            path: {{ .Values.storage.hostPath }}
            type: DirectoryOrCreate
        {{- else if eq .Values.storage.type "emptyDir" }}
        - name: data
          emptyDir: {}
        {{- end }}

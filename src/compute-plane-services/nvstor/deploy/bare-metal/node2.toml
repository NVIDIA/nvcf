# nvstor Node 2 (follower)
#
# Replace 10.0.0.1 / 10.0.0.3 with the reachable IPs of your other
# two nodes before running deploy.sh.

[storage]
data_path = "/data/nvstor"
chunk_size_bytes = 16777216
gc_enabled = true
gc_interval_secs = 300

[network]
s3_port = 9000
grpc_port = 9002
health_port = 9101
nbd_port = 10809
nfs_port = 2049
raft_port = 9102

[nfs]
# Who may mount the NFS export (it has no other authentication): the
# three nodes and local mounts; add your NFS clients. A list admits
# exactly what it names; empty admits loopback only.
allow_clients = ["127.0.0.1", "10.0.0.1", "10.0.0.2", "10.0.0.3"]

[limits]
max_connections = 1000
request_timeout_secs = 30
idle_timeout_secs = 300

[node]
# Must match the id peers use for this node in their `seeds`.
id = 2

[cluster]
bootstrap = false
seeds = ["1@10.0.0.1:9102", "3@10.0.0.3:9102"]

[auth]
anonymous = true

[tls]
enabled = false

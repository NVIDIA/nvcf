apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvstor-nfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: nvstor.storage.io
parameters:
  # nvstor NFS server address (set by helm or kustomize overlay).
  server: "${NVSTOR_NFS_SERVER}"
  # NFS export path.
  share: "/"
  # Mount options for the NFS client.
  mountOptions: "nfsvers=4.2,hard,intr,rsize=1048576,wsize=1048576"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvstor-block
provisioner: nvstor.storage.io
parameters:
  type: block
  server: "${NVSTOR_SERVER}"
reclaimPolicy: Delete
volumeBindingMode: Immediate

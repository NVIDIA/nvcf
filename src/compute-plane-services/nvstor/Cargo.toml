[workspace]
resolver = "2"
members = [
    "crates/nvstor-core",
    "crates/nvstor-metadata",
    "crates/nvstor-storage",
    "crates/nvstor-block",
    "crates/nvstor-object",
    "crates/nvstor-transport",
    "crates/nvstor-raft",
    "crates/nvstor-iam",
    "crates/nvstor-kms",
    "crates/nvstor-client",
    "crates/nvstor-nfs",
    "crates/nvstor-placement",
    "crates/nvstor-rdma",
    "crates/nvstor-peer",
    "crates/nvstor-kv",
    "crates/nvstor-fuse",
    "bins/nvstor-server",
    "bins/nvstor-csi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dsx-ai-factory/nvcf"
homepage = "https://github.com/dsx-ai-factory/nvcf"
authors = ["NVIDIA CORPORATION & AFFILIATES"]
rust-version = "1.87"

# Dependency policy, checked with `cargo deny check licenses bans sources`.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[licenses]
# The NVIDIA/nvcf repository's allowed licenses (.allowed-licenses.txt).
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-4-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "PSF-2.0",
    "BlueOak-1.0.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

# unicode-ident carries the Unicode character database under Unicode-3.0, a
# permissive data license; every Rust proc-macro depends on it.
[[licenses.exceptions]]
crate = "unicode-ident"
allow = ["Unicode-3.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

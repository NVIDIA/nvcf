[package]
name = "nvstor-raft"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false
description = "Raft consensus for nvstor — metadata replication across cluster nodes"

[dependencies]
nvstor-core = { path = "../nvstor-core" }
nvstor-metadata = { path = "../nvstor-metadata" }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
rocksdb = "0.23"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

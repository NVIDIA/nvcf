[package]
name = "nvstor-nfs"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false
description = "NFS v4.2 server for nvstor — XDR, ONC RPC, COMPOUND operations"

[[bin]]
name = "nvstor-nfs-export"
path = "src/bin/nvstor-nfs-export.rs"

[features]
default = ["rdma"]
rdma = ["dep:nvstor-rdma"]

[dependencies]
nvstor-core = { path = "../nvstor-core" }
nvstor-storage = { path = "../nvstor-storage" }
nvstor-metadata = { path = "../nvstor-metadata" }
nvstor-raft = { path = "../nvstor-raft" }
nvstor-rdma = { path = "../nvstor-rdma", features = ["rdma-cm"], optional = true }
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "sync", "time", "macros", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
bytes = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
hex = "0.4"
sha2 = "0.10"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "v5"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

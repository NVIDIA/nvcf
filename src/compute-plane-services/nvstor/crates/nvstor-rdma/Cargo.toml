[package]
name = "nvstor-rdma"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false
description = "RDMA transport for nvstor — zero-copy data transfer via ibverbs"

[dependencies]
nvstor-core = { path = "../nvstor-core" }
tracing = "0.1"
parking_lot = "0.12"
sha2 = "0.10"  # etag computation for s3_rdma responses
hmac = "0.12"  # HMAC-SHA256 request signing (transport auth)
libc = "0.2"   # setsockopt for SO_SNDBUF/SO_RCVBUF tuning on the s3-tcp transport
getrandom = "0.2"

[features]
rdma-cm = []

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

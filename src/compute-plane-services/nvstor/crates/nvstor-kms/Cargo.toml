[package]
name = "nvstor-kms"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
nvstor-core = { path = "../nvstor-core" }
nvstor-metadata = { path = "../nvstor-metadata" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

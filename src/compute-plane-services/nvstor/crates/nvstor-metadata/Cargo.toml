[package]
name = "nvstor-metadata"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false
description = "RocksDB-backed metadata store for nvstor storage"

[dependencies]
rocksdb = "0.23"
serde = { version = "1", features = ["derive"] }
bincode = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

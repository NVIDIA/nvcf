[package]
name = "nvstor-object"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false
description = "S3-compatible HTTP gateway for nvstor storage"

[dependencies]
nvstor-core = { path = "../nvstor-core" }
nvstor-storage = { path = "../nvstor-storage" }
nvstor-metadata = { path = "../nvstor-metadata" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
crc32fast = "1"
base64 = "0.22"
bytes = "1"
http = "1"
parking_lot = "0.12"
tracing = "0.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
nvstor-raft = { path = "../nvstor-raft" }
nvstor-iam = { path = "../nvstor-iam" }
nvstor-kms = { path = "../nvstor-kms" }
nvstor-placement = { path = "../nvstor-placement" }
roxmltree = "0.21.1"
crc64fast-nvme = "1.2.1"

[dev-dependencies]
tempfile = "3"
tower = "0.5"
tokio = { version = "1", features = ["full"] }

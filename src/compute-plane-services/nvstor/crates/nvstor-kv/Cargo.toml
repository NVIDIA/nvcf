[package]
name = "nvstor-kv"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "The nvstor KV tier: a KV-cache block server over RDMA"

[lib]
# rlib for Rust users, cdylib for engine adapters (libnvstor_kv.so).
crate-type = ["rlib", "cdylib"]

[dependencies]
nvstor-core = { path = "../nvstor-core" }
nvstor-rdma = { path = "../nvstor-rdma" }
nvstor-storage = { path = "../nvstor-storage" }
nvstor-peer = { path = "../nvstor-peer" }
libc = "0.2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

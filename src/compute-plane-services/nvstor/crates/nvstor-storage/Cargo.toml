[package]
name = "nvstor-storage"
version = "0.2.0"
edition = "2021"
license.workspace = true
publish = false
description = "nvstor chunk storage engine — content-addressed, io_uring, backends"

[features]
default = []
io-uring = ["dep:io-uring"]

[dependencies]
nvstor-core = { path = "../nvstor-core" }
nvstor-metadata = { path = "../nvstor-metadata" }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
crc32fast = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
bytes = "1"
libc = "0.2"
tokio = { version = "1", features = ["time"] }
io-uring = { version = "0.7", optional = true }
aes-gcm = "0.10"
reed-solomon-erasure = "6"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

# Single-node nvstor for trying it out. The image's default command reads
# /config/nvstor.toml; this file overrides it so the server starts from the
# built-in defaults plus the NVSTOR_* environment overrides below, with no
# config file to mount.

services:
  nvstor:
    build: .
    # Replaces the image's CMD (--config=/config/nvstor.toml).
    command: ["--data-path=/data/nvstor"]
    ports:
      - "9000:9000"   # S3 HTTP
      - "9100:9100"   # Native wire protocol
      - "9101:9101"   # Health/metrics
      - "10809:10809" # NBD
      - "2049:2049"   # NFS v4.2
      - "9879:9879"   # S3 over TCP
    volumes:
      # /data/nvstor, not the config default /var/lib/nvstor/data: the image
      # runs as UID 1000 and only chowns /data/nvstor, so a named volume at
      # the default path mounts root-owned and the server exits 1 trying to
      # create wal/chunks/meta under it. Matches deploy/helm and deploy/bare-metal.
      - nvstor-data:/data/nvstor
    environment:
      - NVSTOR_DATA_PATH=/data/nvstor
      - NVSTOR_S3_PORT=9000
      - NVSTOR_GRPC_PORT=9100    # native wire protocol port
      - NVSTOR_HTTP_PORT=9101    # health and metrics
      - NVSTOR_NBD_PORT=10809
      - NVSTOR_NFS_PORT=2049
      # NFS admits only listed clients. Connections to a published port
      # reach the container from the compose network (the host through its
      # gateway), so admit that network's subnet and nothing else.
      - NVSTOR_NFS_ALLOW_CLIENTS=172.28.0.0/16
      - RUST_LOG=info
    networks:
      - nvstor

networks:
  nvstor:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  nvstor-data:

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="961" viewBox="0 0 1400 961" role="img" aria-labelledby="title desc">
<title id="title">nvstor System Context: Clients, Front Ends, Two Data Planes</title>
<desc id="desc">Clients reach nvstor-server through five protocol front ends. NFS file content, NBD volumes and the S3-over-RDMA and S3-over-TCP fast paths store bytes in PmStore, one sparse file per inode, volume or object. The S3 HTTP gateway and the native wire protocol store content-addressed chunks through ChunkManager, whose rows live in the RocksDB metadata store. In cluster mode an S3 PUT is replicated to peer nodes after the local write, over RDMA when possible and the TCP RPC otherwise, and its manifest is proposed through Raft. Standalone binaries run without the metadata store.</desc>
<defs>

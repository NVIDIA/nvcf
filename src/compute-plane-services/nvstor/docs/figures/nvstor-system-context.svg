<symbol id="icon-server" viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#7d55c0"/><g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="13" width="22" height="9" rx="1.5"/><rect x="13" y="26" width="22" height="9" rx="1.5"/><path d="M17 17.5h2M17 30.5h2M25 17.5h6M25 30.5h6"/></g></symbol>

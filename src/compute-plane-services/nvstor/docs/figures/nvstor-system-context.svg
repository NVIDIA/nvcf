<use href="#icon-third" x="55" y="252" width="48" height="48"/>
<text x="113" y="273" class="label" data-fit="c-nbd" data-fit-padding="4">nbd-client</text>
<text x="113" y="288" class="small" data-fit="c-nbd" data-fit-padding="4">Linux NBD</text>
<rect id="c-fast" x="45" y="328" width="220" height="64" rx="8" class="card"/>
<use href="#icon-actor" x="55" y="336" width="48" height="48"/>
<text x="113" y="357" class="label" data-fit="c-fast" data-fit-padding="4">Fast-path clients</text>
<text x="113" y="372" class="small" data-fit="c-fast" data-fit-padding="4">s3_hydrate, S3RdmaClient</text>
<rect id="c-s3" x="45" y="412" width="220" height="64" rx="8" class="card"/>
<use href="#icon-third" x="55" y="420" width="48" height="48"/>
<text x="113" y="441" class="label" data-fit="c-s3" data-fit-padding="4">S3 clients</text>
<text x="113" y="456" class="small" data-fit="c-s3" data-fit-padding="4">aws CLI, SDKs</text>
<rect id="c-wire" x="45" y="496" width="220" height="64" rx="8" class="card"/>
<use href="#icon-actor" x="55" y="504" width="48" height="48"/>
<text x="113" y="525" class="label" data-fit="c-wire" data-fit-padding="4">Native Rust client</text>
<text x="113" y="540" class="small" data-fit="c-wire" data-fit-padding="4">nvstor-client</text>
<rect x="310" y="110" width="820" height="590" rx="10" class="group-nv"/>
<text x="324" y="132" class="group-label" text-anchor="start">nvstor-server</text>
<text x="324" y="147" class="small" text-anchor="start">one process per node</text>
<rect id="s-nfs" x="330" y="160" width="230" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-service" x="340" y="168" width="48" height="48"/>
<text x="398" y="189" class="label" data-fit="s-nfs" data-fit-padding="4">NFS v4.2 server</text>
<text x="398" y="204" class="small" data-fit="s-nfs" data-fit-padding="4">TCP 2049, RDMA 20049</text>
<rect id="s-nbd" x="330" y="244" width="230" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-service" x="340" y="252" width="48" height="48"/>
<text x="398" y="273" class="label" data-fit="s-nbd" data-fit-padding="4">NBD server</text>
<text x="398" y="288" class="small" data-fit="s-nbd" data-fit-padding="4">10809</text>
<rect id="s-fast" x="330" y="328" width="230" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-service" x="340" y="336" width="48" height="48"/>
<text x="398" y="357" class="label" data-fit="s-fast" data-fit-padding="4">S3-over-RDMA / TCP</text>
<text x="398" y="372" class="small" data-fit="s-fast" data-fit-padding="4">9877 + rails, 9879</text>
<rect id="s-s3" x="330" y="412" width="230" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-service" x="340" y="420" width="48" height="48"/>
<text x="398" y="441" class="label" data-fit="s-s3" data-fit-padding="4">S3 HTTP gateway</text>
<text x="398" y="456" class="small" data-fit="s-s3" data-fit-padding="4">9000, SigV4, IAM, SSE</text>
<rect id="s-wire" x="330" y="496" width="230" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-service" x="340" y="504" width="48" height="48"/>
<text x="398" y="525" class="label" data-fit="s-wire" data-fit-padding="4">Native wire protocol</text>
<text x="398" y="540" class="small" data-fit="s-wire" data-fit-padding="4">9100; volumes go to PmStore</text>
<rect id="d-pm" x="620" y="160" width="230" height="232" rx="8" class="card"/>
<use href="#icon-data" x="711" y="168" width="48" height="48"/>
<text x="735" y="232" class="label" text-anchor="middle" data-fit="d-pm" data-fit-padding="4">PmStore</text>
<text x="735" y="247" class="small" text-anchor="middle" data-fit="d-pm" data-fit-padding="4">one sparse file per inode,</text>
<text x="735" y="260" class="small" text-anchor="middle" data-fit="d-pm" data-fit-padding="4">volume or object (PmObjectStore)</text>
<text x="735" y="290" class="small" text-anchor="middle">POSIX or io_uring backend</text>
<text x="735" y="305" class="small" text-anchor="middle">no chunking, no hashing</text>
<rect id="d-ca" x="620" y="412" width="230" height="148" rx="8" class="card"/>
<use href="#icon-data" x="711" y="420" width="48" height="48"/>
<text x="735" y="484" class="label" text-anchor="middle" data-fit="d-ca" data-fit-padding="4">ChunkManager</text>
<text x="735" y="499" class="small" text-anchor="middle" data-fit="d-ca" data-fit-padding="4">sha256 chunks, 16 MiB, dedup</text>
<text x="735" y="512" class="small" text-anchor="middle" data-fit="d-ca" data-fit-padding="4">objects up to 64 KiB inline</text>
<rect id="d-meta" x="620" y="610" width="230" height="64" rx="8" class="card"/>
<use href="#icon-db" x="630" y="618" width="48" height="48"/>
<text x="688" y="639" class="label" data-fit="d-meta" data-fit-padding="4">MetadataStore</text>
<text x="688" y="654" class="small" data-fit="d-meta" data-fit-padding="4">RocksDB, 10 column families</text>
<rect id="x-iam" x="900" y="160" width="210" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-guard" x="910" y="168" width="48" height="48"/>
<text x="968" y="189" class="label" data-fit="x-iam" data-fit-padding="4">IAM</text>
<text x="968" y="204" class="small" data-fit="x-iam" data-fit-padding="4">users, groups, policies</text>
<rect id="x-kms" x="900" y="244" width="210" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-guard" x="910" y="252" width="48" height="48"/>
<text x="968" y="273" class="label" data-fit="x-kms" data-fit-padding="4">KMS</text>
<text x="968" y="288" class="small" data-fit="x-kms" data-fit-padding="4">envelope keys for SSE</text>
<rect id="x-place" x="900" y="412" width="210" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-service" x="910" y="420" width="48" height="48"/>
<text x="968" y="441" class="label" data-fit="x-place" data-fit-padding="4">Placement + replication</text>
<text x="968" y="456" class="small" data-fit="x-place" data-fit-padding="4">jump hash, rack-aware</text>
<rect id="x-raft" x="900" y="496" width="210" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-service" x="910" y="504" width="48" height="48"/>
<text x="968" y="525" class="label" data-fit="x-raft" data-fit-padding="4">Raft</text>
<text x="968" y="540" class="small" data-fit="x-raft" data-fit-padding="4">9102, metadata log</text>
<rect x="1170" y="390" width="200" height="190" rx="10" class="group"/>
<text x="1184" y="412" class="group-label" text-anchor="start">Other nodes</text>
<text x="1184" y="427" class="small" text-anchor="start">cluster mode</text>
<rect id="p-peer" x="1190" y="440" width="160" height="112" rx="8" class="card"/>
<use href="#icon-server" x="1246" y="448" width="48" height="48"/>
<text x="1270" y="512" class="label" text-anchor="middle" data-fit="p-peer" data-fit-padding="4">nvstor-server</text>
<text x="1270" y="527" class="small" text-anchor="middle" data-fit="p-peer" data-fit-padding="4">REPLICATE, RPC 9878</text>
<text x="1270" y="540" class="small" text-anchor="middle" data-fit="p-peer" data-fit-padding="4">Raft 9102</text>
<path class="path" d="M265 192 L330 192" marker-end="url(#arrow)"/>
<path class="path" d="M265 276 L330 276" marker-end="url(#arrow)"/>
<path class="path" d="M265 360 L330 360" marker-end="url(#arrow)"/>

<text x="40" y="44" class="title">nvstor System Context: Clients, Front Ends, Two Data Planes</text>
<text x="40" y="64" class="sub">Solid: data path. Dashed: cluster mode only. Ports are nvstor-server defaults (bins/nvstor-server/src/config.rs).</text>
<rect x="30" y="110" width="250" height="480" rx="10" class="group"/>
<text x="44" y="132" class="group-label" text-anchor="start">Clients</text>
<rect id="c-nfs" x="45" y="160" width="220" height="64" rx="8" class="card"/>
<use href="#icon-third" x="55" y="168" width="48" height="48"/>
<text x="113" y="189" class="label" data-fit="c-nfs" data-fit-padding="4">Linux NFS client</text>
<text x="113" y="204" class="small" data-fit="c-nfs" data-fit-padding="4">kernel; kubelet via nvstor-csi</text>

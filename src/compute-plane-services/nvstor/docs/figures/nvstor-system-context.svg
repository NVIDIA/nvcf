<rect x="30" y="730" width="1340" height="124" rx="10" class="group"/>
<text x="44" y="752" class="group-label" text-anchor="start">Standalone binaries</text>
<text x="44" y="767" class="small" text-anchor="start">no metadata store; each serves or copies a plain local directory</text>
<rect id="b-export" x="50" y="780" width="300" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-folder" x="60" y="788" width="48" height="48"/>
<text x="118" y="809" class="label" data-fit="b-export" data-fit-padding="4">nvstor-nfs-export</text>
<text x="118" y="824" class="small" data-fit="b-export" data-fit-padding="4">NFS TCP + RDMA export of a directory</text>
<rect id="b-peer" x="380" y="780" width="300" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-folder" x="390" y="788" width="48" height="48"/>
<text x="448" y="809" class="label" data-fit="b-peer" data-fit-padding="4">nvstor-peer</text>
<text x="448" y="824" class="small" data-fit="b-peer" data-fit-padding="4">serve / fetch a directory over RDMA</text>
<rect id="b-fuse" x="710" y="780" width="300" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-folder" x="720" y="788" width="48" height="48"/>
<text x="778" y="809" class="label" data-fit="b-fuse" data-fit-padding="4">nvstor-mount + nvstor-fs-serve</text>
<text x="778" y="824" class="small" data-fit="b-fuse" data-fit-padding="4">FUSE, read-only, TCP</text>
<rect id="b-csi" x="1040" y="780" width="310" height="64" rx="8" class="card" style="stroke:#76b900;stroke-width:1.5"/>
<use href="#icon-service" x="1050" y="788" width="48" height="48"/>
<text x="1108" y="809" class="label" data-fit="b-csi" data-fit-padding="4">nvstor-csi</text>
<text x="1108" y="824" class="small" data-fit="b-csi" data-fit-padding="4">CSI v1; provisions NFS subdirectories</text>
<circle cx="39" cy="890" r="9" class="callout"/><text x="39" y="894" class="callout-text" text-anchor="middle">A</text>
<text x="56" y="894" class="note" text-anchor="start">NFS file content, NBD volumes and the RDMA/TCP object fast paths write in place in PmStore. NFS inodes are kept in RocksDB; PmObjectStore keys need no metadata (the file id is a hash of the key).</text>
<circle cx="39" cy="911" r="9" class="callout"/><text x="39" y="915" class="callout-text" text-anchor="middle">B</text>
<text x="56" y="915" class="note" text-anchor="start">In cluster mode an S3 PUT writes locally, then writes to every replica in parallel, waits for all of them, needs at least min_write_nodes to succeed, and proposes the manifest through Raft. Replication uses the S3-over-</text>
<text x="56" y="930" class="note" text-anchor="start">RDMA REPLICATE verb when the object fits a pool slot, otherwise (or if REPLICATE fails) the TCP RPC on rdma_port + 1.</text>
</svg>

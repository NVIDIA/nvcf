{{- $service := .Values.nvcfSparkUi.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nvcf-spark-ui.fullname" . }}
  labels:
    {{- include "nvcf-spark-ui.labels" . | nindent 4 }}
spec:
  type: {{ $service.type }}
  ports:
    - port: {{ $service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq $service.type "NodePort") $service.nodePort }}
      nodePort: {{ $service.nodePort }}
      {{- end }}
  selector:
    {{- include "nvcf-spark-ui.selectorLabels" . | nindent 4 }}

{{- $ingress := .Values.nvcfSparkUi.ingress }}
{{- if $ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nvcf-spark-ui.fullname" . }}
  labels:
    {{- include "nvcf-spark-ui.labels" . | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with $ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # One prefix for the UI and its API: the BFF serves both, and
          # longer prefixes from other Ingresses (such as /grafana) still win.
          - path: {{ $ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "nvcf-spark-ui.fullname" . }}
                port:
                  name: http
{{- end }}

allowBuilds:
  esbuild: true
  lightningcss: true
  "@nvidia/foundations-react-core": true
  msw: true

# solid-js, pulled in by the TanStack query devtools (dev only, never bundled),
# pins a seroval release with critical advisories. Use the patched release the
# router already depends on. Drop this once solid-js moves past 1.5.x.
overrides:
  seroval: ^1.6.8
  seroval-plugins: ^1.6.8

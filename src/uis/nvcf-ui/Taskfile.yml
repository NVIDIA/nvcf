version: "3"

includes:
  ui:
    taskfile: ./ui/Taskfile.yml
    dir: ./ui
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend

tasks:
  setup:
    desc: Bootstrap dev environment
    cmds:
      - go install github.com/google/addlicense@v1.2.0
      - task: ui:install
      - task: backend:install

  generate:
    desc: Generate typed API hooks, TypeScript models, and MSW mock handlers from OpenAPI spec
    cmds:
      - task: ui:generate
      - task: license:add

  typecheck:
    desc: Type-check the UI
    cmds:
      - task: ui:typecheck

  build:
    desc: Build UI into the backend static dir and compile the Go binaries
    cmds:
      - task: ui:build
        vars:
          OUT_DIR: ../backend/static
      - task: backend:build

  test:
    desc: Run all tests
    cmds:
      - task: ui:test
      - task: backend:test

  lint:
    desc: Run all linters
    cmds:
      - task: ui:lint
      - task: backend:lint
      - task: license:check

  lint:fix:
    desc: Auto-fix all lint issues
    cmds:
      - task: ui:lint:fix
      - task: backend:lint:fix
      - task: license:add

  license:check:
    desc: Check for missing license headers
    cmds:
      - task: license:add
        vars:
          FLAGS: -check

  license:add:
    desc: Add missing license headers
    cmds:
      - addlicense {{.FLAGS}} -f license-header.txt -ignore "**/node_modules/**" -ignore "**/pnpm-lock.yaml" -ignore "backend/static/**" -ignore "backend/bin/**" -ignore "ui/dist/**" -ignore "bazel-*/**" .

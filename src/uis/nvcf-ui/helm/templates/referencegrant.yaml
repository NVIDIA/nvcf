{{- if and .Values.nvcfUi.httpRoute.enabled .Values.nvcfUi.httpRoute.referenceGrant.enabled .Values.nvcfUi.httpRoute.namespace (ne .Values.nvcfUi.httpRoute.namespace .Release.Namespace) }}
# Gateway API requires a ReferenceGrant in the target (Service) namespace to
# authorize any cross-namespace backendRef. The HTTPRoute lives in the Gateway's
# namespace (.Values.nvcfUi.httpRoute.namespace), so this grant — created in the release
# namespace alongside the Service it authorizes — lets that route reach the
# in-release Service. Mirrors the cluster's allow-routes-to-* grants.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "nvcf-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvcf-ui.labels" . | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Values.nvcfUi.httpRoute.namespace }}
  to:
    - group: ""
      kind: Service
      name: {{ include "nvcf-ui.fullname" . }}
{{- end }}

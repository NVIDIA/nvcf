apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nvcf-ui.fullname" . }}-vault-agent-tpl
  labels:
    {{- include "nvcf-ui.labels" . | nindent 4 }}
data:
  tokens.tmpl: |-
    {{- `{
  {{- with secret "services/nvcf-api/jwt/sign/nvcf-ui" }}
  "nvcfApiToken": "{{ .Data.token }}",
  {{- end }}
  {{- with secret "services/nvct-api/jwt/sign/nvcf-ui" }}
  "nvctApiToken": "{{ .Data.token }}",
  {{- end }}
  {{- with secret "services/sis-api/jwt/sign/nvcf-ui" }}
  "sisApiToken": "{{ .Data.token }}"
  {{- end }}
}` | nindent 4 }}

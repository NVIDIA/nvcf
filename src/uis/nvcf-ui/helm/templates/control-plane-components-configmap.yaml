apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nvcf-ui.controlPlane.fullname" . }}-components
  labels:
    {{- include "nvcf-ui.controlPlane.labels" . | nindent 4 }}
data:
  # Rendered from .Values.nvcfUi.controlPlane.components and mounted into the
  # control-plane pod at COMPONENTS_PATH; Loadcomponents reads it at startup.
  components.yaml: |
    components:
      {{- toYaml .Values.nvcfUi.controlPlane.components | nindent 6 }}

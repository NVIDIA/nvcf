# Namespaced: the monitor writes its health ConfigMap only into its own
# namespace (NAMESPACE = metadata.namespace), so ConfigMap access stays scoped
# to the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nvcf-ui.controlPlane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvcf-ui.controlPlane.labels" . | nindent 4 }}
rules:
  # Write the control-plane-health ConfigMap (server-side apply) and read it back.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nvcf-ui.controlPlane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvcf-ui.controlPlane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nvcf-ui.controlPlane.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nvcf-ui.controlPlane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Cluster-scoped: components.yaml addresses workloads by their own namespace, so
# the monitor must read workloads and pods in ANY namespace to evaluate health
# (see k8shealth.go). These grants are read-only. The resource name is suffixed
# with the namespace so multiple releases in different namespaces don't collide
# on these cluster-scoped objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nvcf-ui.controlPlane.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "nvcf-ui.controlPlane.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nvcf-ui.controlPlane.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "nvcf-ui.controlPlane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nvcf-ui.controlPlane.fullname" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nvcf-ui.controlPlane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

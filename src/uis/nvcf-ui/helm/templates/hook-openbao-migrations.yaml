# Helm hook Job that provisions the OpenBao JWT signing roles the nvcf-ui BFF
# server needs to mint cluster, NVCF API, and NVCT tokens. Runs pre-install and
# pre-upgrade so the auth role and sign policies exist before the server pods
# come up and the Vault Agent tries to log in.
{{- $bao := .Values.nvcfUi.openbaoMigrations }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nvcf-ui.fullname" . }}-openbao-migrations
  namespace: {{ $bao.namespace }}
  labels:
    {{- include "nvcf-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao-migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "2"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ default 3 $bao.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "nvcf-ui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openbao-migrations
        {{- with .Values.nvcfUi.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nvcfUi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $bao.serviceAccountName }}
      {{- with .Values.nvcfUi.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nvcfUi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nvcfUi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nvcfUi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openbao-migrations
          {{- with $bao.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ include "nvcf-ui.openbaoMigrationsImage" . }}"
          imagePullPolicy: {{ $bao.image.pullPolicy }}
          env:
            - name: CORE_MIGRATIONS_ENABLED
              value: "false"
            - name: ADDONS_NVCF_UI_ENABLED
              value: "true"
            - name: BAO_SERVICE
              value: {{ ($bao.baoService | default (printf "openbao-server.%s.svc.cluster.local" $bao.namespace)) | quote }}
            - name: BAO_PORT
              value: {{ $bao.baoPort | quote }}
          volumeMounts:
            - name: root-token
              mountPath: /secrets/root_token
              readOnly: true
          resources:
            {{- toYaml $bao.resources | nindent 12 }}
      volumes:
        - name: root-token
          secret:
            secretName: {{ $bao.rootTokenSecretName }}
            items:
              - key: root_token
                path: root_token

{{- if .Values.nvcfUi.httpRoute.enabled }}
{{- $fullName := include "nvcf-ui.fullname" . }}
{{- $svcPort := .Values.nvcfUi.service.port }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  {{- with .Values.nvcfUi.httpRoute.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "nvcf-ui.labels" . | nindent 4 }}
  {{- with .Values.nvcfUi.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.nvcfUi.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.nvcfUi.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.nvcfUi.httpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          namespace: {{ $.Release.Namespace }}
          port: {{ $svcPort }}
          weight: 1
    {{- end }}
{{- end }}

# Namespaced read-only access for the BFF server: it serves GET /v1/control-plane
# by reading the control-plane-health ConfigMap from its own namespace (the one
# the control-plane monitor writes into). No cross-namespace access is needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nvcf-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvcf-ui.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nvcf-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvcf-ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nvcf-ui.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nvcf-ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

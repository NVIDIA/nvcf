apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nvcf-ui.fullname" . }}
  labels:
    {{- include "nvcf-ui.labels" . | nindent 4 }}
spec:
  {{- if not .Values.nvcfUi.autoscaling.enabled }}
  replicas: {{ .Values.nvcfUi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nvcf-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the vault token template changes: the agent renders
        # tokens.json from it once at startup, so a ConfigMap-only change would
        # otherwise leave running pods on the stale template.
        checksum/vault-tpl: {{ include (print $.Template.BasePath "/vault-agent-configmap.yaml") . | sha256sum | quote }}
        {{- include "nvcf-ui.vaultAnnotations" . | nindent 8 }}
        {{- with .Values.nvcfUi.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nvcf-ui.labels" . | nindent 8 }}
        {{- with .Values.nvcfUi.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.nvcfUi.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nvcf-ui.serviceAccountName" . }}
      {{- with .Values.nvcfUi.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.nvcfUi.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.nvcfUi.image.repository }}:{{ .Values.nvcfUi.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.nvcfUi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.nvcfUi.service.port }}
              protocol: TCP
          env:
            # The server reads the control-plane-health ConfigMap from its own
            # namespace; NAMESPACE is read by configMapNamespace().
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Upstream service addresses the BFF server proxies to.
            {{- with .Values.nvcfUi.config.nvcfUrl }}
            - name: NVCF_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.nvcfUi.config.nvctUrl }}
            - name: NVCT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.nvcfUi.config.sisUrl }}
            - name: SIS_URL
              value: {{ . | quote }}
            {{- end }}
          # HTTP probes against /status, the server's dependency-free 200
          # handler. The probe action is hardcoded; timing comes from values.
          livenessProbe:
            httpGet:
              path: /status
              port: http
            {{- toYaml .Values.nvcfUi.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /status
              port: http
            {{- toYaml .Values.nvcfUi.readinessProbe | nindent 12 }}
          {{- with .Values.nvcfUi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: vault-config-templates
              mountPath: /vault/config/templates
            - name: {{ include "nvcf-ui.openbaoTokenVolumeName" . }}
              mountPath: {{ include "nvcf-ui.openbaoTokenMountPath" . }}
              readOnly: true
            {{- with .Values.nvcfUi.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: vault-config-templates
          configMap:
            name: {{ include "nvcf-ui.fullname" . }}-vault-agent-tpl
        - name: {{ include "nvcf-ui.openbaoTokenVolumeName" . }}
          projected:
            sources:
              - serviceAccountToken:
                  path: {{ include "nvcf-ui.openbaoTokenFileName" . }}
                  audience: {{ .Values.nvcfUi.vault.audience | quote }}
                  expirationSeconds: 3600
        {{- with .Values.nvcfUi.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nvcfUi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nvcfUi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nvcfUi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

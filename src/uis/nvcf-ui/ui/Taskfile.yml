version: "3"

tasks:
  install:
    desc: Install UI dependencies
    cmds:
      - pnpm install

  generate:
    desc: Build OpenAPI spec and generate typed query hooks, schemas, and mocks
    cmds:
      - pnpm generate

  dev:
    desc: Start Vite dev server
    cmds:
      - pnpm dev
    env:
      VITE_MOCK: "{{.MOCK}}"
      VITE_SCENARIO: "{{.SCENARIO}}"

  build:
    desc: Production build
    cmds:
      - pnpm build {{if .OUT_DIR}}--outDir {{.OUT_DIR}}{{end}}

  lint:
    desc: Lint and format check
    cmds:
      - pnpm check

  lint:fix:
    desc: Auto-fix lint and format issues
    cmds:
      - pnpm check:fix

  typecheck:
    desc: Run TypeScript type checking
    cmds:
      - pnpm tsc --noEmit

  test:
    desc: Run tests
    cmds:
      - pnpm test

  vendor-css:
    desc: Fetch KUI foundations CSS from CDN (run after bumping @nvidia/foundations-react-core)
    cmds:
      - pnpm vendor-css

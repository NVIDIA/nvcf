version: "3"

tasks:
  install:
    desc: Download Go module dependencies
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: Compile the server and control-plane binaries into bin/
    cmds:
      - go build -o bin/server ./cmd/server
      - go build -o bin/control-plane ./cmd/control-plane

  lint:
    desc: Lint Go code
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Auto-fix Go lint issues
    cmds:
      - golangci-lint run --fix ./...

  test:
    desc: Run Go tests
    cmds:
      - go test ./...
